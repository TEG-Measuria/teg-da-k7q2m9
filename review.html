o tell, you can invent a short one that fits.", "options": ["True", "False"], "answer": 1, "feedback": "Stories must be true. If you have none, say \"A lot of patients tell me...\".", "quote": "If you do not have one, say \"A lot of patients tell me...\" and never invent a story.", "tags": ["stories"]}, {"id": "g-08-q8", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "Mid-objection a patient asks whether a lens is suitable for their eye condition. What do you do?", "options": ["Reassure them it is fine to wear", "Ask a registrant", "Check the lens brochure and tell them", "Move on to the price"], "answer": 1, "feedback": "If an objection raises a clinical question, ask a registrant.", "quote": "If an objection raises a clinical question, such as whether a lens is suitable, ask a registrant.", "tags": ["clinical"]}], "g-09": [{"id": "g-09-q1", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "What does \"it is too expensive\" often really mean?", "options": ["I cannot afford anything at all today", "I do not yet see why it is worth the cost", "I want a discount straight away", "I do not like the frame much"], "answer": 1, "feedback": "They cannot know it is expensive until they have seen what it gives them.", "quote": "\"It is too expensive\" often means \"I do not yet see why it is worth it\".", "tags": ["price"]}, {"id": "g-09-q2", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "A patient says a high-street shop is cheaper. What is the best response?", "options": ["Point out the other shop's quality problems", "Compare what is included, not the shop", "Offer to match their price on the spot", "Say that people get what they pay for"], "answer": 1, "feedback": "Compare the design, coatings, measuring, after-care and warranty, without criticising anyone.", "quote": "Do not criticise the other shop. Compare what is included", "tags": ["cheaper-elsewhere"]}, {"id": "g-09-q3", "lesson": "g-09", "level": 2, "type": "tf", "stem": "If a patient says they will buy online, you can tell them online glasses are illegal.", "options": ["True", "False"], "answer": 1, "feedback": "Do not say that buying online is illegal or unsafe.", "quote": "Do not say that buying online is illegal or unsafe.", "tags": ["online"]}, {"id": "g-09-q4", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "A patient says, \"I will come back on payday.\" What do you do?", "options": ["Press them hard to decide before they leave", "Hold the quote; agree a follow-up date", "Offer a discount you can approve later", "Tell them the price will rise soon"], "answer": 1, "feedback": "Write down what the optometrist advised, hold the quote and agree a date. Do not pressure, but do follow up.", "quote": "Write down what the optometrist advised, hold the quote, and agree a date you will follow up.", "tags": ["payday"]}, {"id": "g-09-q5", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "A patient asks why a thinner lens costs so much more. What is a fair answer?", "options": ["It is always lighter, so it is worth more", "A more advanced material, neater look", "It lasts twice as long as a thicker lens", "It is a premium brand charge only"], "answer": 1, "feedback": "Thin does not always mean light, so only say that if you have checked the product information.", "quote": "A thinner lens uses a more advanced material and has a thinner edge, so the glasses look neater.", "tags": ["thinner"]}, {"id": "g-09-q6", "lesson": "g-09", "level": 2, "type": "tf", "stem": "You should only say you can \"see what you can do\" on price if it is a real, approved code.", "options": ["True", "False"], "answer": 0, "feedback": "Never make up a discount. Staff cannot override a price.", "quote": "Do not tell them you can \"see what you can do\" unless it is a real, approved code.", "tags": ["discount"]}, {"id": "g-09-q7", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "A patient says they will order online. What can you honestly say?", "options": ["Our lenses are measured for you, with after-care", "Online glasses are unsafe and unlikely to work well", "We can match any online price if you show us it", "Online lenses are never made to the right power"], "answer": 0, "feedback": "Explain your measuring and after-care. Never say online glasses are unsafe or illegal.", "quote": "Explain that your lenses are measured and centred for the individual wearer, and that you are there if anything feels wrong.", "tags": ["online"]}, {"id": "g-09-q8", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "You have no story about a worried patient. What do you say?", "options": ["I had a patient just like you who regretted not buying", "A lot of patients tell me they worry about cost", "Everyone ends up paying more in the long run", "Our lenses will never need replacing"], "answer": 1, "feedback": "Use a true story with no names, or say \"A lot of patients tell me...\". Never invent.", "quote": "If you have none, say \"A lot of patients tell me...\" and never invent.", "tags": ["stories"]}], "g-10": [{"id": "g-10-q1", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "A patient says, \"I will think about it.\" What is the best first response?", "options": ["Offer a discount if they decide today", "Say the price may rise next week", "Ask what they want to think over", "Move on and let them call back later"], "answer": 2, "feedback": "Most think about it means price, value, a person to ask, or feeling rushed. Ask so you can help with the real reason.", "quote": "\"Of course, it is your decision. What would you like to think over? I may be able to help now.\"", "tags": ["think-about-it"]}, {"id": "g-10-q2", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "After agreeing to hold the quote, what must you do?", "options": ["Nothing; the patient will come back", "Agree when to follow up, and do it", "Send a daily reminder until they reply", "Ask for a deposit to secure the price"], "answer": 1, "feedback": "A promised follow-up that never happens costs trust.", "quote": "Then agree when you will follow up, and do it.", "tags": ["follow-up"]}, {"id": "g-10-q3", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "A patient says their partner decides. What should you do?", "options": ["Treat it as an excuse and keep selling", "Include the partner", "Ask for the partner's phone number", "Drop the price to settle it"], "answer": 1, "feedback": "Treat it as true. Offer a time the partner can come, or a written summary to show them.", "quote": "Include the partner. Offer to book a time they can come, or to give a written summary to show them.", "tags": ["partner"]}, {"id": "g-10-q4", "lesson": "g-10", "level": 2, "type": "tf", "stem": "It is fine to say a price is only available today to push a decision.", "options": ["True", "False"], "answer": 1, "feedback": "Do not say this unless it is a real, approved offer.", "quote": "Do not say \"this price is only available today\" unless it is a real, approved offer.", "tags": ["pressure"]}, {"id": "g-10-q5", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "What helps a patient explain the lens to a partner at home?", "options": ["A leaflet of coating names", "A simple line to repeat", "A copy of the order form", "A list of every feature"], "answer": 1, "feedback": "A partner who asks \"How much?!\" needs a simple reason, not a technical one.", "quote": "Give them a sentence they can say at home", "tags": ["words"]}, {"id": "g-10-q6", "lesson": "g-10", "level": 2, "type": "tf", "stem": "When a patient says their partner decides, you should treat it as true.", "options": ["True", "False"], "answer": 0, "feedback": "It is often true and sometimes a polite way out; either way, treat it as true.", "quote": "Treat it as true.", "tags": ["partner"]}, {"id": "g-10-q7", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "The patient's partner phones to ask what the patient was advised. What do you do?", "options": ["Share it, since they are paying", "Check the patient agrees first", "Read out the full record", "Send the quote by email to the partner"], "answer": 1, "feedback": "Do not discuss patient details with the partner without the patient's agreement.", "quote": "Do not discuss patient details with the partner without the patient's agreement.", "tags": ["privacy"]}, {"id": "g-10-q8", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "What should you note on the patient record after a think-it-over conversation?", "options": ["What was advised and the follow-up", "Only the quote that was given", "That the patient hesitated", "Whether they asked for a discount"], "answer": 0, "feedback": "Whatever the outcome, note what was advised and the agreed follow-up.", "quote": "Whatever the outcome, note what was advised and the agreed follow-up on the patient record.", "tags": ["record"]}], "g-11": [{"id": "g-11-q1", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "What must you always do with an NHS voucher patient?", "options": ["Offer them every upgrade available", "Explain what the voucher covers", "Ask them to pay a deposit first", "Avoid the subject of coatings"], "answer": 1, "feedback": "Always explain what the voucher covers, so the patient knows what they are getting.", "quote": "Always explain what the voucher covers, so the patient knows what they are getting.", "tags": ["nhs-voucher"]}, {"id": "g-11-q2", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "A patient says their glasses are only for reading. What is a good first question?", "options": ["Why not get varifocals instead?", "What else do you look at in a day?", "Do you do much driving at night?", "Is that definitely your final choice?"], "answer": 1, "feedback": "Ask what else they do. If they only read, say a reading pair is just what they need.", "quote": "Ask what else they do: \"What else do you look at in a day, a phone, a computer, the TV?\"", "tags": ["reading"]}, {"id": "g-11-q3", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "A patient says, \"My old ones were fine.\" Which image helps explain a fresh lens?", "options": ["A tyre wears even when the car runs fine", "Lenses expire after a fixed twelve months of use", "Old lenses can slowly harm the eyes over time", "New lenses are always sharper than old ones"], "answer": 0, "feedback": "Never make false health claims. The honest point is that coating wears over time even when everything seems fine.", "quote": "Lenses are coated, and the coating wears over time like a tyre wears even when the car runs fine.", "tags": ["old-glasses"]}, {"id": "g-11-q4", "lesson": "g-11", "level": 2, "type": "tf", "stem": "A patient who asks only for what the voucher covers should be pushed to consider extras more than once.", "options": ["True", "False"], "answer": 1, "feedback": "Mention extras once and let them decide. Do not push extras on a patient who wants only what is covered.", "quote": "Do not push extras on a patient who has told you they only want what is covered.", "tags": ["pressure"]}, {"id": "g-11-q5", "lesson": "g-11", "level": 2, "type": "tf", "stem": "Reading glasses are not harmful, and you should never suggest they are.", "options": ["True", "False"], "answer": 0, "feedback": "A patient who wants a reading pair is not making a mistake. Never make them feel foolish.", "quote": "Do not tell them reading glasses are harmful. They are not.", "tags": ["reading"]}, {"id": "g-11-q6", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "The prescription has not changed and the patient says their old ones were fine. What can you say?", "options": ["Great news, your eyes are healthy", "Then your old lenses must be perfect", "Old lenses like these are a risk", "You really should replace them anyway"], "answer": 0, "feedback": "Say your eyes are healthy and explain what a fresh lens would do for comfort. If they still say no, accept it.", "quote": "If the prescription has not changed, say, \"Great news, your eyes are healthy,\" and explain what a fresh lens would do for comfort.", "tags": ["old-glasses"]}, {"id": "g-11-q7", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "A reading-only patient also uses a computer and phone daily. What can you mention?", "options": ["That reading lenses suit one distance", "That reading glasses will damage their eyes", "That a varifocal is the only sensible choice", "That they need new lenses every year"], "answer": 0, "feedback": "Reading glasses are set for one distance. Whether another lens is right is for the optometrist; if unsure, ask a registrant.", "quote": "you can mention that reading glasses are set for one distance", "tags": ["reading"]}, {"id": "g-11-q8", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "A patient wants only what the voucher covers. What is a good way to start?", "options": ["Show the covered frames first, positively", "Show the dearest frames first for comparison", "Mention extras at each stage in case", "Say the covered frames are rather limited"], "answer": 0, "feedback": "Show the covered frames first and be positive about them. Never suggest the voucher pair is second-rate.", "quote": "With voucher patients, show the covered frames first and be positive about them.", "tags": ["nhs-voucher"]}], "g-12": [{"id": "g-12-q1", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "How should you explain a coating?", "options": ["By its full technical name", "By what the patient will notice", "By quoting the supplier brochure", "By showing the price list first"], "answer": 1, "feedback": "Explain a coating through what the patient notices, such as less glare or easier cleaning.", "quote": "Explain a coating through what the patient notices, not through what it is called.", "tags": ["coatings"]}, {"id": "g-12-q2", "lesson": "g-12", "level": 2, "type": "tf", "stem": "You may say a blue light filter protects the eyes from disease.", "options": ["True", "False"], "answer": 1, "feedback": "Blue light filters are about comfort only. Never make an eye-health claim about them.", "quote": "Blue light filters are about comfort only. Never make an eye-health claim about them.", "tags": ["claims"]}, {"id": "g-12-q3", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "The optometrist did not advise a varifocal and the patient has a single vision prescription. What do you do?", "options": ["Offer a varifocal as an upgrade", "Do not offer it", "Say varifocals suit everyone", "Ask the patient to decide"], "answer": 1, "feedback": "If the optometrist did not advise a varifocal, do not offer it. If unsure, check the record or ask a registrant.", "quote": "If the optometrist did not advise a varifocal, do not offer it.", "tags": ["varifocals"]}, {"id": "g-12-q4", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "What is honest to say about adapting to a first varifocal?", "options": ["You will not notice any difference at all", "Most people need a few days to adjust", "It takes about a year to settle in properly", "You will never need to come back for a check"], "answer": 1, "feedback": "Be honest about the adjustment, show where to look, and invite them back if anything feels odd.", "quote": "Most people take a few days to get used to them.", "tags": ["adaptation"]}, {"id": "g-12-q5", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "A patient asks what happens if they leave the anti-reflective coating off. What do you say?", "options": ["They keep the glare and smudges", "Their eyes will be put at risk", "Nothing will change at all", "The lenses will stop working well"], "answer": 0, "feedback": "Answer honestly and do not scare them. If they still do not want it, accept that.", "quote": "they keep the glare, smudges and reflections. Do not scare them.", "tags": ["honesty"]}, {"id": "g-12-q6", "lesson": "g-12", "level": 2, "type": "tf", "stem": "Light-reactive lenses barely darken in a car.", "options": ["True", "False"], "answer": 0, "feedback": "That is why a polarised second pair is useful for driving.", "quote": "They barely darken in a car.", "tags": ["sun"]}, {"id": "g-12-q7", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "A patient says, \"I do not need varifocals.\" What do you do first?", "options": ["Find out why they feel that", "Explain the lens in technical terms", "Offer a cheaper design at once", "Tell them they will regret it"], "answer": 0, "feedback": "They may be using two pairs already, or be reluctant about the look or the adjustment.", "quote": "If the patient says \"I do not need them\", find out why.", "tags": ["varifocals"]}, {"id": "g-12-q8", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "A patient mentions difficulty with their previous varifocal pair. What do you do?", "options": ["Fetch a registrant", "Reassure them it will be fine", "Offer a different coating instead", "Suggest they just persevere"], "answer": 0, "feedback": "If the patient raises a clinical worry, such as difficulty with a previous pair, fetch a registrant.", "quote": "If the patient raises a clinical worry, such as difficulty with a previous pair, fetch a registrant.", "tags": ["clinical"]}], "g-13": [{"id": "g-13-q1", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "Which closing sounds like the next step rather than an option?", "options": ["Would you like to go ahead with this one?", "Are you alright with that? Great, come this way.", "Do you want a little time to think about it?", "I suppose that is about all we can really do here."], "answer": 1, "feedback": "A walk-on close is flat and friendly, with the voice falling, and you keep moving.", "quote": "Do this: \"Are you alright with that? Great, come this way.\"", "tags": ["walk-on-close"]}, {"id": "g-13-q2", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "The patient hesitates and asks a question halfway through your close. What do you do?", "options": ["Carry on with the walk-on", "Stop the walk-on and answer it", "Ask the closing question again, louder", "End the conversation politely"], "answer": 1, "feedback": "Answer the question, then close again once.", "quote": "If the patient hesitates, goes quiet or asks a question, stop the walk-on and answer it.", "tags": ["hesitation"]}, {"id": "g-13-q3", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "Which is the better way to book a collection?", "options": ["When would suit you?", "Thursday or Friday?", "Just pop in sometime next week", "We will give you a call"], "answer": 1, "feedback": "Two choices are easier than an open question.", "quote": "Offer two choices of day: \"Thursday or Friday?\"", "tags": ["booking"]}, {"id": "g-13-q4", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "Besides the collection date, what else should you mention before the patient leaves?", "options": ["The recall for their next eye test", "The cost of the frame once more", "The practice's other branches", "A lens they did not choose"], "answer": 0, "feedback": "Say the recall line every time so they know when to come back for their next eye test.", "quote": "Mention the recall: when they should come back for their next eye test.", "tags": ["recall"]}, {"id": "g-13-q5", "lesson": "g-13", "level": 2, "type": "tf", "stem": "You may close before the price has been given if the patient seems keen.", "options": ["True", "False"], "answer": 1, "feedback": "The patient must have heard the price before anything is ordered.", "quote": "Do not close before the price has been given.", "tags": ["price-first"]}, {"id": "g-13-q6", "lesson": "g-13", "level": 2, "type": "tf", "stem": "The walk-on close is said with the voice falling at the end.", "options": ["True", "False"], "answer": 0, "feedback": "A falling voice makes it sound like the next step, not a question.", "quote": "The voice falls at the end, and you keep moving.", "tags": ["walk-on-close"]}, {"id": "g-13-q7", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "The patient says yes. What do you do next?", "options": ["Say how long it takes, then offer two days", "Let them go and ring them in a week", "Ask them to pick any day that suits", "Take payment outside the usual process"], "answer": 0, "feedback": "Give them a next step straight away, write it in the diary and repeat it back.", "quote": "After the yes, give them a next step straight away.", "tags": ["booking"]}, {"id": "g-13-q8", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "What should the dispense record show?", "options": ["The options chosen and any declined extras", "Only the frame and the final price paid", "Only the frame that was chosen", "Whether the patient was in a hurry"], "answer": 0, "feedback": "Recording declined extras, such as a second pair, lets the next visit pick up.", "quote": "Make sure the dispense record shows the options chosen and any declined extras, such as a second pair, so the next visit can pick up.", "tags": ["record"]}], "g-14": [{"id": "g-14-q1", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "Who must lead or supervise the dispensing of glasses to a child under 16?", "options": ["Any trained dispenser", "A registrant", "The child's parent", "The practice manager"], "answer": 1, "feedback": "Under 16s must be dispensed by or under the supervision of a registrant. That is the law.", "quote": "Children under 16 must be dispensed by or under the supervision of a registrant", "tags": ["law"]}, {"id": "g-14-q2", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "Who do you talk to about cost and decisions when dispensing for a child?", "options": ["The child alone", "The parent or guardian", "Neither; the registrant does it all", "Whoever speaks first"], "answer": 1, "feedback": "Talk to the parent about decisions, cost and care, and include the child in choosing the frame.", "quote": "Talk to the parent or guardian about decisions, cost and care.", "tags": ["parent"]}, {"id": "g-14-q3", "lesson": "g-14", "level": 2, "type": "tf", "stem": "Warning a parent about their child's future eyesight is a good way to help them decide on a spare pair.", "options": ["True", "False"], "answer": 1, "feedback": "Never use fear with children or with their parents. Explain a spare pair as normal advice.", "quote": "Never use fear with children or with their parents.", "tags": ["ethics"]}, {"id": "g-14-q4", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "A parent asks whether their child's prescription will change. What do you do?", "options": ["Reassure them it will not change", "Say it probably will change", "Say the optometrist will be able to explain", "Change the subject politely"], "answer": 2, "feedback": "This is a clinical question. Do not answer it yourself.", "quote": "This is a clinical question. Do not answer it yourself. Say the optometrist can explain.", "tags": ["clinical-boundary"]}, {"id": "g-14-q5", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "A parent asks, \"Will they break?\" What helps most?", "options": ["Show tough materials and a flexing frame", "Promise they will last for several years", "Tell them children are always very careless", "Offer a cheaper frame instead"], "answer": 0, "feedback": "Show durable materials and flexible frames. Showing how a frame bends is something parents remember.", "quote": "Show durable materials and flexible frames.", "tags": ["durability"]}, {"id": "g-14-q6", "lesson": "g-14", "level": 2, "type": "tf", "stem": "A spare pair is mentioned to parents as normal advice, because glasses get lost and broken.", "options": ["True", "False"], "answer": 0, "feedback": "A child without glasses may struggle at school.", "quote": "Mention a spare pair as normal advice, because glasses get lost and broken", "tags": ["spare"]}, {"id": "g-14-q7", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "You have a concern about a child's welfare during the appointment. What do you do?", "options": ["Tell the safeguarding lead", "Question the child gently yourself", "Ask the parent to explain", "Wait to see whether it happens again"], "answer": 0, "feedback": "Follow the practice process. Do not question the child about it.", "quote": "If you have any concern about a child's welfare, tell the practice's safeguarding lead and follow the practice process.", "tags": ["safeguarding"]}, {"id": "g-14-q8", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "You are not trained to measure a child. What do you do?", "options": ["Say so and ask for help", "Measure as you would for an adult", "Estimate from the frame size", "Let the parent measure it"], "answer": 0, "feedback": "The registrant or a trained colleague checks the fit and measurements.", "quote": "If you are not trained to measure a child, say so and ask.", "tags": ["fit"]}], "g-15": [{"id": "g-15-q1", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "How is each behaviour in the sales rubric scored?", "options": ["Pass or fail, by one observer", "0, 1 or 2 by two observers, compared", "1 to 10, by the patient afterwards", "A single total only, set by the coach"], "answer": 1, "feedback": "Two observers score independently, then compare. The maximum is 20.", "quote": "Two observers score each dispense independently, 0, 1 or 2 per behaviour, then compare.", "tags": ["scoring"]}, {"id": "g-15-q2", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "Which description earns a 2 for confident price?", "options": ["Said the price quickly, with an apology", "Said the whole-pair price plainly, then stopped", "Gave the lens price only", "Offered a discount before saying the price"], "answer": 1, "feedback": "A 2 means done clearly, as taught in this course.", "quote": "Confident price: said the whole-pair price plainly and then stopped talking.", "tags": ["confident-price"]}, {"id": "g-15-q3", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "A patient raised an objection and the dispenser quoted a discount straight away. Which behaviour is hurt?", "options": ["Open question asked at the start", "Recall explained at the end of the visit", "Objection acknowledged then answered", "Three options, lens before price"], "answer": 2, "feedback": "The objection should be heard, clarified and then answered, not met with a discount.", "quote": "Objection acknowledged then answered: heard the objection, asked what was behind it, then answered.", "tags": ["objection"]}, {"id": "g-15-q4", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "The dispenser did not push a second pair but recorded that the patient declined. What does the rubric say counts?", "options": ["Nothing; it has to be sold", "Offered, or recorded as declined", "Only a second pair that is sold", "Only if the patient asks about it"], "answer": 1, "feedback": "The behaviour is scored on raising it, or recording a decline.", "quote": "Second pair and sun raised: offered, or recorded as declined.", "tags": ["second-pair"]}, {"id": "g-15-q5", "lesson": "g-15", "level": 2, "type": "tf", "stem": "Saying \"let me check with the optometrist\" when unsure lowers your score.", "options": ["True", "False"], "answer": 1, "feedback": "Asking when unsure is behaviour 10. It is a strength, not a weakness.", "quote": "Do not skip \"asked when unsure\" because you think it looks weak. It is a strength.", "tags": ["ask-when-unsure"]}, {"id": "g-15-q6", "lesson": "g-15", "level": 2, "type": "tf", "stem": "The maximum score for one observed dispense is 20.", "options": ["True", "False"], "answer": 0, "feedback": "Ten behaviours, each scored 0, 1 or 2.", "quote": "The maximum is 20.", "tags": ["scoring"]}, {"id": "g-15-q7", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "The two observers differ by more than one point on a behaviour. What happens?", "options": ["They discuss and agree a score", "The higher of the two scores is used", "The dispenser chooses between them", "The lower of the two scores is used"], "answer": 0, "feedback": "They use the evidence of what was said, then write one thing to keep and one to change.", "quote": "Where they differ by more than one point on a behaviour, they discuss and agree a score, using the evidence of what was said.", "tags": ["scoring"]}, {"id": "g-15-q8", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "A patient said no but felt heard and respected. How might the dispense score?", "options": ["Still highly", "Low, as there was no sale", "Zero for the close", "It cannot be scored"], "answer": 0, "feedback": "It is scored on what the patient experienced, not on repeating words or making a sale.", "quote": "A dispense where the patient said no but was heard and respected can still score highly.", "tags": ["scoring"]}], "h-03": [{"id": "h-03-q1", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "Which is the top step of the varifocal ladder?", "options": ["Elite", "Tailor Made", "Varilux XR Design", "Varilux XR Pro"], "answer": 3, "feedback": "The ladder runs Elite, Tailor Made, Comfort Max, XR Design and XR Pro.", "quote": "5. **Varilux XR Pro.** The top step.", "tags": ["ladder"]}, {"id": "h-03-q2", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "Elite is the staff name for which lens?", "options": ["Nova Plus 3.0 lens", "Visio Digital", "Comfort Max", "XR Design"], "answer": 1, "feedback": "Elite is Visio Digital; Tailor Made is Nova Plus 3.0.", "quote": "The staff-facing names for ordering are Elite for Visio Digital and Tailor Made for Nova Plus 3.0.", "tags": ["names"]}, {"id": "h-03-q3", "lesson": "h-03", "level": 3, "type": "tf", "stem": "You may override a price in the till if the patient asks.", "options": ["True", "False"], "answer": 1, "feedback": "Never type or guess a price, and never override one.", "quote": "Never type or guess a price, and never override one.", "tags": ["price"]}, {"id": "h-03-q4", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "Which step is Nova Plus 3.0?", "options": ["Elite", "Tailor Made", "Varilux Comfort Max", "XR Pro"], "answer": 1, "feedback": "Tailor Made is the staff name for Nova Plus 3.0.", "quote": "Tailor Made (Nova Plus 3.0).", "tags": ["names"]}, {"id": "h-03-q5", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "Which designs on the ladder must be eyecoded?", "options": ["Comfort Max, XR Design and XR Pro lenses", "Elite and Tailor Made, and no others", "Every step except XR Pro", "None; eyecoding is optional"], "answer": 0, "feedback": "Comfort Max, XR Design and XR Pro must be eyecoded.", "quote": "Comfort Max, XR Design and XR Pro must be eyecoded", "tags": ["eyecode"]}, {"id": "h-03-q6", "lesson": "h-03", "level": 3, "type": "tf", "stem": "The top step should be offered only where it suits the patient, not pushed to everyone.", "options": ["True", "False"], "answer": 0, "feedback": "Start with the patient's needs and let them choose.", "quote": "Do not push the top step to every patient.", "tags": ["ethics"]}, {"id": "h-03-q7", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "A patient asks how one step differs from the next. How do you explain it?", "options": ["By what they notice, such as comfort", "By the design names and material codes", "By saying the dearer one is simply better", "By comparing the lab's brochure wording"], "answer": 0, "feedback": "Explain by what the patient will notice, not by jargon.", "quote": "Explain the difference by what the patient will notice, not by jargon: comfort, wider clear areas, easier adaptation.", "tags": ["explain"]}, {"id": "h-03-q8", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "A patient asks whether the top step will protect their eyes from disease. What do you say?", "options": ["Describe comfort and use, no medical claim", "Say it helps protect their long-term eye health", "Say it is the safest for their eyes", "Ask them to read the supplier's leaflet"], "answer": 0, "feedback": "Do not claim medical benefits for any lens.", "quote": "Do not claim medical benefits for any lens. Describe comfort and use.", "tags": ["claims"]}], "h-04": [{"id": "h-04-q1", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "Which level adds how the wearer moves their eyes and head?", "options": ["Level 1", "Level 2", "Level 3", "Level 4"], "answer": 2, "feedback": "Level 3 adds the wearer's habits, measured with VisiOffice.", "quote": "Level 3: the wearer's habits.** Adds how the wearer moves their eyes and head, measured with VisiOffice.", "tags": ["levels"]}, {"id": "h-04-q2", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "Which lens is personalisation level 4 used for?", "options": ["Elite", "XR Pro", "Comfort Max", "Eyezen Start"], "answer": 1, "feedback": "Level 4 adds near vision behaviour (NVB) and is used for XR Pro.", "quote": "Adds how the wearer holds things for near (NVB). Used for XR Pro.", "tags": ["levels"]}, {"id": "h-04-q3", "lesson": "h-04", "level": 3, "type": "tf", "stem": "Where VisiOffice could not be done, you should write on the dispense why.", "options": ["True", "False"], "answer": 0, "feedback": "Always note on the dispense why VisiOffice was not done.", "quote": "Always note on the dispense why VisiOffice was not done.", "tags": ["record"]}, {"id": "h-04-q4", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "Which of these is NOT part of level 2?", "options": ["Wrap", "Wrap and pantoscopic tilt", "Eye and head movement", "Vertex distance"], "answer": 2, "feedback": "Level 2 is lens to frame: wrap, pantoscopic tilt and vertex distance. Eye and head movement is level 3.", "quote": "Adds how the lens sits in the frame: wrap, pantoscopic tilt and vertex distance.", "tags": ["levels"]}, {"id": "h-04-q5", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "VisiOffice cannot be done for a patient. What do you do?", "options": ["Use measured values and averages; note why", "Skip the measurements and leave the boxes blank", "Copy over the previous patient's measurements", "Estimate every value by eye"], "answer": 0, "feedback": "Use measured values or the stated averages and always write why VisiOffice was not done.", "quote": "Use PD and heights as measured; ERC 25.5 right and left; cape 0.0; dominant eye none; wrap 4 to 6; panto 8 to 12; vertex 10 to 12.", "tags": ["fallback"]}, {"id": "h-04-q6", "lesson": "h-04", "level": 3, "type": "tf", "stem": "If VisiOffice could not be done, you may enter a near vision behaviour value you have estimated.", "options": ["True", "False"], "answer": 1, "feedback": "Do not enter the NVB if you did not measure it.", "quote": "Do not enter the NVB if you did not measure it.", "tags": ["nvb"]}, {"id": "h-04-q7", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "XR Pro was dispensed without VisiOffice. What is ordered instead?", "options": ["XR Design with the average measurements", "Elite with the average measurements taken", "XR Pro with an estimated NVB value", "Comfort Max with a new add"], "answer": 0, "feedback": "If XR Pro was dispensed without VisiOffice, order XR Design with the average measurements.", "quote": "If XR Pro was dispensed without VisiOffice, order XR Design with the average measurements.", "tags": ["fallback"]}, {"id": "h-04-q8", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "Who presses Send on an Opsysweb order?", "options": ["Only a trained person", "Any dispenser, for practice", "The patient", "The reception team"], "answer": 0, "feedback": "Sending the order is done only by a trained person. You never press Send as part of practice.", "quote": "Sending the order is done only by a trained person; you never press Send as part of practice.", "tags": ["ordering"]}], "h-09": [{"id": "h-09-q1", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "What is the best way to help a patient choose a varifocal?", "options": ["Tell them which one is the best", "Show the difference; let them choose", "Quote the prices only and then wait quietly", "Choose the right one for them"], "answer": 1, "feedback": "Selling a varifocal is about showing, not telling.", "quote": "Selling a varifocal is about showing, not telling.", "tags": ["showing"]}, {"id": "h-09-q2", "lesson": "h-09", "level": 3, "type": "tf", "stem": "You should always push the top step of the ladder.", "options": ["True", "False"], "answer": 1, "feedback": "Do not push the top step to everyone, and do not oversell. A lens that is more than the patient needs loses trust.", "quote": "Pushing the top step to everyone.", "tags": ["ethics"]}, {"id": "h-09-q3", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "Which is the right approach to discounts?", "options": ["Use only the codes your practice has", "Invent a small one to help the sale", "Offer one first to soften the price", "Apply one you think the manager would allow"], "answer": 0, "feedback": "Never invent a discount. Use only the codes on the code table.", "quote": "Never invent a discount; use only the codes your practice has.", "tags": ["discounts"]}, {"id": "h-09-q4", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "How do you explain the difference between steps?", "options": ["In detailed technical jargon", "In outcomes they will notice", "With a long product lecture", "By leaving them to read a leaflet"], "answer": 1, "feedback": "Explain in outcomes: wider clear areas, a calmer feel, easier adaptation.", "quote": "Wider clear areas, a calmer feel, easier adaptation. Not jargon.", "tags": ["language"]}, {"id": "h-09-q5", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "A patient says, \"I tried varifocals and hated them.\" What do you do?", "options": ["Ask what went wrong", "Tell them these are different", "Offer the top step straight away", "Move on to another lens type"], "answer": 0, "feedback": "It may have been the measurements, the frame or the design. Involve a registrant if there is a history of difficulty.", "quote": "Ask what went wrong.", "tags": ["history"]}, {"id": "h-09-q6", "lesson": "h-09", "level": 3, "type": "tf", "stem": "Asking \"which is easier?\" is better than asking \"which is better?\".", "options": ["True", "False"], "answer": 0, "feedback": "It keeps the patient's experience at the centre.", "quote": "Ask \"which is easier?\" rather than \"which is better?\".", "tags": ["tips"]}, {"id": "h-09-q7", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "A patient says the choice is too expensive. What do you do?", "options": ["Acknowledge, show the next step down", "Apply a discount you think they will accept", "Tell them the lower steps are not as good", "Say the price is fixed and move on"], "answer": 0, "feedback": "Acknowledge, show the next step down, and ask what matters most. Do not put down the lower steps.", "quote": "Acknowledge it. Show the next step down and say what they would notice.", "tags": ["price"]}, {"id": "h-09-q8", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "A patient is leaning towards the entry varifocal. What do you say?", "options": ["A good lens; here is what the next step adds", "It is rather basic, so I would not really choose it", "Most people regret it after a week", "It is fine if you do not mind blur"], "answer": 0, "feedback": "Do not put down the lower steps. They are good lenses.", "quote": "Putting down the lower steps. They are good lenses.", "tags": ["entry"]}], "h-11": [{"id": "h-11-q1", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "Which of these is one of the four measures?", "options": ["The number of frames sold", "The remake rate", "The hours you have worked", "Your time off sick"], "answer": 1, "feedback": "The four measures are remake rate, second-pair rate, the observed rubric and patient feedback.", "quote": "**Remake rate.** How many of your jobs were remade, and why.", "tags": ["measures"]}, {"id": "h-11-q2", "lesson": "h-11", "level": 3, "type": "tf", "stem": "The 90-day check is a pass or fail exam.", "options": ["True", "False"], "answer": 1, "feedback": "It is a trend, never pass or fail. The point is learning, not blame.", "quote": "A trend, never pass or fail.", "tags": ["trend"]}, {"id": "h-11-q3", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "What is \"amazing\" at TEG?", "options": ["Level 3 plus a 90-day check", "Any month with a high sales total", "Level 1 and a full set of notes", "A discount given to every patient"], "answer": 0, "feedback": "\"Amazing\" is Level 3 plus a 90-day check.", "quote": "\"Amazing\" at TEG is Level 3 plus a 90-day check.", "tags": ["definition"]}, {"id": "h-11-q4", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "Why note the cause of a remake?", "options": ["So you are not marked down unfairly", "So you can be ranked against colleagues", "So the owner can set a pay deduction", "So the record looks complete"], "answer": 0, "feedback": "Remakes caused by a prescription change, a supplier fault or patient damage are noted as such.", "quote": "Remakes caused by a prescription change, a supplier fault or patient damage are noted as such", "tags": ["fairness"]}, {"id": "h-11-q5", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "Who decides anything about your level?", "options": ["The practice manager and the owner together", "The 90-day check score and nothing else", "Your colleagues, by comparing the rates", "The coach, on the day of the check"], "answer": 0, "feedback": "The 90-day check does not rank staff, decide pay or remove authority on its own.", "quote": "Any decision about your level is made by your practice manager and the owner, using more than these figures.", "tags": ["authority"]}, {"id": "h-11-q6", "lesson": "h-11", "level": 3, "type": "tf", "stem": "A single bad week proves nothing about how you are doing.", "options": ["True", "False"], "answer": 0, "feedback": "A steady pattern, not one week, shows where to focus.", "quote": "A single bad week proves nothing; a steady pattern shows where to focus.", "tags": ["trend"]}, {"id": "h-11-q7", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "A remake was caused by something you did. What do you do?", "options": ["Record it with the reason", "Leave it out so the rate stays low", "Ask a colleague to log it", "Wait to see if anyone notices"], "answer": 0, "feedback": "Do not hide a remake; recording it helps everyone.", "quote": "Do not hide a remake; recording it helps everyone.", "tags": ["remakes"]}, {"id": "h-11-q8", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "Who should you compare your results with?", "options": ["Your own trend over time", "Your closest colleague", "The best dispenser in the group", "A fixed target set by the owner"], "answer": 0, "feedback": "Do not compare yourself with colleagues; compare with your own trend.", "quote": "Do not compare yourself with colleagues; compare with your own trend.", "tags": ["trend"]}]}};</script><script src="assets/app.js"></script></body></html>

quote": "Adjust nose pads on metal frames: move them in or out, or alter their angle a little.", "tags": ["scope"]}, {"id": "c-04-q2", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "What is the golden rule about adjusting a frame?", "options": ["Warm the frame first so that it cannot snap under the pliers", "Only adjust frames that your practice has sold", "Adjust until it looks right and then check the fit once", "Ask first if you could not repair the frame should it break"], "answer": 3, "feedback": "Never adjust a frame that you could not repair if it broke without asking.", "quote": "The golden rule: never adjust a frame that you could not repair if it broke without asking.", "tags": ["golden-rule"]}, {"id": "c-04-q3", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "You meet resistance while bending a side. What do you do?", "options": ["Stop, and ask a qualified colleague", "Warm it with a hot air gun", "Push a little harder with the pliers", "Bend the other side to match"], "answer": 0, "feedback": "Never force a bend. Resistance means stop.", "quote": "Never force a bend.", "tags": ["safe-method"]}, {"id": "c-04-q4", "lesson": "c-04", "level": 1, "type": "tf", "stem": "Acetate should be warmed with a proper frame warmer, never a naked flame or hot air gun.", "options": ["True", "False"], "answer": 0, "feedback": "Naked flames and hot air guns overheat acetate, which then goes shiny or bubbles.", "quote": "Never use a naked flame or hot air gun.", "tags": ["safe-method"]}, {"id": "c-04-q5", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "What is the safest way to make an adjustment?", "options": ["Remove the lenses first and do it all in one go", "One firm bend, then check the fit when he collects it", "Adjust with the patient out of the room", "A small change, then re-check the fit on the patient"], "answer": 3, "feedback": "Small steps, re-checking on the patient each time.", "quote": "Make a small change, then re-check the fit on the patient.", "tags": ["safe-method"]}, {"id": "c-04-q6", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "A patient hands you an old, thin metal frame with a crack near the hinge and asks you to tighten it up. What do you do?", "options": ["Bend the side slightly to ease the strain on the hinge", "Warm the crack with the frame warmer to close it", "Stop, ask a colleague and explain the risk honestly", "Tighten the hinge screw gently and see if it holds"], "answer": 2, "feedback": "A cracked old frame could snap and you could not repair it. Stop and ask before touching it.", "quote": "Never adjust a frame that you could not repair if it broke without asking.", "tags": ["golden-rule"]}, {"id": "c-04-q7", "lesson": "c-04", "level": 1, "type": "tf", "stem": "A frame that keeps slipping after two adjustments just needs a third.", "options": ["True", "False"], "answer": 1, "feedback": "A frame that keeps slipping or pinching after two adjustments may be the wrong frame.", "quote": "A frame that keeps slipping or pinching after two adjustments may be the wrong frame.", "tags": ["fit"]}, {"id": "c-04-q8", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "Which job needs a qualified colleague rather than a Level 1?", "options": ["Adjusting a rimless three-piece frame", "Straightening a metal side by gentle hand pressure", "Tightening a hinge screw with the right screwdriver", "Bending a metal earpiece tip with the correct pliers"], "answer": 0, "feedback": "Rimless and three-piece mounts can crack the lens if knocked or drilled badly; the other three are on the Level 1 list.", "quote": "Rimless or three-piece frames, where a hard knock to a mount or a drilled hole could crack the lens.", "tags": ["scope"]}], "c-05": [{"id": "c-05-q1", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "A patient has a round face. What do you aim for?", "options": ["Small round thin metal frames that echo the shape", "Angles and a little width for structure", "Rimless frames in a soft oval", "Very deep frames with no angles at all"], "answer": 1, "feedback": "Angles and width give a round face structure; round frames repeat its shape.", "quote": "Round: width and length similar, soft jaw.", "tags": ["shape"]}, {"id": "c-05-q2", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "What suits a face that is longer than it is wide?", "options": ["Deeper frames with decorated sides to add width", "Tiny round frames to soften the jaw", "Narrow rimless frames with plain sides", "Very shallow frames that make the face look shorter"], "answer": 0, "feedback": "Depth and decorated sides add width to a long face.", "quote": "Aim for deeper frames and decorated sides to add width.", "tags": ["shape"]}, {"id": "c-05-q3", "lesson": "c-05", "level": 2, "type": "tf", "stem": "Face-shape guidance is a guide for choosing three or four frames, not a set of rules.", "options": ["True", "False"], "answer": 0, "feedback": "Use it to narrow the choice, then watch the patient's reaction.", "quote": "These are a guide, not rules.", "tags": ["approach"]}, {"id": "c-05-q4", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "What do you do before bringing frames to a patient?", "options": ["Ask whether they prefer plastic or metal, bold or classic", "Pick the three frames you like best yourself", "Wait quietly while the patient browses the wall", "Hand them a tray of every frame to browse alone"], "answer": 0, "feedback": "Ask first, then choose three or four.", "quote": "Ask first: \"Plastic or metal? Something that stands out, or quite classic?\" Then choose three or four.", "tags": ["approach"]}, {"id": "c-05-q5", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "A patient with a round face and a short nose wants a frame that does not make him look old. Which is the best first choice?", "options": ["A thin, soft round acetate frame", "A very small rimless round frame", "A small round thin metal frame", "A browline with a strong upper edge"], "answer": 3, "feedback": "The strong top line gives structure; round frames repeat the shape of the face.", "quote": "The strong top line gives your face some structure.", "tags": ["shape"]}, {"id": "c-05-q6", "lesson": "c-05", "level": 2, "type": "tf", "stem": "Offering the patient the whole wall is better than choosing three or four frames.", "options": ["True", "False"], "answer": 1, "feedback": "Choose three or four and say why each is on the tray.", "quote": "Do not offer the patient the whole wall.", "tags": ["approach"]}, {"id": "c-05-q7", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "How wide should the frame be, compared with the face?", "options": ["Wider than the face so the sides stand clear of the temples", "About as wide as the face at the cheekbones", "As wide as the forehead, whatever the cheekbones", "Narrower than the eyes so the lenses stay small"], "answer": 1, "feedback": "The frame should match the face at the cheekbones, no wider.", "quote": "the frame should be about as wide as the face at the cheekbones, no wider.", "tags": ["proportion"]}, {"id": "c-05-q8", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "A patient with a wide face asks how a frame looks. Which phrase is best?", "options": ["Your cheekbones are your best feature", "Your face is quite big so this one suits", "It makes your face look less fat", "This frame hides how long your face is"], "answer": 0, "feedback": "Talk about the effect on the face. Words like fat, big and long should not be used about the face.", "quote": "Do not use the words \"fat\", \"big\" or \"long\" about the face.", "tags": ["wording"]}], "c-06": [{"id": "c-06-q1", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "Skin that looks pink or rosy has which undertone?", "options": ["Cool", "Olive", "Warm", "Neutral"], "answer": 0, "feedback": "Pink, rosy or blue-tinged skin is a cool undertone.", "quote": "Cool undertone: skin looks pink, rosy or blue-tinged.", "tags": ["undertone"]}, {"id": "c-06-q2", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "Which frame colours generally suit warm skin?", "options": ["Clear grey and pale blue-grey", "Silver, navy, burgundy and plum", "Gold, bronze, brown and warm tortoiseshell", "Cool pink and blue-toned tortoiseshell"], "answer": 2, "feedback": "Warm skin suits gold, bronze and brown tones; the others are cool colours.", "quote": "Warm skin: gold, bronze, brown, olive, warm tortoiseshell, coral, cream.", "tags": ["colour"]}, {"id": "c-06-q3", "lesson": "c-06", "level": 2, "type": "tf", "stem": "Veins that look blue on the wrist suggest a cool undertone.", "options": ["True", "False"], "answer": 0, "feedback": "Use the wrist and daylight rather than the surface colour of the skin.", "quote": "Veins on the wrist look blue.", "tags": ["undertone"]}, {"id": "c-06-q4", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "What can happen with a very dark, heavy frame on very light colouring?", "options": ["It helps the eyes stand out most", "It can look severe against the face", "It always flatters pale skin", "It can look washed out against the face"], "answer": 1, "feedback": "Dark and heavy on very light colouring looks severe. Washed out is the opposite problem (pale frame, dark colouring).", "quote": "A dark, heavy frame on very light colouring can look severe.", "tags": ["contrast"]}, {"id": "c-06-q5", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "A patient has silver-white hair, pale pink-toned skin and blue-grey eyes. Which pair of colours do you bring?", "options": ["Gold and coral", "Dark brown and olive", "Soft navy and muted burgundy", "Warm tortoiseshell and bronze"], "answer": 2, "feedback": "Pink skin and silver hair are cool, so bring cool tones.", "quote": "so she suits cool colours.", "tags": ["colour"]}, {"id": "c-06-q6", "lesson": "c-06", "level": 2, "type": "tf", "stem": "Frame colour is best judged from the tray under the shop lights.", "options": ["True", "False"], "answer": 1, "feedback": "Look at the patient in daylight or by the window.", "quote": "Do not decide on colour from the tray under shop lights.", "tags": ["lighting"]}, {"id": "c-06-q7", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "Where should you check frame colour against the patient's face?", "options": ["Under the brightest practice spotlight", "In daylight, such as by the window", "In the mirror with the fitting light off", "On the tray, next to other frames"], "answer": 1, "feedback": "Daylight shows undertone and colour truthfully.", "quote": "Look at the patient in daylight or by the window if possible.", "tags": ["lighting"]}, {"id": "c-06-q8", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "A patient with olive skin and brown eyes wants something warmer than his usual black frames. What do you bring?", "options": ["Pale clear pink with a blue tint", "Warm tortoiseshell, deep brown or bronze", "Cool silver, steel grey or navy metal", "Plum, burgundy or blue-toned tortoiseshell"], "answer": 1, "feedback": "Olive skin and brown eyes are a warm undertone.", "quote": "Olive skin and brown eyes are a warm undertone.", "tags": ["colour"]}], "c-07": [{"id": "c-07-q1", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "Which is a sign of a well-made acetate frame?", "options": ["Uneven hinge gaps and screws that stand proud", "A gloss finish that shows no scratches", "Edges left matt from the cutting process", "Polished edges that feel smooth to the touch"], "answer": 3, "feedback": "Polished, smooth edges show quality. Rough edges and uneven hinges are signs of a cheap frame, and gloss shows scratches more.", "quote": "Polished edges: smooth to the touch.", "tags": ["finish"]}, {"id": "c-07-q2", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "You do not know where a frame is made. What do you say?", "options": ["It does not matter where a frame is made", "It is made in Italy, as most good frames are", "It is handmade, which is why it costs more", "Let me find out, I will ask a colleague"], "answer": 3, "feedback": "Only say what you know and find out the rest. Do not invent where a frame is made.", "quote": "Only say what you know.", "tags": ["honesty"]}, {"id": "c-07-q3", "lesson": "c-07", "level": 2, "type": "tf", "stem": "You can say a frame is made in a particular country if it sounds right.", "options": ["True", "False"], "answer": 1, "feedback": "Do not invent facts about where a frame is made or what it is made from.", "quote": "Do not invent facts about where a frame is made or what it is made from.", "tags": ["honesty"]}, {"id": "c-07-q4", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "How do you find the price of a frame?", "options": ["By asking the patient what they paid before", "From the price list or the price-it tool", "From memory of the last similar sale", "From the brand's reputation for price"], "answer": 1, "feedback": "Never quote a price from memory.", "quote": "Always use the price list or the price-it tool.", "tags": ["price"]}, {"id": "c-07-q5", "lesson": "c-07", "level": 2, "type": "tf", "stem": "Only Administrators can override a price; staff cannot.", "options": ["True", "False"], "answer": 0, "feedback": "Do not offer a discount to close a sale. If a price looks wrong, ask.", "quote": "Staff cannot override a price; only Administrators can (Nov 2026).", "tags": ["price"]}, {"id": "c-07-q6", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "A patient picks up a dearer frame and says she cannot see the difference. What do you show her?", "options": ["The brand name on the side, as proof of quality", "The label that says handmade, whatever it is made of", "The finish, such as layered colour, and a firm, even hinge", "A lower price, by offering her a discount on it"], "answer": 2, "feedback": "Show what she can see and feel. Do not discount, and do not claim handmade unless the supplier says so.", "quote": "Do not claim a frame is \"handmade\" or \"made in\" a country unless the supplier information says so.", "tags": ["value"]}, {"id": "c-07-q7", "lesson": "c-07", "level": 2, "type": "tf", "stem": "A gloss finish shows scratches more than a matte or satin finish.", "options": ["True", "False"], "answer": 0, "feedback": "Matte or satin shows fewer marks, so it can suit someone who wants a frame that hides wear.", "quote": "Matte or satin finish: soft and modern, shows fewer marks.", "tags": ["finish"]}, {"id": "c-07-q8", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "Which sentence links a finish to the patient's needs without pushing?", "options": ["Everyone who buys this one loves it, so you will too.", "This is the best frame in the shop, so you must have it.", "This dearer one will last forever.", "You wear them all day, so a lighter hinge will keep its shape."], "answer": 3, "feedback": "Give a reason tied to their day. Do not say a frame will last forever.", "quote": "\"You wear them all day, so a lighter hinge will keep its shape.\"", "tags": ["value"]}], "c-14": [{"id": "c-14-q1", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "What commonly makes a frame rest on the cheeks?", "options": ["A frame or lens too deep, or a bridge sitting too low", "A bridge that is too high on the nose", "Sides that are too short behind the ear", "A lens that is too thin at the edge"], "answer": 0, "feedback": "Depth, a low bridge or too little pantoscopic tilt let the bottom of the frame swing onto the cheek.", "quote": "Causes: lens or frame too deep, bridge sitting too low, or the pantoscopic tilt too small so the bottom of the frame swings forward onto the cheek.", "tags": ["cheeks"]}, {"id": "c-14-q2", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "What is a likely cause of lashes touching the lens?", "options": ["Sides that are too long behind the ears", "The frame being too wide for the face", "A lens that is too thick at the edge", "The lens sitting too close to the eye"], "answer": 3, "feedback": "A short vertex distance puts the lens in the path of the lashes.", "quote": "Causes: the lens too close to the eye (short vertex distance), a frame that is very close fitting, or long lashes.", "tags": ["lashes"]}, {"id": "c-14-q3", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "What is the first step with any fit complaint?", "options": ["Look at the patient wearing the frame", "Order a remake of the lenses", "Tell her it will settle with wear", "Adjust the pads before you ask questions"], "answer": 0, "feedback": "Look first. Do not guess, and do not adjust before you know the cause.", "quote": "Look at the patient wearing the frame.", "tags": ["method"]}, {"id": "c-14-q4", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "Which order of fixes is recommended?", "options": ["Side, then frame, then lens", "Pad, then side, then frame", "Frame, then side, then pad", "Lens, then pad, then side"], "answer": 1, "feedback": "Choose the smallest fix first: pad, side, then frame.", "quote": "Choose the smallest fix: pad, side, then frame.", "tags": ["method"]}, {"id": "c-14-q5", "lesson": "c-14", "level": 2, "type": "tf", "stem": "Checking the fit while the patient smiles shows whether the frame touches the cheeks.", "options": ["True", "False"], "answer": 0, "feedback": "The cheeks rise when the patient smiles, so a frame that looks fine at rest may touch.", "quote": "For prevention, check when the patient smiles: the cheeks rise.", "tags": ["cheeks"]}, {"id": "c-14-q6", "lesson": "c-14", "level": 2, "type": "tf", "stem": "If a patient reports blurred vision as well as a slipping frame, treat it as a fit complaint only.", "options": ["True", "False"], "answer": 1, "feedback": "Do not treat it as a fit complaint only. Tell a registrant, as the problem may be in the lens.", "quote": "do not treat it as a fit complaint only.", "tags": ["scope"]}, {"id": "c-14-q7", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "After pad and side adjustments the frame still marks the cheeks, because the lens is deep. What do you do?", "options": ["Bend the sides further in until the marks fade", "Show her a shallower frame", "Tell her it is her face shape and will settle", "Ask her to wear them for shorter periods"], "answer": 1, "feedback": "If adjustments do not cure it, change the frame. Do not blame the patient's face.", "quote": "If it still marks, I can show you a shallower frame.", "tags": ["cheeks"]}, {"id": "c-14-q8", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "Which type of nose pad helps a slippery nose?", "options": ["Smaller metal pads set closer together", "Silicone pads", "Hard plastic pads", "Pads moved right up the nose"], "answer": 1, "feedback": "Silicone pads grip better. Pads too close or too small make slipping worse.", "quote": "Choose silicone pads for slippery noses.", "tags": ["slipping"]}], "d-01": [{"id": "d-01-q1", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "A cell on the lens price list shows one figure. What does it cover?", "options": ["One lens, with the coating priced separately", "A pair of lenses plus the fitting", "One lens, so double it for a pair", "Both lenses together, as a pair"], "answer": 3, "feedback": "Every price is per pair. Never quote a single lens.", "quote": "Every price is per pair.", "tags": ["pair"]}, {"id": "d-01-q2", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "The printed list labels a column \"2.25 to 3.00 DS\". How should you treat that label?", "options": ["As the thickness of the lens in millimetres", "As a strict rule that fixes the index", "As a guide to which index usually suits that power", "As a discount band for stronger powers"], "answer": 2, "feedback": "It is a guide only. The frame, the cylinder and what the patient wants also matter.", "quote": "The power labels are a guide.", "tags": ["guide"]}, {"id": "d-01-q3", "lesson": "d-01", "level": 1, "type": "tf", "stem": "If a cell on the lens list is empty, that combination is not sold.", "options": ["True", "False"], "answer": 0, "feedback": "Offer the nearest index that is sold. Never type a price in for it.", "quote": "If the cell is empty, that combination is not sold.", "tags": ["blank"]}, {"id": "d-01-q4", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "A price in the till looks different from the price list. What do you do?", "options": ["Override it to match the list", "Ask the patient which price they prefer", "Change the VAT code to correct the total", "Leave it and tell your practice manager"], "answer": 3, "feedback": "Do not change it. Staff cannot override a price, and overriding breaks the VAT split.", "quote": "If a price on screen in Optix One (desktop) looks different from the list, do not change it.", "tags": ["till"]}, {"id": "d-01-q5", "lesson": "d-01", "level": 1, "type": "tf", "stem": "If a till price looks wrong, a team member can override it to match the list.", "options": ["True", "False"], "answer": 1, "feedback": "Only Administrators can override a price. Staff ask instead.", "quote": "Staff cannot override a price in the till; only Administrators can (from 6 Nov 2026).", "tags": ["till"]}, {"id": "d-01-q6", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "Which three choices find a price on the lens list?", "options": ["Lens design, index band, and clear or Transitions", "Lens design, frame material and index band", "Index band, patient age and Gold or standard", "Frame size, lens design and clear or Transitions"], "answer": 0, "feedback": "Row is the design, column is the index band, then clear or Transitions.", "quote": "Put a finger on the row, then slide to the column, then pick clear or Transitions.", "tags": ["method"]}, {"id": "d-01-q7", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "A patient is between two index bands. What is the tip?", "options": ["Quote both so they can choose", "Quote the cheaper one only", "Choose for them and say it is best", "Quote the thinner one only"], "answer": 0, "feedback": "Quote both so the patient can choose.", "quote": "If the patient is between two bands, quote both so they can choose.", "tags": ["tips"]}, {"id": "d-01-q8", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "A patient wants Road Pilot in 1.74, but that cell is empty. What do you do?", "options": ["Work out a price from the 1.67 cell", "Offer the nearest index that is sold", "Quote the Eyezen Start price instead", "Ask a colleague to type a price in the till"], "answer": 1, "feedback": "There is no 1.74 Road Pilot, so offer the nearest index that is sold.", "quote": "Offer the nearest index that is.", "tags": ["blank"]}], "d-02": [{"id": "d-02-q1", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "What is the Gold member discount on frames?", "options": ["20%", "50%", "30%", "10%"], "answer": 2, "feedback": "Gold members get 30% off frames, 20% off prescription lenses, 50% off additional spectacles within 90 days and 20% off care products.", "quote": "They get 30% off frames, 20% off prescription lenses, 50% off additional spectacles bought within 90 days of the first pair, and 20% off care products.", "tags": ["gold"]}, {"id": "d-02-q2", "lesson": "d-02", "level": 1, "type": "tf", "stem": "You should work out a Gold price yourself for a frame above the top of the list.", "options": ["True", "False"], "answer": 1, "feedback": "Do not work out a Gold price yourself. Ask your practice manager.", "quote": "Do not work out a Gold price yourself.", "tags": ["over-list"]}, {"id": "d-02-q3", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "Which patient is quoted from the Gold member frame column?", "options": ["A patient on Eyecare Plan Gold", "A patient paying by card", "A patient buying two pairs at once", "A patient with an NHS voucher"], "answer": 0, "feedback": "Only a patient on Eyecare Plan Gold.", "quote": "Only a patient on Eyecare Plan Gold.", "tags": ["gold"]}, {"id": "d-02-q4", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "The frame price in the till looks wrong against the list. What do you do?", "options": ["Change the VAT band so the total matches", "Apply a manual discount to match the list", "Leave it and ask your practice manager", "Override the price to match the list"], "answer": 2, "feedback": "Staff never override a price.", "quote": "Staff never override a price.", "tags": ["till"]}, {"id": "d-02-q5", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "A Gold member buys a second pair 60 days after the first. What discount applies to the additional spectacles?", "options": ["50%", "30%", "20%", "10%"], "answer": 0, "feedback": "50% off additional spectacles bought within 90 days of the first pair.", "quote": "50% off additional spectacles bought within 90 days of the first pair", "tags": ["gold"]}, {"id": "d-02-q6", "lesson": "d-02", "level": 1, "type": "tf", "stem": "The Gold column on the frame list is the standard price less 30%, already worked out.", "options": ["True", "False"], "answer": 0, "feedback": "Read it from the column. Do not work out 30% in your head.", "quote": "The Gold column is the standard price less 30%, already worked out.", "tags": ["gold"]}, {"id": "d-02-q7", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "A patient asks whether the Gold plan is worth it. What do you do?", "options": ["Tell her it is worth joining whatever she buys", "Show both columns and let the patient decide", "Say you cannot discuss the plan at the till", "Quote only the Gold price so the plan looks cheaper"], "answer": 1, "feedback": "Do not push it. Show the two columns, and quote the full job both ways if asked.", "quote": "Do not push it.", "tags": ["plan"]}, {"id": "d-02-q8", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "A frame costs more than the highest price on the list. What do you do?", "options": ["Use the highest Gold price on the list", "Ask your practice manager how to price it", "Round it down to the top price on the list", "Take 30% off the tag price in the till"], "answer": 1, "feedback": "Frames over the top of the list: ask in practice.", "quote": "If a frame costs more than the highest price on the list, \"Frames over 365 pounds: ask in practice.\"", "tags": ["over-list"]}], "d-03": [{"id": "d-03-q1", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "What discount do Gold members get on prescription lenses?", "options": ["20%", "10%", "50%", "30%"], "answer": 0, "feedback": "Lenses get 20%, frames get 30%. Do not mix them up.", "quote": "The Gold figure is the standard figure less 20%, already worked out.", "tags": ["gold"]}, {"id": "d-03-q2", "lesson": "d-03", "level": 2, "type": "tf", "stem": "The Gold member discount applies to NHS voucher add-ons.", "options": ["True", "False"], "answer": 1, "feedback": "The Gold discount does not cover NHS voucher add-ons or the frame (which has its own 30%).", "quote": "it does not cover NHS voucher add-ons.", "tags": ["scope"]}, {"id": "d-03-q3", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "A patient who is not a Gold member asks for the Gold price just this once. What do you do?", "options": ["Quote the standard column and explain the plan", "Give it to them, just this once, and note it", "Ask the lab to invoice at the Gold price instead", "Take 20% off in the till as a favour"], "answer": 0, "feedback": "Do not apply the Gold price as a favour. Only the plan allows it.", "quote": "Do not apply the Gold price \"as a favour\".", "tags": ["gold"]}, {"id": "d-03-q4", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "Where do you read the Gold lens price?", "options": ["The frame list, using the lens price", "Ask the supplier for a Gold quote", "Take 20% off the standard price on a calculator, then round it", "The Gold member price in the same cell on the list"], "answer": 3, "feedback": "The Gold column already has the 20% worked out. You do not calculate it.", "quote": "The Gold figure is the standard figure less 20%, already worked out.", "tags": ["method"]}, {"id": "d-03-q5", "lesson": "d-03", "level": 2, "type": "tf", "stem": "A Gold member gets 30% off frames but 20% off prescription lenses.", "options": ["True", "False"], "answer": 0, "feedback": "Frames 30%, lenses 20%.", "quote": "Gold member: 20% off prescription lenses; 30% off frames.", "tags": ["gold"]}, {"id": "d-03-q6", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "A Gold member wants Road Pilot lenses in 1.6 clear. Which price do you quote?", "options": ["The standard price, with no discount on lenses", "The Transitions Gold price", "The Gold price from the same cell", "The standard price, then take 20% off it"], "answer": 2, "feedback": "Quote the Gold price from the cell. Read it, do not work it out.", "quote": "Quote the Gold price, because Mr D is a Gold member.", "tags": ["method"]}, {"id": "d-03-q7", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "The figure in the till does not match the Gold column. What do you do?", "options": ["Override the till to match the column", "Type the Gold figure in as a new price", "Stop and ask your practice manager", "Use whichever figure is lower"], "answer": 2, "feedback": "Staff cannot override a price. Stop and ask.", "quote": "If the figure in Optix One (desktop) does not match the Gold column, stop and ask.", "tags": ["till"]}, {"id": "d-03-q8", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "What do you check before quoting from the Gold column?", "options": ["That the patient holds a valid NHS voucher", "That the patient is a current Gold member", "That the patient has bought glasses before", "That the lens is in the cheapest index band"], "answer": 1, "feedback": "Only a current Gold member is quoted from the Gold column. If you cannot see this, ask your practice manager.", "quote": "Check the patient is a current Gold member.", "tags": ["gold"]}], "d-04": [{"id": "d-04-q1", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "How long do Gold members have to buy a second pair at 50% off?", "options": ["60 days", "90 days", "30 days", "12 months"], "answer": 1, "feedback": "50% off additional spectacles bought within 90 days of the first pair.", "quote": "Gold members get 50% off additional spectacles bought within 90 days of the first pair.", "tags": ["offer"]}, {"id": "d-04-q2", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "From which date do you count the 90 days?", "options": ["The date of the eye test", "The date of the second order", "The date the patient joined the Gold plan", "The date the first pair was dispensed"], "answer": 3, "feedback": "Count from the first dispense, not the eye test.", "quote": "Check the date on the first dispense, not the date of the eye test.", "tags": ["count"]}, {"id": "d-04-q3", "lesson": "d-04", "level": 2, "type": "tf", "stem": "You may offer a non-member the Gold second-pair discount if they ask nicely.", "options": ["True", "False"], "answer": 1, "feedback": "Do not promise a non-member the Gold offer.", "quote": "Do not promise a non-member the Gold offer.", "tags": ["non-members"]}, {"id": "d-04-q4", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "How is the second-pair discount applied in the till?", "options": ["By a discount code", "By changing the VAT code", "By typing a lower price", "By asking the lab to invoice less"], "answer": 0, "feedback": "Through a discount code, never by changing a price.", "quote": "Through a discount code in Optix One (desktop), never by changing a price.", "tags": ["till"]}, {"id": "d-04-q5", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "A Gold member bought glasses on 3 March and wants sunglasses on 25 May. Is she inside the offer?", "options": ["No, only the first 60 days count", "No, it is 100 days, so over 90", "Yes, it is 83 days, so within 90", "Yes, any time within the same year"], "answer": 2, "feedback": "28 days left in March, plus 30 in April, plus 25 in May is 83 days.", "quote": "Day 90 is still inside; day 91 is not", "tags": ["count"]}, {"id": "d-04-q6", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "Which of these count as additional spectacles?", "options": ["A second pair, prescription sunglasses or a computer pair", "Only a second pair in the same frame style", "Only a replacement for a lost or broken pair of glasses", "Only prescription sunglasses, never computer pairs or spares"], "answer": 0, "feedback": "A second pair, sunglasses or a computer pair all count. If unsure whether a product counts, ask.", "quote": "An additional pair of spectacles: for example a second pair, a pair of prescription sunglasses or a computer pair.", "tags": ["offer"]}, {"id": "d-04-q7", "lesson": "d-04", "level": 2, "type": "tf", "stem": "The 50% second-pair offer applies to the additional pair, not to the first pair.", "options": ["True", "False"], "answer": 0, "feedback": "The first pair is at its normal or Gold price.", "quote": "the 50% is on the additional pair.", "tags": ["offer"]}, {"id": "d-04-q8", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "A non-member asks for the second-pair offer. What do you do?", "options": ["Offer 25% off as a middle way between the two", "Give them the Gold 50% so they do not feel left out", "Say every second pair is half price at the practice", "Do not promise it; ask your practice manager"], "answer": 3, "feedback": "Do not invent a non-member offer. Ask your practice manager.", "quote": "Inventing a non-member offer. If unsure, ask your practice manager.", "tags": ["non-members"]}], "d-05": [{"id": "d-05-q1", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "Which plan gives 30% off frames and 20% off prescription lenses?", "options": ["Pay as you go", "Essential", "Gold", "Contacts"], "answer": 2, "feedback": "Gold adds the spectacle discounts to what Essential covers.", "quote": "What Gold adds.", "tags": ["plans"]}, {"id": "d-05-q2", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "A patient asks, which plan should I buy? What do you do?", "options": ["Say Gold, since it has the most benefits", "Suggest they ask the optometrist which suits", "Say Essential, since it costs the least each month for them", "Ask what they buy and show the options side by side"], "answer": 3, "feedback": "Never push one plan. Put the options side by side.", "quote": "Put the options side by side without pressure.", "tags": ["conversation"]}, {"id": "d-05-q3", "lesson": "d-05", "level": 1, "type": "tf", "stem": "You can tell a patient a plan will protect their eye health.", "options": ["True", "False"], "answer": 1, "feedback": "The plan covers services. It does not promise eye health outcomes.", "quote": "No medical claims.", "tags": ["claims"]}, {"id": "d-05-q4", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "Which statement is right about Essential and Gold?", "options": ["Only Gold covers the comprehensive eye examination fully", "Only Essential covers emergency examinations", "Neither covers the Optomap retinal scan", "Both fully cover the comprehensive eye examination"], "answer": 3, "feedback": "Both fully cover the exam, scans and emergency examinations. Gold adds spectacle discounts and damage cover.", "quote": "What Essential and Gold fully cover.", "tags": ["plans"]}, {"id": "d-05-q5", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "How much is the Contacts plan each month?", "options": ["11 pounds", "8 pounds", "14 pounds", "Nothing, it is pay as you go"], "answer": 0, "feedback": "Essential is 8 pounds, Contacts 11 and Gold 14.", "quote": "The Contacts plan costs 11 pounds a month and covers the eye exam and contact lens check-ups and gives 50% off contact lenses.", "tags": ["plans"]}, {"id": "d-05-q6", "lesson": "d-05", "level": 1, "type": "tf", "stem": "Gold is also the plan that unlocks the Gold price columns on the lens and frame lists.", "options": ["True", "False"], "answer": 0, "feedback": "Only Gold members are quoted from the Gold columns.", "quote": "Forgetting Gold is also the plan that unlocks the Gold price columns.", "tags": ["plans"]}, {"id": "d-05-q7", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "A patient asks about family cover. Which is right?", "options": ["It is only available on the Contacts plan", "It is included free with the Gold plan", "It replaces the monthly fee for the main member", "An extra monthly amount on Essential and Gold"], "answer": 3, "feedback": "Family cover is available as an extra monthly amount on Essential and Gold.", "quote": "Family cover is available as an extra monthly amount on Essential and Gold.", "tags": ["family"]}, {"id": "d-05-q8", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "What must be true before you sign a patient up to a plan?", "options": ["The patient has bought glasses within 90 days", "The patient has had a Gold lens quote", "The patient has agreed to the monthly payment", "The patient has been tested this year"], "answer": 2, "feedback": "Joining happens in a conversation with the patient agreeing to the monthly payment.", "quote": "Signing up a patient who has not agreed to the monthly payment.", "tags": ["sign-up"]}], "d-06": [{"id": "d-06-q1", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "Which of these extras is ask in practice on the list?", "options": ["Reglaze (lab free)", "None; all three are on the list", "Fixed colour tint", "Mirror finish"], "answer": 3, "feedback": "Reglaze and fixed colour tint have fixed prices. Polarised, XTRActive, mirror and style are ask in practice.", "quote": "What \"ask in practice\" means.", "tags": ["extras"]}, {"id": "d-06-q2", "lesson": "d-06", "level": 2, "type": "tf", "stem": "It is fine to quote a polarised price from memory if you are fairly sure.", "options": ["True", "False"], "answer": 1, "feedback": "Never guess and never quote a figure from memory.", "quote": "Never guess and never quote a figure from memory.", "tags": ["extras"]}, {"id": "d-06-q3", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "A patient wants new lenses in their own old frame. What must you do at the start?", "options": ["Refuse unless the frame is under a year old and unmarked", "Charge extra in case the frame is damaged", "Tell them nothing, since reglazing is routine", "Tell them about the risk of an old frame breaking"], "answer": 3, "feedback": "Explain the risk before you take the order, not afterwards.", "quote": "If it breaks, explain this at the start, not afterwards: tell the patient the risk before you take the order.", "tags": ["reglaze"]}, {"id": "d-06-q4", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "When should extras be in the quote?", "options": ["After the lab invoice arrives", "Only if the patient asks about extras", "Once, in the full quote, before they pay", "At collection, once the lenses are glazed"], "answer": 2, "feedback": "Always include extras in your quote so there are no surprises at collection.", "quote": "Always include extras in your quote.", "tags": ["quote"]}, {"id": "d-06-q5", "lesson": "d-06", "level": 2, "type": "tf", "stem": "Reglaze (lab free) and fixed colour tint have fixed prices on the list.", "options": ["True", "False"], "answer": 0, "feedback": "Polarised, XTRActive, mirror and style are the ones to ask about.", "quote": "reglaze (lab free) and fixed colour tint have fixed prices", "tags": ["extras"]}, {"id": "d-06-q6", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "A patient asks about a mirror finish. What do you do?", "options": ["Leave it off the quote and add it at collection", "Say you will confirm the price before ordering", "Quote the tint price and adjust later", "Quote the polarised price, as it is similar"], "answer": 1, "feedback": "Do not guess. Confirm with your practice manager, then add the confirmed item.", "quote": "Tell the patient you will confirm the price before ordering.", "tags": ["extras"]}, {"id": "d-06-q7", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "What may you say about polarised lenses?", "options": ["They cure eyestrain from glare on screens", "They improve eye health when you are outdoors", "They cut glare from flat surfaces; it is a comfort feature", "They protect your eyes from long-term sun damage outdoors"], "answer": 2, "feedback": "Explain only what is on the manufacturer's information. No medical claims.", "quote": "Polarised reduces glare from flat surfaces; it is a comfort feature.", "tags": ["claims"]}, {"id": "d-06-q8", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "How do you add an extra in the till?", "options": ["Add it to the job as a product", "Type a new price over the lens line", "Note it on paper and charge at collection", "Fold it into the lens price by override"], "answer": 0, "feedback": "Add the extra as a product. Do not override the price.", "quote": "Add the extra to the job as a product in Optix One (desktop).", "tags": ["till"]}], "d-07": [{"id": "d-07-q1", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "Why must staff not override a price?", "options": ["It changes the frame stock count on the system", "It cancels any plan discount already applied", "It makes the VAT split on the sale wrong", "It voids the manufacturer's warranty on the lens"], "answer": 2, "feedback": "The price no longer matches the VAT band, which feeds into the accounts and tax return.", "quote": "If someone types a different price over a product, the price no longer matches the band the product was set up in.", "tags": ["vat"]}, {"id": "d-07-q2", "lesson": "d-07", "level": 1, "type": "tf", "stem": "Staff can change a product's VAT band if it looks wrong.", "options": ["True", "False"], "answer": 1, "feedback": "You never change VAT. The product's band does it.", "quote": "You never change VAT.", "tags": ["vat"]}, {"id": "d-07-q3", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "A price on screen differs from the list. What do you do?", "options": ["Fix it yourself so the sale can go through", "Charge whichever price is lower", "Create a new product at the right price", "Stop and ask your practice manager"], "answer": 3, "feedback": "Tell your practice manager before the sale is finished.", "quote": "A price that looks wrong against the list: stop and ask your practice manager.", "tags": ["method"]}, {"id": "d-07-q4", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "How should a discount the patient is entitled to be applied?", "options": ["By typing a new price", "By a discount code", "By asking the lab for a credit", "By changing the VAT band"], "answer": 1, "feedback": "Plan, second pair and NHS voucher discounts all go through codes.", "quote": "A discount the patient is entitled to: use the discount code (plan, second pair, NHS voucher).", "tags": ["codes"]}, {"id": "d-07-q5", "lesson": "d-07", "level": 1, "type": "tf", "stem": "Since 6 November 2026 only Administrators can override a price.", "options": ["True", "False"], "answer": 0, "feedback": "Staff cannot. Do not look for a way round it.", "quote": "Since 6 November 2026 only Administrators can.", "tags": ["rule"]}, {"id": "d-07-q6", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "A patient offers to pay in cash if you take a few pounds off. What do you do?", "options": ["Charge the list price, applying any discount they qualify for", "Override the price this once and tell the manager later", "Round the price down in the till to a tidy figure", "Take the few pounds off in cash and keep a note of it for later"], "answer": 0, "feedback": "Everyone gets the same price from the same list. Apply only discounts they are entitled to, through a code.", "quote": "Agreeing to \"round it down\" because the patient asks nicely.", "tags": ["rule"]}, {"id": "d-07-q7", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "A product the patient wants is missing from the till. What do you do?", "options": ["Invent a product with the right total", "Use a similar product and override its price", "Ask your practice manager", "Add the cost to another item on the job"], "answer": 2, "feedback": "Do not invent one.", "quote": "A product missing from Optix One (desktop): ask. Do not invent one.", "tags": ["rule"]}, {"id": "d-07-q8", "lesson": "d-07", "level": 1, "type": "tf", "stem": "NHS voucher contributions now go through a discount code, not a price override.", "options": ["True", "False"], "answer": 0, "feedback": "Overriding prices for vouchers used to break the VAT split.", "quote": "NHS voucher contributions are now a discount code, not a price override.", "tags": ["vat"]}], "d-08": [{"id": "d-08-q1", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "Why must you learn your own company's code names?", "options": ["The two companies name their codes differently", "The codes are secret and kept at head office", "The codes are the same everywhere", "The codes change from day to day across the group"], "answer": 0, "feedback": "The Eyecare Group runs two companies, and each names its codes differently.", "quote": "The codes differ by company.", "tags": ["codes"]}, {"id": "d-08-q2", "lesson": "d-08", "level": 2, "type": "tf", "stem": "You can use a discount code to make a total look right if the system shows an unexpected figure.", "options": ["True", "False"], "answer": 1, "feedback": "Never use a code to make a total look right. If the total is wrong, ask.", "quote": "Never use a code to make a total look right.", "tags": ["rules"]}, {"id": "d-08-q3", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "What must you give each time you apply a code?", "options": ["The patient's date of birth", "A copy of the receipt", "The lab's order number", "The reason for the discount"], "answer": 3, "feedback": "Discounts are audited, so give the reason every time.", "quote": "Give the reason every time.", "tags": ["rules"]}, {"id": "d-08-q4", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "A patient was promised a discount but you cannot find a code. What do you do?", "options": ["Tell the patient the offer does not exist", "Ask your practice manager what code applies", "Make up a code with a similar name", "Override the price to the promised figure instead"], "answer": 1, "feedback": "Do not make one up.", "quote": "If you cannot find a code for something a patient has been promised, do not make one up.", "tags": ["rules"]}, {"id": "d-08-q5", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "Which pair of code names do Harrison Coley and Kings use?", "options": ["NHS and 2NDPAIR", "NHSV and 2NDPAIR", "NHS and 50%-AP", "NHSV and 50%-AP"], "answer": 1, "feedback": "Harrison Coley and Kings use NHSV and 2NDPAIR; Glass & Glass practices use NHS and 50%-AP.", "quote": "Harrison Coley and Kings use NHSV and 2NDPAIR; Glass & Glass practices use NHS and 50%-AP.", "tags": ["codes"]}, {"id": "d-08-q6", "lesson": "d-08", "level": 2, "type": "tf", "stem": "A code from the other company's list will not behave as expected.", "options": ["True", "False"], "answer": 0, "feedback": "Choose the code from your own company's list.", "quote": "A code from the other company's list will not behave as expected.", "tags": ["codes"]}, {"id": "d-08-q7", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "You have applied a code. What do you do next?", "options": ["Hand over the glasses for the patient to check", "Check the total against your quote", "Ask the lab to confirm the discount", "Delete the code if the total looks high"], "answer": 1, "feedback": "If it does not match, stop and ask. Never fix it by overriding the price.", "quote": "After applying, check the total against your quote.", "tags": ["rules"]}, {"id": "d-08-q8", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "A Gold member buys her second pair 30 days after her first. Which code?", "options": ["No code; type the half price in as a new price", "The NHS voucher code", "The second-pair code for your company", "The Gold frame discount button"], "answer": 2, "feedback": "The second-pair code covers a Gold member buying an additional pair within 90 days.", "quote": "The second-pair code: a Gold member buying an additional pair within 90 days of the first pair.", "tags": ["codes"]}], "d-09": [{"id": "d-09-q1", "lesson": "d-09", "level": 2, "type": "tf", "stem": "Being eligible for a free NHS eye test means the person is eligible for a voucher.", "options": ["True", "False"], "answer": 1, "feedback": "Free eye test entitlement is a separate question with a wider list of people.", "quote": "Being eligible for a free eye test does not mean the person gets a voucher.", "tags": ["eligibility"]}, {"id": "d-09-q2", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "A patient says they get help with health costs. What is your first step?", "options": ["Issue the voucher and note down what they told you", "Offer a Gold discount instead of a voucher", "Ask what they receive and check the evidence", "Explain that vouchers are for children only"], "answer": 2, "feedback": "You do not issue a voucher on a patient's word alone.", "quote": "You do not issue a voucher on a patient's word alone.", "tags": ["evidence"]}, {"id": "d-09-q3", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "What does an NHS optical voucher give the patient?", "options": ["A free eye test and a free lens clean", "A fixed contribution towards the cost", "A year of Gold membership", "A free pair of glasses in a standard frame"], "answer": 1, "feedback": "It is a contribution, not a free pair. The amount depends on the lens needed.", "quote": "It is not a free pair of glasses.", "tags": ["voucher"]}, {"id": "d-09-q4", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "Where do you take voucher values from?", "options": ["The till set-up or the current guidance", "Your memory of the last voucher job", "A poster on the practice wall", "What the patient says they got last time"], "answer": 0, "feedback": "Do not quote voucher values from memory or old posters.", "quote": "Do not quote voucher values from memory or old posters", "tags": ["values"]}, {"id": "d-09-q5", "lesson": "d-09", "level": 2, "type": "tf", "stem": "Children under 16 may be entitled to an NHS optical voucher.", "options": ["True", "False"], "answer": 0, "feedback": "Under-16s may be entitled, and must be dispensed by or under a registrant.", "quote": "children under 16", "tags": ["eligibility"]}, {"id": "d-09-q6", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "A 70-year-old says: I get free eye tests, so I get a free pair of glasses. What do you say?", "options": ["Say she should join a Gold plan to get glasses free", "Tell her yes, because over-60s always get a voucher too", "Explain the two are separate and check other grounds", "Issue the voucher now and check her paperwork later"], "answer": 2, "feedback": "A free eye test does not on its own give a voucher. Ask about other grounds, and ask if unsure.", "quote": "Entitlement to a free NHS eye test is a separate question with a wider list of people, such as people over 60 or with certain eye conditions.", "tags": ["eligibility"]}, {"id": "d-09-q7", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "Which patient must be dispensed by or under a registrant, even with a voucher?", "options": ["A child under 16", "A patient holding an NHS help certificate", "A 17-year-old in full-time education", "A patient with a complex prescription"], "answer": 0, "feedback": "A voucher does not change the registrant rule for under-16s and sight impaired patients.", "quote": "These patients must be dispensed by or under the supervision of a registrant.", "tags": ["scope"]}, {"id": "d-09-q8", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "What do you check about the patient's evidence?", "options": ["That it is in date and in the patient's name", "That it names the glasses being bought", "That it has a photograph of the patient on it", "That it was issued by this practice"], "answer": 0, "feedback": "Check it is in date and in their name.", "quote": "Check the details are in date and in their name.", "tags": ["evidence"]}], "d-11": [{"id": "d-11-q1", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "What is the correct order to build a quote?", "options": ["Total, frame, lenses, then extras", "Extras, frame, total, then lenses", "Frame, lens pair, extras, total", "Lenses, extras, frame, then total"], "answer": 2, "feedback": "Four steps, always in this order.", "quote": "Build the quote in four steps, always in this order.", "tags": ["method"]}, {"id": "d-11-q2", "lesson": "d-11", "level": 2, "type": "tf", "stem": "For a Gold member you can use the Gold frame price with standard lens prices.", "options": ["True", "False"], "answer": 1, "feedback": "Gold means Gold throughout; do not mix columns.", "quote": "Gold means Gold throughout.", "tags": ["gold"]}, {"id": "d-11-q3", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "The till total does not match your quote. What do you do?", "options": ["Override the price to match the quote", "Ask the patient to accept the till figure", "Find out why before taking any payment", "Take payment now and tell your manager later"], "answer": 2, "feedback": "Never fix it by overriding a price.", "quote": "Never fix it by overriding a price.", "tags": ["till"]}, {"id": "d-11-q4", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "Lens prices on the list are for what?", "options": ["One lens plus its coating", "A frame and lenses together", "One lens", "A pair"], "answer": 3, "feedback": "Every lens price is per pair.", "quote": "It is a price per pair.", "tags": ["pair"]}, {"id": "d-11-q5", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "Which extras do you confirm before quoting?", "options": ["Reglaze and mirror", "Polarised, mirror and XTRActive", "Reglaze and fixed colour tint only", "Fixed colour tint and polarised"], "answer": 1, "feedback": "Polarised, mirror and XTRActive are ask in practice.", "quote": "For polarised, mirror and XTRActive, ask in practice and confirm before you quote.", "tags": ["extras"]}, {"id": "d-11-q6", "lesson": "d-11", "level": 2, "type": "tf", "stem": "A non-member uses the standard columns throughout the quote.", "options": ["True", "False"], "answer": 0, "feedback": "Frame and lenses both come from the standard columns.", "quote": "A non-member uses the standard columns throughout.", "tags": ["gold"]}, {"id": "d-11-q7", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "A Gold member chooses a frame and Comfort Max lenses. Which columns do you read?", "options": ["Standard columns for both, with 30% off at the till", "Gold frame column and Gold lens columns", "Gold frame column and standard lens columns", "Standard frame column and Gold lens columns"], "answer": 1, "feedback": "Gold throughout; never work the discount out yourself.", "quote": "A Gold member's frame uses the Gold frame column and their lenses use the Gold lens columns.", "tags": ["gold"]}, {"id": "d-11-q8", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "A patient asks: what if I go thinner? What do you do?", "options": ["Ask the lab what the thinner lens costs", "Estimate the price from the current band", "Quote the same price and adjust at collection", "Re-read the next band rather than guessing"], "answer": 3, "feedback": "Read the next band on the list.", "quote": "re-read the next band rather than guessing.", "tags": ["method"]}], "d-12": [{"id": "d-12-q1", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "How many varifocal options should you usually present?", "options": ["Three, on adjacent rungs of the ladder", "Four, so that nothing is hidden", "All of them, so the patient can compare", "One, to avoid confusing the patient"], "answer": 0, "feedback": "Offer three choices, not four.", "quote": "Offer three choices, not four.", "tags": ["ladder"]}, {"id": "d-12-q2", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "Why keep the same index and clear or Transitions across the ladder?", "options": ["So the patient compares like with like", "So the thinnest lens is always offered", "So the lab can group the orders together", "So the quote is quicker to produce"], "answer": 0, "feedback": "Otherwise the comparison is unfair; show the effect of a thinner index afterwards if asked.", "quote": "Keep to the same index and clear or Transitions across the ladder", "tags": ["method"]}, {"id": "d-12-q3", "lesson": "d-12", "level": 3, "type": "tf", "stem": "You may promise a patient that the top rung will fix any problem they have.", "options": ["True", "False"], "answer": 1, "feedback": "Describe, do not guarantee. No medical claims.", "quote": "No medical claims.", "tags": ["claims"]}, {"id": "d-12-q4", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "A Gold member is being quoted the ladder. Which column do you use?", "options": ["Whichever column gives the lower total", "The standard column, then 20% off at the till", "The Gold column for the top rung only", "The Gold column for every rung"], "answer": 3, "feedback": "Use the same column for all options.", "quote": "The comparison should use the same column for all options.", "tags": ["gold"]}, {"id": "d-12-q5", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "Which rung is the entry level of the varifocal ladder?", "options": ["Elite (Visio Digital)", "Comfort Max", "XR (XR Design or XR Pro)", "Tailor Made (Nova Plus 3.0)"], "answer": 0, "feedback": "The ladder runs Elite, Tailor Made, Comfort Max, XR.", "quote": "1. Elite (Visio Digital)", "tags": ["ladder"]}, {"id": "d-12-q6", "lesson": "d-12", "level": 3, "type": "tf", "stem": "XR Design and XR Pro are sold at the same price.", "options": ["True", "False"], "answer": 0, "feedback": "The list gives one XR price for both.", "quote": "XR (XR Design or XR Pro; the same price)", "tags": ["ladder"]}, {"id": "d-12-q7", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "What do you do first when presenting the ladder?", "options": ["Explain the technical design of each lens", "Ask how they use their glasses day to day", "Recommend the top rung, then step down", "Quote the cheapest rung and stop there"], "answer": 1, "feedback": "Start with reading, screens, driving and hobbies, then describe each option in what the patient will notice.", "quote": "Ask how they use their glasses: reading, screens, driving, hobbies.", "tags": ["method"]}, {"id": "d-12-q8", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "Who must dispense varifocals for a 12-year-old?", "options": ["A registrant, or someone under their supervision", "Any dispenser who has passed Level 2", "A Level 1 team member, with a coach present", "Any dispenser, if a parent agrees"], "answer": 0, "feedback": "Under-16s are dispensed by or under a registrant.", "quote": "Under-16s and registered sight impaired patients are dispensed by or under a registrant.", "tags": ["law"]}], "e-01": [{"id": "e-01-q1", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Which two details do you ask for before searching?", "options": ["Full name and date of birth", "First name and phone number", "Full name and plan type", "Surname and postcode"], "answer": 0, "feedback": "Two identifiers, every time.", "quote": "Ask the patient for their full name and date of birth.", "tags": ["id"]}, {"id": "e-01-q2", "lesson": "e-01", "level": 1, "type": "tf", "stem": "If a prescription looks wrong, you can edit it in the record.", "options": ["True", "False"], "answer": 1, "feedback": "You never change a prescription. Ask the optometrist or a dispensing optician.", "quote": "You never change a prescription.", "tags": ["scope"]}, {"id": "e-01-q3", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Why check you are in the correct record before billing?", "options": ["Otherwise the receipt and the history are wrong", "Otherwise the discount codes stop working", "Otherwise the frame barcode will not scan", "Otherwise the lab will reject the order"], "answer": 0, "feedback": "Payment assumes the right patient record.", "quote": "Check you are in the correct record before billing.", "tags": ["id"]}, {"id": "e-01-q4", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "The test you select is nearly three years old. What do you do?", "options": ["Carry on, as the exemption covers it", "Round the date down to two years", "Ask a registrant before going any further", "Copy the numbers into a new test"], "answer": 2, "feedback": "A prescription over two years old is out of date for selling spectacles.", "quote": "A prescription more than two years old is out of date for selling spectacles, so ask a registrant before you go any further.", "tags": ["date"]}, {"id": "e-01-q5", "lesson": "e-01", "level": 1, "type": "tf", "stem": "You should ask the patient to tell you their name and date of birth, not read them out for a yes.", "options": ["True", "False"], "answer": 0, "feedback": "Reading them out invites a yes to the wrong record.", "quote": "Do not read them out for the patient to say \"yes\".", "tags": ["id"]}, {"id": "e-01-q6", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Two patients share a surname. What do you do?", "options": ["Pick the record with the most recent test", "Pick the one whose first name looks closest", "Turn the screen so the patient can point to theirs", "Match both name and date of birth to the record"], "answer": 3, "feedback": "Two details, always. Do not leave a record open where others can see it.", "quote": "Search in Optix One (desktop) and compare both details with the record. Pick the one that matches both.", "tags": ["id"]}, {"id": "e-01-q7", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Which is part of checking a prescription is complete?", "options": ["Sphere for each eye, and the PD copied from the old record", "Sphere only for each eye, as cylinder is optional", "Sphere, cylinder and axis for each eye, plus an add if needed", "The frame size and the patient's PD"], "answer": 2, "feedback": "If any check fails, ask a registrant.", "quote": "Check the prescription is complete: sphere, cylinder and axis for each eye, and an add if the patient needs near correction.", "tags": ["rx"]}, {"id": "e-01-q8", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Where do the patient's PDs come from?", "options": ["You measure them on the day", "The old record, to save time", "The prescription card", "The PD of the last frame"], "answer": 0, "feedback": "Note PDs only after measuring.", "quote": "Do not copy them from an old record.", "tags": ["measure"]}], "e-02": [{"id": "e-02-q1", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "Which product is Tailor Made?", "options": ["Varilux Immersia MID", "Visio Digital", "Nova Plus 3.0", "Comfort Max"], "answer": 2, "feedback": "Elite is Visio Digital, Tailor Made is Nova Plus 3.0, E-reader is Varilux Immersia MID.", "quote": "Elite is Visio Digital, Tailor Made is Nova Plus 3.0, E-reader is Varilux Immersia MID.", "tags": ["products"]}, {"id": "e-02-q2", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "Where are heights measured from for varifocals?", "options": ["The centre of the nose pad", "The top of the rim of the frame", "The upper edge of the eyebrow", "The lower rim of the frame"], "answer": 3, "feedback": "Heights are taken from the lower rim and are vital for varifocals.", "quote": "Heights are taken from the lower rim and are vital for varifocals.", "tags": ["measure"]}, {"id": "e-02-q3", "lesson": "e-02", "level": 2, "type": "tf", "stem": "If the frame price on screen is wrong you can type the right price.", "options": ["True", "False"], "answer": 1, "feedback": "Check the frame details and price match; staff cannot override a price. Ask.", "quote": "Typing a price over a product. Staff cannot override.", "tags": ["price"]}, {"id": "e-02-q4", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "What do you do before you confirm the dispense?", "options": ["Send the lens order to the lab", "Close the record to protect their data", "Recap the order and total with the patient", "Print the receipt for the patient to check"], "answer": 2, "feedback": "Recap first, then confirm.", "quote": "Recap the order and total cost with the patient.", "tags": ["method"]}, {"id": "e-02-q5", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "A product you need is not in the list. What do you do?", "options": ["Ask your practice manager", "Type in a manual price for it", "Pick the nearest match and add a note", "Leave it out and add it at collection"], "answer": 0, "feedback": "Do not choose a close match.", "quote": "If a product does not appear, ask.", "tags": ["products"]}, {"id": "e-02-q6", "lesson": "e-02", "level": 2, "type": "tf", "stem": "On the lens screen, both eyes should be selected unless only one lens is being supplied.", "options": ["True", "False"], "answer": 0, "feedback": "Selecting one eye by mistake leaves half the order out.", "quote": "On the lens screen, make sure both eyes is selected unless only one is being supplied.", "tags": ["method"]}, {"id": "e-02-q7", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "What do you do before you open the dispense screen?", "options": ["Scan the frame barcode", "Take the PDs and heights", "Search for the lens product", "Recap the total with the patient"], "answer": 1, "feedback": "Measurements come first, as you were trained.", "quote": "Take the measurements first (PDs and heights) as you were trained.", "tags": ["method"]}, {"id": "e-02-q8", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "Mrs S is having a varifocal lens. What must you tick on the dispense screen?", "options": ["That only one eye is supplied", "That a near prescription is needed", "That the lens is a plain blank", "That the frame is rimless"], "answer": 1, "feedback": "Tick near prescription for a varifocal, bifocal or reading lens.", "quote": "Tick that a near prescription is needed if the patient has a varifocal, bifocal or reading lens.", "tags": ["method"]}], "e-03": [{"id": "e-03-q1", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "How is a discount applied now?", "options": ["Through a discount code", "By overriding the price", "By the lab, when it invoices", "By changing the VAT band"], "answer": 0, "feedback": "A discount always goes through a code.", "quote": "A discount always goes through a code.", "tags": ["codes"]}, {"id": "e-03-q2", "lesson": "e-03", "level": 2, "type": "tf", "stem": "Each pair is its own dispense.", "options": ["True", "False"], "answer": 0, "feedback": "Each pair has its own product, lenses and frame.", "quote": "Each pair is its own dispense: its own product, lenses and frame, entered as in the dispensing lesson.", "tags": ["method"]}, {"id": "e-03-q3", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "The total does not match your quote. What do you do?", "options": ["Override the price to match the quote", "Stop, check the code and pair, then ask", "Delete the item and enter it again", "Take the payment and sort it out afterwards"], "answer": 1, "feedback": "Check the code is on the right pair, and ask if still wrong. Never fix it by overriding.", "quote": "Read the total aloud and compare it with your quote.", "tags": ["method"]}, {"id": "e-03-q4", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "You added an item by mistake. What do you do?", "options": ["Delete it without a note", "Override its price down to zero", "Void it with a reason", "Leave it and tell the patient"], "answer": 2, "feedback": "Void, never delete.", "quote": "If you have to remove an item, void it with a reason.", "tags": ["method"]}, {"id": "e-03-q5", "lesson": "e-03", "level": 2, "type": "tf", "stem": "The second-pair code is applied to the first pair when a Gold member buys two pairs.", "options": ["True", "False"], "answer": 1, "feedback": "The code goes on the second pair only; the first pair gets the plan discount.", "quote": "Applying the second-pair code to the first pair.", "tags": ["codes"]}, {"id": "e-03-q6", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "A Gold member bought glasses 40 days ago and wants sunglasses. What do you check first?", "options": ["Her last eye test result", "Her frame size from the old job", "The sunglasses stock level", "The first-pair date in her record"], "answer": 3, "feedback": "The offer depends on the first-pair date being within 90 days.", "quote": "Open her record and check the first-pair date.", "tags": ["steps"]}, {"id": "e-03-q7", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "A friend at the other company uses a different code name for the same offer. Which do you use?", "options": ["Your friend's code, as it is the same offer", "Either, since they do the same job", "The one in your own company's table", "The shorter one, to save time"], "answer": 2, "feedback": "Codes differ by company; learn and use your own.", "quote": "Look up your company's second-pair code in the table below.", "tags": ["codes"]}, {"id": "e-03-q8", "lesson": "e-03", "level": 2, "type": "tf", "stem": "Gold plan discounts on the first pair are applied through the plan discount, never by changing the price.", "options": ["True", "False"], "answer": 0, "feedback": "Same rule as the second pair: discounts, not price changes.", "quote": "on the first pair work the same way: through the plan discount, never by changing the price.", "tags": ["codes"]}], "e-04": [{"id": "e-04-q1", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "For cash, what do you enter in the system?", "options": ["The day's takings so far", "The change due", "The amount handed over", "The amount owed"], "answer": 3, "feedback": "Enter the amount owed, not the amount handed over.", "quote": "enter the amount owed, not the amount handed over", "tags": ["cash"]}, {"id": "e-04-q2", "lesson": "e-04", "level": 2, "type": "tf", "stem": "You can agree a refund on the spot if the patient seems upset.", "options": ["True", "False"], "answer": 1, "feedback": "Take the details and come back; management signs off refunds.", "quote": "Never say yes or no to a refund on the spot.", "tags": ["refunds"]}, {"id": "e-04-q3", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "For a chip and PIN card payment, who keeps which copy?", "options": ["Neither copy is kept once the payment clears", "Both copies stay in the till with the day's banking", "The patient keeps the merchant copy and you keep the other copy", "The customer takes their copy; you keep the merchant copy"], "answer": 3, "feedback": "Give the customer copy, keep the merchant copy.", "quote": "For chip and PIN give the customer copy and keep the merchant copy.", "tags": ["card"]}, {"id": "e-04-q4", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "What is the first check before taking payment?", "options": ["That you are in the correct patient record", "That the receipt paper is loaded", "That the discount code is applied", "That the lab has finished the job"], "answer": 0, "feedback": "Wrong record means a wrong receipt and history.", "quote": "Are you in the correct patient record?", "tags": ["method"]}, {"id": "e-04-q5", "lesson": "e-04", "level": 2, "type": "tf", "stem": "A merchant receipt should have the patient's name written on the back before it goes in the till.", "options": ["True", "False"], "answer": 0, "feedback": "It lets the payment be traced at banking.", "quote": "Write the patient's name on the back of the merchant receipt and put it in the till.", "tags": ["card"]}, {"id": "e-04-q6", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "A patient hands you a 20-pound note for a 14.50 balance. What do you enter as the cash amount?", "options": ["14.50", "20.00", "34.50", "5.50"], "answer": 0, "feedback": "Enter what is owed, put the cash in the till and give 5.50 change.", "quote": "enter the amount owed, not the amount handed over", "tags": ["cash"]}, {"id": "e-04-q7", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "A patient asks for a refund and is upset. What do you do?", "options": ["Refuse the refund politely and move on", "Take the details and say you will come back to them", "Refund it from the till and note it afterwards", "Agree to the refund to calm things down"], "answer": 1, "feedback": "Refunds are signed off by management; large cash refunds need approval first.", "quote": "Never say yes or no to a refund on the spot. Take the details and come back, because refunds are signed off by management.", "tags": ["refunds"]}, {"id": "e-04-q8", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "A patient pays contactless and asks for a receipt. What do you do?", "options": ["Print one from the system", "Tell them contactless has no receipt", "Ask the card machine to print it twice", "Hand over the merchant copy"], "answer": 0, "feedback": "For contactless only a merchant copy prints, so print the customer receipt from the system if asked.", "quote": "For contactless only a merchant copy prints; print a receipt from Optix One (desktop) if asked.", "tags": ["card"]}], "e-05": [{"id": "e-05-q1", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "What do you do first at collection?", "options": ["Mark the job as collected", "Check the job matches the order", "Take any balance and give a receipt", "Phone the lab to confirm the job"], "answer": 1, "feedback": "Check the right patient, pair, frame and lenses before anything else.", "quote": "Check the job: the right patient, the right pair, the right frame, the lenses match the order.", "tags": ["check"]}, {"id": "e-05-q2", "lesson": "e-05", "level": 1, "type": "tf", "stem": "If the glasses do not match the order you may hand them over and fix it later.", "options": ["True", "False"], "answer": 1, "feedback": "Do not hand them over; tell your practice manager.", "quote": "If the glasses do not match the order, do not hand them over.", "tags": ["check"]}, {"id": "e-05-q3", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "Who checks jobs for under-16s?", "options": ["Any team member at the till", "A registrant", "The patient's parent", "The lab before dispatch"], "answer": 1, "feedback": "Under-16s and registered sight impaired patients are dispensed by or under a registrant.", "quote": "A registrant checks these jobs.", "tags": ["scope"]}, {"id": "e-05-q4", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "What do you record after collection?", "options": ["Collection notes, such as happy with distance", "The patient's card PIN", "Nothing, as the receipt is enough", "The lab's delivery address"], "answer": 0, "feedback": "Record notes such as adjustments made or unsure about near.", "quote": "Record collection notes, for example happy with distance, unsure about near, adjustments made.", "tags": ["notes"]}, {"id": "e-05-q5", "lesson": "e-05", "level": 1, "type": "tf", "stem": "A follow-up call should be planned for first-time varifocal or enhanced-reader users.", "options": ["True", "False"], "answer": 0, "feedback": "Also for anyone who was unsure.", "quote": "Plan a follow-up call for first-time varifocal or enhanced-reader users and for anyone who was unsure.", "tags": ["follow-up"]}, {"id": "e-05-q6", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "The glasses do not match the order at collection. What do you do?", "options": ["Hand them over and fix them at the follow-up", "Do not hand them over and tell your practice manager", "Adjust the frame so the patient will not notice", "Offer a discount and let the patient decide"], "answer": 1, "feedback": "Do not promise a remake before the problem has been looked at.", "quote": "If the glasses do not match the order, do not hand them over. Tell your practice manager.", "tags": ["check"]}, {"id": "e-05-q7", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "Which part of collection is not yet written?", "options": ["Taking any balance and giving a receipt", "Checking the job against the order on collection", "The system's status names and follow-up timing", "Fitting and adjusting the glasses with the patient"], "answer": 2, "feedback": "The known parts are check, fit, balance, mark collected. The status names and follow-up timing are still to be confirmed.", "quote": "The exact steps and status names in Optix One (desktop), the follow-up timing and the paperwork that goes with the job.", "tags": ["process"]}, {"id": "e-05-q8", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "What do you ask the patient to do when they try the glasses?", "options": ["Wear them home and return only if sore", "Sign the job to say the lenses are perfect", "Read their prescription back to you", "Look through them and say how they feel"], "answer": 3, "feedback": "Fit, adjust, and ask how they feel before they leave.", "quote": "Ask him to look through them and tell you how they feel.", "tags": ["fit"]}], "e-06": [{"id": "e-06-q1", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "Which of these must you record for a remake?", "options": ["The patient's card number and PIN", "Nothing until a remake is approved", "The reason and the original order reference", "The lab's login for the claim"], "answer": 2, "feedback": "Record the reason and the original order reference.", "quote": "Record the original order reference.", "tags": ["record"]}, {"id": "e-06-q2", "lesson": "e-06", "level": 2, "type": "tf", "stem": "You may promise a free remake on the spot to calm an upset patient.", "options": ["True", "False"], "answer": 1, "feedback": "Never promise a free remake before the problem has been triaged.", "quote": "Never promise a free remake before the problem has been triaged.", "tags": ["promises"]}, {"id": "e-06-q3", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "What should you do with the original pair?", "options": ["Return it to the patient straight away", "Pass it to the lab with the claim", "Keep it unless told otherwise", "Throw it away to avoid confusion"], "answer": 2, "feedback": "Keep the original glasses.", "quote": "Keep the original glasses unless told otherwise.", "tags": ["record"]}, {"id": "e-06-q4", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "Who looks at a clinical complaint?", "options": ["The supplier", "A new starter", "Reception", "A registrant"], "answer": 3, "feedback": "A registrant looks at any clinical complaint.", "quote": "A registrant looks at any clinical complaint.", "tags": ["scope"]}, {"id": "e-06-q5", "lesson": "e-06", "level": 2, "type": "tf", "stem": "Tell the patient when you will call back, and then make that call.", "options": ["True", "False"], "answer": 0, "feedback": "Keep the patient informed.", "quote": "Keep the patient informed. Tell them when you will get back to them and do.", "tags": ["tone"]}, {"id": "e-06-q6", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "A patient says: these are rubbish, remake them free. What do you do?", "options": ["Say the lab probably caused the fault", "Note what she notices and promise a callback, not a remake", "Promise a free remake now to calm things down", "Ask her to wear them for another month first"], "answer": 1, "feedback": "Promise a callback, not a remake. A remake might be a warranty matter, an error, an adjustment, or neither.", "quote": "Do not say \"we will remake them\".", "tags": ["promises"]}, {"id": "e-06-q7", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "A colleague says eyecoded lenses carry a 12-month guarantee. What do you tell a patient?", "options": ["That eyecoded lenses are always remade free", "Nothing is promised; the wording is still to be confirmed", "That the supplier pays for any remake", "That all eyecoded lenses carry a 12-month guarantee"], "answer": 1, "feedback": "Any warranty advantage of eyecode is not yet confirmed; do not promise it.", "quote": "Any warranty advantage of eyecode is not yet confirmed; do not promise it.", "tags": ["warranty"]}, {"id": "e-06-q8", "lesson": "e-06", "level": 2, "type": "tf", "stem": "It helps to blame the lab in front of the patient so they see y

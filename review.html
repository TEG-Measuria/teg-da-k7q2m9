ce", "n": 8, "fl": true}}, "page": "review", "bank": {"l0-01": [{"id": "l0-01-q1", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "What may you do alone at Level 0?", "options": ["Collections using the 8-step routine", "Repairs and simple adjustments", "Nothing alone; you shadow dispenses", "Adult single vision dispenses"], "answer": 2, "feedback": "Level 0 is induction. You shadow at least 20 dispenses and do nothing alone, so even a simple adjustment waits until Level 1.", "quote": "Level 0, Induction: you do nothing alone.", "tags": ["levels"]}, {"id": "l0-01-q2", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "Who watches you do the real thing before you move up a Level?", "options": ["A colleague who is already at the same Level as you", "A registrant, an optometrist or dispensing optician", "The patient you are serving, who gives a rating", "A supplier representative visiting the practice"], "answer": 1, "feedback": "Sign-off is by a registrant. A colleague at your own Level, however friendly, cannot sign you off.", "quote": "A registrant (an optometrist or dispensing optician) watches you do the real thing.", "tags": ["signoff"]}, {"id": "l0-01-q3", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "What score do you need on the escalate-or-stop set?", "options": ["80%, the same as every module", "90% with one retry allowed", "100%, retrying until it is perfect", "75% averaged over three attempts"], "answer": 2, "feedback": "The set protects patients from harm, so it needs 100%. Modules are 80%, which is why the two scores must not be confused.", "quote": "The escalate-or-stop set, which you meet in lesson 4, needs 100%, because it protects patients from harm.", "tags": ["gate"]}, {"id": "l0-01-q4", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "When do the spaced re-tests appear after a module?", "options": ["At 1 day, 7 days and 30 days", "At 1 week, 1 month and 1 year", "Every morning for the first fortnight", "Once only, at the end of Level 1"], "answer": 0, "feedback": "Short re-tests at 1, 7 and 30 days move knowledge from a quick read into something you can use at the counter.", "quote": "Memory fades fast, so the Academy asks you a few questions again at 1 day, 7 days and 30 days after each module.", "tags": ["retest"]}, {"id": "l0-01-q5", "lesson": "l0-01", "level": 0, "type": "tf", "stem": "True or false: you show your completion codes to your coach at the weekly check-in.", "options": ["True", "False"], "answer": 0, "feedback": "The codes are your record, and the check-in is where the coach sees them.", "quote": "Every week you spend 10 minutes with your coach.", "tags": ["checkin"]}, {"id": "l0-01-q6", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "You have done 5 observed collections and passed the Level 1 quiz. What decides whether you move up?", "options": ["How many shifts you have worked so far", "The registrant judging that you are ready", "Your quiz score from the very first week", "How many sales you made last month"], "answer": 1, "feedback": "Five observed collections is only a minimum. The registrant must also judge you ready and ask a 5-question spoken spot-check.", "quote": "The count is only a minimum.", "tags": ["signoff"]}, {"id": "l0-01-q7", "lesson": "l0-01", "level": 0, "type": "tf", "stem": "True or false: if you score well on a module quiz, you may serve patients alone straight away.", "options": ["True", "False"], "answer": 1, "feedback": "You may only serve alone at a Level once you are signed off for it, however well you did in the quiz.", "quote": "Do not serve patients alone before you are signed off for that Level, however well you did in the quiz.", "tags": ["levels"]}, {"id": "l0-01-q8", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "A lesson step does not match what you see in practice. What do you do?", "options": ["Use the \"report a wrong step\" link, which goes to Jimmy", "Quietly follow the lesson anyway and say nothing about it", "Change the way the practice works to match the lesson", "Wait for the next re-test to mention the problem"], "answer": 0, "feedback": "The link exists for exactly this. Staying silent leaves a wrong step in front of the next learner, and you will never be in trouble for using it.", "quote": "Every lesson has a \"report a wrong step\" link.", "tags": ["report"]}], "l0-02": [{"id": "l0-02-q1", "lesson": "l0-02", "level": 0, "type": "order", "stem": "Put these stages in the correct order.", "options": ["Eye test", "Needs-finding", "Frame choice", "Collection and fitting"], "answer": 0, "feedback": "The patient is tested first, then asked about their needs, then chooses a frame, then collects the finished glasses.", "quote": "Eye test. An optometrist tests the eyes, checks eye health and writes the prescription.", "tags": ["journey"]}, {"id": "l0-02-q2", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "Why does frame choice come before lens advice?", "options": ["The frame decides which lenses can work, so fit and style come first", "Frames cost more than lenses, so the patient should decide first", "Lens advice can only be given once the order has been placed", "The lab needs the frame chosen before it will quote anything"], "answer": 0, "feedback": "Frame size, shape and style limit the lens options. It is not about cost or lab rules.", "quote": "Fit and style come first, because the frame decides which lenses can work.", "tags": ["frames"]}, {"id": "l0-02-q3", "lesson": "l0-02", "level": 0, "type": "tf", "stem": "True or false: you do not change a prescription, and you do not say what is wrong with someone's eyes.", "options": ["True", "False"], "answer": 0, "feedback": "Correct. Diagnosis and prescribing belong to the optometrist, and you pass concerns on to a registrant.", "quote": "You do not diagnose, you do not change a prescription, and you do not say what is wrong with someone's eyes.", "tags": ["role"]}, {"id": "l0-02-q4", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "A patient says they know exactly what they want. What do you do?", "options": ["Ask about their needs anyway", "Skip it and take the order", "Quote the cheapest option first", "Send them back to the booking desk"], "answer": 0, "feedback": "Needs-finding is always worth doing; the right choice depends on how they use their glasses, not on what they ask for first.", "quote": "Do not skip needs-finding because a patient says they know what they want. Ask anyway.", "tags": ["needs"]}, {"id": "l0-02-q5", "lesson": "l0-02", "level": 0, "type": "tf", "stem": "True or false: you should quote a price before you know what the patient needs.", "options": ["True", "False"], "answer": 1, "feedback": "Quoting first anchors the patient on the cheapest option. Needs come first, then the lens, then a confident price.", "quote": "Do not quote a price before you know what the patient needs.", "tags": ["price"]}, {"id": "l0-02-q6", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "While choosing a frame, a patient mentions flashing lights in one eye. What do you do?", "options": ["Get a registrant involved straight away", "Reassure them that it is common and carry on", "Suggest an anti-reflection coating to reduce glare", "Note it for the follow-up call after collection"], "answer": 0, "feedback": "Flashing lights sound clinical. You do not guess at the cause or reassure; you fetch a registrant.", "quote": "such as a patient who mentions flashing lights or a prescription that looks odd, and who gets a registrant involved.", "tags": ["escalate"]}, {"id": "l0-02-q7", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "Which stage comes straight after frame choice?", "options": ["Lens advice, then the price", "Ordering the job with the lab", "Collection and fitting of the glasses", "The recall reminder to the patient"], "answer": 0, "feedback": "After the frame, lenses are matched to the person and the price is stated. Ordering follows measuring.", "quote": "Lens advice. Lenses are matched to the person, not to the price.", "tags": ["journey"]}, {"id": "l0-02-q8", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "Which of these is the dispenser's job rather than the optometrist's?", "options": ["Writing the prescription after the sight test and noting it for the lab", "Taking the measurements that put the lens in the right place", "Checking eye health and looking for signs of eye disease", "Explaining to the patient which condition lies behind their symptoms"], "answer": 1, "feedback": "Measuring is a dispenser task. Prescribing, eye health checks and diagnosis belong to the optometrist.", "quote": "Measuring. The dispenser takes the measurements that put the lens in the right place.", "tags": ["role"]}], "l0-05": [{"id": "l0-05-q1", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "You are worried about a patient. What is the right first step?", "options": ["Ask the person they came with to explain it", "Tell the safeguarding lead, practice manager or a registrant", "Wait and see whether it happens again on a later visit", "Mention it to colleagues in the staff group chat"], "answer": 1, "feedback": "You raise the worry with the right person. You do not investigate or decide, and you do not share it in passing.", "quote": "Tell the practice safeguarding lead, or the practice manager or a registrant if the lead is out, as soon as it is safe to do so.", "tags": ["report"]}, {"id": "l0-05-q2", "lesson": "l0-05", "level": 0, "type": "tf", "stem": "True or false: if someone is in immediate danger, you ring 999.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Immediate danger is the one case where you do not wait for the lead or a registrant.", "quote": "If someone is in immediate danger, ring 999.", "tags": ["emergency"]}, {"id": "l0-05-q3", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "A confused older patient seems to be agreeing to an expensive upgrade without understanding it. What do you do?", "options": ["Complete the sale, since they said yes", "Offer a discount so the choice feels easier", "Do not make the sale and fetch a registrant", "Phone their family later to confirm it"], "answer": 2, "feedback": "If someone appears not to understand what they are buying, you do not complete the sale, and you never use the moment to upsell.", "quote": "If someone appears not to understand what they are buying, do not make the sale.", "tags": ["capacity"]}, {"id": "l0-05-q4", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "When should you write down what you saw and heard?", "options": ["Within a week, once you are certain what happened", "As soon as you can, using facts and not opinions", "Only after the patient has left the building for good", "Never, because notes about patients are gossip"], "answer": 1, "feedback": "A prompt, factual note in the person's own words is the most useful thing you can hand over.", "quote": "Write down what you saw and heard, using the person's own words, as soon as you can.", "tags": ["recording"]}, {"id": "l0-05-q5", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "A younger man answers every question for an elderly patient, who says he has no money, then says \"put it on his account\". What do you do?", "options": ["Tell the younger man you suspect he is controlling the patient", "Take the patient aside and ask whether he is being mistreated", "Refuse to serve them and ask both of them to leave the shop straight away, without a word", "Stay friendly, finish nothing, and quietly fetch the practice manager"], "answer": 3, "feedback": "Nothing proves anything, so you do not accuse or question. You stay friendly and bring in someone whose job it is.", "quote": "The dispenser stays friendly, does not accuse anyone, finishes nothing, and quietly asks the practice manager or a registrant to come over.", "tags": ["report"]}, {"id": "l0-05-q6", "lesson": "l0-05", "level": 0, "type": "tf", "stem": "True or false: you should wait until you are sure before raising a safeguarding worry.", "options": ["True", "False"], "answer": 1, "feedback": "You raise a worry; others decide what it means. Waiting to be sure can leave someone at risk.", "quote": "Do not wait to be sure.", "tags": ["report"]}, {"id": "l0-05-q7", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "Who may you share a safeguarding worry with?", "options": ["Any colleague who happens to be on shift with you and has a spare moment", "The person you are worried about, to hear their side", "A friend outside work, as long as no name is used", "Only the safeguarding lead, practice manager or a registrant"], "answer": 3, "feedback": "A worry goes only to the people whose job it is, not to colleagues in passing and not to the person concerned.", "quote": "Share a safeguarding worry only with the safeguarding lead, the practice manager or a registrant, and not with colleagues in passing.", "tags": ["privacy"]}, {"id": "l0-05-q8", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "A worried child asks you to keep what they tell you secret. What do you say?", "options": ["I promise this will stay between the two of us", "I will keep it secret if you tell me everything", "I cannot talk about this; please ask your parent instead", "I may need to share this with someone whose job is to help"], "answer": 3, "feedback": "You cannot promise secrecy. Being honest about sharing keeps the child's trust without making a promise you cannot keep.", "quote": "Do not promise to keep a secret.", "tags": ["secrecy"]}], "l0-06": [{"id": "l0-06-q1", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "Which pair counts as two identifiers?", "options": ["First name and surname only", "Full name and date of birth", "Phone number and email address", "Name and the item being collected"], "answer": 1, "feedback": "Name and date of birth are the usual pair; a postcode or address is a good alternative second item.", "quote": "Full name and date of birth are the usual pair.", "tags": ["identifiers"]}, {"id": "l0-06-q2", "lesson": "l0-06", "level": 0, "type": "tf", "stem": "True or false: a patient who asks for a copy of their data by phone has made a valid request.", "options": ["True", "False"], "answer": 0, "feedback": "A verbal request is valid, so you tell the practice manager rather than turning them away.", "quote": "A verbal request is valid.", "tags": ["dsar"]}, {"id": "l0-06-q3", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "You emailed a job reminder to the wrong address. What do you do?", "options": ["Tell the practice manager the same day", "Say nothing, as it was only one email", "Email the right address and leave it there", "Ask the wrong recipient to delete it quietly"], "answer": 0, "feedback": "Report straight away. A fast report helps the patient and lets the data protection officer decide what is needed.", "quote": "Tell the practice manager straight away, on the same day.", "tags": ["breach"]}, {"id": "l0-06-q4", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "How long do we have to reply to a request for personal data?", "options": ["Within 24 hours", "Within one calendar month", "Within one calendar year", "There is no fixed deadline at all"], "answer": 1, "feedback": "The reply is due within one calendar month.", "quote": "The reply is due within one calendar month.", "tags": ["dsar"]}, {"id": "l0-06-q5", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "A caller says he is a patient's husband and asks what her prescription is. What do you say?", "options": ["Read it out, since he knows her name and address", "Ask him to confirm her date of birth, then read it out", "Say you can only talk to the patient, and offer to take a message", "Email it to him so that there is a record of it"], "answer": 2, "feedback": "A relationship is not an identifier or permission. You protect the record and take a message instead.", "quote": "Before you give information or hand over a job, check two identifiers.", "tags": ["identifiers"]}, {"id": "l0-06-q6", "lesson": "l0-06", "level": 0, "type": "tf", "stem": "True or false: if a patient asks for their data by phone, you should ask them to put it in writing.", "options": ["True", "False"], "answer": 1, "feedback": "Never turn them away. A verbal request is valid, and you tell the practice manager at once.", "quote": "Do not say \"put it in writing\" to someone asking for their data.", "tags": ["dsar"]}, {"id": "l0-06-q7", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "Who decides whether the regulator must be told of a breach within 72 hours?", "options": ["The first colleague who hears of it", "The dispenser who made the mistake", "The patient whose data was affected", "The data protection officer"], "answer": 3, "feedback": "The data protection officer decides, which is why you report the same day. Every hour counts.", "quote": "the data protection officer decides that", "tags": ["breach"]}, {"id": "l0-06-q8", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "Which action helps keep patient data safe?", "options": ["Photographing a job bag so you can check it at home", "Locking the screen when you leave the computer", "Messaging a prescription to your own personal phone", "Opening a record out of curiosity about a neighbour"], "answer": 1, "feedback": "Locking the screen stops anyone else seeing a record. Photos, personal phones and curiosity all break the rules.", "quote": "Lock the screen when you leave the computer.", "tags": ["safety"]}], "l0-07": [{"id": "l0-07-q1", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "What is the add?", "options": ["The distance between the pupils", "The extra power added for reading", "The coating on the lens surface", "The size of the frame in millimetres"], "answer": 1, "feedback": "The add is the extra reading power on top of the distance prescription.", "quote": "Add: the extra power added for reading.", "tags": ["vocab"]}, {"id": "l0-07-q2", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "What does a focimeter do?", "options": ["Tests the patient's eyes for disease", "Checks the power and centre of a lens", "Measures how thin a lens material is", "Finds the height of the eye above the frame"], "answer": 1, "feedback": "A focimeter reads the power and centre of a lens, so we can check it matches the prescription.", "quote": "Focimeter (lensometer): the instrument that checks the power and centre of a lens.", "tags": ["vocab"]}, {"id": "l0-07-q3", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "What is a registrant?", "options": ["Anyone who works on the front desk at reception", "An optometrist or dispensing optician on the GOC register", "A trainee dispenser in their first week at work", "The lab technician who glazes the finished job"], "answer": 1, "feedback": "A registrant is on the General Optical Council register: an optometrist or a dispensing optician.", "quote": "Registrant: someone on the General Optical Council (GOC) register, either an optometrist or a dispensing optician.", "tags": ["vocab"]}, {"id": "l0-07-q4", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "What does reglaze mean?", "options": ["New lenses in an existing frame", "A new frame with the old lenses", "A thorough clean of the finished glasses", "A free eye test after collection"], "answer": 0, "feedback": "Reglaze is putting new lenses into the frame the patient already owns.", "quote": "Reglaze: new lenses in an existing frame.", "tags": ["vocab"]}, {"id": "l0-07-q5", "lesson": "l0-07", "level": 0, "type": "tf", "stem": "True or false: a higher index lets a lens be thinner for the same prescription.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Index is how strongly the material bends light, and a higher index allows a thinner lens.", "quote": "A higher index lets the lens be thinner for the same prescription.", "tags": ["vocab"]}, {"id": "l0-07-q6", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "A patient asks what a varifocal is. Which is the best plain answer?", "options": ["A lens with two powers and a visible dividing line", "A lens that gives one power over the whole lens", "A lens that changes smoothly from far to near, with no line", "A lens that darkens when it is out in the sunlight"], "answer": 2, "feedback": "The others describe a bifocal, single vision and photochromic lens in turn. A varifocal changes smoothly with no visible line.", "quote": "Varifocal (progressive): a smooth change in power from far to near, with no visible line.", "tags": ["vocab"]}, {"id": "l0-07-q7", "lesson": "l0-07", "level": 0, "type": "tf", "stem": "True or false: height matters most for single vision lenses.", "options": ["True", "False"], "answer": 1, "feedback": "Height matters most for varifocals, where the eye must sit at the right level in the lens.", "quote": "Height: how high above the frame bottom the eye sits. It matters most for varifocals.", "tags": ["vocab"]}, {"id": "l0-07-q8", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "Which term means the gap between the back of the lens and the eye?", "options": ["Pupillary distance", "Cylinder axis", "Vertex distance", "Add power"], "answer": 2, "feedback": "Vertex distance is that gap. PD is the distance between the pupils.", "quote": "Vertex distance: the gap between the back of the lens and the eye.", "tags": ["vocab"]}], "l0-08": [{"id": "l0-08-q1", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "How many dispenses do you shadow at Level 0?", "options": ["At least 5", "At least 10", "At least 20", "At least 50"], "answer": 2, "feedback": "You shadow at least 20 dispenses and do not serve alone.", "quote": "At Level 0 you shadow at least 20 dispenses.", "tags": ["shadow"]}, {"id": "l0-08-q2", "lesson": "l0-08", "level": 0, "type": "order", "stem": "Put these steps of the collection routine in order.", "options": ["Check the job against the order", "Fit", "Distance, near and in motion", "Check two identifiers"], "answer": 0, "feedback": "The routine starts with checking against the order and ends with two identifiers.", "quote": "Collections are done in the same order every time.", "tags": ["collection"]}, {"id": "l0-08-q3", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "How many observed single vision dispenses are needed for Level 2?", "options": ["Five observed dispenses", "Eight observed dispenses", "Ten observed dispenses", "Twenty observed dispenses"], "answer": 2, "feedback": "Level 2 needs at least 10 observed single vision dispenses, with a defined mix.", "quote": "For Level 2 it is 10 observed single vision dispenses", "tags": ["signoff"]}, {"id": "l0-08-q4", "lesson": "l0-08", "level": 0, "type": "tf", "stem": "True or false: at Level 3 you must be observed measuring 3 of the 8 varifocal and bifocal dispenses.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. 3 of the 8 are measured by you and checked by the signer.", "quote": "For Level 3 it is 8 observed varifocal and bifocal dispenses, 3 of them measured by you and checked by the signer.", "tags": ["signoff"]}, {"id": "l0-08-q5", "lesson": "l0-08", "level": 0, "type": "tf", "stem": "True or false: reaching the minimum count means you are automatically signed off.", "options": ["True", "False"], "answer": 1, "feedback": "The count is a minimum. The signer also judges that you are ready and asks a spoken spot-check.", "quote": "In every case the count is a minimum, the signer decides when you are ready, and you answer a 5-question spoken spot-check.", "tags": ["signoff"]}, {"id": "l0-08-q6", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "What goes in your shadowing notebook?", "options": ["The patient's name and what they bought", "A copy of the prescription for revision", "A line on what you saw, with no patient names", "The patient's phone number for the follow-up"], "answer": 2, "feedback": "You count and note each dispense with no patient names or details.", "quote": "Count them in a notebook with no patient names.", "tags": ["shadow"]}, {"id": "l0-08-q7", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "You want to know why the dispenser did something. When do you ask?", "options": ["Straight away, while the patient is talking", "Afterwards, as one why question", "Never; copy what they do instead", "Only at your next weekly check-in"], "answer": 1, "feedback": "Stay quiet and out of the way during the dispense, then ask one why question afterwards.", "quote": "Afterwards, ask one why question.", "tags": ["shadow"]}, {"id": "l0-08-q8", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "Which is part of the Level 2 observed mix?", "options": ["A bifocal with a visible dividing line", "A varifocal measured by the learner", "A contact lens aftercare visit", "An NHS voucher dispense"], "answer": 3, "feedback": "The Level 2 mix includes a high minus, a high plus, an oblique-axis astigmat, an anisometrope, an NHS voucher, a Transitions or tint, and a second pair.", "quote": "an NHS voucher, a Transitions or tint, and a second pair", "tags": ["signoff"]}], "b-01": [{"id": "b-01-q1", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "Mr D wants one pair for driving, a desk and his phone, and does not want to swap glasses all day. Which type fits?", "options": ["Single vision lenses made for reading only", "A varifocal: far, middle and near", "An office lens worn as his only pair", "A bifocal with a visible line for near"], "answer": 1, "feedback": "A varifocal covers far, middle and near in one pair. The others leave out a distance he needs.", "quote": "They give all three distances in one pair.", "tags": ["choose"]}, {"id": "b-01-q2", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "What is the main problem with giving a driver an office lens as their only pair?", "options": ["The lenses cost far too much for an everyday pair", "It cannot be made in a tint", "The far distance view is limited or absent", "It has a visible line across it"], "answer": 2, "feedback": "Office lenses are built for close and middle distances, so they are a second pair for working in, not for the road.", "quote": "They are a second pair for working in, not a pair for the road or the stairs.", "tags": ["office"]}, {"id": "b-01-q3", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "What is the best first step when helping a patient choose a lens type?", "options": ["Read the prescription and pick the type from it", "Offer the most expensive option first", "Ask what they do and how far away they look", "Show frames before asking anything"], "answer": 2, "feedback": "Need comes first. Two people with the same prescription can need different lenses.", "quote": "begin with the patient's day, not the prescription.", "tags": ["needs"]}, {"id": "b-01-q4", "lesson": "b-01", "level": 1, "type": "tf", "stem": "True or false: the law restricts an unregistered person from selling an adult a varifocal.", "options": ["True", "False"], "answer": 1, "feedback": "The law does not restrict the sale of an adult's spectacles by lens design. The restrictions are for under-16s and the registered sight impaired.", "quote": "the law does not restrict the sale of an adult's spectacles by lens design.", "tags": ["law"]}, {"id": "b-01-q5", "lesson": "b-01", "level": 1, "type": "tf", "stem": "True or false: an adult varifocal may be sold by an unregistered person against a prescription under two years old.", "options": ["True", "False"], "answer": 0, "feedback": "Yes, provided the checks in the law are met. The lens design itself is not restricted.", "quote": "An adult varifocal may be sold by an unregistered person against a prescription under two years old", "tags": ["law"]}, {"id": "b-01-q6", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "What is the usual trade-off of a varifocal?", "options": ["A visible line between distance and near", "Nothing in between, so the middle is blurred", "Some blur at the sides of the lens", "Only one distance is covered at a time"], "answer": 2, "feedback": "The sides of a varifocal have some blur, so the wearer learns to point their nose at what they want to see.", "quote": "The trade-off is that the sides of the lens have some blur", "tags": ["varifocal"]}, {"id": "b-01-q7", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "A first-time varifocal wearer asks if it will feel normal at once. What do you say?", "options": ["Most people adapt in a week or two; we will book a check", "Yes, you will not notice any difference at all", "It usually takes about six months to get used to", "Only if you choose the most expensive design"], "answer": 0, "feedback": "Do not promise it will feel normal at once. Most people adapt in a week or two, and you book a check.", "quote": "Say that most people adapt in a week or two and book a check.", "tags": ["adapt"]}, {"id": "b-01-q8", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "A 14-year-old wants varifocals. Who dispenses them?", "options": ["You, if you are signed off at Level 3", "Any adult member of staff on the floor", "You, if a parent agrees to the choice", "A registrant, or you under their supervision"], "answer": 3, "feedback": "Under-16s must be dispensed by or under the supervision of a registrant, whatever the lens type.", "quote": "Under-16s and people registered sight impaired must be dispensed by or under the supervision of a registrant.", "tags": ["law"]}], "b-02": [{"id": "b-02-q1", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "What is a stock lens?", "options": ["A lens ground to the exact prescription for one patient at the lab after the order is placed", "A lens made in advance in set powers and cut to shape for the frame", "A lens with a photochromic tint that darkens", "A lens only supplied for children"], "answer": 1, "feedback": "Stock lenses are pre-made in set powers. Surfaced lenses are ground to the prescription.", "quote": "A stock lens is made in advance by the manufacturer in a range of powers and then cut to shape for the frame.", "tags": ["stock"]}, {"id": "b-02-q2", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "What does HMC stand for in our single vision lens, and what does it give?", "options": ["High magnification curve: a thinner, lighter lens for strong powers and large frames", "Hydrophobic mirror coat: a mirrored finish that repels water", "Hard multi-coat: scratch-resistant hard coating plus anti-reflection", "Home made coating: a coating applied in the practice"], "answer": 2, "feedback": "HMC is hard multi-coat: scratch resistance plus anti-reflection.", "quote": "HMC means a scratch-resistant hard coating and an anti-reflection multi-coat.", "tags": ["hmc"]}, {"id": "b-02-q3", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "Ms R asks why a basic pair is cheaper than an Eyezen pair. She does not use screens much. What is the best answer?", "options": ["The basic lens is simply a lower quality product than Eyezen", "Basic lenses do not last as long as the premium ones do once worn every day", "Eyezen adds a design for heavy screen work that she does not need", "Eyezen is only designed for patients who are over fifty"], "answer": 2, "feedback": "Be honest: the basic lens is good. Premium designs add something for a specific need.", "quote": "Third: the premium range adds special designs for particular jobs, such as heavy screen work, and she has not mentioned that need.", "tags": ["price"]}, {"id": "b-02-q4", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "The price on the till looks wrong for a single vision pair. What do you do?", "options": ["Override it in the system to match the list", "Ask, because you never override a price", "Change the VAT band to fix the total", "Discount it by hand at the till"], "answer": 1, "feedback": "You never override a price. If it looks wrong, you ask.", "quote": "if a price looks wrong, ask.", "tags": ["price"]}, {"id": "b-02-q5", "lesson": "b-02", "level": 2, "type": "tf", "stem": "True or false: a basic single vision lens on our list is a hard multi-coated lens.", "options": ["True", "False"], "answer": 0, "feedback": "Yes, it has a scratch-resistant hard coating and an anti-reflection multi-coat.", "quote": "Single vision on our list is a hard multi-coated lens (HMC).", "tags": ["hmc"]}, {"id": "b-02-q6", "lesson": "b-02", "level": 2, "type": "tf", "stem": "True or false: you can promise a ready date as soon as the patient chooses a lens, whether it is stock or surfaced.", "options": ["True", "False"], "answer": 1, "feedback": "Surfaced lenses depend on the lab, so you wait until you know which type it is.", "quote": "Do not promise a lens will be ready by a date until you know whether it is a stock or a surfaced lens.", "tags": ["timing"]}, {"id": "b-02-q7", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "Which patient is a good match for a basic single vision lens?", "options": ["A patient with heavy daily screen use and tired eyes by the afternoon, who wants all-day comfort", "A patient who mainly wants a lens built for night-time driving", "A patient who needs reading and distance in the same pair", "A patient who needs one distance and has no special screen or driving demands"], "answer": 3, "feedback": "Single vision is right for one distance with no special demands. Screens or driving point to premium designs.", "quote": "When single vision is the right answer: for a patient who needs one distance", "tags": ["choose"]}, {"id": "b-02-q8", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "Why might a strong prescription not be available as a stock lens?", "options": ["Stock lenses cannot be cut down to fit a smaller frame", "Stock lenses are only ever made in plus powers", "Strong powers need a tint that stock lenses lack", "Stock comes in set steps, so strong prescriptions need surfacing"], "answer": 3, "feedback": "Stock lenses come in set steps. The strongest and most unusual prescriptions are surfaced.", "quote": "so the strongest and most unusual prescriptions will not be available in stock.", "tags": ["stock"]}], "b-03": [{"id": "b-03-q1", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "Mr J has tired eyes after nine hours on two screens and a mild prescription. How do you describe Eyezen?", "options": ["It prevents eye damage from long days on screens", "A single vision lens with a design for devices, for comfort", "A varifocal built for office workers", "A lens that blocks all blue light from screens and keeps the eyes healthy"], "answer": 1, "feedback": "Eyezen is described as comfort support for device users, with no health claims.", "quote": "It is for comfort, with no promise about eye health.", "tags": ["eyezen"]}, {"id": "b-03-q2", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "Which of these must be eyecoded?", "options": ["Only Eyezen Boost", "Both Eyezen Start and Eyezen Boost", "Neither design, as they are stock lenses", "Only the Transitions versions"], "answer": 1, "feedback": "Both designs must be eyecoded, using VisiOffice measurements.", "quote": "Both designs must be eyecoded.", "tags": ["eyecode"]}, {"id": "b-03-q3", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "Which patient description fits Eyezen Boost better than Eyezen Start?", "options": ["Wants a spare pair for gardening and walks, no screens, and never uses a phone", "Reports tired eyes with close work on a long device day", "Needs distance vision only, mainly for night driving", "Is a younger wearer whose near focusing is comfortable"], "answer": 1, "feedback": "Boost adds more help for close work, so it suits those who report tired eyes or difficulty at close range.", "quote": "Eyezen Boost adds more help for close work and suits a patient who reports tired eyes", "tags": ["choose"]}, {"id": "b-03-q4", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "Mrs W, 52, on screens all day, has a prescription with a near add. What is the best step?", "options": ["Sell Eyezen Boost, since she is on screens all day anyway", "Ask a registrant, as a varifocal or office lens may suit better", "Tell her screens at her age are damaging her eyes", "Skip the VisiOffice measurements to save her some time"], "answer": 1, "feedback": "A near add changes the conversation. Ask a registrant, and remember that Eyezen is single vision.", "quote": "Do not use Eyezen as a substitute for a reading or varifocal prescription. If the patient has a near add, ask a registrant.", "tags": ["add"]}, {"id": "b-03-q5", "lesson": "b-03", "level": 2, "type": "tf", "stem": "True or false: it is our house rule that every Essilor patient has VisiOffice measurements.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Every Essilor patient is measured on VisiOffice, which is what eyecoding uses.", "quote": "It is our house rule that every Essilor patient has VisiOffice measurements.", "tags": ["eyecode"]}, {"id": "b-03-q6", "lesson": "b-03", "level": 2, "type": "tf", "stem": "True or false: you may press SEND on the Essilor order yourself once it is entered.", "options": ["True", "False"], "answer": 1, "feedback": "Never. Only a trained person sends the order.", "quote": "Never press SEND yourself; only a trained person sends the order.", "tags": ["order"]}, {"id": "b-03-q7", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "A patient asks whether blue light from screens damages the eyes. What do you say?", "options": ["Yes, blue light damages eyes, and Eyezen blocks it", "Eyezen is about comfort, and I cannot make a health claim", "Yes, but only for people who are over forty", "No, it is perfectly safe, so you do not need Eyezen"], "answer": 1, "feedback": "Do not say blue light causes eye damage. Eyezen is a comfort conversation.", "quote": "Do not say blue light causes eye damage. Eyezen is a comfort conversation.", "tags": ["claims"]}, {"id": "b-03-q8", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "VisiOffice cannot be done for a patient. What do you do?", "options": ["Skip the measurements and leave the Eyecode tick off on the order", "Press on and measure the PD by eye instead", "Note why on the dispense and use the fallback card averages", "Delay the order until a registrant is free"], "answer": 2, "feedback": "Note why on the dispense and use the average values in the fallback card.", "quote": "If VisiOffice cannot be done, note why on the dispense and use the average values in the fallback card.", "tags": ["eyecode"]}], "b-04": [{"id": "b-04-q1", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "What is the E-reader on our price list?", "options": ["Varilux Digitime", "Varilux Immersia MID", "Eyezen Boost design", "Varilux Road Pilot design"], "answer": 1, "feedback": "E-reader means Varilux Immersia MID. Staff do not order Digitime.", "quote": "When you order, you order Immersia MID, not Digitime; we do not order Digitime.", "tags": ["product"]}, {"id": "b-04-q2", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "Mrs H has neck ache using varifocals at her screen all day. What do you offer?", "options": ["A thicker index lens in the same varifocal design", "A bifocal worn for driving to work", "An office lens as a second pair for the desk", "Nothing; she must get used to it"], "answer": 2, "feedback": "An office lens gives a wide view at desk distance. It is a second pair, with the varifocals kept for everything else.", "quote": "It is also a good second pair for a varifocal wearer whose neck aches.", "tags": ["choose"]}, {"id": "b-04-q3", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "A patient asks if their new office pair can be worn for driving. What is the correct answer?", "options": ["Yes, it covers all distances comfortably", "No, it is not a replacement for distance vision", "Yes, provided it has an anti-reflection coating", "Only in the evening, when there is less traffic"], "answer": 1, "feedback": "The far distance is limited in an office lens, so it is not for driving, stairs or walking about.", "quote": "It is not a replacement for distance vision.", "tags": ["limits"]}, {"id": "b-04-q4", "lesson": "b-04", "level": 2, "type": "tf", "stem": "True or false: a patient who needs far vision at work, such as a lecturer looking to the back of a hall, should simply be sold an office lens.", "options": ["True", "False"], "answer": 1, "feedback": "If far vision is needed at work, an office lens may not be right. Ask a registrant.", "quote": "A person who needs far vision at work (for example, a lecturer looking to the back of a hall) may need a different answer; ask a registrant.", "tags": ["limits"]}, {"id": "b-04-q5", "lesson": "b-04", "level": 2, "type": "tf", "stem": "True or false: when you order the office lens, you order Immersia MID and not Digitime.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. We do not order Digitime.", "quote": "When you order, you order Immersia MID, not Digitime; we do not order Digitime.", "tags": ["product"]}, {"id": "b-04-q6", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "Which patient is the best match for an office lens?", "options": ["A courier who drives all day and has a near add", "A patient who wants one pair for walking and stairs", "A musician reading from a stand, who has a near add", "A lecturer who must see clearly to the back of a hall"], "answer": 2, "feedback": "Office lenses suit long periods at a desk, a screen, a stand or a bench for someone with a near add.", "quote": "anyone with a near add who spends long periods at a desk or screen, or reading", "tags": ["choose"]}, {"id": "b-04-q7", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "What extra question do you ask when selling an office lens?", "options": ["Whether they would like a tint added", "How far away their screen is, and write it down", "Whether they drive to work each day", "How many hours they sleep each night"], "answer": 1, "feedback": "The working distance matters for the measurements, so ask how far away the screen is and record it.", "quote": "Measurements for the working distance matter, so ask the patient how far away their screen is and write it down.", "tags": ["measure"]}, {"id": "b-04-q8", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "A patient wants the office lens with Transitions. What do you do?", "options": ["Promise it, because every band has a Transitions version", "Order it first and check the band when the lab replies", "Check price-it first; not every band offers Transitions", "Tell the patient Transitions is never offered with this lens"], "answer": 2, "feedback": "Not every Transitions combination is offered, so check price-it before promising.", "quote": "Do not promise a Transitions option without checking that the band offers it.", "tags": ["price"]}], "b-05": [{"id": "b-05-q1", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "What is Road Pilot?", "options": ["A single vision lens made for the dashboard distance only", "A varifocal made for people who drive a lot", "A polarised sun lens designed for daytime driving glare", "A bifocal designed for professional drivers"], "answer": 1, "feedback": "Road Pilot is a progressive (varifocal) with widened distance and middle zones, so the wearer needs a near add.", "quote": "is a progressive lens from Essilor made for people who drive a lot.", "tags": ["product"]}, {"id": "b-05-q2", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "A patient asks whether the anti-reflection coating will stop headlight glare at night. What do you say?", "options": ["Yes, it removes all glare from oncoming headlights", "It may help, but no lens removes glare completely", "Glare never has anything to do with the eyes themselves", "Only Transitions lenses will reduce glare at night"], "answer": 1, "feedback": "Coatings help with reflections and comfort. Promising that glare disappears would be untrue.", "quote": "It cannot remove the glare from oncoming headlights, and it is wrong to say it will.", "tags": ["claims"]}, {"id": "b-05-q3", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "Mrs B says her night driving has got worse. What is the best action?", "options": ["Sell a tinted lens, which will cut the glare down at night", "Tell the optometrist, as it may not be a lens matter", "Tell her she should not drive at night until it is checked", "Promise her that a new coating will fix the problem"], "answer": 1, "feedback": "A new or worsening night-vision complaint may have a medical cause. You never diagnose; you pass it on.", "quote": "A new complaint of glare or poor night vision is something to tell the optometrist about, because it may have a medical cause.", "tags": ["escalate"]}, {"id": "b-05-q4", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "A single vision wearer needs glasses only for driving. Which is usually the simpler and wider answer?", "options": ["Road Pilot, to widen the road view", "A single vision lens for distance", "An office lens for the dashboard", "A bifocal with a line for the mirrors"], "answer": 1, "feedback": "Road Pilot is a varifocal and needs a near add. Single vision is simpler for distance-only needs.", "quote": "a single vision wearer who only needs distance for driving (single vision is simpler and wider)", "tags": ["choose"]}, {"id": "b-05-q5", "lesson": "b-05", "level": 2, "type": "tf", "stem": "True or false: a patient must have a near add to wear Road Pilot.", "options": ["True", "False"], "answer": 0, "feedback": "Road Pilot is a varifocal, so it carries the same adaptation as any progressive and needs a near add.", "quote": "It is a varifocal, so it carries the same adaptation as any progressive and the patient must have a near add.", "tags": ["product"]}, {"id": "b-05-q6", "lesson": "b-05", "level": 2, "type": "tf", "stem": "True or false: a tinted lens is a good choice for night driving.", "options": ["True", "False"], "answer": 1, "feedback": "Never recommend a tint for night driving.", "quote": "Do not recommend a tinted lens for night driving.", "tags": ["claims"]}, {"id": "b-05-q7", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "Why do Transitions lenses stay fairly light inside a car?", "options": ["They only react to darkness, so daylight leaves them clear", "The anti-reflection coating cancels the tint inside a car", "Car windscreens block much of the UV they react to", "They need heat from the sun, not light, to darken"], "answer": 2, "feedback": "Photochromic lenses react to UV, and windscreens block much of it.", "quote": "photochromic lenses (b-12) react to UV, and car windscreens block much of it, so they stay lighter in the car.", "tags": ["sun"]}, {"id": "b-05-q8", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "What is the usual answer for daytime driving glare?", "options": ["A tinted lens worn for night driving as well", "A clear lens with no coating at all", "A polarised sun pair", "A thicker index lens in the usual frame"], "answer": 2, "feedback": "A polarised sun pair is the usual answer for daytime driving glare.", "quote": "A polarised sun pair (b-13) is the usual answer for daytime driving glare.", "tags": ["sun"]}], "b-08": [{"id": "b-08-q1", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "Mrs Q says her last glasses were like jam-jar bottoms. What should you do first?", "options": ["Quote the thinnest material available, then the price", "Ask what bothered her most about the old pair", "Tell her that a strong prescription is just unlucky", "Show her the price list before anything else"], "answer": 1, "feedback": "Find the real worry first, then choose the lever that answers it.", "quote": "You do not start with the word \"index\".", "tags": ["needs"]}, {"id": "b-08-q2", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "Which lever should you offer first because it costs the least?", "options": ["The frame size and shape", "The anti-reflection coating", "The thinnest material on the list", "A second pair of glasses"], "answer": 0, "feedback": "A smaller, rounder frame shows less thickness and often costs less than moving up an index.", "quote": "Start with the lever that costs the least: the frame.", "tags": ["levers"]}, {"id": "b-08-q3", "lesson": "b-08", "level": 2, "type": "tf", "stem": "True or false: a thinner lens is always a lighter lens.", "options": ["True", "False"], "answer": 1, "feedback": "Some higher index materials are denser, so thin does not always mean light.", "quote": "Thin does not always mean light.", "tags": ["weight"]}, {"id": "b-08-q4", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "A patient with a strong prescription asks, \"Will the edge disappear?\" What is the honest answer?", "options": ["Yes, with the thinnest lens it vanishes completely", "Much neater, but still thicker than a mild one", "No, nothing can be done to improve it at all", "Only polycarbonate can make an edge disappear"], "answer": 1, "feedback": "Honest limits build trust; over-promising loses it.", "quote": "A strong prescription will always be thicker at the edge than a mild one, even in the thinnest material.", "tags": ["honesty"]}, {"id": "b-08-q5", "lesson": "b-08", "level": 2, "type": "tf", "stem": "True or false: a strong prescription will still be thicker at the edge than a mild one, even in the thinnest material.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Say so honestly rather than promising the edge will vanish.", "quote": "A strong prescription will always be thicker at the edge than a mild one, even in the thinnest material.", "tags": ["honesty"]}, {"id": "b-08-q6", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "A patient says her glasses \"slide down my nose and leave marks\". Which of the three concerns is this?", "options": ["How it feels", "How it looks", "How it performs", "How it is priced"], "answer": 0, "feedback": "Weight and fit are about how it feels. Looks and performance are the other two concerns.", "quote": "How it feels.", "tags": ["needs"]}, {"id": "b-08-q7", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "How should you set out the options once you know what the patient cares about?", "options": ["Advise what you would choose, then work down to budget", "Start with the cheapest option and work upwards", "Ask their budget first and offer nothing above that figure", "Show every option on the list at once and let them pick"], "answer": 0, "feedback": "The Dispensing Conversation starts with what you would advise, not with the cheapest option.", "quote": "The Dispensing Conversation teaches us to say what we would advise first and then work down to the patient's budget, not to start with the cheapest.", "tags": ["conversation"]}, {"id": "b-08-q8", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "A patient cares most about weight. What do you do?", "options": ["Promise that the thinner lens is bound to be lighter", "Check the product details before promising weight", "Say that every high-index lens is lighter than standard", "Tell them that lens weight cannot be changed at all"], "answer": 1, "feedback": "Some higher index materials are denser, so check before promising.", "quote": "If a patient cares most about weight, ask a colleague or check the product information before promising.", "tags": ["weight"]}], "b-11": [{"id": "b-11-q1", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "What does an anti-reflection coating do for the patient?", "options": ["Makes the lens completely scratch-proof for life", "Cuts reflections, so the eyes can be seen", "Makes the lens thinner at the edge and lighter", "Blocks all the blue light coming from screens"], "answer": 1, "feedback": "Anti-reflection reduces reflections, ghost images and glare, and lets others see the wearer's eyes.", "quote": "An anti-reflection coating reduces this, so the lens looks clearer and the wearer's eyes can be seen.", "tags": ["coating"]}, {"id": "b-11-q2", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "A patient asks if the coating makes the glasses scratch-proof. What is the honest answer?", "options": ["Yes, it makes the glasses completely scratch-proof", "More resistant, but no lens is scratch-proof", "No, coatings do nothing at all against scratches", "Only the Transitions lenses are ever scratch-proof"], "answer": 1, "feedback": "Say \"more resistant\", never \"scratch-proof\".", "quote": "\"Scratch-proof.\" No lens is. Say \"more resistant to everyday scratches\".", "tags": ["claims"]}, {"id": "b-11-q3", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "What is Crizal?", "options": ["Essilor's family of coatings", "A lens material that is thinner than 1.74", "A frame brand sold by Essilor", "A tint that darkens in sunlight"], "answer": 0, "feedback": "Crizal is Essilor's coating range.", "quote": "Crizal** is Essilor's family of coatings.", "tags": ["crizal"]}, {"id": "b-11-q4", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "A patient leaves her glasses on the car dashboard in summer. What should you warn her about?", "options": ["Nothing; coatings are made to withstand it", "Heat can damage a coating", "UV will make the coating stronger", "The coating will turn the lenses darker"], "answer": 1, "feedback": "Heat can damage coatings. Advise a case and a cool place.", "quote": "Heat, such as leaving glasses on a car dashboard, can damage a coating.", "tags": ["care"]}, {"id": "b-11-q5", "lesson": "b-11", "level": 2, "type": "tf", "stem": "True or false: the coating comes with the lens on our list and is not usually sold as a separate extra.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. For anything not on the list, ask in practice.", "quote": "The coating comes with the lens on our list; you do not usually sell it as a separate extra.", "tags": ["price"]}, {"id": "b-11-q6", "lesson": "b-11", "level": 2, "type": "tf", "stem": "True or false: you should tell a patient the coating protects their eyes from UV.", "options": ["True", "False"], "answer": 1, "feedback": "The honest statement is that it reduces UV reflected from the back surface of the lens. Keep to comfort.", "quote": "The honest statement is that it reduces UV reflected from the back surface of the lens", "tags": ["claims"]}, {"id": "b-11-q7", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "How should a patient clean their lenses?", "options": ["A dry tissue, to take the dust off first", "The corner of a shirt, which is soft enough", "Hot water and washing-up liquid on a kitchen cloth", "Lukewarm water, lens spray and a clean microfibre cloth"], "answer": 3, "feedback": "Avoid wiping dry dust off with clothing or tissues, which can scratch the coating.", "quote": "Wash the lenses with lukewarm water, use lens spray and a clean microfibre cloth", "tags": ["care"]}, {"id": "b-11-q8", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "A patient complains of reflections on video calls and smears he cannot clean. Which coating jobs answer this?", "options": ["A hard layer plus UV protection at the back surface", "Anti-reflection and easy-to-clean layers", "UV protection and a darker tint on the front", "A hard layer with a thicker coating on the back"], "answer": 1, "feedback": "Anti-reflection cuts the reflections; easy-to-clean layers repel water and oil so smears wipe off.", "quote": "Layers that repel water and oil make smears and dust easier to wipe off.", "tags": ["coating"]}], "b-12": [{"id": "b-12-q1", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "What triggers a Transitions lens to darken?", "options": ["Heat from the sun on the lens", "UV in daylight", "Visible light from any source, such as screens", "The temperature of the room"], "answer": 1, "feedback": "UV triggers the change, which is why windscreens (which block UV) limit darkening in the car.", "quote": "The change is triggered mainly by the UV in daylight, not by heat.", "tags": ["how"]}, {"id": "b-12-q2", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "Mrs K asks if Transitions will be dark enough for driving in bright sun. What is the honest answer?", "options": ["Yes, they darken fully once you are inside a car", "They stay fairly light behind a windscreen", "Yes, because they work as proper sunglasses do", "Yes, as long as the weather outside is hot"], "answer": 1, "feedback": "The windscreen blocks much of the UV that triggers the lens, so a separate sun pair is better for bright driving.", "quote": "A car windscreen blocks much of the UV, so a standard Transitions lens stays fairly light inside a car.", "tags": ["driving"]}, {"id": "b-12-q3", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "In cold weather, what does a Transitions lens usually do?", "options": ["Stays completely clear until it warms up", "Goes darker and takes longer to clear", "Goes lighter and clears more quickly", "Stops working until the weather warms"], "answer": 1, "feedback": "Cold makes it darker and slower to clear; heat makes it lighter.", "quote": "In cold weather the lens usually goes darker and takes longer to clear; in hot weather it is lighter.", "tags": ["how"]}, {"id": "b-12-q4", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "Before offering a Transitions version of a design in a given band, what must you do?", "options": ["Assume every combination exists in every band", "Check price-it, as some are not offered", "Ask the patient which band they prefer", "Override the price if the cell is empty"], "answer": 1, "feedback": "Some cells are not available, so check before promising.", "quote": "Do not offer a Transitions combination before checking price-it.", "tags": ["price"]}, {"id": "b-12-q5", "lesson": "b-12", "level": 2, "type": "tf", "stem": "True or false: a Transitions lens usually takes longer to clear than it takes to darken.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Tell the patient so they are not surprised.", "quote": "The lens darkens in under a minute and takes longer to clear.", "tags": ["how"]}, {"id": "b-12-q6", "lesson": "b-12", "level": 2, "type": "tf", "stem": "True or false: Transitions lenses are dark enough to replace sunglasses for driving in bright sun.", "options": ["True", "False"], "answer": 1, "feedback": "They are not sunglasses and are not suitable on their own for driving in bright sun.", "quote": "it is not suitable on its own for driving in bright sun.", "tags": ["driving"]}, {"id": "b-12-q7", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "A patient works indoors and drives to work. What does Transitions offer them?", "options": ["Less than it does for someone often in and out", "More, because indoors is where it works best", "The same as for any other wearer", "Nothing, as it never works indoors"], "answer": 0, "feedback": "If they are mostly indoors or in the car, Transitions has less to offer.", "quote": "If they are mostly indoors or in the car, Transitions has less to offer.", "tags": ["recommend"]}, {"id": "b-12-q8", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "What is a good pattern for a patient who drives?", "options": ["One Transitions pair worn for everything, driving too", "A tinted pair for night driving and a clear pair", "Transitions every day, plus a polarised sun pair", "Two Transitions pairs in two different frames"], "answer": 2, "feedback": "Transitions for everyday use, and a polarised sun pair for driving.", "quote": "A good pattern: Transitions for the everyday pair, plus a polarised sun pair if they drive (b-13).", "tags": ["recommend"]}], "b-13": [{"id": "b-13-q1", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "What does a polarising filter do?", "options": ["Makes the lens darker all of the time, whatever the light", "Cuts glare reflected off wet roads and water", "Makes the lens resistant to everyday scratches", "Blocks all of the UV light reaching the eye"], "answer": 1, "feedback": "Polarised lenses cut reflected glare, which is why they suit driving and water.", "quote": "A polarising filter cuts glare that reflects off flat surfaces such as water, wet roads and car bonnets.", "tags": ["polarised"]}, {"id": "b-13-q2", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "Which caution should you give a patient buying polarised lenses for driving?", "options": ["They are not allowed to be worn for driving", "They only give any benefit when it is dark", "Screens and dashboard displays can look patchy", "They cannot ever be made with a tint added"], "answer": 2, "feedback": "Ask the patient to check their satnav or dashboard through the lens.", "quote": "Some digital screens, and some displays on a car dashboard, can look dim or have patches through polarised lenses.", "tags": ["polarised"]}, {"id": "b-13-q3", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "Which sunglass category is not suitable for driving?", "options": ["Category 1", "Category 2", "Category 3", "Category 4"], "answer": 3, "feedback": "Category 4 is for extreme glare such as snow and mountains.", "quote": "Category 4 is for extreme glare, such as snow and mountains, and is not suitable for driving.", "tags": ["category"]}, {"id": "b-13-q4", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "A patient asks the price of polarised lenses. What do you do?", "options": ["Quote the figure from memory, as it is standard", "Use the fixed colour tint price as a guide", "Ask in practice before quoting a figure", "Tell them it is included at no extra cost"], "answer": 2, "feedback": "Polarised, XTRActive, mirror and style are shown as ask in practice. Never quote from memory.", "quote": "Polarised, XTRActive, mirror and style are shown as \"ask in practice\".", "tags": ["price"]}, {"id": "b-13-q5", "lesson": "b-13", "level": 2, "type": "tf", "stem": "True or false: a dark lens without UV protection is worse than no lens at all.", "options": ["True", "False"], "answer": 0, "feedback": "The pupil opens behind a dark lens and lets more UV in. Check for UV400.", "quote": "A dark lens that does not give UV protection is worse than no lens, because the pupil opens and lets more UV in.", "tags": ["uv"]}, {"id": "b-13-q6", "lesson": "b-13", "level": 2, "type": "tf", "stem": "True or false: a category 4 lens is a good choice for driving.", "options": ["True", "False"], "answer": 1, "feedback": "Category 4 is for extreme glare such as snow and is not for driving.", "quote": "A category 4 lens is not for driving.", "tags": ["category"]}, {"id": "b-13-q7", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "Which tint is a good choice for driving?", "options": ["A very dark tint to cut all the glare", "A medium-dark brown or grey", "A pale yellow tint, for night driving", "Any mirror coating, whatever the light"], "answer": 1, "feedback": "A medium-dark brown or grey is good for driving. Never a very dark lens for the road, and no tint at night.", "quote": "A medium-dark brown or grey tint is good for driving.", "tags": ["tint"]}, {"id": "b-13-q8", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "How should you advise a patient who has an everyday pair and drives a lot?", "options": ["Offer only the cheapest pair and mention a sun pair never", "Sell a sun pair and suggest wearing it every day too", "Wait for the patient to raise the idea of a sun pair", "An everyday pair plus a sun pair, explaining why"], "answer": 3, "feedback": "The everyday pair is for every day, the sun pair for driving and bright days. If the budget does not allow both, discuss priorities.", "quote": "the everyday pair for every day, the sun pair for driving and bright days.", "tags": ["conversation"]}], "b-14": [{"id": "b-14-q1", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "A patient asks if blue light from her screen is damaging her eyes. What is the accurate position?", "options": ["Yes, and filtering lenses will prevent the harm", "No good evidence of harm; filters are for comfort", "Only older patients are harmed by screen light", "Screen blue light is a known cause of macular disease"], "answer": 1, "feedback": "The professional position is no good evidence of harm from screens. Filters, if chosen, are for comfort.", "quote": "there is no good evidence that blue light from screens harms the eyes", "tags": ["claims"]}, {"id": "b-14-q2", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "Which phrase is acceptable to say about a blue-light-filtering lens?", "options": ["It protects your eyes from the damage screens do", "It prevents long-term damage building up in your eyes", "It may feel more comfortable on long screen days", "It will help you sleep better once the screen is off"], "answer": 2, "feedback": "Comfort language only. The other three are health claims.", "quote": "We say: \"may feel more comfortable on long screen days\"", "tags": ["claims"]}, {"id": "b-14-q3", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "Mr H asks if blue light glasses will stop macular degeneration. What do you do?", "options": ["Say yes, as long-term eye protection is what they are for", "Say it is a comfort option only, and offer the optometrist", "Say they probably will help in the long run", "Move on to the frame and leave the question"], "answer": 1, "feedback": "Never make disease-prevention claims; pass health questions to the optometrist.", "quote": "it prevents macular problems", "tags": ["claims"]}, {"id": "b-14-q4", "lesson": "b-14", "level": 2, "type": "tf", "stem": "True or false: the honest answer to \"do I need blue light lenses?\" is that they are optional.", "options": ["True", "False"], "answer": 0, "feedback": "They are a comfort option, not a necessity.", "quote": "If a patient asks if a feature is \"needed\", the honest answer is no: it is optional.", "tags": ["optional"]}, {"id": "b-14-q5", "lesson": "b-14", "level": 2, "type": "tf", "stem": "True or false: you may tell a patient that a blue light filter helps with sleep.", "options": ["True", "False"], "answer": 1, "feedback": "That is a health claim, and we never make it.", "quote": "Never say a lens helps sleep or prevents any disease.", "tags": ["claims"]}, {"id": "b-14-q6", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "What free tip can you give a patient with tired eyes from screens?", "options": ["Every 2 hours, close the eyes for 20 minutes", "Every 20 seconds, blink 20 times in a row", "Every hour, look at a bright light for 20 seconds", "Every 20 minutes, look 20 feet away for 20 seconds"], "answer": 3, "feedback": "The 20 20 20 habit: every 20 minutes, look about 6 metres away for 20 seconds.", "quote": "every 20 minutes, look 20 feet (about 6 metres) away for 20 seconds", "tags": ["tip"]}, {"id": "b-14-q7", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "A patient has dry or sore eyes and headaches. What do you suggest?", "options": ["Suggest they talk to the optometrist", "Sell a blue-light-filter lens to relieve them", "Suggest an anti-reflection coating instead", "Tell them it is just screen fatigue"], "answer": 0, "feedback": "Dry or sore eyes, headaches or changes in vision are for the optometrist.", "quote": "If a patient has dry or sore eyes, headaches or changes in vision, they should talk to the optometrist.", "tags": ["escalate"]}, {"id": "b-14-q8", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "A patient is not interested in a blue-light feature. What do you do?", "options": ["Explain the risks of blue light until they agree", "Add it to the order anyway, just to be safe", "Do not push it; it is optional", "Offer it again at collection with a discount"], "answer": 2, "feedback": "Do not push a blue-light feature on someone who is not interested, and do not scare a patient to sell an option.", "quote": "Do not push a blue-light feature on someone who is not interested.", "tags": ["ethics"]}], "c-01": [{"id": "c-01-q1", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "A frame is marked 54 17 140. What does the 17 mean?", "options": ["Width of one lens opening", "Length of the side to the tip", "Gap between the two lenses", "Height of the lens box"], "answer": 2, "feedback": "The middle number is the bridge, the distance between the lenses, in millimetres.", "quote": "Bridge (DBL): the distance between the lenses, also in millimetres.", "tags": ["box"]}, {"id": "c-01-q2", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "A frame is marked 50 20 145. What is its frame PD (centre-to-centre distance)?", "options": ["50 mm", "120 mm", "90 mm", "70 mm"], "answer": 3, "feedback": "Frame PD is the eye size plus the bridge: 50 + 20 = 70 mm. Adding the eye size twice (120) gives the lens-area width, not the frame PD.", "quote": "Frame PD (centre-to-centre distance) is the eye size plus the bridge.", "tags": ["frame-pd"]}, {"id": "c-01-q3", "lesson": "c-01", "level": 1, "type": "tf", "stem": "The depth of the lens opening (B) is not printed on the frame, so you measure it with a ruler.", "options": ["True", "False"], "answer": 0, "feedback": "B is not printed. You measure it, and it matters for varifocals and lens thickness.", "quote": "B is not printed on the frame.", "tags": ["box"]}, {"id": "c-01-q4", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "Which part of a frame lets the side fold?", "options": ["Hinge", "Rim", "Bridge", "End piece"], "answer": 0, "feedback": "The hinge lets the side fold. The end piece is only where the hinge is fixed to the front.", "quote": "Hinge: lets the side fold.", "tags": ["parts"]}, {"id": "c-01-q5", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "A patient's PD is 62 mm and the frame is marked 52 18 140. How far must the lenses be moved in, in total?", "options": ["14 mm in total, 7 mm each side", "4 mm in total, 2 mm each side", "8 mm in total, 4 mm each side", "10 mm in total, 5 mm each side"], "answer": 2, "feedback": "Frame PD is 52 + 18 = 70 mm. 70 - 62 = 8 mm in total, so 4 mm each side.", "quote": "Frame PD (centre-to-centre distance) is the eye size plus the bridge.", "tags": ["decentration"]}, {"id": "c-01-q6", "lesson": "c-01", "level": 1, "type": "tf", "stem": "Two frames from different brands both marked 52 can look different in size.", "options": ["True", "False"], "answer": 0, "feedback": "Brand sizing varies because of rim thickness and shape, so the printed number alone is not the whole story.", "quote": "Brand sizing varies.", "tags": ["watch-out"]}, {"id": "c-01-q7", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "A varifocal is going into a frame. Which measurement is not printed and must be measured with a ruler?", "options": ["The depth of the lens box (B)", "The width of one lens opening", "The distance between the lenses", "The length of the side from hinge to tip"], "answer": 0, "feedback": "Box depth B is never printed. The other three are the printed numbers (eye size, bridge, side length).", "quote": "B is not printed on the frame.", "tags": ["box"]}, {"id": "c-01-q8", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "Why do you work out a frame's centre-to-centre distance?", "options": ["To choose the side length that will sit best behind the ears", "To see how far the lens must be shifted to meet the patient's PD", "To find the depth of the box before ordering a varifocal lens", "To decide whether the frame needs spring hinges or plain ones"], "answer": 1, "feedback": "Comparing it with the patient's PD shows how much decentration the lab must apply. It tells you nothing about side length, hinges or box depth.", "quote": "Compare it with the patient's PD.", "tags": ["frame-pd"]}], "c-02": [{"id": "c-02-q1", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "Which material is light, strong and described as hypoallergenic?", "options": ["Propionate", "Stainless steel", "Titanium", "Monel (nickel alloy)"], "answer": 2, "feedback": "Titanium is the hypoallergenic metal. Some stainless steel contains nickel, and Monel is a nickel alloy.", "quote": "Titanium: light, strong and hypoallergenic.", "tags": ["materials"]}, {"id": "c-02-q2", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "A patient says earrings and a watch strap often irritate her skin. What do you offer?", "options": ["Any metal frame, and wipe the pads often", "An acetate or titanium frame", "A nickel-alloy frame with thick plating", "A frame in whichever style she prefers"], "answer": 1, "feedback": "Her history points to a nickel sensitivity, so offer acetate or titanium. Plating wears through and cleaning does not remove nickel from the alloy.", "quote": "If yes, offer acetate or titanium.", "tags": ["nickel"]}, {"id": "c-02-q3", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "Where on glasses does a nickel reaction usually appear?", "options": ["Along the cheeks below the lens", "Behind the neck where a cord sits", "At the nose pads, bridge and earpieces", "Across the forehead and brow"], "answer": 2, "feedback": "A reaction shows where metal touches skin: nose pads, bridge and earpieces.", "quote": "In glasses, the places that touch the skin are the nose pads, the bridge and the earpieces, so these are where a reaction appears.", "tags": ["nickel"]}, {"id": "c-02-q4", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "A patient has a spreading, sore rash from her old glasses. What do you do?", "options": ["Say it looks like a nickel allergy and note that on her record", "Ask her to wear them less often until the rash has settled", "Offer a different material and suggest a pharmacist or GP for the skin", "Tell her which cream to use and ask her to keep wearing them"], "answer": 2, "feedback": "You change the material but do not diagnose. A spreading, sore rash is for a clinician to look at.", "quote": "Do not diagnose a rash.", "tags": ["scope"]}, {"id": "c-02-q5", "lesson": "c-02", "level": 1, "type": "tf", "stem": "A reaction to an existing pair is a reason to change the material, not to put up with it.", "options": ["True", "False"], "answer": 0, "feedback": "Changing the frame material is part of your job when a reaction is reported.", "quote": "A reaction to an existing pair is a reason to change the material, not to put up with it.", "tags": ["nickel"]}, {"id": "c-02-q6", "lesson": "c-02", "level": 1, "type": "tf", "stem": "You can tell a patient a metal frame is hypoallergenic as long as it looks like titanium.", "options": ["True", "False"], "answer": 1, "feedback": "Only say hypoallergenic when the label or the supplier says so. Looks prove nothing; if you do not know, say so and ask.", "quote": "Do not say a frame is \"hypoallergenic\" unless the label or the supplier says so.", "tags": ["claims"]}, {"id": "c-02-q7", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "When should you ask a patient the nickel question?", "options": ["Once the order has been sent to the lab", "At collection, after the lenses have been glazed", "Early, before the patient chooses a frame", "Only when the patient mentions a rash first"], "answer": 2, "feedback": "Ask early so the patient does not fall for a frame they cannot wear.", "quote": "Ask the nickel question early, before the patient falls for a frame.", "tags": ["nickel"]}, {"id": "c-02-q8", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "Which nose pads are kinder on sensitive skin?", "options": ["Pads with extra colour plating", "Plated metal pads", "Hard plastic pads", "Silicone pads"], "answer": 3, "feedback": "Silicone pads are softer than hard plastic pads and kinder on sensitive skin.", "quote": "silicone pads are softer than hard plastic pads and kinder on sensitive skin.", "tags": ["pads"]}], "c-03": [{"id": "c-03-q1", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "When choosing between two frames, which comes first?", "options": ["Price, then fit", "Brand, then style", "Style, then fit", "Fit, then style"], "answer": 3, "feedback": "Choose for fit first and style second; lenses cannot rescue a frame that does not fit.", "quote": "Choose the frame for fit first and style second.", "tags": ["fit"]}, {"id": "c-03-q2", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "Where should the pupils sit in the lens opening for most prescriptions?", "options": ["Slightly above centre, nearer the brow", "At the nasal edge, to help the bridge sit", "Roughly in the middle, across and up and down", "Low down, so the top of the frame clears the brow"], "answer": 2, "feedback": "Pupils should be roughly central both horizontally and vertically.", "quote": "For most prescriptions, the pupils should be roughly in the middle of the lens opening, both horizontally and vertically.", "tags": ["fit"]}, {"id": "c-03-q3", "lesson": "c-03", "level": 1, "type": "tf", "stem": "The bottom of the frame should not rest on the patient's cheeks.", "options": ["True", "False"], "answer": 0, "feedback": "A frame resting on the cheeks is a fit fault; check the bottom edge as part of the brow and cheek check.", "quote": "The bottom of the frame should not rest on the cheeks.", "tags": ["fit"]}, {"id": "c-03-q4", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "Why does a slipping frame matter optically?", "options": ["The lens becomes thicker at the edge", "The optical centre moves away from the pupil", "The lens power changes as the frame drops", "Reflections on the front surface increase"], "answer": 1, "feedback": "A slipping frame puts the patient behind the wrong part of the lens.", "quote": "Slipping glasses change the optical centre position, so the patient looks through the wrong part of the lens.", "tags": ["fit"]}, {"id": "c-03-q5", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "A frame is a little wider than the patient's face and slips when she looks down. What do you do?", "options": ["Choose a narrower frame or a different bridge", "Bend the sides in tightly so it grips her head", "Sell it and tell her it will settle with wear", "Heat the frame to make the front narrower"], "answer": 0, "feedback": "Do not force a fit the frame cannot reach. Choose another and repeat the checks.", "quote": "Do not bend or heat a frame to force a fit it cannot reach.", "tags": ["fit"]}, {"id": "c-03-q6", "lesson": "c-03", "level": 1, "type": "tf", "stem": "You can make the final fit judgement with the frame in your hand.", "options": ["True", "False"], "answer": 1, "feedback": "Look at the frame on the patient, from the front, side and slightly above.", "quote": "Do not make the final fit judgement with the frame in your hand.", "tags": ["fit"]}, {"id": "c-03-q7", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "A frame suits Miss R but the bridge sits higher on the left, so it tilts. What do you do?", "options": ["Choose a lens with a different base curve", "Call the fit done, since a slight tilt is normal", "Send it to the lab with a note to decentre the lens", "Note a small adjustment and re-check once it is level"], "answer": 3, "feedback": "Do not call the fit done until it is level.", "quote": "You note it for a small adjustment (c-04) and do not call the fit done until it is level.", "tags": ["fit"]}, {"id": "c-03-q8", "lesson": "c-03", "level": 1, "type": "tf", "stem": "You should fit the frame before you measure, because measuring a poorly fitted frame gives wrong figures.", "options": ["True", "False"], "answer": 0, "feedback": "Measurements taken on a badly fitting frame do not match how it will sit when worn.", "quote": "Measuring a poorly fitted frame gives wrong figures (c-10).", "tags": ["measure"]}], "c-04": [{"id": "c-04-q1", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "Which task may a trained Level 1 do?", "options": ["Drill a hole in a rimless mount", "Bend the bridge of a plastic frame", "Move the nose pads on a metal frame", "Replace a broken hinge on a metal frame"], "answer": 2, "feedback": "Adjusting nose pads on metal frames is allowed. Hinge replacement, drilling and bridge bending need a qualified colleague.", "

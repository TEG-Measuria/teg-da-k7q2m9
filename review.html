ou are on their side.", "options": ["True", "False"], "answer": 1, "feedback": "Do not blame the patient or the lab in front of the patient. Be warm and calm.", "quote": "Blaming the patient or the lab in front of the patient.", "tags": ["tone"]}], "e-07": [{"id": "e-07-q1", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "What does IMPORT MEASUREMENTS do?", "options": ["Works out the lens thickness", "Shows the result of the order so far", "Fills the form from a VisiOffice session", "Stores the draft order"], "answer": 2, "feedback": "IMPORT MEASUREMENTS fills the form from a VisiOffice session.", "quote": "IMPORT MEASUREMENTS fills the form from a VisiOffice session.", "tags": ["buttons"]}, {"id": "e-07-q2", "lesson": "e-07", "level": 2, "type": "tf", "stem": "A new starter may press SEND to practise.", "options": ["True", "False"], "answer": 1, "feedback": "Only a trained person sends an order.", "quote": "Only a trained person sends an order.", "tags": ["send"]}, {"id": "e-07-q3", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "What do Essilor order numbers start with?", "options": ["OP", "EO", "JK", "RX"], "answer": 3, "feedback": "Essilor order numbers start with RX.", "quote": "Essilor order numbers start with RX.", "tags": ["reference"]}, {"id": "e-07-q4", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "What is the first section of the order form?", "options": ["Summary", "Prescription", "Shape", "Lenses"], "answer": 2, "feedback": "The order runs Shape, Prescription, Thickness & measurements, Personalisation, Lenses, Summary.", "quote": "Work down the sections: Shape, Prescription, Thickness & measurements, Personalisation, Lenses and Summary.", "tags": ["form"]}, {"id": "e-07-q5", "lesson": "e-07", "level": 2, "type": "tf", "stem": "The reference box needs the tray number, last name, first initial and Optix ID.", "options": ["True", "False"], "answer": 0, "feedback": "That lets the job be traced.", "quote": "Put the tray number, last name, first initial and Optix ID in the reference box so the job can be traced.", "tags": ["reference"]}, {"id": "e-07-q6", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "You have pressed CALCULATE and checked the preview. What next?", "options": ["Close the form without saving", "SAVE the draft and stop for a trained person", "Print the summary and give it to the patient", "SEND the order to Essilor"], "answer": 1, "feedback": "You prepare a saved draft. A trained person checks and sends.", "quote": "Press CALCULATE, check the preview, then SAVE.", "tags": ["send"]}, {"id": "e-07-q7", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "Where may you write down or share the practice's Opsysweb login?", "options": ["Nowhere; never share it or write it down", "In a message to a colleague who needs it", "On a sticky note beside the screen", "In the notes of the patient's record"], "answer": 0, "feedback": "Log in with your practice's own login and never share it.", "quote": "(never share or write it down in notes)", "tags": ["security"]}, {"id": "e-07-q8", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "The order is confirmed. What do you do with the RX number?", "options": ["Delete it once the lab has the job", "Write it on the frame tray only", "Record it and move the order's status on", "Tell the patient to keep it safe"], "answer": 2, "feedback": "Record it so the job can be traced.", "quote": "move the order's status on.", "tags": ["reference"]}], "e-08": [{"id": "e-08-q1", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "Which of these must be eyecoded?", "options": ["Comfort Max", "A reglaze", "D28 bifocal", "Single vision 1.5"], "answer": 0, "feedback": "The must-eyecode list is Eyezen Start, Eyezen Boost, Comfort Max, Comfort Max f-360, XR Design and Short, and XR Pro.", "quote": "Eyezen Start, Eyezen Boost, Comfort Max, Comfort Max f-360, XR Design and XR Short, and XR Pro.", "tags": ["eyecode"]}, {"id": "e-08-q2", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "XR Pro is needed but VisiOffice cannot be done. What do you order?", "options": ["XR Design with average measurements", "Nothing until VisiOffice is working again", "Comfort Max with measurements you estimate", "XR Pro with the average measurements"], "answer": 0, "feedback": "XR Pro cannot be fully personalised without VisiOffice.", "quote": "Order XR Design with average measurements instead.", "tags": ["fallback"]}, {"id": "e-08-q3", "lesson": "e-08", "level": 2, "type": "tf", "stem": "You must note on the dispense why VisiOffice was not done.", "options": ["True", "False"], "answer": 0, "feedback": "Always write the reason.", "quote": "Always write the reason.", "tags": ["fallback"]}, {"id": "e-08-q4", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "VisiOffice cannot be done. Which fallback set is right?", "options": ["ERC 25.5, cape 0.0, wrap 4 to 6, panto 8 to 12, vertex 14 to 16", "ERC 25.5, cape 0.0, wrap 4 to 6, panto 8 to 12, vertex 10 to 12", "ERC 25.5, cape 4.0, wrap 8 to 12, panto 4 to 6, vertex 10 to 12", "ERC 0.0, cape 25.5, wrap 4 to 6, panto 8 to 12, vertex 10 to 12"], "answer": 1, "feedback": "These average values are the agreed fallback. Do not make up other numbers.", "quote": "Average values are the agreed fallback.", "tags": ["fallback"]}, {"id": "e-08-q5", "lesson": "e-08", "level": 2, "type": "tf", "stem": "You can promise a patient the eyecode rebate.", "options": ["True", "False"], "answer": 1, "feedback": "The rebate and warranty wording are not yet confirmed, so promise neither.", "quote": "Promising the rebate or warranty to a patient.", "tags": ["claims"]}, {"id": "e-08-q6", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "A patient is having Eyezen Boost and VisiOffice is down. What do you do?", "options": ["Order without eyecode, as no session exists", "Use the fallback averages, tick Eyecode and record why", "Postpone the order until VisiOffice works", "Estimate the measurements by eye"], "answer": 1, "feedback": "Eyezen Boost is on the must-eyecode list, so you still eyecode it.", "quote": "Check the policy: Eyezen Boost is on the must-eyecode list.", "tags": ["eyecode"]}, {"id": "e-08-q7", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "Which personalisation level uses wrap, tilt and vertex?", "options": ["Level 2, lens to frame", "Level 1, PD and heights only", "Level 4, near vision behaviour", "Level 3, the wearer's habits"], "answer": 0, "feedback": "Level 1 is PD and heights, level 2 is lens to frame, level 3 is the wearer's habits.", "quote": "Lens to frame: wrap, tilt, vertex.", "tags": ["levels"]}, {"id": "e-08-q8", "lesson": "e-08", "level": 2, "type": "tf", "stem": "Personalisation is included at no extra charge in TEG.", "options": ["True", "False"], "answer": 0, "feedback": "Say what the patient will notice (comfort), with no medical claims.", "quote": "Personalisation is included at no extra charge in TEG.", "tags": ["claims"]}], "e-09": [{"id": "e-09-q1", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "What is the right order of the last steps?", "options": ["PREVIEW, CALCULATE, SEND", "CALCULATE, PREVIEW, SAVE", "SAVE, CALCULATE, PREVIEW", "CALCULATE, SAVE, PREVIEW"], "answer": 1, "feedback": "Calculate first so you know what you are ordering.", "quote": "CALCULATE, then PREVIEW, then SAVE.", "tags": ["order"]}, {"id": "e-09-q2", "lesson": "e-09", "level": 2, "type": "tf", "stem": "Saving an order places it with Essilor.", "options": ["True", "False"], "answer": 1, "feedback": "Saving only stores a draft. A trained person sends.", "quote": "Saving does not place the order.", "tags": ["send"]}, {"id": "e-09-q3", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "You change the index after CALCULATE. What next?", "options": ["SAVE, as the preview will update itself", "Close the form and start again", "SEND, because the change is small", "Press CALCULATE again before you SAVE"], "answer": 3, "feedback": "Any change needs a fresh calculation.", "quote": "If you change anything (prescription, measurements, index, shape), press CALCULATE again before you SAVE.", "tags": ["order"]}, {"id": "e-09-q4", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "The preview shows thicker lenses than you told the patient. What do you do?", "options": ["Stop, consider options and talk to the patient", "Reduce the prescription slightly", "Send it, as the patient has already paid", "Save anyway; the lab will sort it out"], "answer": 0, "feedback": "Do not just save.", "quote": "Do not just save.", "tags": ["thickness"]}, {"id": "e-09-q5", "lesson": "e-09", "level": 2, "type": "tf", "stem": "If you change the frame shape after CALCULATE, you must press CALCULATE again before saving.", "options": ["True", "False"], "answer": 0, "feedback": "Shape, index, prescription and measurements all affect thickness.", "quote": "If you change anything (prescription, measurements, index, shape), press CALCULATE again before you SAVE.", "tags": ["order"]}, {"id": "e-09-q6", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "Which options may fix a preview that is too thick?", "options": ["Skipping the CALCULATE step", "A larger frame with a wider bridge", "A thinner index, or a smaller frame", "A thicker coating on the front surface"], "answer": 2, "feedback": "Talk to the patient first, and to a registrant if the prescription is strong.", "quote": "a thinner index, with the price difference read from the list", "tags": ["thickness"]}, {"id": "e-09-q7", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "What do you compare in the preview?", "options": ["Whether the thickness matches what you promised", "Whether the practice name is spelled right", "Whether the supplier has stock", "Whether the order number looks familiar"], "answer": 0, "feedback": "Check thickness, shape, measurements and lens details.", "quote": "Is the thickness in line with what you promised the patient when you chose the index?", "tags": ["thickness"]}, {"id": "e-09-q8", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "Who places the order with Essilor?", "options": ["Essilor, automatically when you SAVE", "You, as soon as it is saved", "The patient, by confirming by email", "A trained person, by pressing SEND"], "answer": 3, "feedback": "SAVE is a draft only.", "quote": "The order is placed only when a trained person presses SEND.", "tags": ["send"]}], "e-11": [{"id": "e-11-q1", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "When should you start chasing an order?", "options": ["On the promise date itself", "After the promise date has passed", "A week before the due date", "When the patient phones"], "answer": 2, "feedback": "Chasing early leaves time to fix broken frames or unplaced orders.", "quote": "Start chasing a week before the due date, so problems such as broken frames or unplaced orders can be fixed while keeping the patient informed.", "tags": ["chasing"]}, {"id": "e-11-q2", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "What tag goes on a tray past its promise date?", "options": ["Blue", "Grey", "Yellow", "Red"], "answer": 3, "feedback": "Yellow is for a frame on order.", "quote": "Put a red tag on any tray past its promise date.", "tags": ["tags"]}, {"id": "e-11-q3", "lesson": "e-11", "level": 1, "type": "tf", "stem": "You should offer a discount to every patient whose order is late.", "options": ["True", "False"], "answer": 1, "feedback": "Patients value updates more than discounts, and compensation needs your practice manager's agreement.", "quote": "Patients value updates more than discounts.", "tags": ["patients"]}, {"id": "e-11-q4", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "Where do you record contact with the patient about the order?", "options": ["The supplier's portal", "The Patient Order Notes", "A text message to yourself", "A sticky note on the tray only"], "answer": 1, "feedback": "Record the estimate and every contact, with the method.", "quote": "Record the estimate and every contact, including the method, in the Patient Order Notes.", "tags": ["patients"]}, {"id": "e-11-q5", "lesson": "e-11", "level": 1, "type": "tf", "stem": "A tray with a frame on order gets a yellow tag.", "options": ["True", "False"], "answer": 0, "feedback": "Red is for past the promise date.", "quote": "Put a yellow tag on the tray of any job with a frame on order.", "tags": ["tags"]}, {"id": "e-11-q6", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "A frame will be two weeks late. What do you do today?", "options": ["Offer a discount straight away to avoid a complaint", "Wait and see whether the patient rings first", "Add a note and tag, chase the supplier, phone the patient", "Tell the patient it will be there next week"], "answer": 2, "feedback": "Update patients before they contact you, and give the new estimate once you know it.", "quote": "Update patients before they contact you.", "tags": ["patients"]}, {"id": "e-11-q7", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "You left a patient a voicemail about a delay. What next?", "options": ["Follow up in a few days by another method", "Wait for them to ring you back this week", "Mark the job as patient informed and move on", "Note that you tried and close the matter"], "answer": 0, "feedback": "Follow up and record every attempt.", "quote": "If you leave a voicemail, follow up within a few days by another method and record every attempt.", "tags": ["patients"]}, {"id": "e-11-q8", "lesson": "e-11", "level": 1, "type": "tf", "stem": "You should give the patient a firm arrival date as soon as the frame is ordered.", "options": ["True", "False"], "answer": 1, "feedback": "Do not promise a date you cannot be sure of; give an estimate once you know it.", "quote": "Promising a date you cannot be sure of.", "tags": ["patients"]}], "e-12": [{"id": "e-12-q1", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "When can you remove the clip?", "options": ["After the front photo", "Any time you need to adjust the frame", "After all far and near measurements", "After boxing"], "answer": 2, "feedback": "The clip stays on, untouched, until every measurement is done.", "quote": "The clip stays on, untouched, until all far and near measurements are done.", "tags": ["clip"]}, {"id": "e-12-q2", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "Where do the boxing lines go?", "options": ["On the groove of the rim", "On the inner edge of the front of the rim", "On the outer edge of the side", "Across the centre of the bridge"], "answer": 1, "feedback": "Ignore the groove.", "quote": "Boxing: lines go on the inner edge of the front of the rim, ignoring the groove.", "tags": ["boxing"]}, {"id": "e-12-q3", "lesson": "e-12", "level": 3, "type": "tf", "stem": "You can accept a doubtful photo to save time.", "options": ["True", "False"], "answer": 1, "feedback": "Retake rather than accept a doubtful photo.", "quote": "Retake rather than accept a doubtful photo.", "tags": ["quality"]}, {"id": "e-12-q4", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "How do you measure a second pair?", "options": ["Add an equipment and measure it separately", "Reuse the first pair's measurements", "Phone Essilor for the values", "Measure it without the clip"], "answer": 0, "feedback": "A second pair is measured separately.", "quote": "A second pair is measured separately with Add an equipment.", "tags": ["method"]}, {"id": "e-12-q5", "lesson": "e-12", "level": 3, "type": "tf", "stem": "The client should look at the mirror, not the screen, while you measure.", "options": ["True", "False"], "answer": 0, "feedback": "The camera follows their eye height only if they look in the mirror.", "quote": "Ask the client to look at the mirror, not the screen.", "tags": ["method"]}, {"id": "e-12-q6", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "How far does the client turn the head for the three-quarter view?", "options": ["About 45 degrees", "Fully sideways, about 90 degrees", "About 5 degrees", "About 20 degrees (15 to 25 accepted)"], "answer": 3, "feedback": "They then look back at the mirror without moving the head.", "quote": "the client turns the head about 20 degrees (15 to 25 accepted)", "tags": ["method"]}, {"id": "e-12-q7", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "What do you check on the front photo?", "options": ["That the frame is off the face", "That the client is smiling", "That the client is looking at the screen", "Both eyes open and the clip markers detected"], "answer": 3, "feedback": "Retake rather than accept a doubtful photo.", "quote": "Check the clip markers are detected and both eyes are open.", "tags": ["quality"]}, {"id": "e-12-q8", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "You cannot run a VisiOffice session. What do you do?", "options": ["Order without any measurements and say nothing", "Type in plausible values from a similar patient", "Wait until the next VisiOffice device update", "Use the fallback from the eyecode lesson and note why"], "answer": 3, "feedback": "Use the agreed fallback and record the reason.", "quote": "Use the fallback in the eyecode lesson and note why.", "tags": ["fallback"]}], "e-13": [{"id": "e-13-q1", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "What does IMPORT MEASUREMENTS open?", "options": ["The patient's test history", "The list of past Opsysweb orders", "The UMS list of VisiOffice sessions", "The frame price list"], "answer": 2, "feedback": "Selecting a session fills the order.", "quote": "IMPORT MEASUREMENTS opens the UMS list of VisiOffice sessions.", "tags": ["import"]}, {"id": "e-13-q2", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "What do you do after selecting the session?", "options": ["SEND the order straight away to save time", "Check the imported PDs and heights against the dispense", "Close the form and re-enter every value by hand", "Delete the session from the list and re-measure"], "answer": 1, "feedback": "They should agree with what you measured.", "quote": "Compare the PDs and heights with what you measured at the dispense.", "tags": ["check"]}, {"id": "e-13-q3", "lesson": "e-13", "level": 3, "type": "tf", "stem": "You can press SEND after importing to save time.", "options": ["True", "False"], "answer": 1, "feedback": "Only a trained person sends.", "quote": "Do not press SEND.", "tags": ["send"]}, {"id": "e-13-q4", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "The session is not in the list. What do you do?", "options": ["Wait a month and look again", "Ask who measured, else use fallback averages and note why", "Cancel the patient's order", "Retype values from memory of the measuring"], "answer": 1, "feedback": "It may not have been submitted from the device.", "quote": "It may not have been submitted from the VisiOffice device.", "tags": ["import"]}, {"id": "e-13-q5", "lesson": "e-13", "level": 3, "type": "tf", "stem": "A similar surname is a common error when picking a session from the list.", "options": ["True", "False"], "answer": 0, "feedback": "Check you have the right person, using the initial and submitted time.", "quote": "A similar surname is a common error.", "tags": ["import"]}, {"id": "e-13-q6", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "Mr Y has two sessions in the list. Which do you choose?", "options": ["Whichever is first alphabetically", "Both, then average them", "The earliest, as it is the original", "The latest, unless the list tells you otherwise"], "answer": 3, "feedback": "Check the submitted time.", "quote": "choose the latest unless the list tells you otherwise.", "tags": ["import"]}, {"id": "e-13-q7", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "Which extra values arrive for an XR Pro order?", "options": ["Panto, wrap, dominant eye and the NVB code", "Eyecode, cape and ERC for each eye only", "Only the PDs and heights from the dispense", "The frame price, shape and tray number"], "answer": 0, "feedback": "XR Design brings eyecode, cape, ERC, PDs, heights and box size; XR Pro adds more.", "quote": "For XR Pro they also include panto, wrap, dominant eye and the NVB code.", "tags": ["import"]}, {"id": "e-13-q8", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "An imported value looks wrong. What do you do?", "options": ["Delete the field and leave it blank", "Overtype it with your own estimate", "Press SEND so the lab can check it", "Ask the person who measured"], "answer": 3, "feedback": "Do not edit measured values without a reason.", "quote": "If something looks wrong, ask the person who measured.", "tags": ["check"]}], "f-01": [{"id": "f-01-q1", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "Which step of the collection routine comes first?", "options": ["Pre-adjust the frame on the bench", "Check the job against the order first", "Fit the glasses on the patient", "Book the follow-up call"], "answer": 1, "feedback": "Checking the job against the order comes first because every later step is wasted if the glasses are wrong.", "quote": "Check the job against the order first.", "tags": ["collection"]}, {"id": "f-01-q2", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "You have fitted the glasses and the patient says they are clear while sitting still. What is the next step?", "options": ["Hand the glasses over to the patient", "Check distance, near and in motion next", "Book the follow-up for next week", "Check two identifiers against the job"], "answer": 1, "feedback": "Clear while sitting still is not enough: you also check near and while the head moves. Handover and the identifier check come last.", "quote": "Check distance, near and in motion.", "tags": ["collection"]}, {"id": "f-01-q3", "lesson": "f-01", "level": 1, "type": "tf", "stem": "A Level 1 dispenser may do collections alone after five observed collections.", "options": ["True", "False"], "answer": 0, "feedback": "That is the sign-off rule: five observed collections, each signed off by a coach.", "quote": "Level 1 does collections alone after five observed collections.", "tags": ["level"]}, {"id": "f-01-q4", "lesson": "f-01", "level": 1, "type": "tf", "stem": "If the job looks right at a glance, you can skip comparing it with the order.", "options": ["True", "False"], "answer": 1, "feedback": "Never skip step 1 because the job looks right. Compare the glasses with the order every time.", "quote": "Do not skip step 1 because the job \"looks right\".", "tags": ["collection"]}, {"id": "f-01-q5", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "Which two identifiers are checked before the glasses are handed over?", "options": ["Full name plus date of birth", "First name plus the phone number only", "Order number plus the total price paid", "Frame brand plus the lens coating type"], "answer": 0, "feedback": "Two personal identifiers stop someone leaving with another patient's glasses.", "quote": "Check two identifiers before you hand the glasses over: the full name and one other, such as date of birth or address.", "tags": ["identity"]}, {"id": "f-01-q6", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "Before the patient sits down you find the frame in the bag is a different colour from the order. What do you do?", "options": ["Fit it anyway and mention the colour to him", "Pre-adjust it and see if he likes it", "Swap it for a similar frame on display", "Stop, do not fit it, and tell the practice manager"], "answer": 3, "feedback": "A mistake found now costs five minutes. Stop at step 1, do not fit the wrong frame, and let the practice manager or dispensing optician phone the patient.", "quote": "A mistake found now costs you five minutes; a mistake found at home costs a remake and a patient's trust.", "tags": ["collection"]}, {"id": "f-01-q7", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "Straight after you hand the glasses over, a patient says everything looks double. What do you do?", "options": ["Reassure them and book the follow-up", "Stop what you are doing and fetch a registrant", "Tell them it is normal for a first pair", "Re-adjust the nose pads and ask again"], "answer": 1, "feedback": "Double vision or glasses that hurt straight away is a stop sign, not a first-impression objection. Fetch a registrant.", "quote": "If the patient reports double vision, or says the glasses are blurred or hurt their head straight away, stop and fetch a registrant.", "tags": ["escalate"]}, {"id": "f-01-q8", "lesson": "f-01", "level": 1, "type": "order", "stem": "Put these steps of the collection routine in order.", "options": ["Check the job against the order", "Pre-adjust the frame", "Fit the glasses", "Check distance, near and in motion", "Check two identifiers"], "answer": 0, "feedback": "Check first, adjust and fit, test vision in use, and keep the identifier check as the final gate.", "quote": "Step 8 comes last because it is the final gate.", "tags": ["order"]}], "f-02": [{"id": "f-02-q1", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "When should a patient start wearing their new glasses?", "options": ["First thing in the morning", "Halfway through the first day", "Only for reading and close work", "Evenings only, once they are home"], "answer": 0, "feedback": "Starting first thing in the morning means the day's whole routine adapts together, rather than swapping halfway through.", "quote": "Start wearing the new glasses first thing in the morning, not halfway through the day.", "tags": ["adaptation"]}, {"id": "f-02-q2", "lesson": "f-02", "level": 1, "type": "tf", "stem": "Swapping back to the old pair during the first week speeds up adaptation.", "options": ["True", "False"], "answer": 1, "feedback": "Swapping slows adaptation. Ask the patient to wear the new pair as much as possible.", "quote": "Wear them as much as possible; swapping back to the old pair slows adaptation.", "tags": ["adaptation"]}, {"id": "f-02-q3", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "A patient says they have double vision with their new glasses. What is the right response?", "options": ["Tell them it is normal and to give it a week", "Pass it to a registrant for a prompt review", "Re-measure the heights and reorder new lenses", "Advise them to wear the old pair for a month"], "answer": 1, "feedback": "Double vision is not getting used to it. You do not diagnose; you pass it to a registrant.", "quote": "You do not diagnose; you pass the call to a registrant", "tags": ["escalate"]}, {"id": "f-02-q4", "lesson": "f-02", "level": 1, "type": "tf", "stem": "A little difficulty with stairs or kerbs in the first days of wearing varifocals is normal.", "options": ["True", "False"], "answer": 0, "feedback": "Unfamiliarity and some difficulty on stairs or kerbs are expected at first with a varifocal.", "quote": "a little difficulty with stairs or kerbs for the first days with a varifocal are normal", "tags": ["normal"]}, {"id": "f-02-q5", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "What simple rule do you give a first-time varifocal wearer?", "options": ["Point your nose at what you want to see", "Keep your head still and only move your eyes", "Look over the top of the frame to read close", "Slide the glasses down your nose to read"], "answer": 0, "feedback": "Nose at target helps the wearer use the right part of the lens. Holding the head still makes varifocals harder.", "quote": "tell the patient to point their nose at what they want to see", "tags": ["varifocal"]}, {"id": "f-02-q6", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "A nervous patient asks whether they will definitely get used to the glasses. What do you say?", "options": ["It will definitely be fine, so do not worry", "It usually settles, and you can come back any time", "Everyone adapts in a day, so there is no need to ring", "Some people never adapt, so keep your receipt safe"], "answer": 1, "feedback": "Never promise that adaptation will be fine. Say it usually settles and invite them back.", "quote": "Do not promise that adaptation \"will be fine\". Say it usually settles, and invite them back.", "tags": ["honesty"]}, {"id": "f-02-q7", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "Which of these is correct care advice?", "options": ["Rest them lens-down so the frame is not marked", "Leave them on the dashboard so they are to hand", "Keep them in their case whenever they are taken off", "Clean them dry with a corner of tissue paper"], "answer": 2, "feedback": "The case protects the lenses. Lens-down and hot cars damage them, and cleaning uses the spray and cloth supplied.", "quote": "Keep the glasses in the case whenever they are off.", "tags": ["care"]}, {"id": "f-02-q8", "lesson": "f-02", "level": 1, "type": "tf", "stem": "The care and adaptation talk forms part of the collection routine.", "options": ["True", "False"], "answer": 0, "feedback": "It is step 5 of the collection routine.", "quote": "The care and adaptation talk is step 5 of the collection routine.", "tags": ["collection"]}], "f-05": [{"id": "f-05-q1", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "What should you do first when a patient brings in glasses to be adjusted?", "options": ["Ask what is wrong and listen", "Start tightening the loosest screw", "Quote the price of a repair at once", "Pass them straight to reception"], "answer": 0, "feedback": "Ask which side, when it started and whether anything happened before you touch the glasses.", "quote": "Greet and ask exactly what is wrong.", "tags": ["process"]}, {"id": "f-05-q2", "lesson": "f-05", "level": 1, "type": "tf", "stem": "You should record what you did to the glasses on the patient's file.", "options": ["True", "False"], "answer": 0, "feedback": "Step 5 of the desk routine is to record what you did.", "quote": "Record what you did on the patient's file.", "tags": ["record"]}, {"id": "f-05-q3", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "A patient says, \"I cannot see properly with these.\" What is this?", "options": ["A repair to be booked as a fitting", "A complaint, handled as non-tolerance", "A routine adjustment you can do at once", "A request for a refund or credit note"], "answer": 1, "feedback": "Complaints are not repairs. Use the first-line non-tolerance steps and fetch a registrant for the stop signs.", "quote": "**Complaints are not repairs.**", "tags": ["complaint"]}, {"id": "f-05-q4", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "Which of these should you avoid saying before you know what the repair is?", "options": ["\"Let me have a look at them\"", "\"It will be free and quick\"", "\"I will take your details first\"", "\"Thank you for bringing them in\""], "answer": 1, "feedback": "Do not promise cost or timing until you know what the repair is.", "quote": "Do not promise a free repair or a quick return before you know.", "tags": ["honesty"]}, {"id": "f-05-q5", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "The hinge looks cracked and has been glued before. Who decides what to do?", "options": ["You decide and glue it again with the kit", "A colleague or the dispensing optician", "You heat the frame and re-bend it", "The patient decides whether to risk it"], "answer": 1, "feedback": "If a part is broken, cracked or glued, a colleague or the dispensing optician decides.", "quote": "If a part is broken, cracked or glued, a colleague or the dispensing optician decides.", "tags": ["safety"]}, {"id": "f-05-q6", "lesson": "f-05", "level": 1, "type": "tf", "stem": "If you cannot fix glasses at the desk, send the patient away and ask them to phone later.", "options": ["True", "False"], "answer": 1, "feedback": "Take their details and book a 20-minute Spectacle Fitting slot with the problem in the remarks.", "quote": "take their details, book a 20-minute Spectacle Fitting slot with the problem in the remarks, and say when it will be ready.", "tags": ["booking"]}, {"id": "f-05-q7", "lesson": "f-05", "level": 1, "type": "order", "stem": "Put the desk adjustment steps in order.", "options": ["Ask exactly what is wrong", "Look at the glasses", "Do only what you are trained to do", "Check the result with the patient wearing them", "Record what you did on the file"], "answer": 0, "feedback": "Listen first, look before you touch, adjust within your training, check on the face, then record.", "quote": "Most desk adjustments are simple, but the order matters.", "tags": ["order"]}, {"id": "f-05-q8", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "Their glasses need a repair you cannot finish today and they have no other pair. What do you do?", "options": ["Make sure they leave with something to see through", "Keep the glasses and send them home without them", "Tell them to manage until the repair is done", "Hand over the broken pair and apologise"], "answer": 0, "feedback": "Never leave a patient without a way to see: offer the old pair or a loan pair if the practice has one.", "quote": "Never leave a patient without a way to see", "tags": ["safety"]}], "f-06": [{"id": "f-06-q1", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "What does triage mean in this lesson?", "options": ["Refunding the patient before any checks are made", "Sorting the request into one of five groups before acting", "Sending the request straight to the supplier", "Logging the request and acting on it next week"], "answer": 1, "feedback": "Triage means sorting into one of the five groups before you say or promise anything.", "quote": "Triage means sorting before acting.", "tags": ["triage"]}, {"id": "f-06-q2", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "A patient with a new prescription from a new test asks for a remake. What is this?", "options": ["A remake at the practice's cost", "A new job, not a remake", "A coating guarantee claim", "A goodwill refund request"], "answer": 1, "feedback": "A new prescription from a new test means a new job, not a remake.", "quote": "A new prescription from a new test means a new job, not a remake.", "tags": ["groups"]}, {"id": "f-06-q3", "lesson": "f-06", "level": 2, "type": "tf", "stem": "You may tell a patient, \"Yes, you will get a full refund\", before checking.", "options": ["True", "False"], "answer": 1, "feedback": "Never say yes or no to a refund on the spot. The owner signs off refunds.", "quote": "Never say yes or no to a refund on the spot. The owner signs off refunds.", "tags": ["refund"]}, {"id": "f-06-q4", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "Why do you scan the return form into the patient's record?", "options": ["To avoid repeat remakes", "To let reception bill the patient for it", "To replace the supplier's own paperwork", "To show the owner how busy the desk is"], "answer": 0, "feedback": "A scanned copy shows what has already been returned, so the same job is not remade again.", "quote": "scan a copy of the return form into the patient's record to avoid repeat remakes", "tags": ["records"]}, {"id": "f-06-q5", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "A coating has started to craze on lenses a few months old, with no sign of damage. What is the best first step?", "options": ["Coating fault: check the right claim form", "Damage: tell them it is never covered", "New prescription: open a fresh job", "Non-adaptation: return the lenses now"], "answer": 0, "feedback": "Crazing or peeling is a coating or material fault, which may be a supplier guarantee claim. Check the correct claim form for the product.", "quote": "The coating crazes or peels, the lens delaminates.", "tags": ["groups"]}, {"id": "f-06-q6", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "A patient asks for a free remake and you have not yet sorted the group. What do you say?", "options": ["Yes, we will remake them free of charge today", "I will find out what we can do and ring you by tomorrow", "No, that kind of fault is not covered by our policy", "Come back next week and we will see what can be done"], "answer": 1, "feedback": "Say sorry, promise a call by tomorrow, and then ring. Do not promise a free remake before you know the group.", "quote": "\"I am sorry. I will find out what we can do and ring you by tomorrow.\"", "tags": ["script"]}, {"id": "f-06-q7", "lesson": "f-06", "level": 2, "type": "tf", "stem": "You should chase a supplier credit note that is overdue.", "options": ["True", "False"], "answer": 0, "feedback": "Check that credit notes arrive and chase if they are overdue; unrecorded returns are lost money.", "quote": "Check that supplier credit notes arrive, and chase if they are overdue.", "tags": ["paperwork"]}, {"id": "f-06-q8", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "Who signs off a refund?", "options": ["The owner", "The dispenser who handled it", "The supplier's rep", "The dispensing optician on duty"], "answer": 0, "feedback": "Refunds are signed off by the owner. Take details and come back to the patient.", "quote": "Refunds are signed off by the owner.", "tags": ["refund"]}], "f-07": [{"id": "f-07-q1", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "A patient demands a refund immediately. What do you do?", "options": ["Say yes straight away to calm them down", "Say no firmly and explain the policy", "Take details and say you will come back to them", "Ask them to leave and come back tomorrow"], "answer": 2, "feedback": "Take details and come back; the owner signs off refunds.", "quote": "Say yes or no to a refund on the spot. Take details and come back; the owner signs off refunds.", "tags": ["refund"]}, {"id": "f-07-q2", "lesson": "f-07", "level": 2, "type": "tf", "stem": "You decide on the spot what goodwill to offer.", "options": ["True", "False"], "answer": 1, "feedback": "The practice manager decides what goodwill is possible, and some decisions need the owner.", "quote": "The practice manager decides what goodwill is possible; you do not decide on the spot.", "tags": ["goodwill"]}, {"id": "f-07-q3", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "What is the first thing to do with an upset patient?", "options": ["Explain the practice policy in full", "Listen without interrupting", "Offer a discount to calm things", "Call the manager to the desk"], "answer": 1, "feedback": "Listen without interrupting. Most complaints are solved by being heard.", "quote": "Listen without interrupting. Let them finish.", "tags": ["listening"]}, {"id": "f-07-q4", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "A patient mentions the regulator and legal action. What do you do?", "options": ["Carry on and note it in the record later", "Tell the practice manager at once", "Offer a refund to settle the matter", "Ask them to put it in a letter"], "answer": 1, "feedback": "Legal action, harm or the regulator are serious complaints: stop and tell the practice manager at once.", "quote": "If the patient mentions legal action, harm or the regulator, stop and tell the practice manager at once.", "tags": ["serious"]}, {"id": "f-07-q5", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "Which is the best way to apologise?", "options": ["I am sorry that has happened", "I am sorry, but the lab got it wrong", "I am sorry, but it is not our policy", "I am sorry, but you did not follow the advice"], "answer": 0, "feedback": "Apologise for the experience, not for blame. Never blame the patient, the lab or a colleague.", "quote": "Apologise for the experience, not for blame: \"I am sorry that has happened.\"", "tags": ["apology"]}, {"id": "f-07-q6", "lesson": "f-07", "level": 2, "type": "tf", "stem": "Goodwill is something the practice gives although it does not have to.", "options": ["True", "False"], "answer": 0, "feedback": "A free adjustment, a discount or a repair can all be goodwill.", "quote": "Goodwill is something the practice gives although it does not have to", "tags": ["goodwill"]}, {"id": "f-07-q7", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "A patient complains of headaches and double vision with new glasses. How is this handled?", "options": ["Treat it as goodwill and ask the practice manager to decide", "Use the non-tolerance steps, and a registrant if needed", "Offer a free remake straight away to settle it", "Book a routine call for the following week"], "answer": 1, "feedback": "Complaints about seeing, headaches or double vision are clinical: use the non-tolerance steps and fetch a registrant for the stop signs.", "quote": "If the complaint is about seeing, headaches, double vision or discomfort, use the first-line non-tolerance steps and fetch a registrant for the stop signs.", "tags": ["clinical"]}, {"id": "f-07-q8", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "You have told a patient you will ring back by tomorrow. What do you do next?", "options": ["Wait and see whether they ring first", "Write the time in the diary", "Leave the next shift to remember it", "Ring only if you have good news"], "answer": 1, "feedback": "A promise you cannot see in the diary is a promise that gets forgotten.", "quote": "Write down the promised time and put it in the diary.", "tags": ["promise"]}], "f-08": [{"id": "f-08-q1", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "How should you answer the phone?", "options": ["Name, practice and an offer of help", "The practice name only, then wait for them", "A cheerful hello and the patient's surname", "The practice name and the opening hours"], "answer": 0, "feedback": "Say who is speaking, which practice, and offer help.", "quote": "Answer with who is speaking, which practice, and an offer of help.", "tags": ["phone"]}, {"id": "f-08-q2", "lesson": "f-08", "level": 1, "type": "tf", "stem": "A confirmation or reminder should be sent for FUD calls.", "options": ["True", "False"], "answer": 1, "feedback": "Do not send a confirmation or reminder for FUD calls.", "quote": "Do not send a confirmation or reminder for FUD calls.", "tags": ["FUD"]}, {"id": "f-08-q3", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "A caller mentions new flashing lights in one eye. What do you do?", "options": ["Book a routine slot for next month", "Treat as urgent; pass it to a registrant", "Tell them it is probably just tiredness", "Ask them to email a full description"], "answer": 1, "feedback": "Flashing lights are a warning word. Do not decide; pass the call to a registrant straight away.", "quote": "If you hear any of these, treat it as urgent.", "tags": ["warning"]}, {"id": "f-08-q4", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "Which patients are routinely given a follow-up call (FUD)?", "options": ["Anyone collecting a spare pair", "First varifocal wearers", "Everyone after a repair", "Contact lens trial patients"], "answer": 1, "feedback": "Use FUD for first varifocals and for patients who said they will return later.", "quote": "Use FUD for first varifocals and for patients who said they will return later.", "tags": ["FUD"]}, {"id": "f-08-q5", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "An order is delayed. What do you do?", "options": ["Update the status, then phone them", "Phone first and update the status next week", "Email only and wait for a reply", "Wait until it arrives, then let them know"], "answer": 0, "feedback": "Update the status straight away, then phone. If you cannot reach them, email as well.", "quote": "Update the order status straight away, then phone the patient.", "tags": ["delays"]}, {"id": "f-08-q6", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "A caller describes a sudden shadow across their sight and no registrant is free. What do you tell them?", "options": ["Book them in for a routine check next week", "Wait by the phone for a call-back from the optometrist", "Go to A&E or eye casualty today, not driving", "Rest their eyes and ring us again tomorrow if worse"], "answer": 2, "feedback": "A sudden shadow needs to be seen today. If no registrant can be reached, send them to A&E or eye casualty now, or NHS 111. Never book a routine slot or tell them to wait.", "quote": "If you cannot reach anyone, tell the patient this needs to be seen today", "tags": ["warning"]}, {"id": "f-08-q7", "lesson": "f-08", "level": 1, "type": "tf", "stem": "You should confirm who you are speaking to before discussing a patient's details.", "options": ["True", "False"], "answer": 0, "feedback": "Confirming identity protects the patient's privacy.", "quote": "Confirm who you are speaking to before discussing a patient's details.", "tags": ["privacy"]}, {"id": "f-08-q8", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "A patient does not answer a follow-up call. What do you do?", "options": ["Leave the full details of the problem on voicemail", "Ring back every ten minutes until they answer", "Leave a brief message and log the call with the date", "Send a text giving all the details"], "answer": 2, "feedback": "Do not leave detailed voicemails, and do not call repeatedly. Log voicemails with the date.", "quote": "Do not call the same person repeatedly in a short span. Log voicemails with the date.", "tags": ["voicemail"]}], "f-09": [{"id": "f-09-q1", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "What is a handover?", "options": ["A short written note of all work still open", "A daily list of the sales figures taken", "A rota showing who covers which room", "A formal report that is sent to the owner"], "answer": 0, "feedback": "A handover is a short written note of everything still open.", "quote": "A handover is a short written note of everything still open.", "tags": ["handover"]}, {"id": "f-09-q2", "lesson": "f-09", "level": 1, "type": "tf", "stem": "Full patient details should be written on a shared handover sheet.", "options": ["True", "False"], "answer": 1, "feedback": "Use initials or the job reference on a shared sheet; full details are in the record.", "quote": "Use patient initials or the job reference, not full details, on a shared sheet", "tags": ["privacy"]}, {"id": "f-09-q3", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "Which item should come first on the sheet?", "options": ["The oldest item on the list", "The most urgent item", "The item you finished first", "The longest item to explain"], "answer": 1, "feedback": "Put the most urgent first so it is read first.", "quote": "Put the most urgent first.", "tags": ["priority"]}, {"id": "f-09-q4", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "Why does a forgotten promised call matter?", "options": ["It breaks the practice's filing rules", "A small problem can quickly turn into a complaint", "It lowers the weekly sales figures a little", "It is just a small piece of paperwork"], "answer": 1, "feedback": "The patient remembers that nobody rang.", "quote": "A promised call that is forgotten turns a small problem into a complaint.", "tags": ["trust"]}, {"id": "f-09-q5", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "Which of these belongs on the handover?", "options": ["A call you promised to make tomorrow", "The weekly sales total for the practice", "A colleague's holiday request", "The price list for sunglasses"], "answer": 0, "feedback": "Promised calls come first on the list: who, why and by when.", "quote": "Who, why, and by when.", "tags": ["contents"]}, {"id": "f-09-q6", "lesson": "f-09", "level": 1, "type": "tf", "stem": "Before you go, any call you promised should already be in the diary.", "options": ["True", "False"], "answer": 0, "feedback": "Confirm promised calls are in the diary before you leave.", "quote": "Confirm that any call you promised is in the diary.", "tags": ["checklist"]}, {"id": "f-09-q7", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "How should a patient be identified on a shared handover sheet?", "options": ["By initials or job reference", "By full name and date of birth", "By full name and home address", "By phone number and the surname"], "answer": 0, "feedback": "Initials or the job reference keep full details in the record, not on a shared sheet.", "quote": "Use patient initials or the job reference, not full details, on a shared sheet; full details are in the record.", "tags": ["privacy"]}, {"id": "f-09-q8", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "Something urgent is left open at the end of your shift. What do you do?", "options": ["Tell the next person in person too", "Leave it as the last line of the sheet", "Keep it in your head and text it later", "Assume the next person will read the sheet"], "answer": 0, "feedback": "Tell the next person verbally about anything urgent, as well as writing it down.", "quote": "Tell the next person verbally about anything urgent.", "tags": ["urgent"]}], "g-01": [{"id": "g-01-q1", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "A patient says, \"My vision has gone blurry in one eye and I want it sorted.\" Which buying driver is this?", "options": ["Moving away from a problem", "Moving towards something new", "Wanting the same as last time", "Wanting something different"], "answer": 0, "feedback": "Blur and worry about the eyes is pain to move away from. Lead with their health and the optometrist's advice.", "quote": "People buy to move away from a problem, or towards something they want.", "tags": ["why-people-buy"]}, {"id": "g-01-q2", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "Which set names the four kinds of block in a good dispensing conversation?", "options": ["Greet, qualify, discount and finish", "Position, connect, reassure, close", "Ask, tell, persuade and close", "Frame, lens, coating and price"], "answer": 1, "feedback": "The four blocks are position, connect, reassure and close.", "quote": "Every good conversation is built from four kinds of block: position, connect, reassure and close.", "tags": ["building-blocks"]}, {"id": "g-01-q3", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "\"Driving feels easier after dark\" is which of these?", "options": ["A feature", "A benefit", "The meaning", "A claim about eye health"], "answer": 2, "feedback": "Feature is what it is, benefit is what it does, meaning is what it gives them. Spend most time on the meaning.", "quote": "\"Driving feels easier after dark\" is the meaning.", "tags": ["feature-benefit-meaning"]}, {"id": "g-01-q4", "lesson": "g-01", "level": 1, "type": "tf", "stem": "Lenses come first because, when money is tight, people tend to cut back on the frame before the lenses.", "options": ["True", "False"], "answer": 0, "feedback": "Once a lens is explained it stops being an extra and becomes something the patient needs.", "quote": "Lenses come first, because when money is tight people cut back on the frame before they cut back on the lenses.", "tags": ["lenses-first"]}, {"id": "g-01-q5", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "Why say \"advises\" rather than \"we can offer\"?", "options": ["Advises sounds like a need, where offer sounds optional", "An offer is a word the regulator does not allow", "Advises is quicker to say at a busy desk", "Advises lets you leave the price until later"], "answer": 0, "feedback": "Advises presents the lens as a need. An offer sounds like an extra the patient can decline.", "quote": "Say \"advises\" rather than \"we can offer\", because a need sounds like a need and an offer sounds optional.", "tags": ["language"]}, {"id": "g-01-q6", "lesson": "g-01", "level": 1, "type": "tf", "stem": "If a patient hesitates or asks a question, you should carry on to the end of your script.", "options": ["True", "False"], "answer": 1, "feedback": "Do not recite. Stop and answer the question; you are judged on results and how patients feel.", "quote": "Do not recite. If a patient hesitates, goes quiet or asks a question, stop and answer it.", "tags": ["recite"]}, {"id": "g-01-q7", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "A patient says, \"I just want the same frame as last time.\" What are they showing?", "options": ["A wish for certainty", "A wish for variety", "A problem to move away from", "A hunt for a bargain"], "answer": 0, "feedback": "Wanting the same frame is certainty. Variety would be something different.", "quote": "Others want certainty (\"the same frame as last time\") or variety (\"something different\").", "tags": ["why-people-buy"]}, {"id": "g-01-q8", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "A patient asks whether a lens will stop their eye condition getting worse. What do you say?", "options": ["It will protect your eyes from the condition", "It helps you look after your eyes", "It will slow it down for most people", "It is a cure for that kind of condition"], "answer": 1, "feedback": "Never promise a lens will prevent or cure an eye condition. Say \"look after your eyes\" and check the record or ask a registrant.", "quote": "Do not promise that a lens will prevent or cure an eye condition.", "tags": ["claims"]}], "g-02": [{"id": "g-02-q1", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "Which question is an open question?", "options": ["Do you use a computer at work or home?", "You do a lot of driving, don't you?", "Tell me what a normal day looks like for you", "Is this the pair you wear most days?"], "answer": 2, "feedback": "An open question starts with what, how or tell me and invites a story, not a yes or no.", "quote": "Open questions start with what, how or tell me, and they invite a story instead of a yes or no.", "tags": ["open-questions"]}, {"id": "g-02-q2", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "Which topics should you explore to find out how a patient lives?", "options": ["Screens, driving, hobbies, work and complaints", "Frame brand, colour, price and the delivery date", "Age, address, occupation and household income", "Prescription, index, coating and tint options"], "answer": 0, "feedback": "Each of these points at a lens need. You do not have to ask everything.", "quote": "Ask about screens, driving, hobbies and work, and ask what they dislike about their current pair.", "tags": ["needs-finding"]}, {"id": "g-02-q3", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "You have asked a good open question and the patient pauses. What do you do?", "options": ["Offer a list of answers to pick from", "Ask a second question straight away", "Move on to the price to keep pace", "Stop talking and let the silence do its work"], "answer": 3, "feedback": "Patients fill the gap with the thing that matters most. Do not offer a list.", "quote": "After you ask, stop talking and let the silence do its work.", "tags": ["silence"]}, {"id": "g-02-q4", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "You cannot tell what is driving a patient. How should you treat them?", "options": ["As someone who only wants the cheapest", "As wanting to protect what they have", "As wanting something new and different", "As someone who is not ready to buy"], "answer": 1, "feedback": "If you cannot tell the driver, treat them as wanting to protect what they have and lead with health and the optometrist's advice.", "quote": "If you cannot tell what is driving them, treat them as wanting to protect what they have.", "tags": ["drivers"]}, {"id": "g-02-q5", "lesson": "g-02", "level": 2, "type": "tf", "stem": "After you ask an open question, you should offer a few possible answers to help the patient reply.", "options": ["True", "False"], "answer": 1, "feedback": "Do not offer a list of answers. Stop talking and let the patient fill the gap.", "quote": "Do not offer a list of answers for them to pick from.", "tags": ["silence"]}, {"id": "g-02-q6", "lesson": "g-02", "level": 2, "type": "tf", "stem": "Writing down the patient's own words is useful because you will use them again at the price and the close.", "options": ["True", "False"], "answer": 0, "feedback": "\"Starry lights at night\" lands better than \"anti-reflective coating\".", "quote": "Write down what they tell you in their own words, because you will use their words again at the price and the close.", "tags": ["keep-words"]}, {"id": "g-02-q7", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "A patient seems confused and anxious. How should you adjust?", "options": ["Ask all the questions to be thorough", "Fewer questions, slower pace", "Skip questions and go to the price", "Hand them a questionnaire to fill in"], "answer": 1, "feedback": "A confused or anxious patient needs fewer questions and a slower pace. If unsure how far to go, ask a registrant.", "quote": "A patient who is confused or anxious needs fewer questions and a slower pace.", "tags": ["pace"]}, {"id": "g-02-q8", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "Which question has the answer built in and should be avoided?", "options": ["What are you hoping to see better day to day?", "You do a lot of computer work, don't you?", "What does a normal day look like?", "Any worries about your eyes?"], "answer": 1, "feedback": "A question with the answer built in invites a yes, not a story.", "quote": "Do not ask questions with the answer built in, such as \"You do a lot of computer work, don't you?\"", "tags": ["leading"]}], "g-03": [{"id": "g-03-q1", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "Which is the best shape for linking a lens to a need?", "options": ["List every feature of the chosen lens", "One need, one lens, one sentence", "Quote the price before the benefit", "Leave it to the optometrist to explain"], "answer": 1, "feedback": "Link one need to one lens in a single sentence.", "quote": "Link one need to one lens, and say it in a single sentence.", "tags": ["linking"]}, {"id": "g-03-q2", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "Why use the patient's own words from needs-finding?", "options": ["It keeps the chat short enough for the diary", "The link sounds like listening, not selling", "It avoids having to name the lens at all", "The system requires the words to be recorded"], "answer": 1, "feedback": "Their words sound like listening. Stock phrases sound like selling.", "quote": "Use the patient's own words from needs-finding, so the link sounds like listening and not like selling.", "tags": ["listening"]}, {"id": "g-03-q3", "lesson": "g-03", "level": 2, "type": "tf", "stem": "You should explain the technical coating names to the patient so they understand the lens.", "options": ["True", "False"], "answer": 1, "feedback": "Do not list features; features belong on the order, not in the conversation.", "quote": "Do not list features. Features belong on the order, not in the conversation.", "tags": ["jargon"]}, {"id": "g-03-q4", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "A patient asks if a blue light coating protects their eyes. What is the correct line to take?", "options": ["Yes, it protects against eye disease", "Talk about comfort only, never about eye health", "Say it is only a gimmick and not worth it", "Say it is needed for everyone who uses screens"], "answer": 1, "feedback": "Blue light: talk about comfort only, never eye health.", "quote": "Blue light: talk about comfort only, never eye health.", "tags": ["claims"]}, {"id": "g-03-q5", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "A patient says starry lights at night make driving stressful. Which link fits best?", "options": ["A hard, easy-clean coating for scratches", "An anti-reflective coating for less glare", "A lens that darkens outdoors in bright light", "The best design the budget allows for all-day wear"], "answer": 1, "feedback": "Night driving or glare points to an anti-reflective coating, and for frequent drivers a lens designed for driving.", "quote": "Night driving or glare: an anti-reflective coating", "tags": ["matching"]}, {"id": "g-03-q6", "lesson": "g-03", "level": 2, "type": "tf", "stem": "Two links are plenty; three starts to sound like a pitch.", "options": ["True", "False"], "answer": 0, "feedback": "Keep it to the needs the patient actually gave you.", "quote": "Two links are plenty. Three starts to sound like a pitch.", "tags": ["linking"]}, {"id": "g-03-q7", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "A patient never mentioned driving. Should you advise a driving lens?", "options": ["No, only link needs they actually mentioned", "Yes, most patients drive so it is safe to include", "Yes, as the best option for everyone", "No, driving lenses are never advised"], "answer": 0, "feedback": "Do not invent a need. If they did not mention driving, do not sell a driving lens.", "quote": "Do not invent a need. If they did not mention driving, do not sell a driving lens.", "tags": ["invent"]}, {"id": "g-03-q8", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "Why use a simple comparison, such as sun cream, when explaining a lens?", "options": ["It gives them a line to repeat at home", "It lets you skip explaining the benefit", "It shows how clever the product is", "It stops them asking questions"], "answer": 0, "feedback": "A simple comparison gives the patient a line to repeat at home.", "quote": "A simple comparison gives them a line to repeat at home.", "tags": ["comparison"]}], "g-04": [{"id": "g-04-q1", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "What comes first when you present lens options?", "options": ["The price of the cheapest option", "The lens benefit, then price", "The frame the patient has chosen", "Any discount that is available"], "answer": 1, "feedback": "If the price comes first the patient hears a number with nothing to set against it, and the cheapest wins by default.", "quote": "Show the lens before the price: describe the benefit first, then say what it costs.", "tags": ["lens-before-price"]}, {"id": "g-04-q2", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "How many options should you normally present?", "options": ["One, the one the optometrist advises", "Two, a cheap one and a dear one", "Three: a good, a better and a best option", "Four, so every budget is covered"], "answer": 2, "feedback": "Three is the right number. Two feels like a push or a pull; four is confusing.", "quote": "Three is the right number. Two feels like a push or a pull. Four is confusing.", "tags": ["three-options"]}, {"id": "g-04-q3", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "A patient has said they drive a lot at night. Which option should you lead with?", "options": ["The cheapest, to be on the safe side", "The most expensive, as the gold standard", "The one that best fits their night driving", "Whichever has an offer on this week"], "answer": 2, "feedback": "Lead with the option that fits their needs, not the cheapest or the dearest.", "quote": "Lead with the option that fits their needs, not the cheapest or the dearest.", "tags": ["fit"]}, {"id": "g-04-q4", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "A price on the list looks wrong for the lens you chose. What do you do?", "options": ["Override it in the system to fix it", "Round it to what feels right", "Tell the patient a lower figure", "Ask; staff cannot change a price"], "answer": 3, "feedback": "Staff cannot change a price in the system. If a price looks wrong, ask.", "quote": "If a price looks wrong, ask. Staff cannot change a price in the system.", "tags": ["price-rules"]}, {"id": "g-04-q5", "lesson": "g-04", "level": 2, "type": "tf", "stem": "It is fine to describe the good option as the basic one.", "options": ["True", "False"], "answer": 1, "feedback": "Never describe the good option as second-rate. It works and is a sensible choice.", "quote": "Good: it works and it is a sensible choice. Never describe it as second-rate.", "tags": ["good-option"]}, {"id": "g-04-q6", "lesson": "g-04", "level": 2, "type": "tf", "stem": "\"This one has less glare at night\" is the kind of difference to say between options.", "options": ["True", "False"], "answer": 0, "feedback": "Say each difference in terms of the patient's day, not in technical terms such as index.", "quote": "\"This one has less glare at night\" is a difference.", "tags": ["difference"]}, {"id": "g-04-q7", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "The budget does not allow the best lens. What do you say?", "options": ["Then the better one is all you can have", "Let us get you as close as we can", "The best is the only one I would advise", "The good one will have to do"], "answer": 1, "feedback": "Compromise, not downgrade: keep the benefit that matters most to them.", "quote": "\"That is fine. Let us get you as close to it as we can.\"", "tags": ["compromise"]}, {"id": "g-04-q8", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "You start by describing the cheapest option and work upwards. What is the risk?", "options": ["It anchors the patient's mind low", "It makes the appointment run too long", "It confuses them with too many numbers", "It breaks the price list rules"], "answer": 0, "feedback": "If you start at the bottom you set the patient's mind there.", "quote": "If you start at the bottom, you set the patient's mind there.", "tags": ["order"]}], "g-05": [{"id": "g-05-q1", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "What price should you say to the patient?", "options": ["The frame and lens prices, one after the other", "Only the lens price, if that is the decision", "The whole pair price, frame and lenses together", "A range, to leave room to move"], "answer": 2, "feedback": "Patients buy glasses, not parts. Give the price of the whole pair in one sentence.", "quote": "Say the price of the whole pair, frame and lenses together, in one sentence.", "tags": ["whole-pair"]}, {"id": "g-05-q2", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "After you say the price, what should you do?", "options": ["Offer a discount straight away", "Explain the price in more detail", "Stop talking and let them think", "Ask whether it is too much"], "answer": 2, "feedback": "Silence after the price is the patient thinking. Count to five in your head.", "quote": "Silence after the price is the patient thinking, not a problem for you to fix.", "tags": ["silence"]}, {"id": "g-05-q3", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "Which delivery is best?", "options": ["A rising voice with an apology", "Fast and mumbled to get past it", "Calm, one sentence, with a falling voice", "Reading it silently off the screen"], "answer": 2, "feedback": "A falling voice makes the price a fact. A rising voice makes it a question.", "quote": "A rising voice makes the price a question. A fall makes it a fact.", "tags": ["delivery"]}, {"id": "g-05-q4", "lesson": "g-05", "level": 2, "type": "tf", "stem": "If a price looks wrong, a staff member can override it in the system.", "options": ["True", "False"], "answer": 1, "feedback": "Staff cannot override prices, and an override breaks the VAT split. Ask instead.", "quote": "Staff cannot override prices, and an override breaks the VAT split.", "tags": ["price-rules"]}, {"id": "g-05-q5", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "You have said the price and the patient is silent. What do you do?", "options": ["Count to five in your head", "Offer a discount to break the silence", "Add \"but\" and explain the value", "Ask them if the price is a problem"], "answer": 0, "feedback": "If you speak first you may talk yourself out of a sale, or offer a discount nobody asked for.", "quote": "Count to five in your head.", "tags": ["silence"]}, {"id": "g-05-q6", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "The patient looks tense before you give the price. What helps?", "options": ["Name the worry first, then the price", "Say the price quickly to get it over", "Offer a small discount before the price", "Say the price is only a small amount"], "answer": 0, "feedback": "Naming the worry out loud takes the pressure off. Do not minimise with words like just or only.", "quote": "say their worry out loud first: \"You may be thinking this sounds expensive.\" Then give the price.", "tags": ["worry"]}, {"id": "g-05-q7", "lesson": "g-05", "level": 2, "type": "tf", "stem": "A rising voice at the end of the price makes it sound like a question.", "options": ["True", "False"], "answer": 0, "feedback": "Say the number once, plainly, with your voice falling at the end.", "quote": "A rising voice makes the price a question.", "tags": ["delivery"]}, {"id": "g-05-q8", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "When should the patient hear the price?", "options": ["At collection, when they pay", "Before anything is ordered", "Once the frame has been ordered", "Only if they ask for it"], "answer": 1, "feedback": "A patient surprised at the till at collection will not come back.", "quote": "Give the price before anything is ordered.", "tags": ["timing"]}], "g-06": [{"id": "g-06-q1", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "When should you raise a second pair and sun protection?", "options": ["Only when the patient raises the subject", "At every sale, not only when they may say yes", "Only for patients you expect to say yes", "Only when the first pair is a dear one"], "answer": 1, "feedback": "Skipping it because you think they will say no is the main mistake. Be the person who told them.", "quote": "Raise the second pair and sun at every sale, not only when you think the patient will say yes.", "tags": ["second-pair"]}, {"id": "g-06-q2", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "Why does a polarised pair help a driver who already has light-reactive lenses?", "options": ["Light-reactive lenses never darken outdoors at all", "Light-reactive lenses barely darken in a car", "Polarised lenses are always the cheaper option", "The law requires a second pair for driving"], "answer": 1, "feedback": "Light-reactive lenses are good for everyday glare but barely darken in a car, so a polarised pair covers that.", "quote": "Light-reactive lenses are good for everyday glare but barely darken in a car, so a polarised pair covers that.", "tags": ["polarised"]}, {"id": "g-06-q3", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "Which phrasing makes the second pair the standard advice rather than an upsell?", "options": ["Do you fancy a second pair?", "What we normally do is two pairs.", "We have a discount on a spare today.", "You might want to consider another one."], "answer": 1, "feedback": "Saying what you normally do makes it the standard advice.", "quote": "Say \"What we normally do is two pairs.\"", "tags": ["language"]}, {"id": "g-06-q4", "lesson": "g-06", "level": 2, "type": "tf", "stem": "You can tell a patient that sunglasses will prevent cataracts.", "options": ["True", "False"], "answer": 1, "feedback": "Never claim lenses prevent eye disease. Say \"look after your eyes\".", "quote": "Do not claim sun lenses prevent cataracts or other conditions.", "tags": ["claims"]}, {"id": "g-06-q5", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "When is a spare pair a genuine recommendation?", "options": ["When they cannot see without them", "When the practice has stock to clear", "When the first pair was a low price", "When the patient has a loyalty plan"], "answer": 0, "feedback": "Use the spare-pair link only when it is real, for someone who cannot see without them.", "quote": "Use this only when it is real, such as someone who cannot see without them.", "tags": ["spare"]}, {"id": "g-06-q6", "lesson": "g-06", "level": 2, "type": "tf", "stem": "If a patient declines the second pair, you may mention it again at collection if it still makes sense.", "options": ["True", "False"], "answer": 0, "feedback": "Ask once and accept the answer, but collection is a natural second chance.", "quote": "You can mention it again at collection if it still makes sense.", "tags": ["ask-once"]}, {"id": "g-06-q7", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "A patient has told you their budget is fixed. What do you do about a second pair?", "options": ["Respect the budget and do not push a second pair", "Mention a bigger discount to tempt them", "Offer the dearest pair so it feels worth it", "Say most people regret skipping it"], "answer": 0, "feedback": "Do not push a second pair on a patient who has told you their budget is fixed.", "quote": "Do not push a second pair on a patient who has told you their budget is fixed.", "tags": ["budget"]}, {"id": "g-06-q8", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "A patient says no to sunglasses. What do you do?", "options": ["Ask again in a different way", "Note it and move on", "Tell them what they risk without them", "Add them to the quote anyway"], "answer": 1, "feedback": "Ask once and accept the answer. Writing it on the record lets the next visit pick it up.", "quote": "If they say no, note it and move on.", "tags": ["ask-once"]}], "g-07": [{"id": "g-07-q1", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "When is it right to offer a better lens?", "options": ["Whenever the practice is quiet this week", "When it fixes something they have told you", "When the patient looks quite well off", "When there is a sales target to hit"], "answer": 1, "feedback": "Trade up when the better option solves something the patient told you.", "quote": "Trade up when the better option solves something the patient told you.", "tags": ["trade-up"]}, {"id": "g-07-q2", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "An NHS voucher patient says the basic pair is fine and you have mentioned extras once. What now?", "options": ["Mention extras again at the till", "Explain that the voucher pair is limited", "Accept the answer and carry on", "Ask a manager to speak to them"], "answer": 2, "feedback": "Explain what the voucher covers, mention extras once, and let them choose. Never suggest the voucher pair is second-rate.", "quote": "Explain what the voucher covers, mention extras once, and let them choose.", "tags": ["nhs-voucher"]}, {"id": "g-07-q3", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "A patient seems confused and has come alone. What should you do?", "options": ["Show the whole range so they can see everything", "Offer fewer options and another day with a relative", "Move quickly so the confusion does not build", "Leave the price out so it is simpler for them to follow"], "answer": 1, "feedback": "Slow down, give fewer options and offer to continue another day with a relative or carer. These patients come first, sales second.", "quote": "Slow down, give fewer options, and offer to continue another day with a relative or carer.", "tags": ["vulnerable"]}, {"id": "g-07-q4", "lesson": "g-07", "level": 2, "type": "tf", "stem": "It is acceptable to exaggerate a risk if it helps the patient choose a better lens.", "options": ["True", "False"], "answer": 1, "feedback": "Never use fear to trade up. Do not exaggerate a risk.", "quote": "Never use fear to trade up. Do not exaggerate a risk.", "tags": ["ethics"]}, {"id": "g-07-q5", "lesson": "g-07", "level": 2, "type": "tf", "stem": "Before offering a better lens you should be able to say in one sentence what the patient gets for the extra.", "options": ["True", "False"], "answer": 0, "feedback": "If you cannot explain it in one sentence, do not offer it.", "quote": "Check: could you explain, in one sentence, what they get for the extra?", "tags": ["trade-up"]}, {"id": "g-07-q6", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "A patient has said their budget is a firm limit. What do you do?", "options": ["Show the best within it, and say what is traded away", "Show the dearest option first and see how they react", "Say the budget is too low for any safe option today", "Suggest they borrow against a payment plan to cover it"], "answer": 0, "feedback": "Work within the budget and be honest about what is traded away. Never make a patient feel guilty about a budget.", "quote": "Show the best you can do inside the limit and say what is traded away.", "tags": ["budget"]}, {"id": "g-07-q7", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "A patient is in a hurry and a little upset about a delay. What do you do?", "options": ["Solve the job and leave the extras", "Mention the extras while they wait", "Use the delay to offer a discount", "Ask them to come back to discuss options"], "answer": 0, "feedback": "When someone is in a hurry or upset, solve the job and leave the extras.", "quote": "The patient is in a hurry or upset. Solve the job and leave the extras.", "tags": ["not-to-push"]}, {"id": "g-07-q8", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "A patient says no to the better lens. What do you say?", "options": ["That is a good choice", "Are you sure you will manage?", "It is your decision, but it is risky", "Many regret it later"], "answer": 0, "feedback": "Confirm they chose well and leave the door open: \"If you change your mind, just ask.\"", "quote": "If a patient says no to the better lens, confirm they chose well: \"That is a good choice.\"", "tags": ["respect"]}], "g-08": [{"id": "g-08-q1", "lesson": "g-08", "level": 2, "type": "order", "stem": "Put the five objection steps in the right order.", "options": ["Acknowledge", "Clarify", "Answer with the benefit to them", "Check", "Close"], "answer": 0, "feedback": "Acknowledge and clarify before you answer, check they follow, then close with a next step.", "quote": "Handle every objection the same way: acknowledge, clarify, answer with the benefit to them, check, close.", "tags": ["method"]}, {"id": "g-08-q2", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "Why acknowledge before you answer?", "options": ["It gives you time to look up the right price", "They cannot hear your answer until they feel heard", "It lets you avoid being asked about the price", "It is a rule that the regulator sets for sales"], "answer": 1, "feedback": "If you jump straight to the answer it sounds like arguing.", "quote": "Acknowledge first and answer second, because the patient cannot hear your answer until they feel heard.", "tags": ["acknowledge"]}, {"id": "g-08-q3", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "A patient says, \"It is too expensive.\" What is the next best step after acknowledging?", "options": ["Offer a small discount to keep the sale", "Ask what is really holding them back today", "Repeat the price slowly and clearly", "Tell them it is good value for money"], "answer": 1, "feedback": "Clarify once. Too expensive can mean cannot afford it, not sure it is worth it, or needs to ask a partner.", "quote": "\"What is the main thing holding you back?\"", "tags": ["clarify"]}, {"id": "g-08-q4", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "A patient says a high-street chain is cheaper. What should you do?", "options": ["Say their lenses are generally poor quality", "Compare what is included, not the price", "Match their price to keep the sale today", "Ignore the comment and carry on talking"], "answer": 1, "feedback": "Compare what is included, not the headline price.", "quote": "If the patient mentions another shop or an online seller, never criticise it. Compare what is included, not the headline price.", "tags": ["competitors"]}, {"id": "g-08-q5", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "A patient says no a second time after you offered a middle option. What do you do?", "options": ["Ask again in a different way", "Let it go warmly and hold the quote", "Offer a bigger discount to close", "End the conversation as soon as you can"], "answer": 1, "feedback": "Ask once, never twice. A patient who feels respected will come back.", "quote": "After a no, offer one middle option, then let it go warmly.", "tags": ["ask-once"]}, {"id": "g-08-q6", "lesson": "g-08", "level": 2, "type": "tf", "stem": "The first thing a patient says is often not the real reason for an objection.", "options": ["True", "False"], "answer": 0, "feedback": "That is why you clarify before you answer.", "quote": "The first thing a patient says is often not the real reason.", "tags": ["clarify"]}, {"id": "g-08-q7", "lesson": "g-08", "level": 2, "type": "tf", "stem": "If you have no true story t

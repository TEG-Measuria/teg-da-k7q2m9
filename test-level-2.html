e total with the patient"], "answer": 1, "feedback": "Measurements come first, as you were trained.", "quote": "Take the measurements first (PDs and heights) as you were trained.", "tags": ["method"]}, {"id": "e-02-q8", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "Mrs S is having a varifocal lens. What must you tick on the dispense screen?", "options": ["That only one eye is supplied", "That a near prescription is needed", "That the lens is a plain blank", "That the frame is rimless"], "answer": 1, "feedback": "Tick near prescription for a varifocal, bifocal or reading lens.", "quote": "Tick that a near prescription is needed if the patient has a varifocal, bifocal or reading lens.", "tags": ["method"]}, {"id": "e-03-q1", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "How is a discount applied now?", "options": ["Through a discount code", "By overriding the price", "By the lab, when it invoices", "By changing the VAT band"], "answer": 0, "feedback": "A discount always goes through a code.", "quote": "A discount always goes through a code.", "tags": ["codes"]}, {"id": "e-03-q2", "lesson": "e-03", "level": 2, "type": "tf", "stem": "Each pair is its own dispense.", "options": ["True", "False"], "answer": 0, "feedback": "Each pair has its own product, lenses and frame.", "quote": "Each pair is its own dispense: its own product, lenses and frame, entered as in the dispensing lesson.", "tags": ["method"]}, {"id": "e-03-q3", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "The total does not match your quote. What do you do?", "options": ["Override the price to match the quote", "Stop, check the code and pair, then ask", "Delete the item and enter it again", "Take the payment and sort it out afterwards"], "answer": 1, "feedback": "Check the code is on the right pair, and ask if still wrong. Never fix it by overriding.", "quote": "Read the total aloud and compare it with your quote.", "tags": ["method"]}, {"id": "e-03-q4", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "You added an item by mistake. What do you do?", "options": ["Delete it without a note", "Override its price down to zero", "Void it with a reason", "Leave it and tell the patient"], "answer": 2, "feedback": "Void, never delete.", "quote": "If you have to remove an item, void it with a reason.", "tags": ["method"]}, {"id": "e-03-q5", "lesson": "e-03", "level": 2, "type": "tf", "stem": "The second-pair code is applied to the first pair when a Gold member buys two pairs.", "options": ["True", "False"], "answer": 1, "feedback": "The code goes on the second pair only; the first pair gets the plan discount.", "quote": "Applying the second-pair code to the first pair.", "tags": ["codes"]}, {"id": "e-03-q6", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "A Gold member bought glasses 40 days ago and wants sunglasses. What do you check first?", "options": ["Her last eye test result", "Her frame size from the old job", "The sunglasses stock level", "The first-pair date in her record"], "answer": 3, "feedback": "The offer depends on the first-pair date being within 90 days.", "quote": "Open her record and check the first-pair date.", "tags": ["steps"]}, {"id": "e-03-q7", "lesson": "e-03", "level": 2, "type": "mcq", "stem": "A friend at the other company uses a different code name for the same offer. Which do you use?", "options": ["Your friend's code, as it is the same offer", "Either, since they do the same job", "The one in your own company's table", "The shorter one, to save time"], "answer": 2, "feedback": "Codes differ by company; learn and use your own.", "quote": "Look up your company's second-pair code in the table below.", "tags": ["codes"]}, {"id": "e-03-q8", "lesson": "e-03", "level": 2, "type": "tf", "stem": "Gold plan discounts on the first pair are applied through the plan discount, never by changing the price.", "options": ["True", "False"], "answer": 0, "feedback": "Same rule as the second pair: discounts, not price changes.", "quote": "on the first pair work the same way: through the plan discount, never by changing the price.", "tags": ["codes"]}, {"id": "e-04-q1", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "For cash, what do you enter in the system?", "options": ["The day's takings so far", "The change due", "The amount handed over", "The amount owed"], "answer": 3, "feedback": "Enter the amount owed, not the amount handed over.", "quote": "enter the amount owed, not the amount handed over", "tags": ["cash"]}, {"id": "e-04-q2", "lesson": "e-04", "level": 2, "type": "tf", "stem": "You can agree a refund on the spot if the patient seems upset.", "options": ["True", "False"], "answer": 1, "feedback": "Take the details and come back; management signs off refunds.", "quote": "Never say yes or no to a refund on the spot.", "tags": ["refunds"]}, {"id": "e-04-q3", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "For a chip and PIN card payment, who keeps which copy?", "options": ["Neither copy is kept once the payment clears", "Both copies stay in the till with the day's banking", "The patient keeps the merchant copy and you keep the other copy", "The customer takes their copy; you keep the merchant copy"], "answer": 3, "feedback": "Give the customer copy, keep the merchant copy.", "quote": "For chip and PIN give the customer copy and keep the merchant copy.", "tags": ["card"]}, {"id": "e-04-q4", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "What is the first check before taking payment?", "options": ["That you are in the correct patient record", "That the receipt paper is loaded", "That the discount code is applied", "That the lab has finished the job"], "answer": 0, "feedback": "Wrong record means a wrong receipt and history.", "quote": "Are you in the correct patient record?", "tags": ["method"]}, {"id": "e-04-q5", "lesson": "e-04", "level": 2, "type": "tf", "stem": "A merchant receipt should have the patient's name written on the back before it goes in the till.", "options": ["True", "False"], "answer": 0, "feedback": "It lets the payment be traced at banking.", "quote": "Write the patient's name on the back of the merchant receipt and put it in the till.", "tags": ["card"]}, {"id": "e-04-q6", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "A patient hands you a 20-pound note for a 14.50 balance. What do you enter as the cash amount?", "options": ["14.50", "20.00", "34.50", "5.50"], "answer": 0, "feedback": "Enter what is owed, put the cash in the till and give 5.50 change.", "quote": "enter the amount owed, not the amount handed over", "tags": ["cash"]}, {"id": "e-04-q7", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "A patient asks for a refund and is upset. What do you do?", "options": ["Refuse the refund politely and move on", "Take the details and say you will come back to them", "Refund it from the till and note it afterwards", "Agree to the refund to calm things down"], "answer": 1, "feedback": "Refunds are signed off by management; large cash refunds need approval first.", "quote": "Never say yes or no to a refund on the spot. Take the details and come back, because refunds are signed off by management.", "tags": ["refunds"]}, {"id": "e-04-q8", "lesson": "e-04", "level": 2, "type": "mcq", "stem": "A patient pays contactless and asks for a receipt. What do you do?", "options": ["Print one from the system", "Tell them contactless has no receipt", "Ask the card machine to print it twice", "Hand over the merchant copy"], "answer": 0, "feedback": "For contactless only a merchant copy prints, so print the customer receipt from the system if asked.", "quote": "For contactless only a merchant copy prints; print a receipt from Optix One (desktop) if asked.", "tags": ["card"]}, {"id": "e-06-q1", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "Which of these must you record for a remake?", "options": ["The patient's card number and PIN", "Nothing until a remake is approved", "The reason and the original order reference", "The lab's login for the claim"], "answer": 2, "feedback": "Record the reason and the original order reference.", "quote": "Record the original order reference.", "tags": ["record"]}, {"id": "e-06-q2", "lesson": "e-06", "level": 2, "type": "tf", "stem": "You may promise a free remake on the spot to calm an upset patient.", "options": ["True", "False"], "answer": 1, "feedback": "Never promise a free remake before the problem has been triaged.", "quote": "Never promise a free remake before the problem has been triaged.", "tags": ["promises"]}, {"id": "e-06-q3", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "What should you do with the original pair?", "options": ["Return it to the patient straight away", "Pass it to the lab with the claim", "Keep it unless told otherwise", "Throw it away to avoid confusion"], "answer": 2, "feedback": "Keep the original glasses.", "quote": "Keep the original glasses unless told otherwise.", "tags": ["record"]}, {"id": "e-06-q4", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "Who looks at a clinical complaint?", "options": ["The supplier", "A new starter", "Reception", "A registrant"], "answer": 3, "feedback": "A registrant looks at any clinical complaint.", "quote": "A registrant looks at any clinical complaint.", "tags": ["scope"]}, {"id": "e-06-q5", "lesson": "e-06", "level": 2, "type": "tf", "stem": "Tell the patient when you will call back, and then make that call.", "options": ["True", "False"], "answer": 0, "feedback": "Keep the patient informed.", "quote": "Keep the patient informed. Tell them when you will get back to them and do.", "tags": ["tone"]}, {"id": "e-06-q6", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "A patient says: these are rubbish, remake them free. What do you do?", "options": ["Say the lab probably caused the fault", "Note what she notices and promise a callback, not a remake", "Promise a free remake now to calm things down", "Ask her to wear them for another month first"], "answer": 1, "feedback": "Promise a callback, not a remake. A remake might be a warranty matter, an error, an adjustment, or neither.", "quote": "Do not say \"we will remake them\".", "tags": ["promises"]}, {"id": "e-06-q7", "lesson": "e-06", "level": 2, "type": "mcq", "stem": "A colleague says eyecoded lenses carry a 12-month guarantee. What do you tell a patient?", "options": ["That eyecoded lenses are always remade free", "Nothing is promised; the wording is still to be confirmed", "That the supplier pays for any remake", "That all eyecoded lenses carry a 12-month guarantee"], "answer": 1, "feedback": "Any warranty advantage of eyecode is not yet confirmed; do not promise it.", "quote": "Any warranty advantage of eyecode is not yet confirmed; do not promise it.", "tags": ["warranty"]}, {"id": "e-06-q8", "lesson": "e-06", "level": 2, "type": "tf", "stem": "It helps to blame the lab in front of the patient so they see you are on their side.", "options": ["True", "False"], "answer": 1, "feedback": "Do not blame the patient or the lab in front of the patient. Be warm and calm.", "quote": "Blaming the patient or the lab in front of the patient.", "tags": ["tone"]}, {"id": "e-07-q1", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "What does IMPORT MEASUREMENTS do?", "options": ["Works out the lens thickness", "Shows the result of the order so far", "Fills the form from a VisiOffice session", "Stores the draft order"], "answer": 2, "feedback": "IMPORT MEASUREMENTS fills the form from a VisiOffice session.", "quote": "IMPORT MEASUREMENTS fills the form from a VisiOffice session.", "tags": ["buttons"]}, {"id": "e-07-q2", "lesson": "e-07", "level": 2, "type": "tf", "stem": "A new starter may press SEND to practise.", "options": ["True", "False"], "answer": 1, "feedback": "Only a trained person sends an order.", "quote": "Only a trained person sends an order.", "tags": ["send"]}, {"id": "e-07-q3", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "What do Essilor order numbers start with?", "options": ["OP", "EO", "JK", "RX"], "answer": 3, "feedback": "Essilor order numbers start with RX.", "quote": "Essilor order numbers start with RX.", "tags": ["reference"]}, {"id": "e-07-q4", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "What is the first section of the order form?", "options": ["Summary", "Prescription", "Shape", "Lenses"], "answer": 2, "feedback": "The order runs Shape, Prescription, Thickness & measurements, Personalisation, Lenses, Summary.", "quote": "Work down the sections: Shape, Prescription, Thickness & measurements, Personalisation, Lenses and Summary.", "tags": ["form"]}, {"id": "e-07-q5", "lesson": "e-07", "level": 2, "type": "tf", "stem": "The reference box needs the tray number, last name, first initial and Optix ID.", "options": ["True", "False"], "answer": 0, "feedback": "That lets the job be traced.", "quote": "Put the tray number, last name, first initial and Optix ID in the reference box so the job can be traced.", "tags": ["reference"]}, {"id": "e-07-q6", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "You have pressed CALCULATE and checked the preview. What next?", "options": ["Close the form without saving", "SAVE the draft and stop for a trained person", "Print the summary and give it to the patient", "SEND the order to Essilor"], "answer": 1, "feedback": "You prepare a saved draft. A trained person checks and sends.", "quote": "Press CALCULATE, check the preview, then SAVE.", "tags": ["send"]}, {"id": "e-07-q7", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "Where may you write down or share the practice's Opsysweb login?", "options": ["Nowhere; never share it or write it down", "In a message to a colleague who needs it", "On a sticky note beside the screen", "In the notes of the patient's record"], "answer": 0, "feedback": "Log in with your practice's own login and never share it.", "quote": "(never share or write it down in notes)", "tags": ["security"]}, {"id": "e-07-q8", "lesson": "e-07", "level": 2, "type": "mcq", "stem": "The order is confirmed. What do you do with the RX number?", "options": ["Delete it once the lab has the job", "Write it on the frame tray only", "Record it and move the order's status on", "Tell the patient to keep it safe"], "answer": 2, "feedback": "Record it so the job can be traced.", "quote": "move the order's status on.", "tags": ["reference"]}, {"id": "e-08-q1", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "Which of these must be eyecoded?", "options": ["Comfort Max", "A reglaze", "D28 bifocal", "Single vision 1.5"], "answer": 0, "feedback": "The must-eyecode list is Eyezen Start, Eyezen Boost, Comfort Max, Comfort Max f-360, XR Design and Short, and XR Pro.", "quote": "Eyezen Start, Eyezen Boost, Comfort Max, Comfort Max f-360, XR Design and XR Short, and XR Pro.", "tags": ["eyecode"]}, {"id": "e-08-q2", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "XR Pro is needed but VisiOffice cannot be done. What do you order?", "options": ["XR Design with average measurements", "Nothing until VisiOffice is working again", "Comfort Max with measurements you estimate", "XR Pro with the average measurements"], "answer": 0, "feedback": "XR Pro cannot be fully personalised without VisiOffice.", "quote": "Order XR Design with average measurements instead.", "tags": ["fallback"]}, {"id": "e-08-q3", "lesson": "e-08", "level": 2, "type": "tf", "stem": "You must note on the dispense why VisiOffice was not done.", "options": ["True", "False"], "answer": 0, "feedback": "Always write the reason.", "quote": "Always write the reason.", "tags": ["fallback"]}, {"id": "e-08-q4", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "VisiOffice cannot be done. Which fallback set is right?", "options": ["ERC 25.5, cape 0.0, wrap 4 to 6, panto 8 to 12, vertex 14 to 16", "ERC 25.5, cape 0.0, wrap 4 to 6, panto 8 to 12, vertex 10 to 12", "ERC 25.5, cape 4.0, wrap 8 to 12, panto 4 to 6, vertex 10 to 12", "ERC 0.0, cape 25.5, wrap 4 to 6, panto 8 to 12, vertex 10 to 12"], "answer": 1, "feedback": "These average values are the agreed fallback. Do not make up other numbers.", "quote": "Average values are the agreed fallback.", "tags": ["fallback"]}, {"id": "e-08-q5", "lesson": "e-08", "level": 2, "type": "tf", "stem": "You can promise a patient the eyecode rebate.", "options": ["True", "False"], "answer": 1, "feedback": "The rebate and warranty wording are not yet confirmed, so promise neither.", "quote": "Promising the rebate or warranty to a patient.", "tags": ["claims"]}, {"id": "e-08-q6", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "A patient is having Eyezen Boost and VisiOffice is down. What do you do?", "options": ["Order without eyecode, as no session exists", "Use the fallback averages, tick Eyecode and record why", "Postpone the order until VisiOffice works", "Estimate the measurements by eye"], "answer": 1, "feedback": "Eyezen Boost is on the must-eyecode list, so you still eyecode it.", "quote": "Check the policy: Eyezen Boost is on the must-eyecode list.", "tags": ["eyecode"]}, {"id": "e-08-q7", "lesson": "e-08", "level": 2, "type": "mcq", "stem": "Which personalisation level uses wrap, tilt and vertex?", "options": ["Level 2, lens to frame", "Level 1, PD and heights only", "Level 4, near vision behaviour", "Level 3, the wearer's habits"], "answer": 0, "feedback": "Level 1 is PD and heights, level 2 is lens to frame, level 3 is the wearer's habits.", "quote": "Lens to frame: wrap, tilt, vertex.", "tags": ["levels"]}, {"id": "e-08-q8", "lesson": "e-08", "level": 2, "type": "tf", "stem": "Personalisation is included at no extra charge in TEG.", "options": ["True", "False"], "answer": 0, "feedback": "Say what the patient will notice (comfort), with no medical claims.", "quote": "Personalisation is included at no extra charge in TEG.", "tags": ["claims"]}, {"id": "e-09-q1", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "What is the right order of the last steps?", "options": ["PREVIEW, CALCULATE, SEND", "CALCULATE, PREVIEW, SAVE", "SAVE, CALCULATE, PREVIEW", "CALCULATE, SAVE, PREVIEW"], "answer": 1, "feedback": "Calculate first so you know what you are ordering.", "quote": "CALCULATE, then PREVIEW, then SAVE.", "tags": ["order"]}, {"id": "e-09-q2", "lesson": "e-09", "level": 2, "type": "tf", "stem": "Saving an order places it with Essilor.", "options": ["True", "False"], "answer": 1, "feedback": "Saving only stores a draft. A trained person sends.", "quote": "Saving does not place the order.", "tags": ["send"]}, {"id": "e-09-q3", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "You change the index after CALCULATE. What next?", "options": ["SAVE, as the preview will update itself", "Close the form and start again", "SEND, because the change is small", "Press CALCULATE again before you SAVE"], "answer": 3, "feedback": "Any change needs a fresh calculation.", "quote": "If you change anything (prescription, measurements, index, shape), press CALCULATE again before you SAVE.", "tags": ["order"]}, {"id": "e-09-q4", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "The preview shows thicker lenses than you told the patient. What do you do?", "options": ["Stop, consider options and talk to the patient", "Reduce the prescription slightly", "Send it, as the patient has already paid", "Save anyway; the lab will sort it out"], "answer": 0, "feedback": "Do not just save.", "quote": "Do not just save.", "tags": ["thickness"]}, {"id": "e-09-q5", "lesson": "e-09", "level": 2, "type": "tf", "stem": "If you change the frame shape after CALCULATE, you must press CALCULATE again before saving.", "options": ["True", "False"], "answer": 0, "feedback": "Shape, index, prescription and measurements all affect thickness.", "quote": "If you change anything (prescription, measurements, index, shape), press CALCULATE again before you SAVE.", "tags": ["order"]}, {"id": "e-09-q6", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "Which options may fix a preview that is too thick?", "options": ["Skipping the CALCULATE step", "A larger frame with a wider bridge", "A thinner index, or a smaller frame", "A thicker coating on the front surface"], "answer": 2, "feedback": "Talk to the patient first, and to a registrant if the prescription is strong.", "quote": "a thinner index, with the price difference read from the list", "tags": ["thickness"]}, {"id": "e-09-q7", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "What do you compare in the preview?", "options": ["Whether the thickness matches what you promised", "Whether the practice name is spelled right", "Whether the supplier has stock", "Whether the order number looks familiar"], "answer": 0, "feedback": "Check thickness, shape, measurements and lens details.", "quote": "Is the thickness in line with what you promised the patient when you chose the index?", "tags": ["thickness"]}, {"id": "e-09-q8", "lesson": "e-09", "level": 2, "type": "mcq", "stem": "Who places the order with Essilor?", "options": ["Essilor, automatically when you SAVE", "You, as soon as it is saved", "The patient, by confirming by email", "A trained person, by pressing SEND"], "answer": 3, "feedback": "SAVE is a draft only.", "quote": "The order is placed only when a trained person presses SEND.", "tags": ["send"]}, {"id": "f-06-q1", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "What does triage mean in this lesson?", "options": ["Refunding the patient before any checks are made", "Sorting the request into one of five groups before acting", "Sending the request straight to the supplier", "Logging the request and acting on it next week"], "answer": 1, "feedback": "Triage means sorting into one of the five groups before you say or promise anything.", "quote": "Triage means sorting before acting.", "tags": ["triage"]}, {"id": "f-06-q2", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "A patient with a new prescription from a new test asks for a remake. What is this?", "options": ["A remake at the practice's cost", "A new job, not a remake", "A coating guarantee claim", "A goodwill refund request"], "answer": 1, "feedback": "A new prescription from a new test means a new job, not a remake.", "quote": "A new prescription from a new test means a new job, not a remake.", "tags": ["groups"]}, {"id": "f-06-q3", "lesson": "f-06", "level": 2, "type": "tf", "stem": "You may tell a patient, \"Yes, you will get a full refund\", before checking.", "options": ["True", "False"], "answer": 1, "feedback": "Never say yes or no to a refund on the spot. The owner signs off refunds.", "quote": "Never say yes or no to a refund on the spot. The owner signs off refunds.", "tags": ["refund"]}, {"id": "f-06-q4", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "Why do you scan the return form into the patient's record?", "options": ["To avoid repeat remakes", "To let reception bill the patient for it", "To replace the supplier's own paperwork", "To show the owner how busy the desk is"], "answer": 0, "feedback": "A scanned copy shows what has already been returned, so the same job is not remade again.", "quote": "scan a copy of the return form into the patient's record to avoid repeat remakes", "tags": ["records"]}, {"id": "f-06-q5", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "A coating has started to craze on lenses a few months old, with no sign of damage. What is the best first step?", "options": ["Coating fault: check the right claim form", "Damage: tell them it is never covered", "New prescription: open a fresh job", "Non-adaptation: return the lenses now"], "answer": 0, "feedback": "Crazing or peeling is a coating or material fault, which may be a supplier guarantee claim. Check the correct claim form for the product.", "quote": "The coating crazes or peels, the lens delaminates.", "tags": ["groups"]}, {"id": "f-06-q6", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "A patient asks for a free remake and you have not yet sorted the group. What do you say?", "options": ["Yes, we will remake them free of charge today", "I will find out what we can do and ring you by tomorrow", "No, that kind of fault is not covered by our policy", "Come back next week and we will see what can be done"], "answer": 1, "feedback": "Say sorry, promise a call by tomorrow, and then ring. Do not promise a free remake before you know the group.", "quote": "\"I am sorry. I will find out what we can do and ring you by tomorrow.\"", "tags": ["script"]}, {"id": "f-06-q7", "lesson": "f-06", "level": 2, "type": "tf", "stem": "You should chase a supplier credit note that is overdue.", "options": ["True", "False"], "answer": 0, "feedback": "Check that credit notes arrive and chase if they are overdue; unrecorded returns are lost money.", "quote": "Check that supplier credit notes arrive, and chase if they are overdue.", "tags": ["paperwork"]}, {"id": "f-06-q8", "lesson": "f-06", "level": 2, "type": "mcq", "stem": "Who signs off a refund?", "options": ["The owner", "The dispenser who handled it", "The supplier's rep", "The dispensing optician on duty"], "answer": 0, "feedback": "Refunds are signed off by the owner. Take details and come back to the patient.", "quote": "Refunds are signed off by the owner.", "tags": ["refund"]}, {"id": "f-07-q1", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "A patient demands a refund immediately. What do you do?", "options": ["Say yes straight away to calm them down", "Say no firmly and explain the policy", "Take details and say you will come back to them", "Ask them to leave and come back tomorrow"], "answer": 2, "feedback": "Take details and come back; the owner signs off refunds.", "quote": "Say yes or no to a refund on the spot. Take details and come back; the owner signs off refunds.", "tags": ["refund"]}, {"id": "f-07-q2", "lesson": "f-07", "level": 2, "type": "tf", "stem": "You decide on the spot what goodwill to offer.", "options": ["True", "False"], "answer": 1, "feedback": "The practice manager decides what goodwill is possible, and some decisions need the owner.", "quote": "The practice manager decides what goodwill is possible; you do not decide on the spot.", "tags": ["goodwill"]}, {"id": "f-07-q3", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "What is the first thing to do with an upset patient?", "options": ["Explain the practice policy in full", "Listen without interrupting", "Offer a discount to calm things", "Call the manager to the desk"], "answer": 1, "feedback": "Listen without interrupting. Most complaints are solved by being heard.", "quote": "Listen without interrupting. Let them finish.", "tags": ["listening"]}, {"id": "f-07-q4", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "A patient mentions the regulator and legal action. What do you do?", "options": ["Carry on and note it in the record later", "Tell the practice manager at once", "Offer a refund to settle the matter", "Ask them to put it in a letter"], "answer": 1, "feedback": "Legal action, harm or the regulator are serious complaints: stop and tell the practice manager at once.", "quote": "If the patient mentions legal action, harm or the regulator, stop and tell the practice manager at once.", "tags": ["serious"]}, {"id": "f-07-q5", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "Which is the best way to apologise?", "options": ["I am sorry that has happened", "I am sorry, but the lab got it wrong", "I am sorry, but it is not our policy", "I am sorry, but you did not follow the advice"], "answer": 0, "feedback": "Apologise for the experience, not for blame. Never blame the patient, the lab or a colleague.", "quote": "Apologise for the experience, not for blame: \"I am sorry that has happened.\"", "tags": ["apology"]}, {"id": "f-07-q6", "lesson": "f-07", "level": 2, "type": "tf", "stem": "Goodwill is something the practice gives although it does not have to.", "options": ["True", "False"], "answer": 0, "feedback": "A free adjustment, a discount or a repair can all be goodwill.", "quote": "Goodwill is something the practice gives although it does not have to", "tags": ["goodwill"]}, {"id": "f-07-q7", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "A patient complains of headaches and double vision with new glasses. How is this handled?", "options": ["Treat it as goodwill and ask the practice manager to decide", "Use the non-tolerance steps, and a registrant if needed", "Offer a free remake straight away to settle it", "Book a routine call for the following week"], "answer": 1, "feedback": "Complaints about seeing, headaches or double vision are clinical: use the non-tolerance steps and fetch a registrant for the stop signs.", "quote": "If the complaint is about seeing, headaches, double vision or discomfort, use the first-line non-tolerance steps and fetch a registrant for the stop signs.", "tags": ["clinical"]}, {"id": "f-07-q8", "lesson": "f-07", "level": 2, "type": "mcq", "stem": "You have told a patient you will ring back by tomorrow. What do you do next?", "options": ["Wait and see whether they ring first", "Write the time in the diary", "Leave the next shift to remember it", "Ring only if you have good news"], "answer": 1, "feedback": "A promise you cannot see in the diary is a promise that gets forgotten.", "quote": "Write down the promised time and put it in the diary.", "tags": ["promise"]}, {"id": "g-02-q1", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "Which question is an open question?", "options": ["Do you use a computer at work or home?", "You do a lot of driving, don't you?", "Tell me what a normal day looks like for you", "Is this the pair you wear most days?"], "answer": 2, "feedback": "An open question starts with what, how or tell me and invites a story, not a yes or no.", "quote": "Open questions start with what, how or tell me, and they invite a story instead of a yes or no.", "tags": ["open-questions"]}, {"id": "g-02-q2", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "Which topics should you explore to find out how a patient lives?", "options": ["Screens, driving, hobbies, work and complaints", "Frame brand, colour, price and the delivery date", "Age, address, occupation and household income", "Prescription, index, coating and tint options"], "answer": 0, "feedback": "Each of these points at a lens need. You do not have to ask everything.", "quote": "Ask about screens, driving, hobbies and work, and ask what they dislike about their current pair.", "tags": ["needs-finding"]}, {"id": "g-02-q3", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "You have asked a good open question and the patient pauses. What do you do?", "options": ["Offer a list of answers to pick from", "Ask a second question straight away", "Move on to the price to keep pace", "Stop talking and let the silence do its work"], "answer": 3, "feedback": "Patients fill the gap with the thing that matters most. Do not offer a list.", "quote": "After you ask, stop talking and let the silence do its work.", "tags": ["silence"]}, {"id": "g-02-q4", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "You cannot tell what is driving a patient. How should you treat them?", "options": ["As someone who only wants the cheapest", "As wanting to protect what they have", "As wanting something new and different", "As someone who is not ready to buy"], "answer": 1, "feedback": "If you cannot tell the driver, treat them as wanting to protect what they have and lead with health and the optometrist's advice.", "quote": "If you cannot tell what is driving them, treat them as wanting to protect what they have.", "tags": ["drivers"]}, {"id": "g-02-q5", "lesson": "g-02", "level": 2, "type": "tf", "stem": "After you ask an open question, you should offer a few possible answers to help the patient reply.", "options": ["True", "False"], "answer": 1, "feedback": "Do not offer a list of answers. Stop talking and let the patient fill the gap.", "quote": "Do not offer a list of answers for them to pick from.", "tags": ["silence"]}, {"id": "g-02-q6", "lesson": "g-02", "level": 2, "type": "tf", "stem": "Writing down the patient's own words is useful because you will use them again at the price and the close.", "options": ["True", "False"], "answer": 0, "feedback": "\"Starry lights at night\" lands better than \"anti-reflective coating\".", "quote": "Write down what they tell you in their own words, because you will use their words again at the price and the close.", "tags": ["keep-words"]}, {"id": "g-02-q7", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "A patient seems confused and anxious. How should you adjust?", "options": ["Ask all the questions to be thorough", "Fewer questions, slower pace", "Skip questions and go to the price", "Hand them a questionnaire to fill in"], "answer": 1, "feedback": "A confused or anxious patient needs fewer questions and a slower pace. If unsure how far to go, ask a registrant.", "quote": "A patient who is confused or anxious needs fewer questions and a slower pace.", "tags": ["pace"]}, {"id": "g-02-q8", "lesson": "g-02", "level": 2, "type": "mcq", "stem": "Which question has the answer built in and should be avoided?", "options": ["What are you hoping to see better day to day?", "You do a lot of computer work, don't you?", "What does a normal day look like?", "Any worries about your eyes?"], "answer": 1, "feedback": "A question with the answer built in invites a yes, not a story.", "quote": "Do not ask questions with the answer built in, such as \"You do a lot of computer work, don't you?\"", "tags": ["leading"]}, {"id": "g-03-q1", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "Which is the best shape for linking a lens to a need?", "options": ["List every feature of the chosen lens", "One need, one lens, one sentence", "Quote the price before the benefit", "Leave it to the optometrist to explain"], "answer": 1, "feedback": "Link one need to one lens in a single sentence.", "quote": "Link one need to one lens, and say it in a single sentence.", "tags": ["linking"]}, {"id": "g-03-q2", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "Why use the patient's own words from needs-finding?", "options": ["It keeps the chat short enough for the diary", "The link sounds like listening, not selling", "It avoids having to name the lens at all", "The system requires the words to be recorded"], "answer": 1, "feedback": "Their words sound like listening. Stock phrases sound like selling.", "quote": "Use the patient's own words from needs-finding, so the link sounds like listening and not like selling.", "tags": ["listening"]}, {"id": "g-03-q3", "lesson": "g-03", "level": 2, "type": "tf", "stem": "You should explain the technical coating names to the patient so they understand the lens.", "options": ["True", "False"], "answer": 1, "feedback": "Do not list features; features belong on the order, not in the conversation.", "quote": "Do not list features. Features belong on the order, not in the conversation.", "tags": ["jargon"]}, {"id": "g-03-q4", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "A patient asks if a blue light coating protects their eyes. What is the correct line to take?", "options": ["Yes, it protects against eye disease", "Talk about comfort only, never about eye health", "Say it is only a gimmick and not worth it", "Say it is needed for everyone who uses screens"], "answer": 1, "feedback": "Blue light: talk about comfort only, never eye health.", "quote": "Blue light: talk about comfort only, never eye health.", "tags": ["claims"]}, {"id": "g-03-q5", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "A patient says starry lights at night make driving stressful. Which link fits best?", "options": ["A hard, easy-clean coating for scratches", "An anti-reflective coating for less glare", "A lens that darkens outdoors in bright light", "The best design the budget allows for all-day wear"], "answer": 1, "feedback": "Night driving or glare points to an anti-reflective coating, and for frequent drivers a lens designed for driving.", "quote": "Night driving or glare: an anti-reflective coating", "tags": ["matching"]}, {"id": "g-03-q6", "lesson": "g-03", "level": 2, "type": "tf", "stem": "Two links are plenty; three starts to sound like a pitch.", "options": ["True", "False"], "answer": 0, "feedback": "Keep it to the needs the patient actually gave you.", "quote": "Two links are plenty. Three starts to sound like a pitch.", "tags": ["linking"]}, {"id": "g-03-q7", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "A patient never mentioned driving. Should you advise a driving lens?", "options": ["No, only link needs they actually mentioned", "Yes, most patients drive so it is safe to include", "Yes, as the best option for everyone", "No, driving lenses are never advised"], "answer": 0, "feedback": "Do not invent a need. If they did not mention driving, do not sell a driving lens.", "quote": "Do not invent a need. If they did not mention driving, do not sell a driving lens.", "tags": ["invent"]}, {"id": "g-03-q8", "lesson": "g-03", "level": 2, "type": "mcq", "stem": "Why use a simple comparison, such as sun cream, when explaining a lens?", "options": ["It gives them a line to repeat at home", "It lets you skip explaining the benefit", "It shows how clever the product is", "It stops them asking questions"], "answer": 0, "feedback": "A simple comparison gives the patient a line to repeat at home.", "quote": "A simple comparison gives them a line to repeat at home.", "tags": ["comparison"]}, {"id": "g-04-q1", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "What comes first when you present lens options?", "options": ["The price of the cheapest option", "The lens benefit, then price", "The frame the patient has chosen", "Any discount that is available"], "answer": 1, "feedback": "If the price comes first the patient hears a number with nothing to set against it, and the cheapest wins by default.", "quote": "Show the lens before the price: describe the benefit first, then say what it costs.", "tags": ["lens-before-price"]}, {"id": "g-04-q2", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "How many options should you normally present?", "options": ["One, the one the optometrist advises", "Two, a cheap one and a dear one", "Three: a good, a better and a best option", "Four, so every budget is covered"], "answer": 2, "feedback": "Three is the right number. Two feels like a push or a pull; four is confusing.", "quote": "Three is the right number. Two feels like a push or a pull. Four is confusing.", "tags": ["three-options"]}, {"id": "g-04-q3", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "A patient has said they drive a lot at night. Which option should you lead with?", "options": ["The cheapest, to be on the safe side", "The most expensive, as the gold standard", "The one that best fits their night driving", "Whichever has an offer on this week"], "answer": 2, "feedback": "Lead with the option that fits their needs, not the cheapest or the dearest.", "quote": "Lead with the option that fits their needs, not the cheapest or the dearest.", "tags": ["fit"]}, {"id": "g-04-q4", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "A price on the list looks wrong for the lens you chose. What do you do?", "options": ["Override it in the system to fix it", "Round it to what feels right", "Tell the patient a lower figure", "Ask; staff cannot change a price"], "answer": 3, "feedback": "Staff cannot change a price in the system. If a price looks wrong, ask.", "quote": "If a price looks wrong, ask. Staff cannot change a price in the system.", "tags": ["price-rules"]}, {"id": "g-04-q5", "lesson": "g-04", "level": 2, "type": "tf", "stem": "It is fine to describe the good option as the basic one.", "options": ["True", "False"], "answer": 1, "feedback": "Never describe the good option as second-rate. It works and is a sensible choice.", "quote": "Good: it works and it is a sensible choice. Never describe it as second-rate.", "tags": ["good-option"]}, {"id": "g-04-q6", "lesson": "g-04", "level": 2, "type": "tf", "stem": "\"This one has less glare at night\" is the kind of difference to say between options.", "options": ["True", "False"], "answer": 0, "feedback": "Say each difference in terms of the patient's day, not in technical terms such as index.", "quote": "\"This one has less glare at night\" is a difference.", "tags": ["difference"]}, {"id": "g-04-q7", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "The budget does not allow the best lens. What do you say?", "options": ["Then the better one is all you can have", "Let us get you as close as we can", "The best is the only one I would advise", "The good one will have to do"], "answer": 1, "feedback": "Compromise, not downgrade: keep the benefit that matters most to them.", "quote": "\"That is fine. Let us get you as close to it as we can.\"", "tags": ["compromise"]}, {"id": "g-04-q8", "lesson": "g-04", "level": 2, "type": "mcq", "stem": "You start by describing the cheapest option and work upwards. What is the risk?", "options": ["It anchors the patient's mind low", "It makes the appointment run too long", "It confuses them with too many numbers", "It breaks the price list rules"], "answer": 0, "feedback": "If you start at the bottom you set the patient's mind there.", "quote": "If you start at the bottom, you set the patient's mind there.", "tags": ["order"]}, {"id": "g-05-q1", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "What price should you say to the patient?", "options": ["The frame and lens prices, one after the other", "Only the lens price, if that is the decision", "The whole pair price, frame and lenses together", "A range, to leave room to move"], "answer": 2, "feedback": "Patients buy glasses, not parts. Give the price of the whole pair in one sentence.", "quote": "Say the price of the whole pair, frame and lenses together, in one sentence.", "tags": ["whole-pair"]}, {"id": "g-05-q2", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "After you say the price, what should you do?", "options": ["Offer a discount straight away", "Explain the price in more detail", "Stop talking and let them think", "Ask whether it is too much"], "answer": 2, "feedback": "Silence after the price is the patient thinking. Count to five in your head.", "quote": "Silence after the price is the patient thinking, not a problem for you to fix.", "tags": ["silence"]}, {"id": "g-05-q3", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "Which delivery is best?", "options": ["A rising voice with an apology", "Fast and mumbled to get past it", "Calm, one sentence, with a falling voice", "Reading it silently off the screen"], "answer": 2, "feedback": "A falling voice makes the price a fact. A rising voice makes it a question.", "quote": "A rising voice makes the price a question. A fall makes it a fact.", "tags": ["delivery"]}, {"id": "g-05-q4", "lesson": "g-05", "level": 2, "type": "tf", "stem": "If a price looks wrong, a staff member can override it in the system.", "options": ["True", "False"], "answer": 1, "feedback": "Staff cannot override prices, and an override breaks the VAT split. Ask instead.", "quote": "Staff cannot override prices, and an override breaks the VAT split.", "tags": ["price-rules"]}, {"id": "g-05-q5", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "You have said the price and the patient is silent. What do you do?", "options": ["Count to five in your head", "Offer a discount to break the silence", "Add \"but\" and explain the value", "Ask them if the price is a problem"], "answer": 0, "feedback": "If you speak first you may talk yourself out of a sale, or offer a discount nobody asked for.", "quote": "Count to five in your head.", "tags": ["silence"]}, {"id": "g-05-q6", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "The patient looks tense before you give the price. What helps?", "options": ["Name the worry first, then the price", "Say the price quickly to get it over", "Offer a small discount before the price", "Say the price is only a small amount"], "answer": 0, "feedback": "Naming the worry out loud takes the pressure off. Do not minimise with words like just or only.", "quote": "say their worry out loud first: \"You may be thinking this sounds expensive.\" Then give the price.", "tags": ["worry"]}, {"id": "g-05-q7", "lesson": "g-05", "level": 2, "type": "tf", "stem": "A rising voice at the end of the price makes it sound like a question.", "options": ["True", "False"], "answer": 0, "feedback": "Say the number once, plainly, with your voice falling at the end.", "quote": "A rising voice makes the price a question.", "tags": ["delivery"]}, {"id": "g-05-q8", "lesson": "g-05", "level": 2, "type": "mcq", "stem": "When should the patient hear the price?", "options": ["At collection, when they pay", "Before anything is ordered", "Once the frame has been ordered", "Only if they ask for it"], "answer": 1, "feedback": "A patient surprised at the till at collection will not come back.", "quote": "Give the price before anything is ordered.", "tags": ["timing"]}, {"id": "g-06-q1", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "When should you raise a second pair and sun protection?", "options": ["Only when the patient raises the subject", "At every sale, not only when they may say yes", "Only for patients you expect to say yes", "Only when the first pair is a dear one"], "answer": 1, "feedback": "Skipping it because you think they will say no is the main mistake. Be the person who told them.", "quote": "Raise the second pair and sun at every sale, not only when you think the patient will say yes.", "tags": ["second-pair"]}, {"id": "g-06-q2", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "Why does a polarised pair help a driver who already has light-reactive lenses?", "options": ["Light-reactive lenses never darken outdoors at all", "Light-reactive lenses barely darken in a car", "Polarised lenses are always the cheaper option", "The law requires a second pair for driving"], "answer": 1, "feedback": "Light-reactive lenses are good for everyday glare but barely darken in a car, so a polarised pair covers that.", "quote": "Light-reactive lenses are good for everyday glare but barely darken in a car, so a polarised pair covers that.", "tags": ["polarised"]}, {"id": "g-06-q3", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "Which phrasing makes the second pair the standard advice rather than an upsell?", "options": ["Do you fancy a second pair?", "What we normally do is two pairs.", "We have a discount on a spare today.", "You might want to consider another one."], "answer": 1, "feedback": "Saying what you normally do makes it the standard advice.", "quote": "Say \"What we normally do is two pairs.\"", "tags": ["language"]}, {"id": "g-06-q4", "lesson": "g-06", "level": 2, "type": "tf", "stem": "You can tell a patient that sunglasses will prevent cataracts.", "options": ["True", "False"], "answer": 1, "feedback": "Never claim lenses prevent eye disease. Say \"look after your eyes\".", "quote": "Do not claim sun lenses prevent cataracts or other conditions.", "tags": ["claims"]}, {"id": "g-06-q5", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "When is a spare pair a genuine recommendation?", "options": ["When they cannot see without them", "When the practice has stock to clear", "When the first pair was a low price", "When the patient has a loyalty plan"], "answer": 0, "feedback": "Use the spare-pair link only when it is real, for someone who cannot see without them.", "quote": "Use this only when it is real, such as someone who cannot see without them.", "tags": ["spare"]}, {"id": "g-06-q6", "lesson": "g-06", "level": 2, "type": "tf", "stem": "If a patient declines the second pair, you may mention it again at collection if it still makes sense.", "options": ["True", "False"], "answer": 0, "feedback": "Ask once and accept the answer, but collection is a natural second chance.", "quote": "You can mention it again at collection if it still makes sense.", "tags": ["ask-once"]}, {"id": "g-06-q7", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "A patient has told you their budget is fixed. What do you do about a second pair?", "options": ["Respect the budget and do not push a second pair", "Mention a bigger discount to tempt them", "Offer the dearest pair so it feels worth it", "Say most people regret skipping it"], "answer": 0, "feedback": "Do not push a second pair on a patient who has told you their budget is fixed.", "quote": "Do not push a second pair on a patient who has told you their budget is fixed.", "tags": ["budget"]}, {"id": "g-06-q8", "lesson": "g-06", "level": 2, "type": "mcq", "stem": "A patient says no to sunglasses. What do you do?", "options": ["Ask again in a different way", "Note it and move on", "Tell them what they risk without them", "Add them to the quote anyway"], "answer": 1, "feedback": "Ask once and accept the answer. Writing it on the record lets the next visit pick it up.", "quote": "If they say no, note it and move on.", "tags": ["ask-once"]}, {"id": "g-07-q1", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "When is it right to offer a better lens?", "options": ["Whenever the practice is quiet this week", "When it fixes something they have told you", "When the patient looks quite well off", "When there is a sales target to hit"], "answer": 1, "feedback": "Trade up when the better option solves something the patient told you.", "quote": "Trade up when the better option solves something the patient told you.", "tags": ["trade-up"]}, {"id": "g-07-q2", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "An NHS voucher patient says the basic pair is fine and you have mentioned extras once. What now?", "options": ["Mention extras again at the till", "Explain that the voucher pair is limited", "Accept the answer and carry on", "Ask a manager to speak to them"], "answer": 2, "feedback": "Explain what the voucher covers, mention extras once, and let them choose. Never suggest the voucher pair is second-rate.", "quote": "Explain what the voucher covers, mention extras once, and let them choose.", "tags": ["nhs-voucher"]}, {"id": "g-07-q3", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "A patient seems confused and has come alone. What should you do?", "options": ["Show the whole range so they can see everything", "Offer fewer options and another day with a relative", "Move quickly so the confusion does not build", "Leave the price out so it is simpler for them to follow"], "answer": 1, "feedback": "Slow down, give fewer options and offer to continue another day with a relative or carer. These patients come first, sales second.", "quote": "Slow down, give fewer options, and offer to continue another day with a relative or carer.", "tags": ["vulnerable"]}, {"id": "g-07-q4", "lesson": "g-07", "level": 2, "type": "tf", "stem": "It is acceptable to exaggerate a risk if it helps the patient choose a better lens.", "options": ["True", "False"], "answer": 1, "feedback": "Never use fear to trade up. Do not exaggerate a risk.", "quote": "Never use fear to trade up. Do not exaggerate a risk.", "tags": ["ethics"]}, {"id": "g-07-q5", "lesson": "g-07", "level": 2, "type": "tf", "stem": "Before offering a better lens you should be able to say in one sentence what the patient gets for the extra.", "options": ["True", "False"], "answer": 0, "feedback": "If you cannot explain it in one sentence, do not offer it.", "quote": "Check: could you explain, in one sentence, what they get for the extra?", "tags": ["trade-up"]}, {"id": "g-07-q6", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "A patient has said their budget is a firm limit. What do you do?", "options": ["Show the best within it, and say what is traded away", "Show the dearest option first and see how they react", "Say the budget is too low for any safe option today", "Suggest they borrow against a payment plan to cover it"], "answer": 0, "feedback": "Work within the budget and be honest about what is traded away. Never make a patient feel guilty about a budget.", "quote": "Show the best you can do inside the limit and say what is traded away.", "tags": ["budget"]}, {"id": "g-07-q7", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "A patient is in a hurry and a little upset about a delay. What do you do?", "options": ["Solve the job and leave the extras", "Mention the extras while they wait", "Use the delay to offer a discount", "Ask them to come back to discuss options"], "answer": 0, "feedback": "When someone is in a hurry or upset, solve the job and leave the extras.", "quote": "The patient is in a hurry or upset. Solve the job and leave the extras.", "tags": ["not-to-push"]}, {"id": "g-07-q8", "lesson": "g-07", "level": 2, "type": "mcq", "stem": "A patient says no to the better lens. What do you say?", "options": ["That is a good choice", "Are you sure you will manage?", "It is your decision, but it is risky", "Many regret it later"], "answer": 0, "feedback": "Confirm they chose well and leave the door open: \"If you change your mind, just ask.\"", "quote": "If a patient says no to the better lens, confirm they chose well: \"That is a good choice.\"", "tags": ["respect"]}, {"id": "g-08-q1", "lesson": "g-08", "level": 2, "type": "order", "stem": "Put the five objection steps in the right order.", "options": ["Acknowledge", "Clarify", "Answer with the benefit to them", "Check", "Close"], "answer": 0, "feedback": "Acknowledge and clarify before you answer, check they follow, then close with a next step.", "quote": "Handle every objection the same way: acknowledge, clarify, answer with the benefit to them, check, close.", "tags": ["method"]}, {"id": "g-08-q2", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "Why acknowledge before you answer?", "options": ["It gives you time to look up the right price", "They cannot hear your answer until they feel heard", "It lets you avoid being asked about the price", "It is a rule that the regulator sets for sales"], "answer": 1, "feedback": "If you jump straight to the answer it sounds like arguing.", "quote": "Acknowledge first and answer second, because the patient cannot hear your answer until they feel heard.", "tags": ["acknowledge"]}, {"id": "g-08-q3", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "A patient says, \"It is too expensive.\" What is the next best step after acknowledging?", "options": ["Offer a small discount to keep the sale", "Ask what is really holding them back today", "Repeat the price slowly and clearly", "Tell them it is good value for money"], "answer": 1, "feedback": "Clarify once. Too expensive can mean cannot afford it, not sure it is worth it, or needs to ask a partner.", "quote": "\"What is the main thing holding you back?\"", "tags": ["clarify"]}, {"id": "g-08-q4", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "A patient says a high-street chain is cheaper. What should you do?", "options": ["Say their lenses are generally poor quality", "Compare what is included, not the price", "Match their price to keep the sale today", "Ignore the comment and carry on talking"], "answer": 1, "feedback": "Compare what is included, not the headline price.", "quote": "If the patient mentions another shop or an online seller, never criticise it. Compare what is included, not the headline price.", "tags": ["competitors"]}, {"id": "g-08-q5", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "A patient says no a second time after you offered a middle option. What do you do?", "options": ["Ask again in a different way", "Let it go warmly and hold the quote", "Offer a bigger discount to close", "End the conversation as soon as you can"], "answer": 1, "feedback": "Ask once, never twice. A patient who feels respected will come back.", "quote": "After a no, offer one middle option, then let it go warmly.", "tags": ["ask-once"]}, {"id": "g-08-q6", "lesson": "g-08", "level": 2, "type": "tf", "stem": "The first thing a patient says is often not the real reason for an objection.", "options": ["True", "False"], "answer": 0, "feedback": "That is why you clarify before you answer.", "quote": "The first thing a patient says is often not the real reason.", "tags": ["clarify"]}, {"id": "g-08-q7", "lesson": "g-08", "level": 2, "type": "tf", "stem": "If you have no true story to tell, you can invent a short one that fits.", "options": ["True", "False"], "answer": 1, "feedback": "Stories must be true. If you have none, say \"A lot of patients tell me...\".", "quote": "If you do not have one, say \"A lot of patients tell me...\" and never invent a story.", "tags": ["stories"]}, {"id": "g-08-q8", "lesson": "g-08", "level": 2, "type": "mcq", "stem": "Mid-objection a patient asks whether a lens is suitable for their eye condition. What do you do?", "options": ["Reassure them it is fine to wear", "Ask a registrant", "Check the lens brochure and tell them", "Move on to the price"], "answer": 1, "feedback": "If an objection raises a clinical question, ask a registrant.", "quote": "If an objection raises a clinical question, such as whether a lens is suitable, ask a registrant.", "tags": ["clinical"]}, {"id": "g-09-q1", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "What does \"it is too expensive\" often really mean?", "options": ["I cannot afford anything at all today", "I do not yet see why it is worth the cost", "I want a discount straight away", "I do not like the frame much"], "answer": 1, "feedback": "They cannot know it is expensive until they have seen what it gives them.", "quote": "\"It is too expensive\" often means \"I do not yet see why it is worth it\".", "tags": ["price"]}, {"id": "g-09-q2", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "A patient says a high-street shop is cheaper. What is the best response?", "options": ["Point out the other shop's quality problems", "Compare what is included, not the shop", "Offer to match their price on the spot", "Say that people get what they pay for"], "answer": 1, "feedback": "Compare the design, coatings, measuring, after-care and warranty, without criticising anyone.", "quote": "Do not criticise the other shop. Compare what is included", "tags": ["cheaper-elsewhere"]}, {"id": "g-09-q3", "lesson": "g-09", "level": 2, "type": "tf", "stem": "If a patient says they will buy online, you can tell them online glasses are illegal.", "options": ["True", "False"], "answer": 1, "feedback": "Do not say that buying online is illegal or unsafe.", "quote": "Do not say that buying online is illegal or unsafe.", "tags": ["online"]}, {"id": "g-09-q4", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "A patient says, \"I will come back on payday.\" What do you do?", "options": ["Press them hard to decide before they leave", "Hold the quote; agree a follow-up date", "Offer a discount you can approve later", "Tell them the price will rise soon"], "answer": 1, "feedback": "Write down what the optometrist advised, hold the quote and agree a date. Do not pressure, but do follow up.", "quote": "Write down what the optometrist advised, hold the quote, and agree a date you will follow up.", "tags": ["payday"]}, {"id": "g-09-q5", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "A patient asks why a thinner lens costs so much more. What is a fair answer?", "options": ["It is always lighter, so it is worth more", "A more advanced material, neater look", "It lasts twice as long as a thicker lens", "It is a premium brand charge only"], "answer": 1, "feedback": "Thin does not always mean light, so only say that if you have checked the product information.", "quote": "A thinner lens uses a more advanced material and has a thinner edge, so the glasses look neater.", "tags": ["thinner"]}, {"id": "g-09-q6", "lesson": "g-09", "level": 2, "type": "tf", "stem": "You should only say you can \"see what you can do\" on price if it is a real, approved code.", "options": ["True", "False"], "answer": 0, "feedback": "Never make up a discount. Staff cannot override a price.", "quote": "Do not tell them you can \"see what you can do\" unless it is a real, approved code.", "tags": ["discount"]}, {"id": "g-09-q7", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "A patient says they will order online. What can you honestly say?", "options": ["Our lenses are measured for you, with after-care", "Online glasses are unsafe and unlikely to work well", "We can match any online price if you show us it", "Online lenses are never made to the right power"], "answer": 0, "feedback": "Explain your measuring and after-care. Never say online glasses are unsafe or illegal.", "quote": "Explain that your lenses are measured and centred for the individual wearer, and that you are there if anything feels wrong.", "tags": ["online"]}, {"id": "g-09-q8", "lesson": "g-09", "level": 2, "type": "mcq", "stem": "You have no story about a worried patient. What do you say?", "options": ["I had a patient just like you who regretted not buying", "A lot of patients tell me they worry about cost", "Everyone ends up paying more in the long run", "Our lenses will never need replacing"], "answer": 1, "feedback": "Use a true story with no names, or say \"A lot of patients tell me...\". Never invent.", "quote": "If you have none, say \"A lot of patients tell me...\" and never invent.", "tags": ["stories"]}, {"id": "g-10-q1", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "A patient says, \"I will think about it.\" What is the best first response?", "options": ["Offer a discount if they decide today", "Say the price may rise next week", "Ask what they want to think over", "Move on and let them call back later"], "answer": 2, "feedback": "Most think about it means price, value, a person to ask, or feeling rushed. Ask so you can help with the real reason.", "quote": "\"Of course, it is your decision. What would you like to think over? I may be able to help now.\"", "tags": ["think-about-it"]}, {"id": "g-10-q2", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "After agreeing to hold the quote, what must you do?", "options": ["Nothing; the patient will come back", "Agree when to follow up, and do it", "Send a daily reminder until they reply", "Ask for a deposit to secure the price"], "answer": 1, "feedback": "A promised follow-up that never happens costs trust.", "quote": "Then agree when you will follow up, and do it.", "tags": ["follow-up"]}, {"id": "g-10-q3", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "A patient says their partner decides. What should you do?", "options": ["Treat it as an excuse and keep selling", "Include the partner", "Ask for the partner's phone number", "Drop the price to settle it"], "answer": 1, "feedback": "Treat it as true. Offer a time the partner can come, or a written summary to show them.", "quote": "Include the partner. Offer to book a time they can come, or to give a written summary to show them.", "tags": ["partner"]}, {"id": "g-10-q4", "lesson": "g-10", "level": 2, "type": "tf", "stem": "It is fine to say a price is only available today to push a decision.", "options": ["True", "False"], "answer": 1, "feedback": "Do not say this unless it is a real, approved offer.", "quote": "Do not say \"this price is only available today\" unless it is a real, approved offer.", "tags": ["pressure"]}, {"id": "g-10-q5", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "What helps a patient explain the lens to a partner at home?", "options": ["A leaflet of coating names", "A simple line to repeat", "A copy of the order form", "A list of every feature"], "answer": 1, "feedback": "A partner who asks \"How much?!\" needs a simple reason, not a technical one.", "quote": "Give them a sentence they can say at home", "tags": ["words"]}, {"id": "g-10-q6", "lesson": "g-10", "level": 2, "type": "tf", "stem": "When a patient says their partner decides, you should treat it as true.", "options": ["True", "False"], "answer": 0, "feedback": "It is often true and sometimes a polite way out; either way, treat it as true.", "quote": "Treat it as true.", "tags": ["partner"]}, {"id": "g-10-q7", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "The patient's partner phones to ask what the patient was advised. What do you do?", "options": ["Share it, since they are paying", "Check the patient agrees first", "Read out the full record", "Send the quote by email to the partner"], "answer": 1, "feedback": "Do not discuss patient details with the partner without the patient's agreement.", "quote": "Do not discuss patient details with the partner without the patient's agreement.", "tags": ["privacy"]}, {"id": "g-10-q8", "lesson": "g-10", "level": 2, "type": "mcq", "stem": "What should you note on the patient record after a think-it-over conversation?", "options": ["What was advised and the follow-up", "Only the quote that was given", "That the patient hesitated", "Whether they asked for a discount"], "answer": 0, "feedback": "Whatever the outcome, note what was advised and the agreed follow-up.", "quote": "Whatever the outcome, note what was advised and the agreed follow-up on the patient record.", "tags": ["record"]}, {"id": "g-11-q1", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "What must you always do with an NHS voucher patient?", "options": ["Offer them every upgrade available", "Explain what the voucher covers", "Ask them to pay a deposit first", "Avoid the subject of coatings"], "answer": 1, "feedback": "Always explain what the voucher covers, so the patient knows what they are getting.", "quote": "Always explain what the voucher covers, so the patient knows what they are getting.", "tags": ["nhs-voucher"]}, {"id": "g-11-q2", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "A patient says their glasses are only for reading. What is a good first question?", "options": ["Why not get varifocals instead?", "What else do you look at in a day?", "Do you do much driving at night?", "Is that definitely your final choice?"], "answer": 1, "feedback": "Ask what else they do. If they only read, say a reading pair is just what they need.", "quote": "Ask what else they do: \"What else do you look at in a day, a phone, a computer, the TV?\"", "tags": ["reading"]}, {"id": "g-11-q3", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "A patient says, \"My old ones were fine.\" Which image helps explain a fresh lens?", "options": ["A tyre wears even when the car runs fine", "Lenses expire after a fixed twelve months of use", "Old lenses can slowly harm the eyes over time", "New lenses are always sharper than old ones"], "answer": 0, "feedback": "Never make false health claims. The honest point is that coating wears over time even when everything seems fine.", "quote": "Lenses are coated, and the coating wears over time like a tyre wears even when the car runs fine.", "tags": ["old-glasses"]}, {"id": "g-11-q4", "lesson": "g-11", "level": 2, "type": "tf", "stem": "A patient who asks only for what the voucher covers should be pushed to consider extras more than once.", "options": ["True", "False"], "answer": 1, "feedback": "Mention extras once and let them decide. Do not push extras on a patient who wants only what is covered.", "quote": "Do not push extras on a patient who has told you they only want what is covered.", "tags": ["pressure"]}, {"id": "g-11-q5", "lesson": "g-11", "level": 2, "type": "tf", "stem": "Reading glasses are not harmful, and you should never suggest they are.", "options": ["True", "False"], "answer": 0, "feedback": "A patient who wants a reading pair is not making a mistake. Never make them feel foolish.", "quote": "Do not tell them reading glasses are harmful. They are not.", "tags": ["reading"]}, {"id": "g-11-q6", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "The prescription has not changed and the patient says their old ones were fine. What can you say?", "options": ["Great news, your eyes are healthy", "Then your old lenses must be perfect", "Old lenses like these are a risk", "You really should replace them anyway"], "answer": 0, "feedback": "Say your eyes are healthy and explain what a fresh lens would do for comfort. If they still say no, accept it.", "quote": "If the prescription has not changed, say, \"Great news, your eyes are healthy,\" and explain what a fresh lens would do for comfort.", "tags": ["old-glasses"]}, {"id": "g-11-q7", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "A reading-only patient also uses a computer and phone daily. What can you mention?", "options": ["That reading lenses suit one distance", "That reading glasses will damage their eyes", "That a varifocal is the only sensible choice", "That they need new lenses every year"], "answer": 0, "feedback": "Reading glasses are set for one distance. Whether another lens is right is for the optometrist; if unsure, ask a registrant.", "quote": "you can mention that reading glasses are set for one distance", "tags": ["reading"]}, {"id": "g-11-q8", "lesson": "g-11", "level": 2, "type": "mcq", "stem": "A patient wants only what the voucher covers. What is a good way to start?", "options": ["Show the covered frames first, positively", "Show the dearest frames first for comparison", "Mention extras at each stage in case", "Say the covered frames are rather limited"], "answer": 0, "feedback": "Show the covered frames first and be positive about them. Never suggest the voucher pair is second-rate.", "quote": "With voucher patients, show the covered frames first and be positive about them.", "tags": ["nhs-voucher"]}, {"id": "g-12-q1", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "How should you explain a coating?", "options": ["By its full technical name", "By what the patient will notice", "By quoting the supplier brochure", "By showing the price list first"], "answer": 1, "feedback": "Explain a coating through what the patient notices, such as less glare or easier cleaning.", "quote": "Explain a coating through what the patient notices, not through what it is called.", "tags": ["coatings"]}, {"id": "g-12-q2", "lesson": "g-12", "level": 2, "type": "tf", "stem": "You may say a blue light filter protects the eyes from disease.", "options": ["True", "False"], "answer": 1, "feedback": "Blue light filters are about comfort only. Never make an eye-health claim about them.", "quote": "Blue light filters are about comfort only. Never make an eye-health claim about them.", "tags": ["claims"]}, {"id": "g-12-q3", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "The optometrist did not advise a varifocal and the patient has a single vision prescription. What do you do?", "options": ["Offer a varifocal as an upgrade", "Do not offer it", "Say varifocals suit everyone", "Ask the patient to decide"], "answer": 1, "feedback": "If the optometrist did not advise a varifocal, do not offer it. If unsure, check the record or ask a registrant.", "quote": "If the optometrist did not advise a varifocal, do not offer it.", "tags": ["varifocals"]}, {"id": "g-12-q4", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "What is honest to say about adapting to a first varifocal?", "options": ["You will not notice any difference at all", "Most people need a few days to adjust", "It takes about a year to settle in properly", "You will never need to come back for a check"], "answer": 1, "feedback": "Be honest about the adjustment, show where to look, and invite them back if anything feels odd.", "quote": "Most people take a few days to get used to them.", "tags": ["adaptation"]}, {"id": "g-12-q5", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "A patient asks what happens if they leave the anti-reflective coating off. What do you say?", "options": ["They keep the glare and smudges", "Their eyes will be put at risk", "Nothing will change at all", "The lenses will stop working well"], "answer": 0, "feedback": "Answer honestly and do not scare them. If they still do not want it, accept that.", "quote": "they keep the glare, smudges and reflections. Do not scare them.", "tags": ["honesty"]}, {"id": "g-12-q6", "lesson": "g-12", "level": 2, "type": "tf", "stem": "Light-reactive lenses barely darken in a car.", "options": ["True", "False"], "answer": 0, "feedback": "That is why a polarised second pair is useful for driving.", "quote": "They barely darken in a car.", "tags": ["sun"]}, {"id": "g-12-q7", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "A patient says, \"I do not need varifocals.\" What do you do first?", "options": ["Find out why they feel that", "Explain the lens in technical terms", "Offer a cheaper design at once", "Tell them they will regret it"], "answer": 0, "feedback": "They may be using two pairs already, or be reluctant about the look or the adjustment.", "quote": "If the patient says \"I do not need them\", find out why.", "tags": ["varifocals"]}, {"id": "g-12-q8", "lesson": "g-12", "level": 2, "type": "mcq", "stem": "A patient mentions difficulty with their previous varifocal pair. What do you do?", "options": ["Fetch a registrant", "Reassure them it will be fine", "Offer a different coating instead", "Suggest they just persevere"], "answer": 0, "feedback": "If the patient raises a clinical worry, such as difficulty with a previous pair, fetch a registrant.", "quote": "If the patient raises a clinical worry, such as difficulty with a previous pair, fetch a registrant.", "tags": ["clinical"]}, {"id": "g-13-q1", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "Which closing sounds like the next step rather than an option?", "options": ["Would you like to go ahead with this one?", "Are you alright with that? Great, come this way.", "Do you want a little time to think about it?", "I suppose that is about all we can really do here."], "answer": 1, "feedback": "A walk-on close is flat and friendly, with the voice falling, and you keep moving.", "quote": "Do this: \"Are you alright with that? Great, come this way.\"", "tags": ["walk-on-close"]}, {"id": "g-13-q2", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "The patient hesitates and asks a question halfway through your close. What do you do?", "options": ["Carry on with the walk-on", "Stop the walk-on and answer it", "Ask the closing question again, louder", "End the conversation politely"], "answer": 1, "feedback": "Answer the question, then close again once.", "quote": "If the patient hesitates, goes quiet or asks a question, stop the walk-on and answer it.", "tags": ["hesitation"]}, {"id": "g-13-q3", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "Which is the better way to book a collection?", "options": ["When would suit you?", "Thursday or Friday?", "Just pop in sometime next week", "We will give you a call"], "answer": 1, "feedback": "Two choices are easier than an open question.", "quote": "Offer two choices of day: \"Thursday or Friday?\"", "tags": ["booking"]}, {"id": "g-13-q4", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "Besides the collection date, what else should you mention before the patient leaves?", "options": ["The recall for their next eye test", "The cost of the frame once more", "The practice's other branches", "A lens they did not choose"], "answer": 0, "feedback": "Say the recall line every time so they know when to come back for their next eye test.", "quote": "Mention the recall: when they should come back for their next eye test.", "tags": ["recall"]}, {"id": "g-13-q5", "lesson": "g-13", "level": 2, "type": "tf", "stem": "You may close before the price has been given if the patient seems keen.", "options": ["True", "False"], "answer": 1, "feedback": "The patient must have heard the price before anything is ordered.", "quote": "Do not close before the price has been given.", "tags": ["price-first"]}, {"id": "g-13-q6", "lesson": "g-13", "level": 2, "type": "tf", "stem": "The walk-on close is said with the voice falling at the end.", "options": ["True", "False"], "answer": 0, "feedback": "A falling voice makes it sound like the next step, not a question.", "quote": "The voice falls at the end, and you keep moving.", "tags": ["walk-on-close"]}, {"id": "g-13-q7", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "The patient says yes. What do you do next?", "options": ["Say how long it takes, then offer two days", "Let them go and ring them in a week", "Ask them to pick any day that suits", "Take payment outside the usual process"], "answer": 0, "feedback": "Give them a next step straight away, write it in the diary and repeat it back.", "quote": "After the yes, give them a next step straight away.", "tags": ["booking"]}, {"id": "g-13-q8", "lesson": "g-13", "level": 2, "type": "mcq", "stem": "What should the dispense record show?", "options": ["The options chosen and any declined extras", "Only the frame and the final price paid", "Only the frame that was chosen", "Whether the patient was in a hurry"], "answer": 0, "feedback": "Recording declined extras, such as a second pair, lets the next visit pick up.", "quote": "Make sure the dispense record shows the options chosen and any declined extras, such as a second pair, so the next visit can pick up.", "tags": ["record"]}, {"id": "g-14-q1", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "Who must lead or supervise the dispensing of glasses to a child under 16?", "options": ["Any trained dispenser", "A registrant", "The child's parent", "The practice manager"], "answer": 1, "feedback": "Under 16s must be dispensed by or under the supervision of a registrant. That is the law.", "quote": "Children under 16 must be dispensed by or under the supervision of a registrant", "tags": ["law"]}, {"id": "g-14-q2", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "Who do you talk to about cost and decisions when dispensing for a child?", "options": ["The child alone", "The parent or guardian", "Neither; the registrant does it all", "Whoever speaks first"], "answer": 1, "feedback": "Talk to the parent about decisions, cost and care, and include the child in choosing the frame.", "quote": "Talk to the parent or guardian about decisions, cost and care.", "tags": ["parent"]}, {"id": "g-14-q3", "lesson": "g-14", "level": 2, "type": "tf", "stem": "Warning a parent about their child's future eyesight is a good way to help them decide on a spare pair.", "options": ["True", "False"], "answer": 1, "feedback": "Never use fear with children or with their parents. Explain a spare pair as normal advice.", "quote": "Never use fear with children or with their parents.", "tags": ["ethics"]}, {"id": "g-14-q4", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "A parent asks whether their child's prescription will change. What do you do?", "options": ["Reassure them it will not change", "Say it probably will change", "Say the optometrist will be able to explain", "Change the subject politely"], "answer": 2, "feedback": "This is a clinical question. Do not answer it yourself.", "quote": "This is a clinical question. Do not answer it yourself. Say the optometrist can explain.", "tags": ["clinical-boundary"]}, {"id": "g-14-q5", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "A parent asks, \"Will they break?\" What helps most?", "options": ["Show tough materials and a flexing frame", "Promise they will last for several years", "Tell them children are always very careless", "Offer a cheaper frame instead"], "answer": 0, "feedback": "Show durable materials and flexible frames. Showing how a frame bends is something parents remember.", "quote": "Show durable materials and flexible frames.", "tags": ["durability"]}, {"id": "g-14-q6", "lesson": "g-14", "level": 2, "type": "tf", "stem": "A spare pair is mentioned to parents as normal advice, because glasses get lost and broken.", "options": ["True", "False"], "answer": 0, "feedback": "A child without glasses may struggle at school.", "quote": "Mention a spare pa

ir as normal advice, because glasses get lost and broken", "tags": ["spare"]}, {"id": "g-14-q7", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "You have a concern about a child's welfare during the appointment. What do you do?", "options": ["Tell the safeguarding lead", "Question the child gently yourself", "Ask the parent to explain", "Wait to see whether it happens again"], "answer": 0, "feedback": "Follow the practice process. Do not question the child about it.", "quote": "If you have any concern about a child's welfare, tell the practice's safeguarding lead and follow the practice process.", "tags": ["safeguarding"]}, {"id": "g-14-q8", "lesson": "g-14", "level": 2, "type": "mcq", "stem": "You are not trained to measure a child. What do you do?", "options": ["Say so and ask for help", "Measure as you would for an adult", "Estimate from the frame size", "Let the parent measure it"], "answer": 0, "feedback": "The registrant or a trained colleague checks the fit and measurements.", "quote": "If you are not trained to measure a child, say so and ask.", "tags": ["fit"]}, {"id": "g-15-q1", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "How is each behaviour in the sales rubric scored?", "options": ["Pass or fail, by one observer", "0, 1 or 2 by two observers, compared", "1 to 10, by the patient afterwards", "A single total only, set by the coach"], "answer": 1, "feedback": "Two observers score independently, then compare. The maximum is 20.", "quote": "Two observers score each dispense independently, 0, 1 or 2 per behaviour, then compare.", "tags": ["scoring"]}, {"id": "g-15-q2", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "Which description earns a 2 for confident price?", "options": ["Said the price quickly, with an apology", "Said the whole-pair price plainly, then stopped", "Gave the lens price only", "Offered a discount before saying the price"], "answer": 1, "feedback": "A 2 means done clearly, as taught in this course.", "quote": "Confident price: said the whole-pair price plainly and then stopped talking.", "tags": ["confident-price"]}, {"id": "g-15-q3", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "A patient raised an objection and the dispenser quoted a discount straight away. Which behaviour is hurt?", "options": ["Open question asked at the start", "Recall explained at the end of the visit", "Objection acknowledged then answered", "Three options, lens before price"], "answer": 2, "feedback": "The objection should be heard, clarified and then answered, not met with a discount.", "quote": "Objection acknowledged then answered: heard the objection, asked what was behind it, then answered.", "tags": ["objection"]}, {"id": "g-15-q4", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "The dispenser did not push a second pair but recorded that the patient declined. What does the rubric say counts?", "options": ["Nothing; it has to be sold", "Offered, or recorded as declined", "Only a second pair that is sold", "Only if the patient asks about it"], "answer": 1, "feedback": "The behaviour is scored on raising it, or recording a decline.", "quote": "Second pair and sun raised: offered, or recorded as declined.", "tags": ["second-pair"]}, {"id": "g-15-q5", "lesson": "g-15", "level": 2, "type": "tf", "stem": "Saying \"let me check with the optometrist\" when unsure lowers your score.", "options": ["True", "False"], "answer": 1, "feedback": "Asking when unsure is behaviour 10. It is a strength, not a weakness.", "quote": "Do not skip \"asked when unsure\" because you think it looks weak. It is a strength.", "tags": ["ask-when-unsure"]}, {"id": "g-15-q6", "lesson": "g-15", "level": 2, "type": "tf", "stem": "The maximum score for one observed dispense is 20.", "options": ["True", "False"], "answer": 0, "feedback": "Ten behaviours, each scored 0, 1 or 2.", "quote": "The maximum is 20.", "tags": ["scoring"]}, {"id": "g-15-q7", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "The two observers differ by more than one point on a behaviour. What happens?", "options": ["They discuss and agree a score", "The higher of the two scores is used", "The dispenser chooses between them", "The lower of the two scores is used"], "answer": 0, "feedback": "They use the evidence of what was said, then write one thing to keep and one to change.", "quote": "Where they differ by more than one point on a behaviour, they discuss and agree a score, using the evidence of what was said.", "tags": ["scoring"]}, {"id": "g-15-q8", "lesson": "g-15", "level": 2, "type": "mcq", "stem": "A patient said no but felt heard and respected. How might the dispense score?", "options": ["Still highly", "Low, as there was no sale", "Zero for the close", "It cannot be scored"], "answer": 0, "feedback": "It is scored on what the patient experienced, not on repeating words or making a sale.", "quote": "A dispense where the patient said no but was heard and respected can still score highly.", "tags": ["scoring"]}], "n": 20, "pass_": 0.8};</script><script src="assets/app.js"></script></body></html>

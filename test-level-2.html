pen": false, "visible": true, "status": "draft - not for learners", "ver": "49c7842", "n": 8, "fl": true}, "h-02": {"title": "Who suits a varifocal, and first-time wearers", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "51856ab", "n": 8, "fl": true}, "h-03": {"title": "Our varifocal ladder: Visio Digital to XR Pro", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "0e20cbf", "n": 8, "fl": true}, "h-04": {"title": "Personalisation: the four levels", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "f46287f", "n": 8, "fl": true}, "h-05": {"title": "Fitting heights and minimum heights", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "6338935", "n": 8, "fl": true}, "h-06": {"title": "Choosing a frame for a varifocal", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "88721bf", "n": 8, "fl": true}, "h-07": {"title": "Measuring for a varifocal: monocular PD and heights", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "712464a", "n": 8, "fl": true}, "h-08": {"title": "Varifocal non-tolerance: causes and checks", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "f03efcc", "n": 8, "fl": true}, "h-09": {"title": "Selling the varifocal: show the difference", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "79b251e", "n": 8, "fl": true}, "h-10": {"title": "Checking in a varifocal: markings and engravings", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "7bc46e0", "n": 8, "fl": true}, "h-11": {"title": "The 90-day check: what amazing looks like", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "c26f7ce", "n": 8, "fl": true}}, "page": "test", "id": "T2", "qs": [{"id": "b-02-q1", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "What is a stock lens?", "options": ["A lens ground to the exact prescription for one patient at the lab after the order is placed", "A lens made in advance in set powers and cut to shape for the frame", "A lens with a photochromic tint that darkens", "A lens only supplied for children"], "answer": 1, "feedback": "Stock lenses are pre-made in set powers. Surfaced lenses are ground to the prescription.", "quote": "A stock lens is made in advance by the manufacturer in a range of powers and then cut to shape for the frame.", "tags": ["stock"]}, {"id": "b-02-q2", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "What does HMC stand for in our single vision lens, and what does it give?", "options": ["High magnification curve: a thinner, lighter lens for strong powers and large frames", "Hydrophobic mirror coat: a mirrored finish that repels water", "Hard multi-coat: scratch-resistant hard coating plus anti-reflection", "Home made coating: a coating applied in the practice"], "answer": 2, "feedback": "HMC is hard multi-coat: scratch resistance plus anti-reflection.", "quote": "HMC means a scratch-resistant hard coating and an anti-reflection multi-coat.", "tags": ["hmc"]}, {"id": "b-02-q3", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "Ms R asks why a basic pair is cheaper than an Eyezen pair. She does not use screens much. What is the best answer?", "options": ["The basic lens is simply a lower quality product than Eyezen", "Basic lenses do not last as long as the premium ones do once worn every day", "Eyezen adds a design for heavy screen work that she does not need", "Eyezen is only designed for patients who are over fifty"], "answer": 2, "feedback": "Be honest: the basic lens is good. Premium designs add something for a specific need.", "quote": "Third: the premium range adds special designs for particular jobs, such as heavy screen work, and she has not mentioned that need.", "tags": ["price"]}, {"id": "b-02-q4", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "The price on the till looks wrong for a single vision pair. What do you do?", "options": ["Override it in the system to match the list", "Ask, because you never override a price", "Change the VAT band to fix the total", "Discount it by hand at the till"], "answer": 1, "feedback": "You never override a price. If it looks wrong, you ask.", "quote": "if a price looks wrong, ask.", "tags": ["price"]}, {"id": "b-02-q5", "lesson": "b-02", "level": 2, "type": "tf", "stem": "True or false: a basic single vision lens on our list is a hard multi-coated lens.", "options": ["True", "False"], "answer": 0, "feedback": "Yes, it has a scratch-resistant hard coating and an anti-reflection multi-coat.", "quote": "Single vision on our list is a hard multi-coated lens (HMC).", "tags": ["hmc"]}, {"id": "b-02-q6", "lesson": "b-02", "level": 2, "type": "tf", "stem": "True or false: you can promise a ready date as soon as the patient chooses a lens, whether it is stock or surfaced.", "options": ["True", "False"], "answer": 1, "feedback": "Surfaced lenses depend on the lab, so you wait until you know which type it is.", "quote": "Do not promise a lens will be ready by a date until you know whether it is a stock or a surfaced lens.", "tags": ["timing"]}, {"id": "b-02-q7", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "Which patient is a good match for a basic single vision lens?", "options": ["A patient with heavy daily screen use and tired eyes by the afternoon, who wants all-day comfort", "A patient who mainly wants a lens built for night-time driving", "A patient who needs reading and distance in the same pair", "A patient who needs one distance and has no special screen or driving demands"], "answer": 3, "feedback": "Single vision is right for one distance with no special demands. Screens or driving point to premium designs.", "quote": "When single vision is the right answer: for a patient who needs one distance", "tags": ["choose"]}, {"id": "b-02-q8", "lesson": "b-02", "level": 2, "type": "mcq", "stem": "Why might a strong prescription not be available as a stock lens?", "options": ["Stock lenses cannot be cut down to fit a smaller frame", "Stock lenses are only ever made in plus powers", "Strong powers need a tint that stock lenses lack", "Stock comes in set steps, so strong prescriptions need surfacing"], "answer": 3, "feedback": "Stock lenses come in set steps. The strongest and most unusual prescriptions are surfaced.", "quote": "so the strongest and most unusual prescriptions will not be available in stock.", "tags": ["stock"]}, {"id": "b-03-q1", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "Mr J has tired eyes after nine hours on two screens and a mild prescription. How do you describe Eyezen?", "options": ["It prevents eye damage from long days on screens", "A single vision lens with a design for devices, for comfort", "A varifocal built for office workers", "A lens that blocks all blue light from screens and keeps the eyes healthy"], "answer": 1, "feedback": "Eyezen is described as comfort support for device users, with no health claims.", "quote": "It is for comfort, with no promise about eye health.", "tags": ["eyezen"]}, {"id": "b-03-q2", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "Which of these must be eyecoded?", "options": ["Only Eyezen Boost", "Both Eyezen Start and Eyezen Boost", "Neither design, as they are stock lenses", "Only the Transitions versions"], "answer": 1, "feedback": "Both designs must be eyecoded, using VisiOffice measurements.", "quote": "Both designs must be eyecoded.", "tags": ["eyecode"]}, {"id": "b-03-q3", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "Which patient description fits Eyezen Boost better than Eyezen Start?", "options": ["Wants a spare pair for gardening and walks, no screens, and never uses a phone", "Reports tired eyes with close work on a long device day", "Needs distance vision only, mainly for night driving", "Is a younger wearer whose near focusing is comfortable"], "answer": 1, "feedback": "Boost adds more help for close work, so it suits those who report tired eyes or difficulty at close range.", "quote": "Eyezen Boost adds more help for close work and suits a patient who reports tired eyes", "tags": ["choose"]}, {"id": "b-03-q4", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "Mrs W, 52, on screens all day, has a prescription with a near add. What is the best step?", "options": ["Sell Eyezen Boost, since she is on screens all day anyway", "Ask a registrant, as a varifocal or office lens may suit better", "Tell her screens at her age are damaging her eyes", "Skip the VisiOffice measurements to save her some time"], "answer": 1, "feedback": "A near add changes the conversation. Ask a registrant, and remember that Eyezen is single vision.", "quote": "Do not use Eyezen as a substitute for a reading or varifocal prescription. If the patient has a near add, ask a registrant.", "tags": ["add"]}, {"id": "b-03-q5", "lesson": "b-03", "level": 2, "type": "tf", "stem": "True or false: it is our house rule that every Essilor patient has VisiOffice measurements.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Every Essilor patient is measured on VisiOffice, which is what eyecoding uses.", "quote": "It is our house rule that every Essilor patient has VisiOffice measurements.", "tags": ["eyecode"]}, {"id": "b-03-q6", "lesson": "b-03", "level": 2, "type": "tf", "stem": "True or false: you may press SEND on the Essilor order yourself once it is entered.", "options": ["True", "False"], "answer": 1, "feedback": "Never. Only a trained person sends the order.", "quote": "Never press SEND yourself; only a trained person sends the order.", "tags": ["order"]}, {"id": "b-03-q7", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "A patient asks whether blue light from screens damages the eyes. What do you say?", "options": ["Yes, blue light damages eyes, and Eyezen blocks it", "Eyezen is about comfort, and I cannot make a health claim", "Yes, but only for people who are over forty", "No, it is perfectly safe, so you do not need Eyezen"], "answer": 1, "feedback": "Do not say blue light causes eye damage. Eyezen is a comfort conversation.", "quote": "Do not say blue light causes eye damage. Eyezen is a comfort conversation.", "tags": ["claims"]}, {"id": "b-03-q8", "lesson": "b-03", "level": 2, "type": "mcq", "stem": "VisiOffice cannot be done for a patient. What do you do?", "options": ["Skip the measurements and leave the Eyecode tick off on the order", "Press on and measure the PD by eye instead", "Note why on the dispense and use the fallback card averages", "Delay the order until a registrant is free"], "answer": 2, "feedback": "Note why on the dispense and use the average values in the fallback card.", "quote": "If VisiOffice cannot be done, note why on the dispense and use the average values in the fallback card.", "tags": ["eyecode"]}, {"id": "b-04-q1", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "What is the E-reader on our price list?", "options": ["Varilux Digitime", "Varilux Immersia MID", "Eyezen Boost design", "Varilux Road Pilot design"], "answer": 1, "feedback": "E-reader means Varilux Immersia MID. Staff do not order Digitime.", "quote": "When you order, you order Immersia MID, not Digitime; we do not order Digitime.", "tags": ["product"]}, {"id": "b-04-q2", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "Mrs H has neck ache using varifocals at her screen all day. What do you offer?", "options": ["A thicker index lens in the same varifocal design", "A bifocal worn for driving to work", "An office lens as a second pair for the desk", "Nothing; she must get used to it"], "answer": 2, "feedback": "An office lens gives a wide view at desk distance. It is a second pair, with the varifocals kept for everything else.", "quote": "It is also a good second pair for a varifocal wearer whose neck aches.", "tags": ["choose"]}, {"id": "b-04-q3", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "A patient asks if their new office pair can be worn for driving. What is the correct answer?", "options": ["Yes, it covers all distances comfortably", "No, it is not a replacement for distance vision", "Yes, provided it has an anti-reflection coating", "Only in the evening, when there is less traffic"], "answer": 1, "feedback": "The far distance is limited in an office lens, so it is not for driving, stairs or walking about.", "quote": "It is not a replacement for distance vision.", "tags": ["limits"]}, {"id": "b-04-q4", "lesson": "b-04", "level": 2, "type": "tf", "stem": "True or false: a patient who needs far vision at work, such as a lecturer looking to the back of a hall, should simply be sold an office lens.", "options": ["True", "False"], "answer": 1, "feedback": "If far vision is needed at work, an office lens may not be right. Ask a registrant.", "quote": "A person who needs far vision at work (for example, a lecturer looking to the back of a hall) may need a different answer; ask a registrant.", "tags": ["limits"]}, {"id": "b-04-q5", "lesson": "b-04", "level": 2, "type": "tf", "stem": "True or false: when you order the office lens, you order Immersia MID and not Digitime.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. We do not order Digitime.", "quote": "When you order, you order Immersia MID, not Digitime; we do not order Digitime.", "tags": ["product"]}, {"id": "b-04-q6", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "Which patient is the best match for an office lens?", "options": ["A courier who drives all day and has a near add", "A patient who wants one pair for walking and stairs", "A musician reading from a stand, who has a near add", "A lecturer who must see clearly to the back of a hall"], "answer": 2, "feedback": "Office lenses suit long periods at a desk, a screen, a stand or a bench for someone with a near add.", "quote": "anyone with a near add who spends long periods at a desk or screen, or reading", "tags": ["choose"]}, {"id": "b-04-q7", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "What extra question do you ask when selling an office lens?", "options": ["Whether they would like a tint added", "How far away their screen is, and write it down", "Whether they drive to work each day", "How many hours they sleep each night"], "answer": 1, "feedback": "The working distance matters for the measurements, so ask how far away the screen is and record it.", "quote": "Measurements for the working distance matter, so ask the patient how far away their screen is and write it down.", "tags": ["measure"]}, {"id": "b-04-q8", "lesson": "b-04", "level": 2, "type": "mcq", "stem": "A patient wants the office lens with Transitions. What do you do?", "options": ["Promise it, because every band has a Transitions version", "Order it first and check the band when the lab replies", "Check price-it first; not every band offers Transitions", "Tell the patient Transitions is never offered with this lens"], "answer": 2, "feedback": "Not every Transitions combination is offered, so check price-it before promising.", "quote": "Do not promise a Transitions option without checking that the band offers it.", "tags": ["price"]}, {"id": "b-05-q1", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "What is Road Pilot?", "options": ["A single vision lens made for the dashboard distance only", "A varifocal made for people who drive a lot", "A polarised sun lens designed for daytime driving glare", "A bifocal designed for professional drivers"], "answer": 1, "feedback": "Road Pilot is a progressive (varifocal) with widened distance and middle zones, so the wearer needs a near add.", "quote": "is a progressive lens from Essilor made for people who drive a lot.", "tags": ["product"]}, {"id": "b-05-q2", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "A patient asks whether the anti-reflection coating will stop headlight glare at night. What do you say?", "options": ["Yes, it removes all glare from oncoming headlights", "It may help, but no lens removes glare completely", "Glare never has anything to do with the eyes themselves", "Only Transitions lenses will reduce glare at night"], "answer": 1, "feedback": "Coatings help with reflections and comfort. Promising that glare disappears would be untrue.", "quote": "It cannot remove the glare from oncoming headlights, and it is wrong to say it will.", "tags": ["claims"]}, {"id": "b-05-q3", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "Mrs B says her night driving has got worse. What is the best action?", "options": ["Sell a tinted lens, which will cut the glare down at night", "Tell the optometrist, as it may not be a lens matter", "Tell her she should not drive at night until it is checked", "Promise her that a new coating will fix the problem"], "answer": 1, "feedback": "A new or worsening night-vision complaint may have a medical cause. You never diagnose; you pass it on.", "quote": "A new complaint of glare or poor night vision is something to tell the optometrist about, because it may have a medical cause.", "tags": ["escalate"]}, {"id": "b-05-q4", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "A single vision wearer needs glasses only for driving. Which is usually the simpler and wider answer?", "options": ["Road Pilot, to widen the road view", "A single vision lens for distance", "An office lens for the dashboard", "A bifocal with a line for the mirrors"], "answer": 1, "feedback": "Road Pilot is a varifocal and needs a near add. Single vision is simpler for distance-only needs.", "quote": "a single vision wearer who only needs distance for driving (single vision is simpler and wider)", "tags": ["choose"]}, {"id": "b-05-q5", "lesson": "b-05", "level": 2, "type": "tf", "stem": "True or false: a patient must have a near add to wear Road Pilot.", "options": ["True", "False"], "answer": 0, "feedback": "Road Pilot is a varifocal, so it carries the same adaptation as any progressive and needs a near add.", "quote": "It is a varifocal, so it carries the same adaptation as any progressive and the patient must have a near add.", "tags": ["product"]}, {"id": "b-05-q6", "lesson": "b-05", "level": 2, "type": "tf", "stem": "True or false: a tinted lens is a good choice for night driving.", "options": ["True", "False"], "answer": 1, "feedback": "Never recommend a tint for night driving.", "quote": "Do not recommend a tinted lens for night driving.", "tags": ["claims"]}, {"id": "b-05-q7", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "Why do Transitions lenses stay fairly light inside a car?", "options": ["They only react to darkness, so daylight leaves them clear", "The anti-reflection coating cancels the tint inside a car", "Car windscreens block much of the UV they react to", "They need heat from the sun, not light, to darken"], "answer": 2, "feedback": "Photochromic lenses react to UV, and windscreens block much of it.", "quote": "photochromic lenses (b-12) react to UV, and car windscreens block much of it, so they stay lighter in the car.", "tags": ["sun"]}, {"id": "b-05-q8", "lesson": "b-05", "level": 2, "type": "mcq", "stem": "What is the usual answer for daytime driving glare?", "options": ["A tinted lens worn for night driving as well", "A clear lens with no coating at all", "A polarised sun pair", "A thicker index lens in the usual frame"], "answer": 2, "feedback": "A polarised sun pair is the usual answer for daytime driving glare.", "quote": "A polarised sun pair (b-13) is the usual answer for daytime driving glare.", "tags": ["sun"]}, {"id": "b-08-q1", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "Mrs Q says her last glasses were like jam-jar bottoms. What should you do first?", "options": ["Quote the thinnest material available, then the price", "Ask what bothered her most about the old pair", "Tell her that a strong prescription is just unlucky", "Show her the price list before anything else"], "answer": 1, "feedback": "Find the real worry first, then choose the lever that answers it.", "quote": "You do not start with the word \"index\".", "tags": ["needs"]}, {"id": "b-08-q2", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "Which lever should you offer first because it costs the least?", "options": ["The frame size and shape", "The anti-reflection coating", "The thinnest material on the list", "A second pair of glasses"], "answer": 0, "feedback": "A smaller, rounder frame shows less thickness and often costs less than moving up an index.", "quote": "Start with the lever that costs the least: the frame.", "tags": ["levers"]}, {"id": "b-08-q3", "lesson": "b-08", "level": 2, "type": "tf", "stem": "True or false: a thinner lens is always a lighter lens.", "options": ["True", "False"], "answer": 1, "feedback": "Some higher index materials are denser, so thin does not always mean light.", "quote": "Thin does not always mean light.", "tags": ["weight"]}, {"id": "b-08-q4", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "A patient with a strong prescription asks, \"Will the edge disappear?\" What is the honest answer?", "options": ["Yes, with the thinnest lens it vanishes completely", "Much neater, but still thicker than a mild one", "No, nothing can be done to improve it at all", "Only polycarbonate can make an edge disappear"], "answer": 1, "feedback": "Honest limits build trust; over-promising loses it.", "quote": "A strong prescription will always be thicker at the edge than a mild one, even in the thinnest material.", "tags": ["honesty"]}, {"id": "b-08-q5", "lesson": "b-08", "level": 2, "type": "tf", "stem": "True or false: a strong prescription will still be thicker at the edge than a mild one, even in the thinnest material.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Say so honestly rather than promising the edge will vanish.", "quote": "A strong prescription will always be thicker at the edge than a mild one, even in the thinnest material.", "tags": ["honesty"]}, {"id": "b-08-q6", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "A patient says her glasses \"slide down my nose and leave marks\". Which of the three concerns is this?", "options": ["How it feels", "How it looks", "How it performs", "How it is priced"], "answer": 0, "feedback": "Weight and fit are about how it feels. Looks and performance are the other two concerns.", "quote": "How it feels.", "tags": ["needs"]}, {"id": "b-08-q7", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "How should you set out the options once you know what the patient cares about?", "options": ["Advise what you would choose, then work down to budget", "Start with the cheapest option and work upwards", "Ask their budget first and offer nothing above that figure", "Show every option on the list at once and let them pick"], "answer": 0, "feedback": "The Dispensing Conversation starts with what you would advise, not with the cheapest option.", "quote": "The Dispensing Conversation teaches us to say what we would advise first and then work down to the patient's budget, not to start with the cheapest.", "tags": ["conversation"]}, {"id": "b-08-q8", "lesson": "b-08", "level": 2, "type": "mcq", "stem": "A patient cares most about weight. What do you do?", "options": ["Promise that the thinner lens is bound to be lighter", "Check the product details before promising weight", "Say that every high-index lens is lighter than standard", "Tell them that lens weight cannot be changed at all"], "answer": 1, "feedback": "Some higher index materials are denser, so check before promising.", "quote": "If a patient cares most about weight, ask a colleague or check the product information before promising.", "tags": ["weight"]}, {"id": "b-11-q1", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "What does an anti-reflection coating do for the patient?", "options": ["Makes the lens completely scratch-proof for life", "Cuts reflections, so the eyes can be seen", "Makes the lens thinner at the edge and lighter", "Blocks all the blue light coming from screens"], "answer": 1, "feedback": "Anti-reflection reduces reflections, ghost images and glare, and lets others see the wearer's eyes.", "quote": "An anti-reflection coating reduces this, so the lens looks clearer and the wearer's eyes can be seen.", "tags": ["coating"]}, {"id": "b-11-q2", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "A patient asks if the coating makes the glasses scratch-proof. What is the honest answer?", "options": ["Yes, it makes the glasses completely scratch-proof", "More resistant, but no lens is scratch-proof", "No, coatings do nothing at all against scratches", "Only the Transitions lenses are ever scratch-proof"], "answer": 1, "feedback": "Say \"more resistant\", never \"scratch-proof\".", "quote": "\"Scratch-proof.\" No lens is. Say \"more resistant to everyday scratches\".", "tags": ["claims"]}, {"id": "b-11-q3", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "What is Crizal?", "options": ["Essilor's family of coatings", "A lens material that is thinner than 1.74", "A frame brand sold by Essilor", "A tint that darkens in sunlight"], "answer": 0, "feedback": "Crizal is Essilor's coating range.", "quote": "Crizal** is Essilor's family of coatings.", "tags": ["crizal"]}, {"id": "b-11-q4", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "A patient leaves her glasses on the car dashboard in summer. What should you warn her about?", "options": ["Nothing; coatings are made to withstand it", "Heat can damage a coating", "UV will make the coating stronger", "The coating will turn the lenses darker"], "answer": 1, "feedback": "Heat can damage coatings. Advise a case and a cool place.", "quote": "Heat, such as leaving glasses on a car dashboard, can damage a coating.", "tags": ["care"]}, {"id": "b-11-q5", "lesson": "b-11", "level": 2, "type": "tf", "stem": "True or false: the coating comes with the lens on our list and is not usually sold as a separate extra.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. For anything not on the list, ask in practice.", "quote": "The coating comes with the lens on our list; you do not usually sell it as a separate extra.", "tags": ["price"]}, {"id": "b-11-q6", "lesson": "b-11", "level": 2, "type": "tf", "stem": "True or false: you should tell a patient the coating protects their eyes from UV.", "options": ["True", "False"], "answer": 1, "feedback": "The honest statement is that it reduces UV reflected from the back surface of the lens. Keep to comfort.", "quote": "The honest statement is that it reduces UV reflected from the back surface of the lens", "tags": ["claims"]}, {"id": "b-11-q7", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "How should a patient clean their lenses?", "options": ["A dry tissue, to take the dust off first", "The corner of a shirt, which is soft enough", "Hot water and washing-up liquid on a kitchen cloth", "Lukewarm water, lens spray and a clean microfibre cloth"], "answer": 3, "feedback": "Avoid wiping dry dust off with clothing or tissues, which can scratch the coating.", "quote": "Wash the lenses with lukewarm water, use lens spray and a clean microfibre cloth", "tags": ["care"]}, {"id": "b-11-q8", "lesson": "b-11", "level": 2, "type": "mcq", "stem": "A patient complains of reflections on video calls and smears he cannot clean. Which coating jobs answer this?", "options": ["A hard layer plus UV protection at the back surface", "Anti-reflection and easy-to-clean layers", "UV protection and a darker tint on the front", "A hard layer with a thicker coating on the back"], "answer": 1, "feedback": "Anti-reflection cuts the reflections; easy-to-clean layers repel water and oil so smears wipe off.", "quote": "Layers that repel water and oil make smears and dust easier to wipe off.", "tags": ["coating"]}, {"id": "b-12-q1", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "What triggers a Transitions lens to darken?", "options": ["Heat from the sun on the lens", "UV in daylight", "Visible light from any source, such as screens", "The temperature of the room"], "answer": 1, "feedback": "UV triggers the change, which is why windscreens (which block UV) limit darkening in the car.", "quote": "The change is triggered mainly by the UV in daylight, not by heat.", "tags": ["how"]}, {"id": "b-12-q2", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "Mrs K asks if Transitions will be dark enough for driving in bright sun. What is the honest answer?", "options": ["Yes, they darken fully once you are inside a car", "They stay fairly light behind a windscreen", "Yes, because they work as proper sunglasses do", "Yes, as long as the weather outside is hot"], "answer": 1, "feedback": "The windscreen blocks much of the UV that triggers the lens, so a separate sun pair is better for bright driving.", "quote": "A car windscreen blocks much of the UV, so a standard Transitions lens stays fairly light inside a car.", "tags": ["driving"]}, {"id": "b-12-q3", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "In cold weather, what does a Transitions lens usually do?", "options": ["Stays completely clear until it warms up", "Goes darker and takes longer to clear", "Goes lighter and clears more quickly", "Stops working until the weather warms"], "answer": 1, "feedback": "Cold makes it darker and slower to clear; heat makes it lighter.", "quote": "In cold weather the lens usually goes darker and takes longer to clear; in hot weather it is lighter.", "tags": ["how"]}, {"id": "b-12-q4", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "Before offering a Transitions version of a design in a given band, what must you do?", "options": ["Assume every combination exists in every band", "Check price-it, as some are not offered", "Ask the patient which band they prefer", "Override the price if the cell is empty"], "answer": 1, "feedback": "Some cells are not available, so check before promising.", "quote": "Do not offer a Transitions combination before checking price-it.", "tags": ["price"]}, {"id": "b-12-q5", "lesson": "b-12", "level": 2, "type": "tf", "stem": "True or false: a Transitions lens usually takes longer to clear than it takes to darken.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Tell the patient so they are not surprised.", "quote": "The lens darkens in under a minute and takes longer to clear.", "tags": ["how"]}, {"id": "b-12-q6", "lesson": "b-12", "level": 2, "type": "tf", "stem": "True or false: Transitions lenses are dark enough to replace sunglasses for driving in bright sun.", "options": ["True", "False"], "answer": 1, "feedback": "They are not sunglasses and are not suitable on their own for driving in bright sun.", "quote": "it is not suitable on its own for driving in bright sun.", "tags": ["driving"]}, {"id": "b-12-q7", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "A patient works indoors and drives to work. What does Transitions offer them?", "options": ["Less than it does for someone often in and out", "More, because indoors is where it works best", "The same as for any other wearer", "Nothing, as it never works indoors"], "answer": 0, "feedback": "If they are mostly indoors or in the car, Transitions has less to offer.", "quote": "If they are mostly indoors or in the car, Transitions has less to offer.", "tags": ["recommend"]}, {"id": "b-12-q8", "lesson": "b-12", "level": 2, "type": "mcq", "stem": "What is a good pattern for a patient who drives?", "options": ["One Transitions pair worn for everything, driving too", "A tinted pair for night driving and a clear pair", "Transitions every day, plus a polarised sun pair", "Two Transitions pairs in two different frames"], "answer": 2, "feedback": "Transitions for everyday use, and a polarised sun pair for driving.", "quote": "A good pattern: Transitions for the everyday pair, plus a polarised sun pair if they drive (b-13).", "tags": ["recommend"]}, {"id": "b-13-q1", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "What does a polarising filter do?", "options": ["Makes the lens darker all of the time, whatever the light", "Cuts glare reflected off wet roads and water", "Makes the lens resistant to everyday scratches", "Blocks all of the UV light reaching the eye"], "answer": 1, "feedback": "Polarised lenses cut reflected glare, which is why they suit driving and water.", "quote": "A polarising filter cuts glare that reflects off flat surfaces such as water, wet roads and car bonnets.", "tags": ["polarised"]}, {"id": "b-13-q2", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "Which caution should you give a patient buying polarised lenses for driving?", "options": ["They are not allowed to be worn for driving", "They only give any benefit when it is dark", "Screens and dashboard displays can look patchy", "They cannot ever be made with a tint added"], "answer": 2, "feedback": "Ask the patient to check their satnav or dashboard through the lens.", "quote": "Some digital screens, and some displays on a car dashboard, can look dim or have patches through polarised lenses.", "tags": ["polarised"]}, {"id": "b-13-q3", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "Which sunglass category is not suitable for driving?", "options": ["Category 1", "Category 2", "Category 3", "Category 4"], "answer": 3, "feedback": "Category 4 is for extreme glare such as snow and mountains.", "quote": "Category 4 is for extreme glare, such as snow and mountains, and is not suitable for driving.", "tags": ["category"]}, {"id": "b-13-q4", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "A patient asks the price of polarised lenses. What do you do?", "options": ["Quote the figure from memory, as it is standard", "Use the fixed colour tint price as a guide", "Ask in practice before quoting a figure", "Tell them it is included at no extra cost"], "answer": 2, "feedback": "Polarised, XTRActive, mirror and style are shown as ask in practice. Never quote from memory.", "quote": "Polarised, XTRActive, mirror and style are shown as \"ask in practice\".", "tags": ["price"]}, {"id": "b-13-q5", "lesson": "b-13", "level": 2, "type": "tf", "stem": "True or false: a dark lens without UV protection is worse than no lens at all.", "options": ["True", "False"], "answer": 0, "feedback": "The pupil opens behind a dark lens and lets more UV in. Check for UV400.", "quote": "A dark lens that does not give UV protection is worse than no lens, because the pupil opens and lets more UV in.", "tags": ["uv"]}, {"id": "b-13-q6", "lesson": "b-13", "level": 2, "type": "tf", "stem": "True or false: a category 4 lens is a good choice for driving.", "options": ["True", "False"], "answer": 1, "feedback": "Category 4 is for extreme glare such as snow and is not for driving.", "quote": "A category 4 lens is not for driving.", "tags": ["category"]}, {"id": "b-13-q7", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "Which tint is a good choice for driving?", "options": ["A very dark tint to cut all the glare", "A medium-dark brown or grey", "A pale yellow tint, for night driving", "Any mirror coating, whatever the light"], "answer": 1, "feedback": "A medium-dark brown or grey is good for driving. Never a very dark lens for the road, and no tint at night.", "quote": "A medium-dark brown or grey tint is good for driving.", "tags": ["tint"]}, {"id": "b-13-q8", "lesson": "b-13", "level": 2, "type": "mcq", "stem": "How should you advise a patient who has an everyday pair and drives a lot?", "options": ["Offer only the cheapest pair and mention a sun pair never", "Sell a sun pair and suggest wearing it every day too", "Wait for the patient to raise the idea of a sun pair", "An everyday pair plus a sun pair, explaining why"], "answer": 3, "feedback": "The everyday pair is for every day, the sun pair for driving and bright days. If the budget does not allow both, discuss priorities.", "quote": "the everyday pair for every day, the sun pair for driving and bright days.", "tags": ["conversation"]}, {"id": "b-14-q1", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "A patient asks if blue light from her screen is damaging her eyes. What is the accurate position?", "options": ["Yes, and filtering lenses will prevent the harm", "No good evidence of harm; filters are for comfort", "Only older patients are harmed by screen light", "Screen blue light is a known cause of macular disease"], "answer": 1, "feedback": "The professional position is no good evidence of harm from screens. Filters, if chosen, are for comfort.", "quote": "there is no good evidence that blue light from screens harms the eyes", "tags": ["claims"]}, {"id": "b-14-q2", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "Which phrase is acceptable to say about a blue-light-filtering lens?", "options": ["It protects your eyes from the damage screens do", "It prevents long-term damage building up in your eyes", "It may feel more comfortable on long screen days", "It will help you sleep better once the screen is off"], "answer": 2, "feedback": "Comfort language only. The other three are health claims.", "quote": "We say: \"may feel more comfortable on long screen days\"", "tags": ["claims"]}, {"id": "b-14-q3", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "Mr H asks if blue light glasses will stop macular degeneration. What do you do?", "options": ["Say yes, as long-term eye protection is what they are for", "Say it is a comfort option only, and offer the optometrist", "Say they probably will help in the long run", "Move on to the frame and leave the question"], "answer": 1, "feedback": "Never make disease-prevention claims; pass health questions to the optometrist.", "quote": "it prevents macular problems", "tags": ["claims"]}, {"id": "b-14-q4", "lesson": "b-14", "level": 2, "type": "tf", "stem": "True or false: the honest answer to \"do I need blue light lenses?\" is that they are optional.", "options": ["True", "False"], "answer": 0, "feedback": "They are a comfort option, not a necessity.", "quote": "If a patient asks if a feature is \"needed\", the honest answer is no: it is optional.", "tags": ["optional"]}, {"id": "b-14-q5", "lesson": "b-14", "level": 2, "type": "tf", "stem": "True or false: you may tell a patient that a blue light filter helps with sleep.", "options": ["True", "False"], "answer": 1, "feedback": "That is a health claim, and we never make it.", "quote": "Never say a lens helps sleep or prevents any disease.", "tags": ["claims"]}, {"id": "b-14-q6", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "What free tip can you give a patient with tired eyes from screens?", "options": ["Every 2 hours, close the eyes for 20 minutes", "Every 20 seconds, blink 20 times in a row", "Every hour, look at a bright light for 20 seconds", "Every 20 minutes, look 20 feet away for 20 seconds"], "answer": 3, "feedback": "The 20 20 20 habit: every 20 minutes, look about 6 metres away for 20 seconds.", "quote": "every 20 minutes, look 20 feet (about 6 metres) away for 20 seconds", "tags": ["tip"]}, {"id": "b-14-q7", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "A patient has dry or sore eyes and headaches. What do you suggest?", "options": ["Suggest they talk to the optometrist", "Sell a blue-light-filter lens to relieve them", "Suggest an anti-reflection coating instead", "Tell them it is just screen fatigue"], "answer": 0, "feedback": "Dry or sore eyes, headaches or changes in vision are for the optometrist.", "quote": "If a patient has dry or sore eyes, headaches or changes in vision, they should talk to the optometrist.", "tags": ["escalate"]}, {"id": "b-14-q8", "lesson": "b-14", "level": 2, "type": "mcq", "stem": "A patient is not interested in a blue-light feature. What do you do?", "options": ["Explain the risks of blue light until they agree", "Add it to the order anyway, just to be safe", "Do not push it; it is optional", "Offer it again at collection with a discount"], "answer": 2, "feedback": "Do not push a blue-light feature on someone who is not interested, and do not scare a patient to sell an option.", "quote": "Do not push a blue-light feature on someone who is not interested.", "tags": ["ethics"]}, {"id": "c-05-q1", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "A patient has a round face. What do you aim for?", "options": ["Small round thin metal frames that echo the shape", "Angles and a little width for structure", "Rimless frames in a soft oval", "Very deep frames with no angles at all"], "answer": 1, "feedback": "Angles and width give a round face structure; round frames repeat its shape.", "quote": "Round: width and length similar, soft jaw.", "tags": ["shape"]}, {"id": "c-05-q2", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "What suits a face that is longer than it is wide?", "options": ["Deeper frames with decorated sides to add width", "Tiny round frames to soften the jaw", "Narrow rimless frames with plain sides", "Very shallow frames that make the face look shorter"], "answer": 0, "feedback": "Depth and decorated sides add width to a long face.", "quote": "Aim for deeper frames and decorated sides to add width.", "tags": ["shape"]}, {"id": "c-05-q3", "lesson": "c-05", "level": 2, "type": "tf", "stem": "Face-shape guidance is a guide for choosing three or four frames, not a set of rules.", "options": ["True", "False"], "answer": 0, "feedback": "Use it to narrow the choice, then watch the patient's reaction.", "quote": "These are a guide, not rules.", "tags": ["approach"]}, {"id": "c-05-q4", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "What do you do before bringing frames to a patient?", "options": ["Ask whether they prefer plastic or metal, bold or classic", "Pick the three frames you like best yourself", "Wait quietly while the patient browses the wall", "Hand them a tray of every frame to browse alone"], "answer": 0, "feedback": "Ask first, then choose three or four.", "quote": "Ask first: \"Plastic or metal? Something that stands out, or quite classic?\" Then choose three or four.", "tags": ["approach"]}, {"id": "c-05-q5", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "A patient with a round face and a short nose wants a frame that does not make him look old. Which is the best first choice?", "options": ["A thin, soft round acetate frame", "A very small rimless round frame", "A small round thin metal frame", "A browline with a strong upper edge"], "answer": 3, "feedback": "The strong top line gives structure; round frames repeat the shape of the face.", "quote": "The strong top line gives your face some structure.", "tags": ["shape"]}, {"id": "c-05-q6", "lesson": "c-05", "level": 2, "type": "tf", "stem": "Offering the patient the whole wall is better than choosing three or four frames.", "options": ["True", "False"], "answer": 1, "feedback": "Choose three or four and say why each is on the tray.", "quote": "Do not offer the patient the whole wall.", "tags": ["approach"]}, {"id": "c-05-q7", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "How wide should the frame be, compared with the face?", "options": ["Wider than the face so the sides stand clear of the temples", "About as wide as the face at the cheekbones", "As wide as the forehead, whatever the cheekbones", "Narrower than the eyes so the lenses stay small"], "answer": 1, "feedback": "The frame should match the face at the cheekbones, no wider.", "quote": "the frame should be about as wide as the face at the cheekbones, no wider.", "tags": ["proportion"]}, {"id": "c-05-q8", "lesson": "c-05", "level": 2, "type": "mcq", "stem": "A patient with a wide face asks how a frame looks. Which phrase is best?", "options": ["Your cheekbones are your best feature", "Your face is quite big so this one suits", "It makes your face look less fat", "This frame hides how long your face is"], "answer": 0, "feedback": "Talk about the effect on the face. Words like fat, big and long should not be used about the face.", "quote": "Do not use the words \"fat\", \"big\" or \"long\" about the face.", "tags": ["wording"]}, {"id": "c-06-q1", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "Skin that looks pink or rosy has which undertone?", "options": ["Cool", "Olive", "Warm", "Neutral"], "answer": 0, "feedback": "Pink, rosy or blue-tinged skin is a cool undertone.", "quote": "Cool undertone: skin looks pink, rosy or blue-tinged.", "tags": ["undertone"]}, {"id": "c-06-q2", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "Which frame colours generally suit warm skin?", "options": ["Clear grey and pale blue-grey", "Silver, navy, burgundy and plum", "Gold, bronze, brown and warm tortoiseshell", "Cool pink and blue-toned tortoiseshell"], "answer": 2, "feedback": "Warm skin suits gold, bronze and brown tones; the others are cool colours.", "quote": "Warm skin: gold, bronze, brown, olive, warm tortoiseshell, coral, cream.", "tags": ["colour"]}, {"id": "c-06-q3", "lesson": "c-06", "level": 2, "type": "tf", "stem": "Veins that look blue on the wrist suggest a cool undertone.", "options": ["True", "False"], "answer": 0, "feedback": "Use the wrist and daylight rather than the surface colour of the skin.", "quote": "Veins on the wrist look blue.", "tags": ["undertone"]}, {"id": "c-06-q4", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "What can happen with a very dark, heavy frame on very light colouring?", "options": ["It helps the eyes stand out most", "It can look severe against the face", "It always flatters pale skin", "It can look washed out against the face"], "answer": 1, "feedback": "Dark and heavy on very light colouring looks severe. Washed out is the opposite problem (pale frame, dark colouring).", "quote": "A dark, heavy frame on very light colouring can look severe.", "tags": ["contrast"]}, {"id": "c-06-q5", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "A patient has silver-white hair, pale pink-toned skin and blue-grey eyes. Which pair of colours do you bring?", "options": ["Gold and coral", "Dark brown and olive", "Soft navy and muted burgundy", "Warm tortoiseshell and bronze"], "answer": 2, "feedback": "Pink skin and silver hair are cool, so bring cool tones.", "quote": "so she suits cool colours.", "tags": ["colour"]}, {"id": "c-06-q6", "lesson": "c-06", "level": 2, "type": "tf", "stem": "Frame colour is best judged from the tray under the shop lights.", "options": ["True", "False"], "answer": 1, "feedback": "Look at the patient in daylight or by the window.", "quote": "Do not decide on colour from the tray under shop lights.", "tags": ["lighting"]}, {"id": "c-06-q7", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "Where should you check frame colour against the patient's face?", "options": ["Under the brightest practice spotlight", "In daylight, such as by the window", "In the mirror with the fitting light off", "On the tray, next to other frames"], "answer": 1, "feedback": "Daylight shows undertone and colour truthfully.", "quote": "Look at the patient in daylight or by the window if possible.", "tags": ["lighting"]}, {"id": "c-06-q8", "lesson": "c-06", "level": 2, "type": "mcq", "stem": "A patient with olive skin and brown eyes wants something warmer than his usual black frames. What do you bring?", "options": ["Pale clear pink with a blue tint", "Warm tortoiseshell, deep brown or bronze", "Cool silver, steel grey or navy metal", "Plum, burgundy or blue-toned tortoiseshell"], "answer": 1, "feedback": "Olive skin and brown eyes are a warm undertone.", "quote": "Olive skin and brown eyes are a warm undertone.", "tags": ["colour"]}, {"id": "c-07-q1", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "Which is a sign of a well-made acetate frame?", "options": ["Uneven hinge gaps and screws that stand proud", "A gloss finish that shows no scratches", "Edges left matt from the cutting process", "Polished edges that feel smooth to the touch"], "answer": 3, "feedback": "Polished, smooth edges show quality. Rough edges and uneven hinges are signs of a cheap frame, and gloss shows scratches more.", "quote": "Polished edges: smooth to the touch.", "tags": ["finish"]}, {"id": "c-07-q2", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "You do not know where a frame is made. What do you say?", "options": ["It does not matter where a frame is made", "It is made in Italy, as most good frames are", "It is handmade, which is why it costs more", "Let me find out, I will ask a colleague"], "answer": 3, "feedback": "Only say what you know and find out the rest. Do not invent where a frame is made.", "quote": "Only say what you know.", "tags": ["honesty"]}, {"id": "c-07-q3", "lesson": "c-07", "level": 2, "type": "tf", "stem": "You can say a frame is made in a particular country if it sounds right.", "options": ["True", "False"], "answer": 1, "feedback": "Do not invent facts about where a frame is made or what it is made from.", "quote": "Do not invent facts about where a frame is made or what it is made from.", "tags": ["honesty"]}, {"id": "c-07-q4", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "How do you find the price of a frame?", "options": ["By asking the patient what they paid before", "From the price list or the price-it tool", "From memory of the last similar sale", "From the brand's reputation for price"], "answer": 1, "feedback": "Never quote a price from memory.", "quote": "Always use the price list or the price-it tool.", "tags": ["price"]}, {"id": "c-07-q5", "lesson": "c-07", "level": 2, "type": "tf", "stem": "Only Administrators can override a price; staff cannot.", "options": ["True", "False"], "answer": 0, "feedback": "Do not offer a discount to close a sale. If a price looks wrong, ask.", "quote": "Staff cannot override a price; only Administrators can (Nov 2026).", "tags": ["price"]}, {"id": "c-07-q6", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "A patient picks up a dearer frame and says she cannot see the difference. What do you show her?", "options": ["The brand name on the side, as proof of quality", "The label that says handmade, whatever it is made of", "The finish, such as layered colour, and a firm, even hinge", "A lower price, by offering her a discount on it"], "answer": 2, "feedback": "Show what she can see and feel. Do not discount, and do not claim handmade unless the supplier says so.", "quote": "Do not claim a frame is \"handmade\" or \"made in\" a country unless the supplier information says so.", "tags": ["value"]}, {"id": "c-07-q7", "lesson": "c-07", "level": 2, "type": "tf", "stem": "A gloss finish shows scratches more than a matte or satin finish.", "options": ["True", "False"], "answer": 0, "feedback": "Matte or satin shows fewer marks, so it can suit someone who wants a frame that hides wear.", "quote": "Matte or satin finish: soft and modern, shows fewer marks.", "tags": ["finish"]}, {"id": "c-07-q8", "lesson": "c-07", "level": 2, "type": "mcq", "stem": "Which sentence links a finish to the patient's needs without pushing?", "options": ["Everyone who buys this one loves it, so you will too.", "This is the best frame in the shop, so you must have it.", "This dearer one will last forever.", "You wear them all day, so a lighter hinge will keep its shape."], "answer": 3, "feedback": "Give a reason tied to their day. Do not say a frame will last forever.", "quote": "\"You wear them all day, so a lighter hinge will keep its shape.\"", "tags": ["value"]}, {"id": "c-14-q1", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "What commonly makes a frame rest on the cheeks?", "options": ["A frame or lens too deep, or a bridge sitting too low", "A bridge that is too high on the nose", "Sides that are too short behind the ear", "A lens that is too thin at the edge"], "answer": 0, "feedback": "Depth, a low bridge or too little pantoscopic tilt let the bottom of the frame swing onto the cheek.", "quote": "Causes: lens or frame too deep, bridge sitting too low, or the pantoscopic tilt too small so the bottom of the frame swings forward onto the cheek.", "tags": ["cheeks"]}, {"id": "c-14-q2", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "What is a likely cause of lashes touching the lens?", "options": ["Sides that are too long behind the ears", "The frame being too wide for the face", "A lens that is too thick at the edge", "The lens sitting too close to the eye"], "answer": 3, "feedback": "A short vertex distance puts the lens in the path of the lashes.", "quote": "Causes: the lens too close to the eye (short vertex distance), a frame that is very close fitting, or long lashes.", "tags": ["lashes"]}, {"id": "c-14-q3", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "What is the first step with any fit complaint?", "options": ["Look at the patient wearing the frame", "Order a remake of the lenses", "Tell her it will settle with wear", "Adjust the pads before you ask questions"], "answer": 0, "feedback": "Look first. Do not guess, and do not adjust before you know the cause.", "quote": "Look at the patient wearing the frame.", "tags": ["method"]}, {"id": "c-14-q4", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "Which order of fixes is recommended?", "options": ["Side, then frame, then lens", "Pad, then side, then frame", "Frame, then side, then pad", "Lens, then pad, then side"], "answer": 1, "feedback": "Choose the smallest fix first: pad, side, then frame.", "quote": "Choose the smallest fix: pad, side, then frame.", "tags": ["method"]}, {"id": "c-14-q5", "lesson": "c-14", "level": 2, "type": "tf", "stem": "Checking the fit while the patient smiles shows whether the frame touches the cheeks.", "options": ["True", "False"], "answer": 0, "feedback": "The cheeks rise when the patient smiles, so a frame that looks fine at rest may touch.", "quote": "For prevention, check when the patient smiles: the cheeks rise.", "tags": ["cheeks"]}, {"id": "c-14-q6", "lesson": "c-14", "level": 2, "type": "tf", "stem": "If a patient reports blurred vision as well as a slipping frame, treat it as a fit complaint only.", "options": ["True", "False"], "answer": 1, "feedback": "Do not treat it as a fit complaint only. Tell a registrant, as the problem may be in the lens.", "quote": "do not treat it as a fit complaint only.", "tags": ["scope"]}, {"id": "c-14-q7", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "After pad and side adjustments the frame still marks the cheeks, because the lens is deep. What do you do?", "options": ["Bend the sides further in until the marks fade", "Show her a shallower frame", "Tell her it is her face shape and will settle", "Ask her to wear them for shorter periods"], "answer": 1, "feedback": "If adjustments do not cure it, change the frame. Do not blame the patient's face.", "quote": "If it still marks, I can show you a shallower frame.", "tags": ["cheeks"]}, {"id": "c-14-q8", "lesson": "c-14", "level": 2, "type": "mcq", "stem": "Which type of nose pad helps a slippery nose?", "options": ["Smaller metal pads set closer together", "Silicone pads", "Hard plastic pads", "Pads moved right up the nose"], "answer": 1, "feedback": "Silicone pads grip better. Pads too close or too small make slipping worse.", "quote": "Choose silicone pads for slippery noses.", "tags": ["slipping"]}, {"id": "d-03-q1", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "What discount do Gold members get on prescription lenses?", "options": ["20%", "10%", "50%", "30%"], "answer": 0, "feedback": "Lenses get 20%, frames get 30%. Do not mix them up.", "quote": "The Gold figure is the standard figure less 20%, already worked out.", "tags": ["gold"]}, {"id": "d-03-q2", "lesson": "d-03", "level": 2, "type": "tf", "stem": "The Gold member discount applies to NHS voucher add-ons.", "options": ["True", "False"], "answer": 1, "feedback": "The Gold discount does not cover NHS voucher add-ons or the frame (which has its own 30%).", "quote": "it does not cover NHS voucher add-ons.", "tags": ["scope"]}, {"id": "d-03-q3", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "A patient who is not a Gold member asks for the Gold price just this once. What do you do?", "options": ["Quote the standard column and explain the plan", "Give it to them, just this once, and note it", "Ask the lab to invoice at the Gold price instead", "Take 20% off in the till as a favour"], "answer": 0, "feedback": "Do not apply the Gold price as a favour. Only the plan allows it.", "quote": "Do not apply the Gold price \"as a favour\".", "tags": ["gold"]}, {"id": "d-03-q4", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "Where do you read the Gold lens price?", "options": ["The frame list, using the lens price", "Ask the supplier for a Gold quote", "Take 20% off the standard price on a calculator, then round it", "The Gold member price in the same cell on the list"], "answer": 3, "feedback": "The Gold column already has the 20% worked out. You do not calculate it.", "quote": "The Gold figure is the standard figure less 20%, already worked out.", "tags": ["method"]}, {"id": "d-03-q5", "lesson": "d-03", "level": 2, "type": "tf", "stem": "A Gold member gets 30% off frames but 20% off prescription lenses.", "options": ["True", "False"], "answer": 0, "feedback": "Frames 30%, lenses 20%.", "quote": "Gold member: 20% off prescription lenses; 30% off frames.", "tags": ["gold"]}, {"id": "d-03-q6", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "A Gold member wants Road Pilot lenses in 1.6 clear. Which price do you quote?", "options": ["The standard price, with no discount on lenses", "The Transitions Gold price", "The Gold price from the same cell", "The standard price, then take 20% off it"], "answer": 2, "feedback": "Quote the Gold price from the cell. Read it, do not work it out.", "quote": "Quote the Gold price, because Mr D is a Gold member.", "tags": ["method"]}, {"id": "d-03-q7", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "The figure in the till does not match the Gold column. What do you do?", "options": ["Override the till to match the column", "Type the Gold figure in as a new price", "Stop and ask your practice manager", "Use whichever figure is lower"], "answer": 2, "feedback": "Staff cannot override a price. Stop and ask.", "quote": "If the figure in Optix One (desktop) does not match the Gold column, stop and ask.", "tags": ["till"]}, {"id": "d-03-q8", "lesson": "d-03", "level": 2, "type": "mcq", "stem": "What do you check before quoting from the Gold column?", "options": ["That the patient holds a valid NHS voucher", "That the patient is a current Gold member", "That the patient has bought glasses before", "That the lens is in the cheapest index band"], "answer": 1, "feedback": "Only a current Gold member is quoted from the Gold column. If you cannot see this, ask your practice manager.", "quote": "Check the patient is a current Gold member.", "tags": ["gold"]}, {"id": "d-04-q1", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "How long do Gold members have to buy a second pair at 50% off?", "options": ["60 days", "90 days", "30 days", "12 months"], "answer": 1, "feedback": "50% off additional spectacles bought within 90 days of the first pair.", "quote": "Gold members get 50% off additional spectacles bought within 90 days of the first pair.", "tags": ["offer"]}, {"id": "d-04-q2", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "From which date do you count the 90 days?", "options": ["The date of the eye test", "The date of the second order", "The date the patient joined the Gold plan", "The date the first pair was dispensed"], "answer": 3, "feedback": "Count from the first dispense, not the eye test.", "quote": "Check the date on the first dispense, not the date of the eye test.", "tags": ["count"]}, {"id": "d-04-q3", "lesson": "d-04", "level": 2, "type": "tf", "stem": "You may offer a non-member the Gold second-pair discount if they ask nicely.", "options": ["True", "False"], "answer": 1, "feedback": "Do not promise a non-member the Gold offer.", "quote": "Do not promise a non-member the Gold offer.", "tags": ["non-members"]}, {"id": "d-04-q4", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "How is the second-pair discount applied in the till?", "options": ["By a discount code", "By changing the VAT code", "By typing a lower price", "By asking the lab to invoice less"], "answer": 0, "feedback": "Through a discount code, never by changing a price.", "quote": "Through a discount code in Optix One (desktop), never by changing a price.", "tags": ["till"]}, {"id": "d-04-q5", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "A Gold member bought glasses on 3 March and wants sunglasses on 25 May. Is she inside the offer?", "options": ["No, only the first 60 days count", "No, it is 100 days, so over 90", "Yes, it is 83 days, so within 90", "Yes, any time within the same year"], "answer": 2, "feedback": "28 days left in March, plus 30 in April, plus 25 in May is 83 days.", "quote": "Day 90 is still inside; day 91 is not", "tags": ["count"]}, {"id": "d-04-q6", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "Which of these count as additional spectacles?", "options": ["A second pair, prescription sunglasses or a computer pair", "Only a second pair in the same frame style", "Only a replacement for a lost or broken pair of glasses", "Only prescription sunglasses, never computer pairs or spares"], "answer": 0, "feedback": "A second pair, sunglasses or a computer pair all count. If unsure whether a product counts, ask.", "quote": "An additional pair of spectacles: for example a second pair, a pair of prescription sunglasses or a computer pair.", "tags": ["offer"]}, {"id": "d-04-q7", "lesson": "d-04", "level": 2, "type": "tf", "stem": "The 50% second-pair offer applies to the additional pair, not to the first pair.", "options": ["True", "False"], "answer": 0, "feedback": "The first pair is at its normal or Gold price.", "quote": "the 50% is on the additional pair.", "tags": ["offer"]}, {"id": "d-04-q8", "lesson": "d-04", "level": 2, "type": "mcq", "stem": "A non-member asks for the second-pair offer. What do you do?", "options": ["Offer 25% off as a middle way between the two", "Give them the Gold 50% so they do not feel left out", "Say every second pair is half price at the practice", "Do not promise it; ask your practice manager"], "answer": 3, "feedback": "Do not invent a non-member offer. Ask your practice manager.", "quote": "Inventing a non-member offer. If unsure, ask your practice manager.", "tags": ["non-members"]}, {"id": "d-06-q1", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "Which of these extras is ask in practice on the list?", "options": ["Reglaze (lab free)", "None; all three are on the list", "Fixed colour tint", "Mirror finish"], "answer": 3, "feedback": "Reglaze and fixed colour tint have fixed prices. Polarised, XTRActive, mirror and style are ask in practice.", "quote": "What \"ask in practice\" means.", "tags": ["extras"]}, {"id": "d-06-q2", "lesson": "d-06", "level": 2, "type": "tf", "stem": "It is fine to quote a polarised price from memory if you are fairly sure.", "options": ["True", "False"], "answer": 1, "feedback": "Never guess and never quote a figure from memory.", "quote": "Never guess and never quote a figure from memory.", "tags": ["extras"]}, {"id": "d-06-q3", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "A patient wants new lenses in their own old frame. What must you do at the start?", "options": ["Refuse unless the frame is under a year old and unmarked", "Charge extra in case the frame is damaged", "Tell them nothing, since reglazing is routine", "Tell them about the risk of an old frame breaking"], "answer": 3, "feedback": "Explain the risk before you take the order, not afterwards.", "quote": "If it breaks, explain this at the start, not afterwards: tell the patient the risk before you take the order.", "tags": ["reglaze"]}, {"id": "d-06-q4", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "When should extras be in the quote?", "options": ["After the lab invoice arrives", "Only if the patient asks about extras", "Once, in the full quote, before they pay", "At collection, once the lenses are glazed"], "answer": 2, "feedback": "Always include extras in your quote so there are no surprises at collection.", "quote": "Always include extras in your quote.", "tags": ["quote"]}, {"id": "d-06-q5", "lesson": "d-06", "level": 2, "type": "tf", "stem": "Reglaze (lab free) and fixed colour tint have fixed prices on the list.", "options": ["True", "False"], "answer": 0, "feedback": "Polarised, XTRActive, mirror and style are the ones to ask about.", "quote": "reglaze (lab free) and fixed colour tint have fixed prices", "tags": ["extras"]}, {"id": "d-06-q6", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "A patient asks about a mirror finish. What do you do?", "options": ["Leave it off the quote and add it at collection", "Say you will confirm the price before ordering", "Quote the tint price and adjust later", "Quote the polarised price, as it is similar"], "answer": 1, "feedback": "Do not guess. Confirm with your practice manager, then add the confirmed item.", "quote": "Tell the patient you will confirm the price before ordering.", "tags": ["extras"]}, {"id": "d-06-q7", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "What may you say about polarised lenses?", "options": ["They cure eyestrain from glare on screens", "They improve eye health when you are outdoors", "They cut glare from flat surfaces; it is a comfort feature", "They protect your eyes from long-term sun damage outdoors"], "answer": 2, "feedback": "Explain only what is on the manufacturer's information. No medical claims.", "quote": "Polarised reduces glare from flat surfaces; it is a comfort feature.", "tags": ["claims"]}, {"id": "d-06-q8", "lesson": "d-06", "level": 2, "type": "mcq", "stem": "How do you add an extra in the till?", "options": ["Add it to the job as a product", "Type a new price over the lens line", "Note it on paper and charge at collection", "Fold it into the lens price by override"], "answer": 0, "feedback": "Add the extra as a product. Do not override the price.", "quote": "Add the extra to the job as a product in Optix One (desktop).", "tags": ["till"]}, {"id": "d-08-q1", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "Why must you learn your own company's code names?", "options": ["The two companies name their codes differently", "The codes are secret and kept at head office", "The codes are the same everywhere", "The codes change from day to day across the group"], "answer": 0, "feedback": "The Eyecare Group runs two companies, and each names its codes differently.", "quote": "The codes differ by company.", "tags": ["codes"]}, {"id": "d-08-q2", "lesson": "d-08", "level": 2, "type": "tf", "stem": "You can use a discount code to make a total look right if the system shows an unexpected figure.", "options": ["True", "False"], "answer": 1, "feedback": "Never use a code to make a total look right. If the total is wrong, ask.", "quote": "Never use a code to make a total look right.", "tags": ["rules"]}, {"id": "d-08-q3", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "What must you give each time you apply a code?", "options": ["The patient's date of birth", "A copy of the receipt", "The lab's order number", "The reason for the discount"], "answer": 3, "feedback": "Discounts are audited, so give the reason every time.", "quote": "Give the reason every time.", "tags": ["rules"]}, {"id": "d-08-q4", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "A patient was promised a discount but you cannot find a code. What do you do?", "options": ["Tell the patient the offer does not exist", "Ask your practice manager what code applies", "Make up a code with a similar name", "Override the price to the promised figure instead"], "answer": 1, "feedback": "Do not make one up.", "quote": "If you cannot find a code for something a patient has been promised, do not make one up.", "tags": ["rules"]}, {"id": "d-08-q5", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "Which pair of code names do Harrison Coley and Kings use?", "options": ["NHS and 2NDPAIR", "NHSV and 2NDPAIR", "NHS and 50%-AP", "NHSV and 50%-AP"], "answer": 1, "feedback": "Harrison Coley and Kings use NHSV and 2NDPAIR; Glass & Glass practices use NHS and 50%-AP.", "quote": "Harrison Coley and Kings use NHSV and 2NDPAIR; Glass & Glass practices use NHS and 50%-AP.", "tags": ["codes"]}, {"id": "d-08-q6", "lesson": "d-08", "level": 2, "type": "tf", "stem": "A code from the other company's list will not behave as expected.", "options": ["True", "False"], "answer": 0, "feedback": "Choose the code from your own company's list.", "quote": "A code from the other company's list will not behave as expected.", "tags": ["codes"]}, {"id": "d-08-q7", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "You have applied a code. What do you do next?", "options": ["Hand over the glasses for the patient to check", "Check the total against your quote", "Ask the lab to confirm the discount", "Delete the code if the total looks high"], "answer": 1, "feedback": "If it does not match, stop and ask. Never fix it by overriding the price.", "quote": "After applying, check the total against your quote.", "tags": ["rules"]}, {"id": "d-08-q8", "lesson": "d-08", "level": 2, "type": "mcq", "stem": "A Gold member buys her second pair 30 days after her first. Which code?", "options": ["No code; type the half price in as a new price", "The NHS voucher code", "The second-pair code for your company", "The Gold frame discount button"], "answer": 2, "feedback": "The second-pair code covers a Gold member buying an additional pair within 90 days.", "quote": "The second-pair code: a Gold member buying an additional pair within 90 days of the first pair.", "tags": ["codes"]}, {"id": "d-09-q1", "lesson": "d-09", "level": 2, "type": "tf", "stem": "Being eligible for a free NHS eye test means the person is eligible for a voucher.", "options": ["True", "False"], "answer": 1, "feedback": "Free eye test entitlement is a separate question with a wider list of people.", "quote": "Being eligible for a free eye test does not mean the person gets a voucher.", "tags": ["eligibility"]}, {"id": "d-09-q2", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "A patient says they get help with health costs. What is your first step?", "options": ["Issue the voucher and note down what they told you", "Offer a Gold discount instead of a voucher", "Ask what they receive and check the evidence", "Explain that vouchers are for children only"], "answer": 2, "feedback": "You do not issue a voucher on a patient's word alone.", "quote": "You do not issue a voucher on a patient's word alone.", "tags": ["evidence"]}, {"id": "d-09-q3", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "What does an NHS optical voucher give the patient?", "options": ["A free eye test and a free lens clean", "A fixed contribution towards the cost", "A year of Gold membership", "A free pair of glasses in a standard frame"], "answer": 1, "feedback": "It is a contribution, not a free pair. The amount depends on the lens needed.", "quote": "It is not a free pair of glasses.", "tags": ["voucher"]}, {"id": "d-09-q4", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "Where do you take voucher values from?", "options": ["The till set-up or the current guidance", "Your memory of the last voucher job", "A poster on the practice wall", "What the patient says they got last time"], "answer": 0, "feedback": "Do not quote voucher values from memory or old posters.", "quote": "Do not quote voucher values from memory or old posters", "tags": ["values"]}, {"id": "d-09-q5", "lesson": "d-09", "level": 2, "type": "tf", "stem": "Children under 16 may be entitled to an NHS optical voucher.", "options": ["True", "False"], "answer": 0, "feedback": "Under-16s may be entitled, and must be dispensed by or under a registrant.", "quote": "children under 16", "tags": ["eligibility"]}, {"id": "d-09-q6", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "A 70-year-old says: I get free eye tests, so I get a free pair of glasses. What do you say?", "options": ["Say she should join a Gold plan to get glasses free", "Tell her yes, because over-60s always get a voucher too", "Explain the two are separate and check other grounds", "Issue the voucher now and check her paperwork later"], "answer": 2, "feedback": "A free eye test does not on its own give a voucher. Ask about other grounds, and ask if unsure.", "quote": "Entitlement to a free NHS eye test is a separate question with a wider list of people, such as people over 60 or with certain eye conditions.", "tags": ["eligibility"]}, {"id": "d-09-q7", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "Which patient must be dispensed by or under a registrant, even with a voucher?", "options": ["A child under 16", "A patient holding an NHS help certificate", "A 17-year-old in full-time education", "A patient with a complex prescription"], "answer": 0, "feedback": "A voucher does not change the registrant rule for under-16s and sight impaired patients.", "quote": "These patients must be dispensed by or under the supervision of a registrant.", "tags": ["scope"]}, {"id": "d-09-q8", "lesson": "d-09", "level": 2, "type": "mcq", "stem": "What do you check about the patient's evidence?", "options": ["That it is in date and in the patient's name", "That it names the glasses being bought", "That it has a photograph of the patient on it", "That it was issued by this practice"], "answer": 0, "feedback": "Check it is in date and in their name.", "quote": "Check the details are in date and in their name.", "tags": ["evidence"]}, {"id": "d-11-q1", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "What is the correct order to build a quote?", "options": ["Total, frame, lenses, then extras", "Extras, frame, total, then lenses", "Frame, lens pair, extras, total", "Lenses, extras, frame, then total"], "answer": 2, "feedback": "Four steps, always in this order.", "quote": "Build the quote in four steps, always in this order.", "tags": ["method"]}, {"id": "d-11-q2", "lesson": "d-11", "level": 2, "type": "tf", "stem": "For a Gold member you can use the Gold frame price with standard lens prices.", "options": ["True", "False"], "answer": 1, "feedback": "Gold means Gold throughout; do not mix columns.", "quote": "Gold means Gold throughout.", "tags": ["gold"]}, {"id": "d-11-q3", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "The till total does not match your quote. What do you do?", "options": ["Override the price to match the quote", "Ask the patient to accept the till figure", "Find out why before taking any payment", "Take payment now and tell your manager later"], "answer": 2, "feedback": "Never fix it by overriding a price.", "quote": "Never fix it by overriding a price.", "tags": ["till"]}, {"id": "d-11-q4", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "Lens prices on the list are for what?", "options": ["One lens plus its coating", "A frame and lenses together", "One lens", "A pair"], "answer": 3, "feedback": "Every lens price is per pair.", "quote": "It is a price per pair.", "tags": ["pair"]}, {"id": "d-11-q5", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "Which extras do you confirm before quoting?", "options": ["Reglaze and mirror", "Polarised, mirror and XTRActive", "Reglaze and fixed colour tint only", "Fixed colour tint and polarised"], "answer": 1, "feedback": "Polarised, mirror and XTRActive are ask in practice.", "quote": "For polarised, mirror and XTRActive, ask in practice and confirm before you quote.", "tags": ["extras"]}, {"id": "d-11-q6", "lesson": "d-11", "level": 2, "type": "tf", "stem": "A non-member uses the standard columns throughout the quote.", "options": ["True", "False"], "answer": 0, "feedback": "Frame and lenses both come from the standard columns.", "quote": "A non-member uses the standard columns throughout.", "tags": ["gold"]}, {"id": "d-11-q7", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "A Gold member chooses a frame and Comfort Max lenses. Which columns do you read?", "options": ["Standard columns for both, with 30% off at the till", "Gold frame column and Gold lens columns", "Gold frame column and standard lens columns", "Standard frame column and Gold lens columns"], "answer": 1, "feedback": "Gold throughout; never work the discount out yourself.", "quote": "A Gold member's frame uses the Gold frame column and their lenses use the Gold lens columns.", "tags": ["gold"]}, {"id": "d-11-q8", "lesson": "d-11", "level": 2, "type": "mcq", "stem": "A patient asks: what if I go thinner? What do you do?", "options": ["Ask the lab what the thinner lens costs", "Estimate the price from the current band", "Quote the same price and adjust at collection", "Re-read the next band rather than guessing"], "answer": 3, "feedback": "Read the next band on the list.", "quote": "re-read the next band rather than guessing.", "tags": ["method"]}, {"id": "e-02-q1", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "Which product is Tailor Made?", "options": ["Varilux Immersia MID", "Visio Digital", "Nova Plus 3.0", "Comfort Max"], "answer": 2, "feedback": "Elite is Visio Digital, Tailor Made is Nova Plus 3.0, E-reader is Varilux Immersia MID.", "quote": "Elite is Visio Digital, Tailor Made is Nova Plus 3.0, E-reader is Varilux Immersia MID.", "tags": ["products"]}, {"id": "e-02-q2", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "Where are heights measured from for varifocals?", "options": ["The centre of the nose pad", "The top of the rim of the frame", "The upper edge of the eyebrow", "The lower rim of the frame"], "answer": 3, "feedback": "Heights are taken from the lower rim and are vital for varifocals.", "quote": "Heights are taken from the lower rim and are vital for varifocals.", "tags": ["measure"]}, {"id": "e-02-q3", "lesson": "e-02", "level": 2, "type": "tf", "stem": "If the frame price on screen is wrong you can type the right price.", "options": ["True", "False"], "answer": 1, "feedback": "Check the frame details and price match; staff cannot override a price. Ask.", "quote": "Typing a price over a product. Staff cannot override.", "tags": ["price"]}, {"id": "e-02-q4", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "What do you do before you confirm the dispense?", "options": ["Send the lens order to the lab", "Close the record to protect their data", "Recap the order and total with the patient", "Print the receipt for the patient to check"], "answer": 2, "feedback": "Recap first, then confirm.", "quote": "Recap the order and total cost with the patient.", "tags": ["method"]}, {"id": "e-02-q5", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "A product you need is not in the list. What do you do?", "options": ["Ask your practice manager", "Type in a manual price for it", "Pick the nearest match and add a note", "Leave it out and add it at collection"], "answer": 0, "feedback": "Do not choose a close match.", "quote": "If a product does not appear, ask.", "tags": ["products"]}, {"id": "e-02-q6", "lesson": "e-02", "level": 2, "type": "tf", "stem": "On the lens screen, both eyes should be selected unless only one lens is being supplied.", "options": ["True", "False"], "answer": 0, "feedback": "Selecting one eye by mistake leaves half the order out.", "quote": "On the lens screen, make sure both eyes is selected unless only one is being supplied.", "tags": ["method"]}, {"id": "e-02-q7", "lesson": "e-02", "level": 2, "type": "mcq", "stem": "What do you do before you open the dispense screen?", "options": ["Scan the frame barcode", "Take the PDs and heights", "Search for the lens product", "Recap th

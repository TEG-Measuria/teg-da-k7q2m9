ce", "n": 8, "fl": true}}, "page": "test", "id": "T3", "qs": [{"id": "d-12-q1", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "How many varifocal options should you usually present?", "options": ["Three, on adjacent rungs of the ladder", "Four, so that nothing is hidden", "All of them, so the patient can compare", "One, to avoid confusing the patient"], "answer": 0, "feedback": "Offer three choices, not four.", "quote": "Offer three choices, not four.", "tags": ["ladder"]}, {"id": "d-12-q2", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "Why keep the same index and clear or Transitions across the ladder?", "options": ["So the patient compares like with like", "So the thinnest lens is always offered", "So the lab can group the orders together", "So the quote is quicker to produce"], "answer": 0, "feedback": "Otherwise the comparison is unfair; show the effect of a thinner index afterwards if asked.", "quote": "Keep to the same index and clear or Transitions across the ladder", "tags": ["method"]}, {"id": "d-12-q3", "lesson": "d-12", "level": 3, "type": "tf", "stem": "You may promise a patient that the top rung will fix any problem they have.", "options": ["True", "False"], "answer": 1, "feedback": "Describe, do not guarantee. No medical claims.", "quote": "No medical claims.", "tags": ["claims"]}, {"id": "d-12-q4", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "A Gold member is being quoted the ladder. Which column do you use?", "options": ["Whichever column gives the lower total", "The standard column, then 20% off at the till", "The Gold column for the top rung only", "The Gold column for every rung"], "answer": 3, "feedback": "Use the same column for all options.", "quote": "The comparison should use the same column for all options.", "tags": ["gold"]}, {"id": "d-12-q5", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "Which rung is the entry level of the varifocal ladder?", "options": ["Elite (Visio Digital)", "Comfort Max", "XR (XR Design or XR Pro)", "Tailor Made (Nova Plus 3.0)"], "answer": 0, "feedback": "The ladder runs Elite, Tailor Made, Comfort Max, XR.", "quote": "1. Elite (Visio Digital)", "tags": ["ladder"]}, {"id": "d-12-q6", "lesson": "d-12", "level": 3, "type": "tf", "stem": "XR Design and XR Pro are sold at the same price.", "options": ["True", "False"], "answer": 0, "feedback": "The list gives one XR price for both.", "quote": "XR (XR Design or XR Pro; the same price)", "tags": ["ladder"]}, {"id": "d-12-q7", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "What do you do first when presenting the ladder?", "options": ["Explain the technical design of each lens", "Ask how they use their glasses day to day", "Recommend the top rung, then step down", "Quote the cheapest rung and stop there"], "answer": 1, "feedback": "Start with reading, screens, driving and hobbies, then describe each option in what the patient will notice.", "quote": "Ask how they use their glasses: reading, screens, driving, hobbies.", "tags": ["method"]}, {"id": "d-12-q8", "lesson": "d-12", "level": 3, "type": "mcq", "stem": "Who must dispense varifocals for a 12-year-old?", "options": ["A registrant, or someone under their supervision", "Any dispenser who has passed Level 2", "A Level 1 team member, with a coach present", "Any dispenser, if a parent agrees"], "answer": 0, "feedback": "Under-16s are dispensed by or under a registrant.", "quote": "Under-16s and registered sight impaired patients are dispensed by or under a registrant.", "tags": ["law"]}, {"id": "e-12-q1", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "When can you remove the clip?", "options": ["After the front photo", "Any time you need to adjust the frame", "After all far and near measurements", "After boxing"], "answer": 2, "feedback": "The clip stays on, untouched, until every measurement is done.", "quote": "The clip stays on, untouched, until all far and near measurements are done.", "tags": ["clip"]}, {"id": "e-12-q2", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "Where do the boxing lines go?", "options": ["On the groove of the rim", "On the inner edge of the front of the rim", "On the outer edge of the side", "Across the centre of the bridge"], "answer": 1, "feedback": "Ignore the groove.", "quote": "Boxing: lines go on the inner edge of the front of the rim, ignoring the groove.", "tags": ["boxing"]}, {"id": "e-12-q3", "lesson": "e-12", "level": 3, "type": "tf", "stem": "You can accept a doubtful photo to save time.", "options": ["True", "False"], "answer": 1, "feedback": "Retake rather than accept a doubtful photo.", "quote": "Retake rather than accept a doubtful photo.", "tags": ["quality"]}, {"id": "e-12-q4", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "How do you measure a second pair?", "options": ["Add an equipment and measure it separately", "Reuse the first pair's measurements", "Phone Essilor for the values", "Measure it without the clip"], "answer": 0, "feedback": "A second pair is measured separately.", "quote": "A second pair is measured separately with Add an equipment.", "tags": ["method"]}, {"id": "e-12-q5", "lesson": "e-12", "level": 3, "type": "tf", "stem": "The client should look at the mirror, not the screen, while you measure.", "options": ["True", "False"], "answer": 0, "feedback": "The camera follows their eye height only if they look in the mirror.", "quote": "Ask the client to look at the mirror, not the screen.", "tags": ["method"]}, {"id": "e-12-q6", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "How far does the client turn the head for the three-quarter view?", "options": ["About 45 degrees", "Fully sideways, about 90 degrees", "About 5 degrees", "About 20 degrees (15 to 25 accepted)"], "answer": 3, "feedback": "They then look back at the mirror without moving the head.", "quote": "the client turns the head about 20 degrees (15 to 25 accepted)", "tags": ["method"]}, {"id": "e-12-q7", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "What do you check on the front photo?", "options": ["That the frame is off the face", "That the client is smiling", "That the client is looking at the screen", "Both eyes open and the clip markers detected"], "answer": 3, "feedback": "Retake rather than accept a doubtful photo.", "quote": "Check the clip markers are detected and both eyes are open.", "tags": ["quality"]}, {"id": "e-12-q8", "lesson": "e-12", "level": 3, "type": "mcq", "stem": "You cannot run a VisiOffice session. What do you do?", "options": ["Order without any measurements and say nothing", "Type in plausible values from a similar patient", "Wait until the next VisiOffice device update", "Use the fallback from the eyecode lesson and note why"], "answer": 3, "feedback": "Use the agreed fallback and record the reason.", "quote": "Use the fallback in the eyecode lesson and note why.", "tags": ["fallback"]}, {"id": "e-13-q1", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "What does IMPORT MEASUREMENTS open?", "options": ["The patient's test history", "The list of past Opsysweb orders", "The UMS list of VisiOffice sessions", "The frame price list"], "answer": 2, "feedback": "Selecting a session fills the order.", "quote": "IMPORT MEASUREMENTS opens the UMS list of VisiOffice sessions.", "tags": ["import"]}, {"id": "e-13-q2", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "What do you do after selecting the session?", "options": ["SEND the order straight away to save time", "Check the imported PDs and heights against the dispense", "Close the form and re-enter every value by hand", "Delete the session from the list and re-measure"], "answer": 1, "feedback": "They should agree with what you measured.", "quote": "Compare the PDs and heights with what you measured at the dispense.", "tags": ["check"]}, {"id": "e-13-q3", "lesson": "e-13", "level": 3, "type": "tf", "stem": "You can press SEND after importing to save time.", "options": ["True", "False"], "answer": 1, "feedback": "Only a trained person sends.", "quote": "Do not press SEND.", "tags": ["send"]}, {"id": "e-13-q4", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "The session is not in the list. What do you do?", "options": ["Wait a month and look again", "Ask who measured, else use fallback averages and note why", "Cancel the patient's order", "Retype values from memory of the measuring"], "answer": 1, "feedback": "It may not have been submitted from the device.", "quote": "It may not have been submitted from the VisiOffice device.", "tags": ["import"]}, {"id": "e-13-q5", "lesson": "e-13", "level": 3, "type": "tf", "stem": "A similar surname is a common error when picking a session from the list.", "options": ["True", "False"], "answer": 0, "feedback": "Check you have the right person, using the initial and submitted time.", "quote": "A similar surname is a common error.", "tags": ["import"]}, {"id": "e-13-q6", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "Mr Y has two sessions in the list. Which do you choose?", "options": ["Whichever is first alphabetically", "Both, then average them", "The earliest, as it is the original", "The latest, unless the list tells you otherwise"], "answer": 3, "feedback": "Check the submitted time.", "quote": "choose the latest unless the list tells you otherwise.", "tags": ["import"]}, {"id": "e-13-q7", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "Which extra values arrive for an XR Pro order?", "options": ["Panto, wrap, dominant eye and the NVB code", "Eyecode, cape and ERC for each eye only", "Only the PDs and heights from the dispense", "The frame price, shape and tray number"], "answer": 0, "feedback": "XR Design brings eyecode, cape, ERC, PDs, heights and box size; XR Pro adds more.", "quote": "For XR Pro they also include panto, wrap, dominant eye and the NVB code.", "tags": ["import"]}, {"id": "e-13-q8", "lesson": "e-13", "level": 3, "type": "mcq", "stem": "An imported value looks wrong. What do you do?", "options": ["Delete the field and leave it blank", "Overtype it with your own estimate", "Press SEND so the lab can check it", "Ask the person who measured"], "answer": 3, "feedback": "Do not edit measured values without a reason.", "quote": "If something looks wrong, ask the person who measured.", "tags": ["check"]}, {"id": "h-03-q1", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "Which is the top step of the varifocal ladder?", "options": ["Elite", "Tailor Made", "Varilux XR Design", "Varilux XR Pro"], "answer": 3, "feedback": "The ladder runs Elite, Tailor Made, Comfort Max, XR Design and XR Pro.", "quote": "5. **Varilux XR Pro.** The top step.", "tags": ["ladder"]}, {"id": "h-03-q2", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "Elite is the staff name for which lens?", "options": ["Nova Plus 3.0 lens", "Visio Digital", "Comfort Max", "XR Design"], "answer": 1, "feedback": "Elite is Visio Digital; Tailor Made is Nova Plus 3.0.", "quote": "The staff-facing names for ordering are Elite for Visio Digital and Tailor Made for Nova Plus 3.0.", "tags": ["names"]}, {"id": "h-03-q3", "lesson": "h-03", "level": 3, "type": "tf", "stem": "You may override a price in the till if the patient asks.", "options": ["True", "False"], "answer": 1, "feedback": "Never type or guess a price, and never override one.", "quote": "Never type or guess a price, and never override one.", "tags": ["price"]}, {"id": "h-03-q4", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "Which step is Nova Plus 3.0?", "options": ["Elite", "Tailor Made", "Varilux Comfort Max", "XR Pro"], "answer": 1, "feedback": "Tailor Made is the staff name for Nova Plus 3.0.", "quote": "Tailor Made (Nova Plus 3.0).", "tags": ["names"]}, {"id": "h-03-q5", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "Which designs on the ladder must be eyecoded?", "options": ["Comfort Max, XR Design and XR Pro lenses", "Elite and Tailor Made, and no others", "Every step except XR Pro", "None; eyecoding is optional"], "answer": 0, "feedback": "Comfort Max, XR Design and XR Pro must be eyecoded.", "quote": "Comfort Max, XR Design and XR Pro must be eyecoded", "tags": ["eyecode"]}, {"id": "h-03-q6", "lesson": "h-03", "level": 3, "type": "tf", "stem": "The top step should be offered only where it suits the patient, not pushed to everyone.", "options": ["True", "False"], "answer": 0, "feedback": "Start with the patient's needs and let them choose.", "quote": "Do not push the top step to every patient.", "tags": ["ethics"]}, {"id": "h-03-q7", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "A patient asks how one step differs from the next. How do you explain it?", "options": ["By what they notice, such as comfort", "By the design names and material codes", "By saying the dearer one is simply better", "By comparing the lab's brochure wording"], "answer": 0, "feedback": "Explain by what the patient will notice, not by jargon.", "quote": "Explain the difference by what the patient will notice, not by jargon: comfort, wider clear areas, easier adaptation.", "tags": ["explain"]}, {"id": "h-03-q8", "lesson": "h-03", "level": 3, "type": "mcq", "stem": "A patient asks whether the top step will protect their eyes from disease. What do you say?", "options": ["Describe comfort and use, no medical claim", "Say it helps protect their long-term eye health", "Say it is the safest for their eyes", "Ask them to read the supplier's leaflet"], "answer": 0, "feedback": "Do not claim medical benefits for any lens.", "quote": "Do not claim medical benefits for any lens. Describe comfort and use.", "tags": ["claims"]}, {"id": "h-04-q1", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "Which level adds how the wearer moves their eyes and head?", "options": ["Level 1", "Level 2", "Level 3", "Level 4"], "answer": 2, "feedback": "Level 3 adds the wearer's habits, measured with VisiOffice.", "quote": "Level 3: the wearer's habits.** Adds how the wearer moves their eyes and head, measured with VisiOffice.", "tags": ["levels"]}, {"id": "h-04-q2", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "Which lens is personalisation level 4 used for?", "options": ["Elite", "XR Pro", "Comfort Max", "Eyezen Start"], "answer": 1, "feedback": "Level 4 adds near vision behaviour (NVB) and is used for XR Pro.", "quote": "Adds how the wearer holds things for near (NVB). Used for XR Pro.", "tags": ["levels"]}, {"id": "h-04-q3", "lesson": "h-04", "level": 3, "type": "tf", "stem": "Where VisiOffice could not be done, you should write on the dispense why.", "options": ["True", "False"], "answer": 0, "feedback": "Always note on the dispense why VisiOffice was not done.", "quote": "Always note on the dispense why VisiOffice was not done.", "tags": ["record"]}, {"id": "h-04-q4", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "Which of these is NOT part of level 2?", "options": ["Wrap", "Wrap and pantoscopic tilt", "Eye and head movement", "Vertex distance"], "answer": 2, "feedback": "Level 2 is lens to frame: wrap, pantoscopic tilt and vertex distance. Eye and head movement is level 3.", "quote": "Adds how the lens sits in the frame: wrap, pantoscopic tilt and vertex distance.", "tags": ["levels"]}, {"id": "h-04-q5", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "VisiOffice cannot be done for a patient. What do you do?", "options": ["Use measured values and averages; note why", "Skip the measurements and leave the boxes blank", "Copy over the previous patient's measurements", "Estimate every value by eye"], "answer": 0, "feedback": "Use measured values or the stated averages and always write why VisiOffice was not done.", "quote": "Use PD and heights as measured; ERC 25.5 right and left; cape 0.0; dominant eye none; wrap 4 to 6; panto 8 to 12; vertex 10 to 12.", "tags": ["fallback"]}, {"id": "h-04-q6", "lesson": "h-04", "level": 3, "type": "tf", "stem": "If VisiOffice could not be done, you may enter a near vision behaviour value you have estimated.", "options": ["True", "False"], "answer": 1, "feedback": "Do not enter the NVB if you did not measure it.", "quote": "Do not enter the NVB if you did not measure it.", "tags": ["nvb"]}, {"id": "h-04-q7", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "XR Pro was dispensed without VisiOffice. What is ordered instead?", "options": ["XR Design with the average measurements", "Elite with the average measurements taken", "XR Pro with an estimated NVB value", "Comfort Max with a new add"], "answer": 0, "feedback": "If XR Pro was dispensed without VisiOffice, order XR Design with the average measurements.", "quote": "If XR Pro was dispensed without VisiOffice, order XR Design with the average measurements.", "tags": ["fallback"]}, {"id": "h-04-q8", "lesson": "h-04", "level": 3, "type": "mcq", "stem": "Who presses Send on an Opsysweb order?", "options": ["Only a trained person", "Any dispenser, for practice", "The patient", "The reception team"], "answer": 0, "feedback": "Sending the order is done only by a trained person. You never press Send as part of practice.", "quote": "Sending the order is done only by a trained person; you never press Send as part of practice.", "tags": ["ordering"]}, {"id": "h-09-q1", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "What is the best way to help a patient choose a varifocal?", "options": ["Tell them which one is the best", "Show the difference; let them choose", "Quote the prices only and then wait quietly", "Choose the right one for them"], "answer": 1, "feedback": "Selling a varifocal is about showing, not telling.", "quote": "Selling a varifocal is about showing, not telling.", "tags": ["showing"]}, {"id": "h-09-q2", "lesson": "h-09", "level": 3, "type": "tf", "stem": "You should always push the top step of the ladder.", "options": ["True", "False"], "answer": 1, "feedback": "Do not push the top step to everyone, and do not oversell. A lens that is more than the patient needs loses trust.", "quote": "Pushing the top step to everyone.", "tags": ["ethics"]}, {"id": "h-09-q3", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "Which is the right approach to discounts?", "options": ["Use only the codes your practice has", "Invent a small one to help the sale", "Offer one first to soften the price", "Apply one you think the manager would allow"], "answer": 0, "feedback": "Never invent a discount. Use only the codes on the code table.", "quote": "Never invent a discount; use only the codes your practice has.", "tags": ["discounts"]}, {"id": "h-09-q4", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "How do you explain the difference between steps?", "options": ["In detailed technical jargon", "In outcomes they will notice", "With a long product lecture", "By leaving them to read a leaflet"], "answer": 1, "feedback": "Explain in outcomes: wider clear areas, a calmer feel, easier adaptation.", "quote": "Wider clear areas, a calmer feel, easier adaptation. Not jargon.", "tags": ["language"]}, {"id": "h-09-q5", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "A patient says, \"I tried varifocals and hated them.\" What do you do?", "options": ["Ask what went wrong", "Tell them these are different", "Offer the top step straight away", "Move on to another lens type"], "answer": 0, "feedback": "It may have been the measurements, the frame or the design. Involve a registrant if there is a history of difficulty.", "quote": "Ask what went wrong.", "tags": ["history"]}, {"id": "h-09-q6", "lesson": "h-09", "level": 3, "type": "tf", "stem": "Asking \"which is easier?\" is better than asking \"which is better?\".", "options": ["True", "False"], "answer": 0, "feedback": "It keeps the patient's experience at the centre.", "quote": "Ask \"which is easier?\" rather than \"which is better?\".", "tags": ["tips"]}, {"id": "h-09-q7", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "A patient says the choice is too expensive. What do you do?", "options": ["Acknowledge, show the next step down", "Apply a discount you think they will accept", "Tell them the lower steps are not as good", "Say the price is fixed and move on"], "answer": 0, "feedback": "Acknowledge, show the next step down, and ask what matters most. Do not put down the lower steps.", "quote": "Acknowledge it. Show the next step down and say what they would notice.", "tags": ["price"]}, {"id": "h-09-q8", "lesson": "h-09", "level": 3, "type": "mcq", "stem": "A patient is leaning towards the entry varifocal. What do you say?", "options": ["A good lens; here is what the next step adds", "It is rather basic, so I would not really choose it", "Most people regret it after a week", "It is fine if you do not mind blur"], "answer": 0, "feedback": "Do not put down the lower steps. They are good lenses.", "quote": "Putting down the lower steps. They are good lenses.", "tags": ["entry"]}, {"id": "h-11-q1", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "Which of these is one of the four measures?", "options": ["The number of frames sold", "The remake rate", "The hours you have worked", "Your time off sick"], "answer": 1, "feedback": "The four measures are remake rate, second-pair rate, the observed rubric and patient feedback.", "quote": "**Remake rate.** How many of your jobs were remade, and why.", "tags": ["measures"]}, {"id": "h-11-q2", "lesson": "h-11", "level": 3, "type": "tf", "stem": "The 90-day check is a pass or fail exam.", "options": ["True", "False"], "answer": 1, "feedback": "It is a trend, never pass or fail. The point is learning, not blame.", "quote": "A trend, never pass or fail.", "tags": ["trend"]}, {"id": "h-11-q3", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "What is \"amazing\" at TEG?", "options": ["Level 3 plus a 90-day check", "Any month with a high sales total", "Level 1 and a full set of notes", "A discount given to every patient"], "answer": 0, "feedback": "\"Amazing\" is Level 3 plus a 90-day check.", "quote": "\"Amazing\" at TEG is Level 3 plus a 90-day check.", "tags": ["definition"]}, {"id": "h-11-q4", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "Why note the cause of a remake?", "options": ["So you are not marked down unfairly", "So you can be ranked against colleagues", "So the owner can set a pay deduction", "So the record looks complete"], "answer": 0, "feedback": "Remakes caused by a prescription change, a supplier fault or patient damage are noted as such.", "quote": "Remakes caused by a prescription change, a supplier fault or patient damage are noted as such", "tags": ["fairness"]}, {"id": "h-11-q5", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "Who decides anything about your level?", "options": ["The practice manager and the owner together", "The 90-day check score and nothing else", "Your colleagues, by comparing the rates", "The coach, on the day of the check"], "answer": 0, "feedback": "The 90-day check does not rank staff, decide pay or remove authority on its own.", "quote": "Any decision about your level is made by your practice manager and the owner, using more than these figures.", "tags": ["authority"]}, {"id": "h-11-q6", "lesson": "h-11", "level": 3, "type": "tf", "stem": "A single bad week proves nothing about how you are doing.", "options": ["True", "False"], "answer": 0, "feedback": "A steady pattern, not one week, shows where to focus.", "quote": "A single bad week proves nothing; a steady pattern shows where to focus.", "tags": ["trend"]}, {"id": "h-11-q7", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "A remake was caused by something you did. What do you do?", "options": ["Record it with the reason", "Leave it out so the rate stays low", "Ask a colleague to log it", "Wait to see if anyone notices"], "answer": 0, "feedback": "Do not hide a remake; recording it helps everyone.", "quote": "Do not hide a remake; recording it helps everyone.", "tags": ["remakes"]}, {"id": "h-11-q8", "lesson": "h-11", "level": 3, "type": "mcq", "stem": "Who should you compare your results with?", "options": ["Your own trend over time", "Your closest colleague", "The best dispenser in the group", "A fixed target set by the owner"], "answer": 0, "feedback": "Do not compare yourself with colleagues; compare with your own trend.", "quote": "Do not compare yourself with colleagues; compare with your own trend.", "tags": ["trend"]}], "n": 20, "pass_": 0.8};</script><script src="assets/app.js"></script></body></html>

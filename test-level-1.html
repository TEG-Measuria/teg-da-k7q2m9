pen": false, "visible": true, "status": "draft - not for learners", "ver": "49c7842", "n": 8, "fl": true}, "h-02": {"title": "Who suits a varifocal, and first-time wearers", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "51856ab", "n": 8, "fl": true}, "h-03": {"title": "Our varifocal ladder: Visio Digital to XR Pro", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "0e20cbf", "n": 8, "fl": true}, "h-04": {"title": "Personalisation: the four levels", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "f46287f", "n": 8, "fl": true}, "h-05": {"title": "Fitting heights and minimum heights", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "6338935", "n": 8, "fl": true}, "h-06": {"title": "Choosing a frame for a varifocal", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "88721bf", "n": 8, "fl": true}, "h-07": {"title": "Measuring for a varifocal: monocular PD and heights", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "712464a", "n": 8, "fl": true}, "h-08": {"title": "Varifocal non-tolerance: causes and checks", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "f03efcc", "n": 8, "fl": true}, "h-09": {"title": "Selling the varifocal: show the difference", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "79b251e", "n": 8, "fl": true}, "h-10": {"title": "Checking in a varifocal: markings and engravings", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "7bc46e0", "n": 8, "fl": true}, "h-11": {"title": "The 90-day check: what amazing looks like", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "c26f7ce", "n": 8, "fl": true}}, "page": "test", "id": "T1", "qs": [{"id": "b-01-q1", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "Mr D wants one pair for driving, a desk and his phone, and does not want to swap glasses all day. Which type fits?", "options": ["Single vision lenses made for reading only", "A varifocal: far, middle and near", "An office lens worn as his only pair", "A bifocal with a visible line for near"], "answer": 1, "feedback": "A varifocal covers far, middle and near in one pair. The others leave out a distance he needs.", "quote": "They give all three distances in one pair.", "tags": ["choose"]}, {"id": "b-01-q2", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "What is the main problem with giving a driver an office lens as their only pair?", "options": ["The lenses cost far too much for an everyday pair", "It cannot be made in a tint", "The far distance view is limited or absent", "It has a visible line across it"], "answer": 2, "feedback": "Office lenses are built for close and middle distances, so they are a second pair for working in, not for the road.", "quote": "They are a second pair for working in, not a pair for the road or the stairs.", "tags": ["office"]}, {"id": "b-01-q3", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "What is the best first step when helping a patient choose a lens type?", "options": ["Read the prescription and pick the type from it", "Offer the most expensive option first", "Ask what they do and how far away they look", "Show frames before asking anything"], "answer": 2, "feedback": "Need comes first. Two people with the same prescription can need different lenses.", "quote": "begin with the patient's day, not the prescription.", "tags": ["needs"]}, {"id": "b-01-q4", "lesson": "b-01", "level": 1, "type": "tf", "stem": "True or false: the law restricts an unregistered person from selling an adult a varifocal.", "options": ["True", "False"], "answer": 1, "feedback": "The law does not restrict the sale of an adult's spectacles by lens design. The restrictions are for under-16s and the registered sight impaired.", "quote": "the law does not restrict the sale of an adult's spectacles by lens design.", "tags": ["law"]}, {"id": "b-01-q5", "lesson": "b-01", "level": 1, "type": "tf", "stem": "True or false: an adult varifocal may be sold by an unregistered person against a prescription under two years old.", "options": ["True", "False"], "answer": 0, "feedback": "Yes, provided the checks in the law are met. The lens design itself is not restricted.", "quote": "An adult varifocal may be sold by an unregistered person against a prescription under two years old", "tags": ["law"]}, {"id": "b-01-q6", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "What is the usual trade-off of a varifocal?", "options": ["A visible line between distance and near", "Nothing in between, so the middle is blurred", "Some blur at the sides of the lens", "Only one distance is covered at a time"], "answer": 2, "feedback": "The sides of a varifocal have some blur, so the wearer learns to point their nose at what they want to see.", "quote": "The trade-off is that the sides of the lens have some blur", "tags": ["varifocal"]}, {"id": "b-01-q7", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "A first-time varifocal wearer asks if it will feel normal at once. What do you say?", "options": ["Most people adapt in a week or two; we will book a check", "Yes, you will not notice any difference at all", "It usually takes about six months to get used to", "Only if you choose the most expensive design"], "answer": 0, "feedback": "Do not promise it will feel normal at once. Most people adapt in a week or two, and you book a check.", "quote": "Say that most people adapt in a week or two and book a check.", "tags": ["adapt"]}, {"id": "b-01-q8", "lesson": "b-01", "level": 1, "type": "mcq", "stem": "A 14-year-old wants varifocals. Who dispenses them?", "options": ["You, if you are signed off at Level 3", "Any adult member of staff on the floor", "You, if a parent agrees to the choice", "A registrant, or you under their supervision"], "answer": 3, "feedback": "Under-16s must be dispensed by or under the supervision of a registrant, whatever the lens type.", "quote": "Under-16s and people registered sight impaired must be dispensed by or under the supervision of a registrant.", "tags": ["law"]}, {"id": "c-01-q1", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "A frame is marked 54 17 140. What does the 17 mean?", "options": ["Width of one lens opening", "Length of the side to the tip", "Gap between the two lenses", "Height of the lens box"], "answer": 2, "feedback": "The middle number is the bridge, the distance between the lenses, in millimetres.", "quote": "Bridge (DBL): the distance between the lenses, also in millimetres.", "tags": ["box"]}, {"id": "c-01-q2", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "A frame is marked 50 20 145. What is its frame PD (centre-to-centre distance)?", "options": ["50 mm", "120 mm", "90 mm", "70 mm"], "answer": 3, "feedback": "Frame PD is the eye size plus the bridge: 50 + 20 = 70 mm. Adding the eye size twice (120) gives the lens-area width, not the frame PD.", "quote": "Frame PD (centre-to-centre distance) is the eye size plus the bridge.", "tags": ["frame-pd"]}, {"id": "c-01-q3", "lesson": "c-01", "level": 1, "type": "tf", "stem": "The depth of the lens opening (B) is not printed on the frame, so you measure it with a ruler.", "options": ["True", "False"], "answer": 0, "feedback": "B is not printed. You measure it, and it matters for varifocals and lens thickness.", "quote": "B is not printed on the frame.", "tags": ["box"]}, {"id": "c-01-q4", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "Which part of a frame lets the side fold?", "options": ["Hinge", "Rim", "Bridge", "End piece"], "answer": 0, "feedback": "The hinge lets the side fold. The end piece is only where the hinge is fixed to the front.", "quote": "Hinge: lets the side fold.", "tags": ["parts"]}, {"id": "c-01-q5", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "A patient's PD is 62 mm and the frame is marked 52 18 140. How far must the lenses be moved in, in total?", "options": ["14 mm in total, 7 mm each side", "4 mm in total, 2 mm each side", "8 mm in total, 4 mm each side", "10 mm in total, 5 mm each side"], "answer": 2, "feedback": "Frame PD is 52 + 18 = 70 mm. 70 - 62 = 8 mm in total, so 4 mm each side.", "quote": "Frame PD (centre-to-centre distance) is the eye size plus the bridge.", "tags": ["decentration"]}, {"id": "c-01-q6", "lesson": "c-01", "level": 1, "type": "tf", "stem": "Two frames from different brands both marked 52 can look different in size.", "options": ["True", "False"], "answer": 0, "feedback": "Brand sizing varies because of rim thickness and shape, so the printed number alone is not the whole story.", "quote": "Brand sizing varies.", "tags": ["watch-out"]}, {"id": "c-01-q7", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "A varifocal is going into a frame. Which measurement is not printed and must be measured with a ruler?", "options": ["The depth of the lens box (B)", "The width of one lens opening", "The distance between the lenses", "The length of the side from hinge to tip"], "answer": 0, "feedback": "Box depth B is never printed. The other three are the printed numbers (eye size, bridge, side length).", "quote": "B is not printed on the frame.", "tags": ["box"]}, {"id": "c-01-q8", "lesson": "c-01", "level": 1, "type": "mcq", "stem": "Why do you work out a frame's centre-to-centre distance?", "options": ["To choose the side length that will sit best behind the ears", "To see how far the lens must be shifted to meet the patient's PD", "To find the depth of the box before ordering a varifocal lens", "To decide whether the frame needs spring hinges or plain ones"], "answer": 1, "feedback": "Comparing it with the patient's PD shows how much decentration the lab must apply. It tells you nothing about side length, hinges or box depth.", "quote": "Compare it with the patient's PD.", "tags": ["frame-pd"]}, {"id": "c-02-q1", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "Which material is light, strong and described as hypoallergenic?", "options": ["Propionate", "Stainless steel", "Titanium", "Monel (nickel alloy)"], "answer": 2, "feedback": "Titanium is the hypoallergenic metal. Some stainless steel contains nickel, and Monel is a nickel alloy.", "quote": "Titanium: light, strong and hypoallergenic.", "tags": ["materials"]}, {"id": "c-02-q2", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "A patient says earrings and a watch strap often irritate her skin. What do you offer?", "options": ["Any metal frame, and wipe the pads often", "An acetate or titanium frame", "A nickel-alloy frame with thick plating", "A frame in whichever style she prefers"], "answer": 1, "feedback": "Her history points to a nickel sensitivity, so offer acetate or titanium. Plating wears through and cleaning does not remove nickel from the alloy.", "quote": "If yes, offer acetate or titanium.", "tags": ["nickel"]}, {"id": "c-02-q3", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "Where on glasses does a nickel reaction usually appear?", "options": ["Along the cheeks below the lens", "Behind the neck where a cord sits", "At the nose pads, bridge and earpieces", "Across the forehead and brow"], "answer": 2, "feedback": "A reaction shows where metal touches skin: nose pads, bridge and earpieces.", "quote": "In glasses, the places that touch the skin are the nose pads, the bridge and the earpieces, so these are where a reaction appears.", "tags": ["nickel"]}, {"id": "c-02-q4", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "A patient has a spreading, sore rash from her old glasses. What do you do?", "options": ["Say it looks like a nickel allergy and note that on her record", "Ask her to wear them less often until the rash has settled", "Offer a different material and suggest a pharmacist or GP for the skin", "Tell her which cream to use and ask her to keep wearing them"], "answer": 2, "feedback": "You change the material but do not diagnose. A spreading, sore rash is for a clinician to look at.", "quote": "Do not diagnose a rash.", "tags": ["scope"]}, {"id": "c-02-q5", "lesson": "c-02", "level": 1, "type": "tf", "stem": "A reaction to an existing pair is a reason to change the material, not to put up with it.", "options": ["True", "False"], "answer": 0, "feedback": "Changing the frame material is part of your job when a reaction is reported.", "quote": "A reaction to an existing pair is a reason to change the material, not to put up with it.", "tags": ["nickel"]}, {"id": "c-02-q6", "lesson": "c-02", "level": 1, "type": "tf", "stem": "You can tell a patient a metal frame is hypoallergenic as long as it looks like titanium.", "options": ["True", "False"], "answer": 1, "feedback": "Only say hypoallergenic when the label or the supplier says so. Looks prove nothing; if you do not know, say so and ask.", "quote": "Do not say a frame is \"hypoallergenic\" unless the label or the supplier says so.", "tags": ["claims"]}, {"id": "c-02-q7", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "When should you ask a patient the nickel question?", "options": ["Once the order has been sent to the lab", "At collection, after the lenses have been glazed", "Early, before the patient chooses a frame", "Only when the patient mentions a rash first"], "answer": 2, "feedback": "Ask early so the patient does not fall for a frame they cannot wear.", "quote": "Ask the nickel question early, before the patient falls for a frame.", "tags": ["nickel"]}, {"id": "c-02-q8", "lesson": "c-02", "level": 1, "type": "mcq", "stem": "Which nose pads are kinder on sensitive skin?", "options": ["Pads with extra colour plating", "Plated metal pads", "Hard plastic pads", "Silicone pads"], "answer": 3, "feedback": "Silicone pads are softer than hard plastic pads and kinder on sensitive skin.", "quote": "silicone pads are softer than hard plastic pads and kinder on sensitive skin.", "tags": ["pads"]}, {"id": "c-03-q1", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "When choosing between two frames, which comes first?", "options": ["Price, then fit", "Brand, then style", "Style, then fit", "Fit, then style"], "answer": 3, "feedback": "Choose for fit first and style second; lenses cannot rescue a frame that does not fit.", "quote": "Choose the frame for fit first and style second.", "tags": ["fit"]}, {"id": "c-03-q2", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "Where should the pupils sit in the lens opening for most prescriptions?", "options": ["Slightly above centre, nearer the brow", "At the nasal edge, to help the bridge sit", "Roughly in the middle, across and up and down", "Low down, so the top of the frame clears the brow"], "answer": 2, "feedback": "Pupils should be roughly central both horizontally and vertically.", "quote": "For most prescriptions, the pupils should be roughly in the middle of the lens opening, both horizontally and vertically.", "tags": ["fit"]}, {"id": "c-03-q3", "lesson": "c-03", "level": 1, "type": "tf", "stem": "The bottom of the frame should not rest on the patient's cheeks.", "options": ["True", "False"], "answer": 0, "feedback": "A frame resting on the cheeks is a fit fault; check the bottom edge as part of the brow and cheek check.", "quote": "The bottom of the frame should not rest on the cheeks.", "tags": ["fit"]}, {"id": "c-03-q4", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "Why does a slipping frame matter optically?", "options": ["The lens becomes thicker at the edge", "The optical centre moves away from the pupil", "The lens power changes as the frame drops", "Reflections on the front surface increase"], "answer": 1, "feedback": "A slipping frame puts the patient behind the wrong part of the lens.", "quote": "Slipping glasses change the optical centre position, so the patient looks through the wrong part of the lens.", "tags": ["fit"]}, {"id": "c-03-q5", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "A frame is a little wider than the patient's face and slips when she looks down. What do you do?", "options": ["Choose a narrower frame or a different bridge", "Bend the sides in tightly so it grips her head", "Sell it and tell her it will settle with wear", "Heat the frame to make the front narrower"], "answer": 0, "feedback": "Do not force a fit the frame cannot reach. Choose another and repeat the checks.", "quote": "Do not bend or heat a frame to force a fit it cannot reach.", "tags": ["fit"]}, {"id": "c-03-q6", "lesson": "c-03", "level": 1, "type": "tf", "stem": "You can make the final fit judgement with the frame in your hand.", "options": ["True", "False"], "answer": 1, "feedback": "Look at the frame on the patient, from the front, side and slightly above.", "quote": "Do not make the final fit judgement with the frame in your hand.", "tags": ["fit"]}, {"id": "c-03-q7", "lesson": "c-03", "level": 1, "type": "mcq", "stem": "A frame suits Miss R but the bridge sits higher on the left, so it tilts. What do you do?", "options": ["Choose a lens with a different base curve", "Call the fit done, since a slight tilt is normal", "Send it to the lab with a note to decentre the lens", "Note a small adjustment and re-check once it is level"], "answer": 3, "feedback": "Do not call the fit done until it is level.", "quote": "You note it for a small adjustment (c-04) and do not call the fit done until it is level.", "tags": ["fit"]}, {"id": "c-03-q8", "lesson": "c-03", "level": 1, "type": "tf", "stem": "You should fit the frame before you measure, because measuring a poorly fitted frame gives wrong figures.", "options": ["True", "False"], "answer": 0, "feedback": "Measurements taken on a badly fitting frame do not match how it will sit when worn.", "quote": "Measuring a poorly fitted frame gives wrong figures (c-10).", "tags": ["measure"]}, {"id": "c-04-q1", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "Which task may a trained Level 1 do?", "options": ["Drill a hole in a rimless mount", "Bend the bridge of a plastic frame", "Move the nose pads on a metal frame", "Replace a broken hinge on a metal frame"], "answer": 2, "feedback": "Adjusting nose pads on metal frames is allowed. Hinge replacement, drilling and bridge bending need a qualified colleague.", "quote": "Adjust nose pads on metal frames: move them in or out, or alter their angle a little.", "tags": ["scope"]}, {"id": "c-04-q2", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "What is the golden rule about adjusting a frame?", "options": ["Warm the frame first so that it cannot snap under the pliers", "Only adjust frames that your practice has sold", "Adjust until it looks right and then check the fit once", "Ask first if you could not repair the frame should it break"], "answer": 3, "feedback": "Never adjust a frame that you could not repair if it broke without asking.", "quote": "The golden rule: never adjust a frame that you could not repair if it broke without asking.", "tags": ["golden-rule"]}, {"id": "c-04-q3", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "You meet resistance while bending a side. What do you do?", "options": ["Stop, and ask a qualified colleague", "Warm it with a hot air gun", "Push a little harder with the pliers", "Bend the other side to match"], "answer": 0, "feedback": "Never force a bend. Resistance means stop.", "quote": "Never force a bend.", "tags": ["safe-method"]}, {"id": "c-04-q4", "lesson": "c-04", "level": 1, "type": "tf", "stem": "Acetate should be warmed with a proper frame warmer, never a naked flame or hot air gun.", "options": ["True", "False"], "answer": 0, "feedback": "Naked flames and hot air guns overheat acetate, which then goes shiny or bubbles.", "quote": "Never use a naked flame or hot air gun.", "tags": ["safe-method"]}, {"id": "c-04-q5", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "What is the safest way to make an adjustment?", "options": ["Remove the lenses first and do it all in one go", "One firm bend, then check the fit when he collects it", "Adjust with the patient out of the room", "A small change, then re-check the fit on the patient"], "answer": 3, "feedback": "Small steps, re-checking on the patient each time.", "quote": "Make a small change, then re-check the fit on the patient.", "tags": ["safe-method"]}, {"id": "c-04-q6", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "A patient hands you an old, thin metal frame with a crack near the hinge and asks you to tighten it up. What do you do?", "options": ["Bend the side slightly to ease the strain on the hinge", "Warm the crack with the frame warmer to close it", "Stop, ask a colleague and explain the risk honestly", "Tighten the hinge screw gently and see if it holds"], "answer": 2, "feedback": "A cracked old frame could snap and you could not repair it. Stop and ask before touching it.", "quote": "Never adjust a frame that you could not repair if it broke without asking.", "tags": ["golden-rule"]}, {"id": "c-04-q7", "lesson": "c-04", "level": 1, "type": "tf", "stem": "A frame that keeps slipping after two adjustments just needs a third.", "options": ["True", "False"], "answer": 1, "feedback": "A frame that keeps slipping or pinching after two adjustments may be the wrong frame.", "quote": "A frame that keeps slipping or pinching after two adjustments may be the wrong frame.", "tags": ["fit"]}, {"id": "c-04-q8", "lesson": "c-04", "level": 1, "type": "mcq", "stem": "Which job needs a qualified colleague rather than a Level 1?", "options": ["Adjusting a rimless three-piece frame", "Straightening a metal side by gentle hand pressure", "Tightening a hinge screw with the right screwdriver", "Bending a metal earpiece tip with the correct pliers"], "answer": 0, "feedback": "Rimless and three-piece mounts can crack the lens if knocked or drilled badly; the other three are on the Level 1 list.", "quote": "Rimless or three-piece frames, where a hard knock to a mount or a drilled hole could crack the lens.", "tags": ["scope"]}, {"id": "d-01-q1", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "A cell on the lens price list shows one figure. What does it cover?", "options": ["One lens, with the coating priced separately", "A pair of lenses plus the fitting", "One lens, so double it for a pair", "Both lenses together, as a pair"], "answer": 3, "feedback": "Every price is per pair. Never quote a single lens.", "quote": "Every price is per pair.", "tags": ["pair"]}, {"id": "d-01-q2", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "The printed list labels a column \"2.25 to 3.00 DS\". How should you treat that label?", "options": ["As the thickness of the lens in millimetres", "As a strict rule that fixes the index", "As a guide to which index usually suits that power", "As a discount band for stronger powers"], "answer": 2, "feedback": "It is a guide only. The frame, the cylinder and what the patient wants also matter.", "quote": "The power labels are a guide.", "tags": ["guide"]}, {"id": "d-01-q3", "lesson": "d-01", "level": 1, "type": "tf", "stem": "If a cell on the lens list is empty, that combination is not sold.", "options": ["True", "False"], "answer": 0, "feedback": "Offer the nearest index that is sold. Never type a price in for it.", "quote": "If the cell is empty, that combination is not sold.", "tags": ["blank"]}, {"id": "d-01-q4", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "A price in the till looks different from the price list. What do you do?", "options": ["Override it to match the list", "Ask the patient which price they prefer", "Change the VAT code to correct the total", "Leave it and tell your practice manager"], "answer": 3, "feedback": "Do not change it. Staff cannot override a price, and overriding breaks the VAT split.", "quote": "If a price on screen in Optix One (desktop) looks different from the list, do not change it.", "tags": ["till"]}, {"id": "d-01-q5", "lesson": "d-01", "level": 1, "type": "tf", "stem": "If a till price looks wrong, a team member can override it to match the list.", "options": ["True", "False"], "answer": 1, "feedback": "Only Administrators can override a price. Staff ask instead.", "quote": "Staff cannot override a price in the till; only Administrators can (from 6 Nov 2026).", "tags": ["till"]}, {"id": "d-01-q6", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "Which three choices find a price on the lens list?", "options": ["Lens design, index band, and clear or Transitions", "Lens design, frame material and index band", "Index band, patient age and Gold or standard", "Frame size, lens design and clear or Transitions"], "answer": 0, "feedback": "Row is the design, column is the index band, then clear or Transitions.", "quote": "Put a finger on the row, then slide to the column, then pick clear or Transitions.", "tags": ["method"]}, {"id": "d-01-q7", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "A patient is between two index bands. What is the tip?", "options": ["Quote both so they can choose", "Quote the cheaper one only", "Choose for them and say it is best", "Quote the thinner one only"], "answer": 0, "feedback": "Quote both so the patient can choose.", "quote": "If the patient is between two bands, quote both so they can choose.", "tags": ["tips"]}, {"id": "d-01-q8", "lesson": "d-01", "level": 1, "type": "mcq", "stem": "A patient wants Road Pilot in 1.74, but that cell is empty. What do you do?", "options": ["Work out a price from the 1.67 cell", "Offer the nearest index that is sold", "Quote the Eyezen Start price instead", "Ask a colleague to type a price in the till"], "answer": 1, "feedback": "There is no 1.74 Road Pilot, so offer the nearest index that is sold.", "quote": "Offer the nearest index that is.", "tags": ["blank"]}, {"id": "d-02-q1", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "What is the Gold member discount on frames?", "options": ["20%", "50%", "30%", "10%"], "answer": 2, "feedback": "Gold members get 30% off frames, 20% off prescription lenses, 50% off additional spectacles within 90 days and 20% off care products.", "quote": "They get 30% off frames, 20% off prescription lenses, 50% off additional spectacles bought within 90 days of the first pair, and 20% off care products.", "tags": ["gold"]}, {"id": "d-02-q2", "lesson": "d-02", "level": 1, "type": "tf", "stem": "You should work out a Gold price yourself for a frame above the top of the list.", "options": ["True", "False"], "answer": 1, "feedback": "Do not work out a Gold price yourself. Ask your practice manager.", "quote": "Do not work out a Gold price yourself.", "tags": ["over-list"]}, {"id": "d-02-q3", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "Which patient is quoted from the Gold member frame column?", "options": ["A patient on Eyecare Plan Gold", "A patient paying by card", "A patient buying two pairs at once", "A patient with an NHS voucher"], "answer": 0, "feedback": "Only a patient on Eyecare Plan Gold.", "quote": "Only a patient on Eyecare Plan Gold.", "tags": ["gold"]}, {"id": "d-02-q4", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "The frame price in the till looks wrong against the list. What do you do?", "options": ["Change the VAT band so the total matches", "Apply a manual discount to match the list", "Leave it and ask your practice manager", "Override the price to match the list"], "answer": 2, "feedback": "Staff never override a price.", "quote": "Staff never override a price.", "tags": ["till"]}, {"id": "d-02-q5", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "A Gold member buys a second pair 60 days after the first. What discount applies to the additional spectacles?", "options": ["50%", "30%", "20%", "10%"], "answer": 0, "feedback": "50% off additional spectacles bought within 90 days of the first pair.", "quote": "50% off additional spectacles bought within 90 days of the first pair", "tags": ["gold"]}, {"id": "d-02-q6", "lesson": "d-02", "level": 1, "type": "tf", "stem": "The Gold column on the frame list is the standard price less 30%, already worked out.", "options": ["True", "False"], "answer": 0, "feedback": "Read it from the column. Do not work out 30% in your head.", "quote": "The Gold column is the standard price less 30%, already worked out.", "tags": ["gold"]}, {"id": "d-02-q7", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "A patient asks whether the Gold plan is worth it. What do you do?", "options": ["Tell her it is worth joining whatever she buys", "Show both columns and let the patient decide", "Say you cannot discuss the plan at the till", "Quote only the Gold price so the plan looks cheaper"], "answer": 1, "feedback": "Do not push it. Show the two columns, and quote the full job both ways if asked.", "quote": "Do not push it.", "tags": ["plan"]}, {"id": "d-02-q8", "lesson": "d-02", "level": 1, "type": "mcq", "stem": "A frame costs more than the highest price on the list. What do you do?", "options": ["Use the highest Gold price on the list", "Ask your practice manager how to price it", "Round it down to the top price on the list", "Take 30% off the tag price in the till"], "answer": 1, "feedback": "Frames over the top of the list: ask in practice.", "quote": "If a frame costs more than the highest price on the list, \"Frames over 365 pounds: ask in practice.\"", "tags": ["over-list"]}, {"id": "d-05-q1", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "Which plan gives 30% off frames and 20% off prescription lenses?", "options": ["Pay as you go", "Essential", "Gold", "Contacts"], "answer": 2, "feedback": "Gold adds the spectacle discounts to what Essential covers.", "quote": "What Gold adds.", "tags": ["plans"]}, {"id": "d-05-q2", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "A patient asks, which plan should I buy? What do you do?", "options": ["Say Gold, since it has the most benefits", "Suggest they ask the optometrist which suits", "Say Essential, since it costs the least each month for them", "Ask what they buy and show the options side by side"], "answer": 3, "feedback": "Never push one plan. Put the options side by side.", "quote": "Put the options side by side without pressure.", "tags": ["conversation"]}, {"id": "d-05-q3", "lesson": "d-05", "level": 1, "type": "tf", "stem": "You can tell a patient a plan will protect their eye health.", "options": ["True", "False"], "answer": 1, "feedback": "The plan covers services. It does not promise eye health outcomes.", "quote": "No medical claims.", "tags": ["claims"]}, {"id": "d-05-q4", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "Which statement is right about Essential and Gold?", "options": ["Only Gold covers the comprehensive eye examination fully", "Only Essential covers emergency examinations", "Neither covers the Optomap retinal scan", "Both fully cover the comprehensive eye examination"], "answer": 3, "feedback": "Both fully cover the exam, scans and emergency examinations. Gold adds spectacle discounts and damage cover.", "quote": "What Essential and Gold fully cover.", "tags": ["plans"]}, {"id": "d-05-q5", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "How much is the Contacts plan each month?", "options": ["11 pounds", "8 pounds", "14 pounds", "Nothing, it is pay as you go"], "answer": 0, "feedback": "Essential is 8 pounds, Contacts 11 and Gold 14.", "quote": "The Contacts plan costs 11 pounds a month and covers the eye exam and contact lens check-ups and gives 50% off contact lenses.", "tags": ["plans"]}, {"id": "d-05-q6", "lesson": "d-05", "level": 1, "type": "tf", "stem": "Gold is also the plan that unlocks the Gold price columns on the lens and frame lists.", "options": ["True", "False"], "answer": 0, "feedback": "Only Gold members are quoted from the Gold columns.", "quote": "Forgetting Gold is also the plan that unlocks the Gold price columns.", "tags": ["plans"]}, {"id": "d-05-q7", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "A patient asks about family cover. Which is right?", "options": ["It is only available on the Contacts plan", "It is included free with the Gold plan", "It replaces the monthly fee for the main member", "An extra monthly amount on Essential and Gold"], "answer": 3, "feedback": "Family cover is available as an extra monthly amount on Essential and Gold.", "quote": "Family cover is available as an extra monthly amount on Essential and Gold.", "tags": ["family"]}, {"id": "d-05-q8", "lesson": "d-05", "level": 1, "type": "mcq", "stem": "What must be true before you sign a patient up to a plan?", "options": ["The patient has bought glasses within 90 days", "The patient has had a Gold lens quote", "The patient has agreed to the monthly payment", "The patient has been tested this year"], "answer": 2, "feedback": "Joining happens in a conversation with the patient agreeing to the monthly payment.", "quote": "Signing up a patient who has not agreed to the monthly payment.", "tags": ["sign-up"]}, {"id": "d-07-q1", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "Why must staff not override a price?", "options": ["It changes the frame stock count on the system", "It cancels any plan discount already applied", "It makes the VAT split on the sale wrong", "It voids the manufacturer's warranty on the lens"], "answer": 2, "feedback": "The price no longer matches the VAT band, which feeds into the accounts and tax return.", "quote": "If someone types a different price over a product, the price no longer matches the band the product was set up in.", "tags": ["vat"]}, {"id": "d-07-q2", "lesson": "d-07", "level": 1, "type": "tf", "stem": "Staff can change a product's VAT band if it looks wrong.", "options": ["True", "False"], "answer": 1, "feedback": "You never change VAT. The product's band does it.", "quote": "You never change VAT.", "tags": ["vat"]}, {"id": "d-07-q3", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "A price on screen differs from the list. What do you do?", "options": ["Fix it yourself so the sale can go through", "Charge whichever price is lower", "Create a new product at the right price", "Stop and ask your practice manager"], "answer": 3, "feedback": "Tell your practice manager before the sale is finished.", "quote": "A price that looks wrong against the list: stop and ask your practice manager.", "tags": ["method"]}, {"id": "d-07-q4", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "How should a discount the patient is entitled to be applied?", "options": ["By typing a new price", "By a discount code", "By asking the lab for a credit", "By changing the VAT band"], "answer": 1, "feedback": "Plan, second pair and NHS voucher discounts all go through codes.", "quote": "A discount the patient is entitled to: use the discount code (plan, second pair, NHS voucher).", "tags": ["codes"]}, {"id": "d-07-q5", "lesson": "d-07", "level": 1, "type": "tf", "stem": "Since 6 November 2026 only Administrators can override a price.", "options": ["True", "False"], "answer": 0, "feedback": "Staff cannot. Do not look for a way round it.", "quote": "Since 6 November 2026 only Administrators can.", "tags": ["rule"]}, {"id": "d-07-q6", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "A patient offers to pay in cash if you take a few pounds off. What do you do?", "options": ["Charge the list price, applying any discount they qualify for", "Override the price this once and tell the manager later", "Round the price down in the till to a tidy figure", "Take the few pounds off in cash and keep a note of it for later"], "answer": 0, "feedback": "Everyone gets the same price from the same list. Apply only discounts they are entitled to, through a code.", "quote": "Agreeing to \"round it down\" because the patient asks nicely.", "tags": ["rule"]}, {"id": "d-07-q7", "lesson": "d-07", "level": 1, "type": "mcq", "stem": "A product the patient wants is missing from the till. What do you do?", "options": ["Invent a product with the right total", "Use a similar product and override its price", "Ask your practice manager", "Add the cost to another item on the job"], "answer": 2, "feedback": "Do not invent one.", "quote": "A product missing from Optix One (desktop): ask. Do not invent one.", "tags": ["rule"]}, {"id": "d-07-q8", "lesson": "d-07", "level": 1, "type": "tf", "stem": "NHS voucher contributions now go through a discount code, not a price override.", "options": ["True", "False"], "answer": 0, "feedback": "Overriding prices for vouchers used to break the VAT split.", "quote": "NHS voucher contributions are now a discount code, not a price override.", "tags": ["vat"]}, {"id": "e-01-q1", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Which two details do you ask for before searching?", "options": ["Full name and date of birth", "First name and phone number", "Full name and plan type", "Surname and postcode"], "answer": 0, "feedback": "Two identifiers, every time.", "quote": "Ask the patient for their full name and date of birth.", "tags": ["id"]}, {"id": "e-01-q2", "lesson": "e-01", "level": 1, "type": "tf", "stem": "If a prescription looks wrong, you can edit it in the record.", "options": ["True", "False"], "answer": 1, "feedback": "You never change a prescription. Ask the optometrist or a dispensing optician.", "quote": "You never change a prescription.", "tags": ["scope"]}, {"id": "e-01-q3", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Why check you are in the correct record before billing?", "options": ["Otherwise the receipt and the history are wrong", "Otherwise the discount codes stop working", "Otherwise the frame barcode will not scan", "Otherwise the lab will reject the order"], "answer": 0, "feedback": "Payment assumes the right patient record.", "quote": "Check you are in the correct record before billing.", "tags": ["id"]}, {"id": "e-01-q4", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "The test you select is nearly three years old. What do you do?", "options": ["Carry on, as the exemption covers it", "Round the date down to two years", "Ask a registrant before going any further", "Copy the numbers into a new test"], "answer": 2, "feedback": "A prescription over two years old is out of date for selling spectacles.", "quote": "A prescription more than two years old is out of date for selling spectacles, so ask a registrant before you go any further.", "tags": ["date"]}, {"id": "e-01-q5", "lesson": "e-01", "level": 1, "type": "tf", "stem": "You should ask the patient to tell you their name and date of birth, not read them out for a yes.", "options": ["True", "False"], "answer": 0, "feedback": "Reading them out invites a yes to the wrong record.", "quote": "Do not read them out for the patient to say \"yes\".", "tags": ["id"]}, {"id": "e-01-q6", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Two patients share a surname. What do you do?", "options": ["Pick the record with the most recent test", "Pick the one whose first name looks closest", "Turn the screen so the patient can point to theirs", "Match both name and date of birth to the record"], "answer": 3, "feedback": "Two details, always. Do not leave a record open where others can see it.", "quote": "Search in Optix One (desktop) and compare both details with the record. Pick the one that matches both.", "tags": ["id"]}, {"id": "e-01-q7", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Which is part of checking a prescription is complete?", "options": ["Sphere for each eye, and the PD copied from the old record", "Sphere only for each eye, as cylinder is optional", "Sphere, cylinder and axis for each eye, plus an add if needed", "The frame size and the patient's PD"], "answer": 2, "feedback": "If any check fails, ask a registrant.", "quote": "Check the prescription is complete: sphere, cylinder and axis for each eye, and an add if the patient needs near correction.", "tags": ["rx"]}, {"id": "e-01-q8", "lesson": "e-01", "level": 1, "type": "mcq", "stem": "Where do the patient's PDs come from?", "options": ["You measure them on the day", "The old record, to save time", "The prescription card", "The PD of the last frame"], "answer": 0, "feedback": "Note PDs only after measuring.", "quote": "Do not copy them from an old record.", "tags": ["measure"]}, {"id": "e-05-q1", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "What do you do first at collection?", "options": ["Mark the job as collected", "Check the job matches the order", "Take any balance and give a receipt", "Phone the lab to confirm the job"], "answer": 1, "feedback": "Check the right patient, pair, frame and lenses before anything else.", "quote": "Check the job: the right patient, the right pair, the right frame, the lenses match the order.", "tags": ["check"]}, {"id": "e-05-q2", "lesson": "e-05", "level": 1, "type": "tf", "stem": "If the glasses do not match the order you may hand them over and fix it later.", "options": ["True", "False"], "answer": 1, "feedback": "Do not hand them over; tell your practice manager.", "quote": "If the glasses do not match the order, do not hand them over.", "tags": ["check"]}, {"id": "e-05-q3", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "Who checks jobs for under-16s?", "options": ["Any team member at the till", "A registrant", "The patient's parent", "The lab before dispatch"], "answer": 1, "feedback": "Under-16s and registered sight impaired patients are dispensed by or under a registrant.", "quote": "A registrant checks these jobs.", "tags": ["scope"]}, {"id": "e-05-q4", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "What do you record after collection?", "options": ["Collection notes, such as happy with distance", "The patient's card PIN", "Nothing, as the receipt is enough", "The lab's delivery address"], "answer": 0, "feedback": "Record notes such as adjustments made or unsure about near.", "quote": "Record collection notes, for example happy with distance, unsure about near, adjustments made.", "tags": ["notes"]}, {"id": "e-05-q5", "lesson": "e-05", "level": 1, "type": "tf", "stem": "A follow-up call should be planned for first-time varifocal or enhanced-reader users.", "options": ["True", "False"], "answer": 0, "feedback": "Also for anyone who was unsure.", "quote": "Plan a follow-up call for first-time varifocal or enhanced-reader users and for anyone who was unsure.", "tags": ["follow-up"]}, {"id": "e-05-q6", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "The glasses do not match the order at collection. What do you do?", "options": ["Hand them over and fix them at the follow-up", "Do not hand them over and tell your practice manager", "Adjust the frame so the patient will not notice", "Offer a discount and let the patient decide"], "answer": 1, "feedback": "Do not promise a remake before the problem has been looked at.", "quote": "If the glasses do not match the order, do not hand them over. Tell your practice manager.", "tags": ["check"]}, {"id": "e-05-q7", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "Which part of collection is not yet written?", "options": ["Taking any balance and giving a receipt", "Checking the job against the order on collection", "The system's status names and follow-up timing", "Fitting and adjusting the glasses with the patient"], "answer": 2, "feedback": "The known parts are check, fit, balance, mark collected. The status names and follow-up timing are still to be confirmed.", "quote": "The exact steps and status names in Optix One (desktop), the follow-up timing and the paperwork that goes with the job.", "tags": ["process"]}, {"id": "e-05-q8", "lesson": "e-05", "level": 1, "type": "mcq", "stem": "What do you ask the patient to do when they try the glasses?", "options": ["Wear them home and return only if sore", "Sign the job to say the lenses are perfect", "Read their prescription back to you", "Look through them and say how they feel"], "answer": 3, "feedback": "Fit, adjust, and ask how they feel before they leave.", "quote": "Ask him to look through them and tell you how they feel.", "tags": ["fit"]}, {"id": "e-11-q1", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "When should you start chasing an order?", "options": ["On the promise date itself", "After the promise date has passed", "A week before the due date", "When the patient phones"], "answer": 2, "feedback": "Chasing early leaves time to fix broken frames or unplaced orders.", "quote": "Start chasing a week before the due date, so problems such as broken frames or unplaced orders can be fixed while keeping the patient informed.", "tags": ["chasing"]}, {"id": "e-11-q2", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "What tag goes on a tray past its promise date?", "options": ["Blue", "Grey", "Yellow", "Red"], "answer": 3, "feedback": "Yellow is for a frame on order.", "quote": "Put a red tag on any tray past its promise date.", "tags": ["tags"]}, {"id": "e-11-q3", "lesson": "e-11", "level": 1, "type": "tf", "stem": "You should offer a discount to every patient whose order is late.", "options": ["True", "False"], "answer": 1, "feedback": "Patients value updates more than discounts, and compensation needs your practice manager's agreement.", "quote": "Patients value updates more than discounts.", "tags": ["patients"]}, {"id": "e-11-q4", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "Where do you record contact with the patient about the order?", "options": ["The supplier's portal", "The Patient Order Notes", "A text message to yourself", "A sticky note on the tray only"], "answer": 1, "feedback": "Record the estimate and every contact, with the method.", "quote": "Record the estimate and every contact, including the method, in the Patient Order Notes.", "tags": ["patients"]}, {"id": "e-11-q5", "lesson": "e-11", "level": 1, "type": "tf", "stem": "A tray with a frame on order gets a yellow tag.", "options": ["True", "False"], "answer": 0, "feedback": "Red is for past the promise date.", "quote": "Put a yellow tag on the tray of any job with a frame on order.", "tags": ["tags"]}, {"id": "e-11-q6", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "A frame will be two weeks late. What do you do today?", "options": ["Offer a discount straight away to avoid a complaint", "Wait and see whether the patient rings first", "Add a note and tag, chase the supplier, phone the patient", "Tell the patient it will be there next week"], "answer": 2, "feedback": "Update patients before they contact you, and give the new estimate once you know it.", "quote": "Update patients before they contact you.", "tags": ["patients"]}, {"id": "e-11-q7", "lesson": "e-11", "level": 1, "type": "mcq", "stem": "You left a patient a voicemail about a delay. What next?", "options": ["Follow up in a few days by another method", "Wait for them to ring you back this week", "Mark the job as patient informed and move on", "Note that you tried and close the matter"], "answer": 0, "feedback": "Follow up and record every attempt.", "quote": "If you leave a voicemail, follow up within a few days by another method and record every attempt.", "tags": ["patients"]}, {"id": "e-11-q8", "lesson": "e-11", "level": 1, "type": "tf", "stem": "You should give the patient a firm arrival date as soon as the frame is ordered.", "options": ["True", "False"], "answer": 1, "feedback": "Do not promise a date you cannot be sure of; give an estimate once you know it.", "quote": "Promising a date you cannot be sure of.", "tags": ["patients"]}, {"id": "f-01-q1", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "Which step of the collection routine comes first?", "options": ["Pre-adjust the frame on the bench", "Check the job against the order first", "Fit the glasses on the patient", "Book the follow-up call"], "answer": 1, "feedback": "Checking the job against the order comes first because every later step is wasted if the glasses are wrong.", "quote": "Check the job against the order first.", "tags": ["collection"]}, {"id": "f-01-q2", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "You have fitted the glasses and the patient says they are clear while sitting still. What is the next step?", "options": ["Hand the glasses over to the patient", "Check distance, near and in motion next", "Book the follow-up for next week", "Check two identifiers against the job"], "answer": 1, "feedback": "Clear while sitting still is not enough: you also check near and while the head moves. Handover and the identifier check come last.", "quote": "Check distance, near and in motion.", "tags": ["collection"]}, {"id": "f-01-q3", "lesson": "f-01", "level": 1, "type": "tf", "stem": "A Level 1 dispenser may do collections alone after five observed collections.", "options": ["True", "False"], "answer": 0, "feedback": "That is the sign-off rule: five observed collections, each signed off by a coach.", "quote": "Level 1 does collections alone after five observed collections.", "tags": ["level"]}, {"id": "f-01-q4", "lesson": "f-01", "level": 1, "type": "tf", "stem": "If the job looks right at a glance, you can skip comparing it with the order.", "options": ["True", "False"], "answer": 1, "feedback": "Never skip step 1 because the job looks right. Compare the glasses with the order every time.", "quote": "Do not skip step 1 because the job \"looks right\".", "tags": ["collection"]}, {"id": "f-01-q5", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "Which two identifiers are checked before the glasses are handed over?", "options": ["Full name plus date of birth", "First name plus the phone number only", "Order number plus the total price paid", "Frame brand plus the lens coating type"], "answer": 0, "feedback": "Two personal identifiers stop someone leaving with another patient's glasses.", "quote": "Check two identifiers before you hand the glasses over: the full name and one other, such as date of birth or address.", "tags": ["identity"]}, {"id": "f-01-q6", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "Before the patient sits down you find the frame in the bag is a different colour from the order. What do you do?", "options": ["Fit it anyway and mention the colour to him", "Pre-adjust it and see if he likes it", "Swap it for a similar frame on display", "Stop, do not fit it, and tell the practice manager"], "answer": 3, "feedback": "A mistake found now costs five minutes. Stop at step 1, do not fit the wrong frame, and let the practice manager or dispensing optician phone the patient.", "quote": "A mistake found now costs you five minutes; a mistake found at home costs a remake and a patient's trust.", "tags": ["collection"]}, {"id": "f-01-q7", "lesson": "f-01", "level": 1, "type": "mcq", "stem": "Straight after you hand the glasses over, a patient says everything looks double. What do you do?", "options": ["Reassure them and book the follow-up", "Stop what you are doing and fetch a registrant", "Tell them it is normal for a first pair", "Re-adjust the nose pads and ask again"], "answer": 1, "feedback": "Double vision or glasses that hurt straight away is a stop sign, not a first-impression objection. Fetch a registrant.", "quote": "If the patient reports double vision, or says the glasses are blurred or hurt their head straight away, stop and fetch a registrant.", "tags": ["escalate"]}, {"id": "f-01-q8", "lesson": "f-01", "level": 1, "type": "order", "stem": "Put these steps of the collection routine in order.", "options": ["Check the job against the order", "Pre-adjust the frame", "Fit the glasses", "Check distance, near and in motion", "Check two identifiers"], "answer": 0, "feedback": "Check first, adjust and fit, test vision in use, and keep the identifier check as the final gate.", "quote": "Step 8 comes last because it is the final gate.", "tags": ["order"]}, {"id": "f-02-q1", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "When should a patient start wearing their new glasses?", "options": ["First thing in the morning", "Halfway through the first day", "Only for reading and close work", "Evenings only, once they are home"], "answer": 0, "feedback": "Starting first thing in the morning means the day's whole routine adapts together, rather than swapping halfway through.", "quote": "Start wearing the new glasses first thing in the morning, not halfway through the day.", "tags": ["adaptation"]}, {"id": "f-02-q2", "lesson": "f-02", "level": 1, "type": "tf", "stem": "Swapping back to the old pair during the first week speeds up adaptation.", "options": ["True", "False"], "answer": 1, "feedback": "Swapping slows adaptation. Ask the patient to wear the new pair as much as possible.", "quote": "Wear them as much as possible; swapping back to the old pair slows adaptation.", "tags": ["adaptation"]}, {"id": "f-02-q3", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "A patient says they have double vision with their new glasses. What is the right response?", "options": ["Tell them it is normal and to give it a week", "Pass it to a registrant for a prompt review", "Re-measure the heights and reorder new lenses", "Advise them to wear the old pair for a month"], "answer": 1, "feedback": "Double vision is not getting used to it. You do not diagnose; you pass it to a registrant.", "quote": "You do not diagnose; you pass the call to a registrant", "tags": ["escalate"]}, {"id": "f-02-q4", "lesson": "f-02", "level": 1, "type": "tf", "stem": "A little difficulty with stairs or kerbs in the first days of wearing varifocals is normal.", "options": ["True", "False"], "answer": 0, "feedback": "Unfamiliarity and some difficulty on stairs or kerbs are expected at first with a varifocal.", "quote": "a little difficulty with stairs or kerbs for the first days with a varifocal are normal", "tags": ["normal"]}, {"id": "f-02-q5", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "What simple rule do you give a first-time varifocal wearer?", "options": ["Point your nose at what you want to see", "Keep your head still and only move your eyes", "Look over the top of the frame to read close", "Slide the glasses down your nose to read"], "answer": 0, "feedback": "Nose at target helps the wearer use the right part of the lens. Holding the head still makes varifocals harder.", "quote": "tell the patient to point their nose at what they want to see", "tags": ["varifocal"]}, {"id": "f-02-q6", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "A nervous patient asks whether they will definitely get used to the glasses. What do you say?", "options": ["It will definitely be fine, so do not worry", "It usually settles, and you can come back any time", "Everyone adapts in a day, so there is no need to ring", "Some people never adapt, so keep your receipt safe"], "answer": 1, "feedback": "Never promise that adaptation will be fine. Say it usually settles and invite them back.", "quote": "Do not promise that adaptation \"will be fine\". Say it usually settles, and invite them back.", "tags": ["honesty"]}, {"id": "f-02-q7", "lesson": "f-02", "level": 1, "type": "mcq", "stem": "Which of these is correct care advice?", "options": ["Rest them lens-down so the frame is not marked", "Leave them on the dashboard so they are to hand", "Keep them in their case whenever they are taken off", "Clean them dry with a corner of tissue paper"], "answer": 2, "feedback": "The case protects the lenses. Lens-down and hot cars damage them, and cleaning uses the spray and cloth supplied.", "quote": "Keep the glasses in the case whenever they are off.", "tags": ["care"]}, {"id": "f-02-q8", "lesson": "f-02", "level": 1, "type": "tf", "stem": "The care and adaptation talk forms part of the collection routine.", "options": ["True", "False"], "answer": 0, "feedback": "It is step 5 of the collection routine.", "quote": "The care and adaptation talk is step 5 of the collection routine.", "tags": ["collection"]}, {"id": "f-05-q1", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "What should you do first when a patient brings in glasses to be adjusted?", "options": ["Ask what is wrong and listen", "Start tightening the loosest screw", "Quote the price of a repair at once", "Pass them straight to reception"], "answer": 0, "feedback": "Ask which side, when it started and whether anything happened before you touch the glasses.", "quote": "Greet and ask exactly what is wrong.", "tags": ["process"]}, {"id": "f-05-q2", "lesson": "f-05", "level": 1, "type": "tf", "stem": "You should record what you did to the glasses on the patient's file.", "options": ["True", "False"], "answer": 0, "feedback": "Step 5 of the desk routine is to record what you did.", "quote": "Record what you did on the patient's file.", "tags": ["record"]}, {"id": "f-05-q3", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "A patient says, \"I cannot see properly with these.\" What is this?", "options": ["A repair to be booked as a fitting", "A complaint, handled as non-tolerance", "A routine adjustment you can do at once", "A request for a refund or credit note"], "answer": 1, "feedback": "Complaints are not repairs. Use the first-line non-tolerance steps and fetch a registrant for the stop signs.", "quote": "**Complaints are not repairs.**", "tags": ["complaint"]}, {"id": "f-05-q4", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "Which of these should you avoid saying before you know what the repair is?", "options": ["\"Let me have a look at them\"", "\"It will be free and quick\"", "\"I will take your details first\"", "\"Thank you for bringing them in\""], "answer": 1, "feedback": "Do not promise cost or timing until you know what the repair is.", "quote": "Do not promise a free repair or a quick return before you know.", "tags": ["honesty"]}, {"id": "f-05-q5", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "The hinge looks cracked and has been glued before. Who decides what to do?", "options": ["You decide and glue it again with the kit", "A colleague or the dispensing optician", "You heat the frame and re-bend it", "The patient decides whether to risk it"], "answer": 1, "feedback": "If a part is broken, cracked or glued, a colleague or the dispensing optician decides.", "quote": "If a part is broken, cracked or glued, a colleague or the dispensing optician decides.", "tags": ["safety"]}, {"id": "f-05-q6", "lesson": "f-05", "level": 1, "type": "tf", "stem": "If you cannot fix glasses at the desk, send the patient away and ask them to phone later.", "options": ["True", "False"], "answer": 1, "feedback": "Take their details and book a 20-minute Spectacle Fitting slot with the problem in the remarks.", "quote": "take their details, book a 20-minute Spectacle Fitting slot with the problem in the remarks, and say when it will be ready.", "tags": ["booking"]}, {"id": "f-05-q7", "lesson": "f-05", "level": 1, "type": "order", "stem": "Put the desk adjustment steps in order.", "options": ["Ask exactly what is wrong", "Look at the glasses", "Do only what you are trained to do", "Check the result with the patient wearing them", "Record what you did on the file"], "answer": 0, "feedback": "Listen first, look before you touch, adjust within your training, check on the face, then record.", "quote": "Most desk adjustments are simple, but the order matters.", "tags": ["order"]}, {"id": "f-05-q8", "lesson": "f-05", "level": 1, "type": "mcq", "stem": "Their glasses need a repair you cannot finish today and they have no other pair. What do you do?", "options": ["Make sure they leave with something to see through", "Keep the glasses and send them home without them", "Tell them to manage until the repair is done", "Hand over the broken pair and apologise"], "answer": 0, "feedback": "Never leave a patient without a way to see: offer the old pair or a loan pair if the practice has one.", "quote": "Never leave a patient without a way to see", "tags": ["safety"]}, {"id": "f-08-q1", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "How should you answer the phone?", "options": ["Name, practice and an offer of help", "The practice name only, then wait for them", "A cheerful hello and the patient's surname", "The practice name and the opening hours"], "answer": 0, "feedback": "Say who is speaking, which practice, and offer help.", "quote": "Answer with who is speaking, which practice, and an offer of help.", "tags": ["phone"]}, {"id": "f-08-q2", "lesson": "f-08", "level": 1, "type": "tf", "stem": "A confirmation or reminder should be sent for FUD calls.", "options": ["True", "False"], "answer": 1, "feedback": "Do not send a confirmation or reminder for FUD calls.", "quote": "Do not send a confirmation or reminder for FUD calls.", "tags": ["FUD"]}, {"id": "f-08-q3", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "A caller mentions new flashing lights in one eye. What do you do?", "options": ["Book a routine slot for next month", "Treat as urgent; pass it to a registrant", "Tell them it is probably just tiredness", "Ask them to email a full description"], "answer": 1, "feedback": "Flashing lights are a warning word. Do not decide; pass the call to a registrant straight away.", "quote": "If you hear any of these, treat it as urgent.", "tags": ["warning"]}, {"id": "f-08-q4", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "Which patients are routinely given a follow-up call (FUD)?", "options": ["Anyone collecting a spare pair", "First varifocal wearers", "Everyone after a repair", "Contact lens trial patients"], "answer": 1, "feedback": "Use FUD for first varifocals and for patients who said they will return later.", "quote": "Use FUD for first varifocals and for patients who said they will return later.", "tags": ["FUD"]}, {"id": "f-08-q5", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "An order is delayed. What do you do?", "options": ["Update the status, then phone them", "Phone first and update the status next week", "Email only and wait for a reply", "Wait until it arrives, then let them know"], "answer": 0, "feedback": "Update the status straight away, then phone. If you cannot reach them, email as well.", "quote": "Update the order status straight away, then phone the patient.", "tags": ["delays"]}, {"id": "f-08-q6", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "A caller describes a sudden shadow across their sight and no registrant is free. What do you tell them?", "options": ["Book them in for a routine check next week", "Wait by the phone for a call-back from the optometrist", "Go to A&E or eye casualty today, not driving", "Rest their eyes and ring us again tomorrow if worse"], "answer": 2, "feedback": "A sudden shadow needs to be seen today. If no registrant can be reached, send them to A&E or eye casualty now, or NHS 111. Never book a routine slot or tell them to wait.", "quote": "If you cannot reach anyone, tell the patient this needs to be seen today", "tags": ["warning"]}, {"id": "f-08-q7", "lesson": "f-08", "level": 1, "type": "tf", "stem": "You should confirm who you are speaking to before discussing a patient's details.", "options": ["True", "False"], "answer": 0, "feedback": "Confirming identity protects the patient's privacy.", "quote": "Confirm who you are speaking to before discussing a patient's details.", "tags": ["privacy"]}, {"id": "f-08-q8", "lesson": "f-08", "level": 1, "type": "mcq", "stem": "A patient does not answer a follow-up call. What do you do?", "options": ["Leave the full details of the problem on voicemail", "Ring back every ten minutes until they answer", "Leave a brief message and log the call with the date", "Send a text giving all the details"], "answer": 2, "feedback": "Do not leave detailed voicemails, and do not call repeatedly. Log voicemails with the date.", "quote": "Do not call the same person repeatedly in a short span. Log voicemails with the date.", "tags": ["voicemail"]}, {"id": "f-09-q1", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "What is a handover?", "options": ["A short written note of all work still open", "A daily list of the sales figures taken", "A rota showing who covers which room", "A formal report that is sent to the owner"], "answer": 0, "feedback": "A handover is a short written note of everything still open.", "quote": "A handover is a short written note of everything still open.", "tags": ["handover"]}, {"id": "f-09-q2", "lesson": "f-09", "level": 1, "type": "tf", "stem": "Full patient details should be written on a shared handover sheet.", "options": ["True", "False"], "answer": 1, "feedback": "Use initials or the job reference on a shared sheet; full details are in the record.", "quote": "Use patient initials or the job reference, not full details, on a shared sheet", "tags": ["privacy"]}, {"id": "f-09-q3", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "Which item should come first on the sheet?", "options": ["The oldest item on the list", "The most urgent item", "The item you finished first", "The longest item to explain"], "answer": 1, "feedback": "Put the most urgent first so it is read first.", "quote": "Put the most urgent first.", "tags": ["priority"]}, {"id": "f-09-q4", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "Why does a forgotten promised call matter?", "options": ["It breaks the practice's filing rules", "A small problem can quickly turn into a complaint", "It lowers the weekly sales figures a little", "It is just a small piece of paperwork"], "answer": 1, "feedback": "The patient remembers that nobody rang.", "quote": "A promised call that is forgotten turns a small problem into a complaint.", "tags": ["trust"]}, {"id": "f-09-q5", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "Which of these belongs on the handover?", "options": ["A call you promised to make tomorrow", "The weekly sales total for the practice", "A colleague's holiday request", "The price list for sunglasses"], "answer": 0, "feedback": "Promised calls come first on the list: who, why and by when.", "quote": "Who, why, and by when.", "tags": ["contents"]}, {"id": "f-09-q6", "lesson": "f-09", "level": 1, "type": "tf", "stem": "Before you go, any call you promised should already be in the diary.", "options": ["True", "False"], "answer": 0, "feedback": "Confirm promised calls are in the diary before you leave.", "quote": "Confirm that any call you promised is in the diary.", "tags": ["checklist"]}, {"id": "f-09-q7", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "How should a patient be identified on a shared handover sheet?", "options": ["By initials or job reference", "By full name and date of birth", "By full name and home address", "By phone number and the surname"], "answer": 0, "feedback": "Initials or the job reference keep full details in the record, not on a shared sheet.", "quote": "Use patient initials or the job reference, not full details, on a shared sheet; full details are in the record.", "tags": ["privacy"]}, {"id": "f-09-q8", "lesson": "f-09", "level": 1, "type": "mcq", "stem": "Something urgent is left open at the end of your shift. What do you do?", "options": ["Tell the next person in person too", "Leave it as the last line of the sheet", "Keep it in your head and text it later", "Assume the next person will read the sheet"], "answer": 0, "feedback": "Tell the next person verbally about anything urgent, as well as writing it down.", "quote": "Tell the next person verbally about anything urgent.", "tags": ["urgent"]}, {"id": "g-01-q1", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "A patient says, \"My vision has gone blurry in one eye and I want it sorted.\" Which buying driver is this?", "options": ["Moving away from a problem", "Moving towards something new", "Wanting the same as last time", "Wanting something different"], "answer": 0, "feedback": "Blur and worry about the eyes is pain to move away from. Lead with their health and the optometrist's advice.", "quote": "People buy to move away from a problem, or towards something they want.", "tags": ["why-people-buy"]}, {"id": "g-01-q2", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "Which set names the four kinds of block in a good dispensing conversation?", "options": ["Greet, qualify, discount and finish", "Position, connect, reassure, close", "Ask, tell, persuade and close", "Frame, lens, coating and price"], "answer": 1, "feedback": "The four blocks are position, connect, reassure and close.", "quote": "Every good conversation is built from four kinds of block: position, connect, reassure and close.", "tags": ["building-blocks"]}, {"id": "g-01-q3", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "\"Driving feels easier after dark\" is which of these?", "options": ["A feature", "A benefit", "The meaning", "A claim about eye health"], "answer": 2, "feedback": "Feature is what it is, benefit is what it does, meaning is what it gives them. Spend most time on the meaning.", "quote": "\"Driving feels easier after dark\" is the meaning.", "tags": ["feature-benefit-meaning"]}, {"id": "g-01-q4", "lesson": "g-01", "level": 1, "type": "tf", "stem": "Lenses come first because, when money is tight, people tend to cut back on the frame before the lenses.", "options": ["True", "False"], "answer": 0, "feedback": "Once a lens is explained it stops being an extra and becomes something the patient needs.", "quote": "Lenses come first, because when money is tight people cut back on the frame before they cut back on the lenses.", "tags": ["lenses-first"]}, {"id": "g-01-q5", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "Why say \"advises\" rather than \"we can offer\"?", "options": ["Advises sounds like a need, where offer sounds optional", "An offer is a word the regulator does not allow", "Advises is quicker to say at a busy desk", "Advises lets you leave the price until later"], "answer": 0, "feedback": "Advises presents the lens as a need. An offer sounds like an extra the patient can decline.", "quote": "Say \"advises\" rather than \"we can offer\", because a need sounds like a need and an offer sounds optional.", "tags": ["language"]}, {"id": "g-01-q6", "lesson": "g-01", "level": 1, "type": "tf", "stem": "If a patient hesitates or asks a question, you should carry on to the end of your script.", "options": ["True", "False"], "answer": 1, "feedback": "Do not recite. Stop and answer the question; you are judged on results and how patients feel.", "quote": "Do not recite. If a patient hesitates, goes quiet or asks a question, stop and answer it.", "tags": ["recite"]}, {"id": "g-01-q7", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "A patient says, \"I just want the same frame as last time.\" What are they showing?", "options": ["A wish for certainty", "A wish for variety", "A problem to move away from", "A hunt for a bargain"], "answer": 0, "feedback": "Wanting the same frame is certainty. Variety would be something different.", "quote": "Others want certainty (\"the same frame as last time\") or variety (\"something different\").", "tags": ["why-people-buy"]}, {"id": "g-01-q8", "lesson": "g-01", "level": 1, "type": "mcq", "stem": "A patient asks whether a lens will stop their eye condition getting worse. What do you say?", "options": ["It will protect your eyes from the condition", "It helps you look after your eyes", "It will slow it down for most people", "It is a cure for that kind of condition"], "answer": 1, "feedback": "Never promise a lens will prevent or cure an eye condition. Say \"look after your eyes\" and check the record or ask a registrant.", "quote": "Do not promise that a lens will prevent or cure an eye condition.", "tags": ["claims"]}], "n": 20, "pass_": 0.8};</script><script src="assets/app.js"></script></body></html>

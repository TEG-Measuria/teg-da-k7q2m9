ce", "n": 8, "fl": true}}, "page": "flash", "cards": [{"term": "Registrant", "means": "Someone on the General Optical Council (GOC) register: an optometrist or a dispensing optician.", "level": 0}, {"term": "Optometrist", "means": "Tests eyes, checks eye health and writes the prescription.", "level": 0}, {"term": "Dispensing optician (DO)", "means": "Advises on, fits and supplies glasses; is always a registrant (GOC-registered).", "level": 0}, {"term": "Prescription (Rx)", "means": "The written power of the lenses a patient needs, given after a sight test.", "level": 0}, {"term": "Dioptre (D)", "means": "The unit that measures lens power.", "level": 0}, {"term": "Sphere", "means": "The main power: plus for long sight and minus for short sight.", "level": 0}, {"term": "Cylinder and axis", "means": "Extra power, and its direction, used to correct astigmatism.", "level": 0}, {"term": "Add", "means": "The extra power added for reading.", "level": 0}, {"term": "Prism", "means": "A power that shifts the image to help the eyes work together.", "level": 0}, {"term": "Single vision (SV)", "means": "One power over the whole lens.", "level": 0}, {"term": "Bifocal", "means": "Two powers, distance and reading, with a visible dividing line.", "level": 0}, {"term": "Varifocal (progressive)", "means": "A smooth change in power from far to near, with no visible line.", "level": 0}, {"term": "Office or occupational lens", "means": "A lens for desk and screen work.", "level": 0}, {"term": "Index", "means": "How strongly a lens material bends light. A higher index lets the lens be thinner for the same prescription.", "level": 0}, {"term": "Coating", "means": "A surface treatment, such as anti-reflection or scratch protection.", "level": 0}, {"term": "Tint and photochromic", "means": "Lenses that are coloured, or that darken in sunlight.", "level": 0}, {"term": "PD (pupillary distance)", "means": "The distance between the pupils.", "level": 0}, {"term": "Height", "means": "How high above the frame bottom the eye sits. It matters most for varifocals.", "level": 0}, {"term": "Focimeter (lensometer)", "means": "The instrument that checks the power and centre of a lens.", "level": 0}, {"term": "Vertex distance", "means": "The gap between the back of the lens and the eye.", "level": 0}, {"term": "Dispense", "means": "Choosing and ordering glasses with a patient.", "level": 0}, {"term": "Collection", "means": "The visit where the finished glasses are checked and handed over.", "level": 0}, {"term": "Reglaze", "means": "New lenses in an existing frame.", "level": 0}, {"term": "Recall", "means": "A reminder that the next eye test is due.", "level": 0}, {"term": "NHS voucher", "means": "Help towards glasses for people who qualify.", "level": 0}, {"term": "Safeguarding", "means": "Protecting people from harm, abuse or neglect, including children and adults who may be unable to protect themselves.", "level": 0}, {"term": "Two identifiers", "means": "Check two before giving information or handing over a job: full name and date of birth, or address or postcode.", "level": 0}, {"term": "DSAR", "means": "A request to see the data we hold on someone. A verbal request is valid; tell the manager.", "level": 0}, {"term": "Data breach", "means": "Patient data going to the wrong place or person, or lost. Tell the practice manager the same day.", "level": 0}, {"term": "Shadowing", "means": "At Level 0 you watch at least 20 dispenses and do not serve alone.", "level": 0}, {"term": "8-step collection routine", "means": "Check the job, pre-adjust, fit, distance near and motion, care and adaptation talk, objections, follow-up, two identifiers.", "level": 1}, {"term": "Pre-adjust", "means": "Get the frame roughly right on the bench: sides level, pads symmetrical, angles about right.", "level": 1}, {"term": "Care and adaptation talk", "means": "Step 5 of the collection routine: cleaning, case, wearing all day from the morning, and what to expect.", "level": 1}, {"term": "Adaptation", "means": "Getting used to new glasses. Start first thing in the morning and wear them as much as possible.", "level": 1}, {"term": "Warning words", "means": "Sudden, loss of vision, pain, flashing lights, new floaters, a shadow or web, double vision, severe headache. Treat as urgent.", "level": 1}, {"term": "FUD (follow-up call)", "means": "A 10-minute Phone Call to Patient slot at a quiet admin time, used for first varifocals and unsure patients.", "level": 1}, {"term": "Spectacle Fitting slot", "means": "A 20-minute slot booked for a repair or adjustment, with the problem in the remarks.", "level": 1}, {"term": "Handover", "means": "A short written note of everything still open, using initials or the job reference, not full details.", "level": 1}, {"term": "Level 1 adjustments", "means": "Tighten hinge screws, adjust pads on metal frames, straighten sides, small earpiece bends, warm acetate sides, check the fit.", "level": 1}, {"term": "Needs a qualified colleague", "means": "Bending a front, rimless frames, titanium, soldering, hinge replacement and anything you have not been trained on.", "level": 1}, {"term": "Golden rule of adjusting", "means": "Never adjust a frame that you could not repair if it broke without asking first.", "level": 1}, {"term": "Acetate", "means": "A plastic frame material. Warm it evenly with a proper frame warmer; overheated acetate goes shiny or bubbles.", "level": 1}, {"term": "Bridge", "means": "The part of the frame that sits on the nose; fit first means bridge, sides and ears.", "level": 1}, {"term": "Nickel allergy", "means": "A reaction where metal touches the skin; acetate or nickel-free titanium are the safer choices.", "level": 1}]};</script><script src="assets/app.js"></script></body></html>

pen": false, "visible": true, "status": "draft - not for learners", "ver": "49c7842", "n": 8, "fl": true}, "h-02": {"title": "Who suits a varifocal, and first-time wearers", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "51856ab", "n": 8, "fl": true}, "h-03": {"title": "Our varifocal ladder: Visio Digital to XR Pro", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "0e20cbf", "n": 8, "fl": true}, "h-04": {"title": "Personalisation: the four levels", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "f46287f", "n": 8, "fl": true}, "h-05": {"title": "Fitting heights and minimum heights", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "6338935", "n": 8, "fl": true}, "h-06": {"title": "Choosing a frame for a varifocal", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "88721bf", "n": 8, "fl": true}, "h-07": {"title": "Measuring for a varifocal: monocular PD and heights", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "712464a", "n": 8, "fl": true}, "h-08": {"title": "Varifocal non-tolerance: causes and checks", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "f03efcc", "n": 8, "fl": true}, "h-09": {"title": "Selling the varifocal: show the difference", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "79b251e", "n": 8, "fl": true}, "h-10": {"title": "Checking in a varifocal: markings and engravings", "level": 3, "track": "H", "open": false, "visible": true, "status": "draft - not for learners", "ver": "7bc46e0", "n": 8, "fl": true}, "h-11": {"title": "The 90-day check: what amazing looks like", "level": 3, "track": "H", "open": true, "visible": true, "status": "published", "ver": "c26f7ce", "n": 8, "fl": true}}, "page": "test", "id": "T0", "qs": [{"id": "l0-01-q1", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "What may you do alone at Level 0?", "options": ["Collections using the 8-step routine", "Repairs and simple adjustments", "Nothing alone; you shadow dispenses", "Adult single vision dispenses"], "answer": 2, "feedback": "Level 0 is induction. You shadow at least 20 dispenses and do nothing alone, so even a simple adjustment waits until Level 1.", "quote": "Level 0, Induction: you do nothing alone.", "tags": ["levels"]}, {"id": "l0-01-q2", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "Who watches you do the real thing before you move up a Level?", "options": ["A colleague who is already at the same Level as you", "A registrant, an optometrist or dispensing optician", "The patient you are serving, who gives a rating", "A supplier representative visiting the practice"], "answer": 1, "feedback": "Sign-off is by a registrant. A colleague at your own Level, however friendly, cannot sign you off.", "quote": "A registrant (an optometrist or dispensing optician) watches you do the real thing.", "tags": ["signoff"]}, {"id": "l0-01-q3", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "What score do you need on the escalate-or-stop set?", "options": ["80%, the same as every module", "90% with one retry allowed", "100%, retrying until it is perfect", "75% averaged over three attempts"], "answer": 2, "feedback": "The set protects patients from harm, so it needs 100%. Modules are 80%, which is why the two scores must not be confused.", "quote": "The escalate-or-stop set, which you meet in lesson 4, needs 100%, because it protects patients from harm.", "tags": ["gate"]}, {"id": "l0-01-q4", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "When do the spaced re-tests appear after a module?", "options": ["At 1 day, 7 days and 30 days", "At 1 week, 1 month and 1 year", "Every morning for the first fortnight", "Once only, at the end of Level 1"], "answer": 0, "feedback": "Short re-tests at 1, 7 and 30 days move knowledge from a quick read into something you can use at the counter.", "quote": "Memory fades fast, so the Academy asks you a few questions again at 1 day, 7 days and 30 days after each module.", "tags": ["retest"]}, {"id": "l0-01-q5", "lesson": "l0-01", "level": 0, "type": "tf", "stem": "True or false: you show your completion codes to your coach at the weekly check-in.", "options": ["True", "False"], "answer": 0, "feedback": "The codes are your record, and the check-in is where the coach sees them.", "quote": "Every week you spend 10 minutes with your coach.", "tags": ["checkin"]}, {"id": "l0-01-q6", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "You have done 5 observed collections and passed the Level 1 quiz. What decides whether you move up?", "options": ["How many shifts you have worked so far", "The registrant judging that you are ready", "Your quiz score from the very first week", "How many sales you made last month"], "answer": 1, "feedback": "Five observed collections is only a minimum. The registrant must also judge you ready and ask a 5-question spoken spot-check.", "quote": "The count is only a minimum.", "tags": ["signoff"]}, {"id": "l0-01-q7", "lesson": "l0-01", "level": 0, "type": "tf", "stem": "True or false: if you score well on a module quiz, you may serve patients alone straight away.", "options": ["True", "False"], "answer": 1, "feedback": "You may only serve alone at a Level once you are signed off for it, however well you did in the quiz.", "quote": "Do not serve patients alone before you are signed off for that Level, however well you did in the quiz.", "tags": ["levels"]}, {"id": "l0-01-q8", "lesson": "l0-01", "level": 0, "type": "mcq", "stem": "A lesson step does not match what you see in practice. What do you do?", "options": ["Use the \"report a wrong step\" link, which goes to Jimmy", "Quietly follow the lesson anyway and say nothing about it", "Change the way the practice works to match the lesson", "Wait for the next re-test to mention the problem"], "answer": 0, "feedback": "The link exists for exactly this. Staying silent leaves a wrong step in front of the next learner, and you will never be in trouble for using it.", "quote": "Every lesson has a \"report a wrong step\" link.", "tags": ["report"]}, {"id": "l0-02-q1", "lesson": "l0-02", "level": 0, "type": "order", "stem": "Put these stages in the correct order.", "options": ["Eye test", "Needs-finding", "Frame choice", "Collection and fitting"], "answer": 0, "feedback": "The patient is tested first, then asked about their needs, then chooses a frame, then collects the finished glasses.", "quote": "Eye test. An optometrist tests the eyes, checks eye health and writes the prescription.", "tags": ["journey"]}, {"id": "l0-02-q2", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "Why does frame choice come before lens advice?", "options": ["The frame decides which lenses can work, so fit and style come first", "Frames cost more than lenses, so the patient should decide first", "Lens advice can only be given once the order has been placed", "The lab needs the frame chosen before it will quote anything"], "answer": 0, "feedback": "Frame size, shape and style limit the lens options. It is not about cost or lab rules.", "quote": "Fit and style come first, because the frame decides which lenses can work.", "tags": ["frames"]}, {"id": "l0-02-q3", "lesson": "l0-02", "level": 0, "type": "tf", "stem": "True or false: you do not change a prescription, and you do not say what is wrong with someone's eyes.", "options": ["True", "False"], "answer": 0, "feedback": "Correct. Diagnosis and prescribing belong to the optometrist, and you pass concerns on to a registrant.", "quote": "You do not diagnose, you do not change a prescription, and you do not say what is wrong with someone's eyes.", "tags": ["role"]}, {"id": "l0-02-q4", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "A patient says they know exactly what they want. What do you do?", "options": ["Ask about their needs anyway", "Skip it and take the order", "Quote the cheapest option first", "Send them back to the booking desk"], "answer": 0, "feedback": "Needs-finding is always worth doing; the right choice depends on how they use their glasses, not on what they ask for first.", "quote": "Do not skip needs-finding because a patient says they know what they want. Ask anyway.", "tags": ["needs"]}, {"id": "l0-02-q5", "lesson": "l0-02", "level": 0, "type": "tf", "stem": "True or false: you should quote a price before you know what the patient needs.", "options": ["True", "False"], "answer": 1, "feedback": "Quoting first anchors the patient on the cheapest option. Needs come first, then the lens, then a confident price.", "quote": "Do not quote a price before you know what the patient needs.", "tags": ["price"]}, {"id": "l0-02-q6", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "While choosing a frame, a patient mentions flashing lights in one eye. What do you do?", "options": ["Get a registrant involved straight away", "Reassure them that it is common and carry on", "Suggest an anti-reflection coating to reduce glare", "Note it for the follow-up call after collection"], "answer": 0, "feedback": "Flashing lights sound clinical. You do not guess at the cause or reassure; you fetch a registrant.", "quote": "such as a patient who mentions flashing lights or a prescription that looks odd, and who gets a registrant involved.", "tags": ["escalate"]}, {"id": "l0-02-q7", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "Which stage comes straight after frame choice?", "options": ["Lens advice, then the price", "Ordering the job with the lab", "Collection and fitting of the glasses", "The recall reminder to the patient"], "answer": 0, "feedback": "After the frame, lenses are matched to the person and the price is stated. Ordering follows measuring.", "quote": "Lens advice. Lenses are matched to the person, not to the price.", "tags": ["journey"]}, {"id": "l0-02-q8", "lesson": "l0-02", "level": 0, "type": "mcq", "stem": "Which of these is the dispenser's job rather than the optometrist's?", "options": ["Writing the prescription after the sight test and noting it for the lab", "Taking the measurements that put the lens in the right place", "Checking eye health and looking for signs of eye disease", "Explaining to the patient which condition lies behind their symptoms"], "answer": 1, "feedback": "Measuring is a dispenser task. Prescribing, eye health checks and diagnosis belong to the optometrist.", "quote": "Measuring. The dispenser takes the measurements that put the lens in the right place.", "tags": ["role"]}, {"id": "l0-05-q1", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "You are worried about a patient. What is the right first step?", "options": ["Ask the person they came with to explain it", "Tell the safeguarding lead, practice manager or a registrant", "Wait and see whether it happens again on a later visit", "Mention it to colleagues in the staff group chat"], "answer": 1, "feedback": "You raise the worry with the right person. You do not investigate or decide, and you do not share it in passing.", "quote": "Tell the practice safeguarding lead, or the practice manager or a registrant if the lead is out, as soon as it is safe to do so.", "tags": ["report"]}, {"id": "l0-05-q2", "lesson": "l0-05", "level": 0, "type": "tf", "stem": "True or false: if someone is in immediate danger, you ring 999.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Immediate danger is the one case where you do not wait for the lead or a registrant.", "quote": "If someone is in immediate danger, ring 999.", "tags": ["emergency"]}, {"id": "l0-05-q3", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "A confused older patient seems to be agreeing to an expensive upgrade without understanding it. What do you do?", "options": ["Complete the sale, since they said yes", "Offer a discount so the choice feels easier", "Do not make the sale and fetch a registrant", "Phone their family later to confirm it"], "answer": 2, "feedback": "If someone appears not to understand what they are buying, you do not complete the sale, and you never use the moment to upsell.", "quote": "If someone appears not to understand what they are buying, do not make the sale.", "tags": ["capacity"]}, {"id": "l0-05-q4", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "When should you write down what you saw and heard?", "options": ["Within a week, once you are certain what happened", "As soon as you can, using facts and not opinions", "Only after the patient has left the building for good", "Never, because notes about patients are gossip"], "answer": 1, "feedback": "A prompt, factual note in the person's own words is the most useful thing you can hand over.", "quote": "Write down what you saw and heard, using the person's own words, as soon as you can.", "tags": ["recording"]}, {"id": "l0-05-q5", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "A younger man answers every question for an elderly patient, who says he has no money, then says \"put it on his account\". What do you do?", "options": ["Tell the younger man you suspect he is controlling the patient", "Take the patient aside and ask whether he is being mistreated", "Refuse to serve them and ask both of them to leave the shop straight away, without a word", "Stay friendly, finish nothing, and quietly fetch the practice manager"], "answer": 3, "feedback": "Nothing proves anything, so you do not accuse or question. You stay friendly and bring in someone whose job it is.", "quote": "The dispenser stays friendly, does not accuse anyone, finishes nothing, and quietly asks the practice manager or a registrant to come over.", "tags": ["report"]}, {"id": "l0-05-q6", "lesson": "l0-05", "level": 0, "type": "tf", "stem": "True or false: you should wait until you are sure before raising a safeguarding worry.", "options": ["True", "False"], "answer": 1, "feedback": "You raise a worry; others decide what it means. Waiting to be sure can leave someone at risk.", "quote": "Do not wait to be sure.", "tags": ["report"]}, {"id": "l0-05-q7", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "Who may you share a safeguarding worry with?", "options": ["Any colleague who happens to be on shift with you and has a spare moment", "The person you are worried about, to hear their side", "A friend outside work, as long as no name is used", "Only the safeguarding lead, practice manager or a registrant"], "answer": 3, "feedback": "A worry goes only to the people whose job it is, not to colleagues in passing and not to the person concerned.", "quote": "Share a safeguarding worry only with the safeguarding lead, the practice manager or a registrant, and not with colleagues in passing.", "tags": ["privacy"]}, {"id": "l0-05-q8", "lesson": "l0-05", "level": 0, "type": "mcq", "stem": "A worried child asks you to keep what they tell you secret. What do you say?", "options": ["I promise this will stay between the two of us", "I will keep it secret if you tell me everything", "I cannot talk about this; please ask your parent instead", "I may need to share this with someone whose job is to help"], "answer": 3, "feedback": "You cannot promise secrecy. Being honest about sharing keeps the child's trust without making a promise you cannot keep.", "quote": "Do not promise to keep a secret.", "tags": ["secrecy"]}, {"id": "l0-06-q1", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "Which pair counts as two identifiers?", "options": ["First name and surname only", "Full name and date of birth", "Phone number and email address", "Name and the item being collected"], "answer": 1, "feedback": "Name and date of birth are the usual pair; a postcode or address is a good alternative second item.", "quote": "Full name and date of birth are the usual pair.", "tags": ["identifiers"]}, {"id": "l0-06-q2", "lesson": "l0-06", "level": 0, "type": "tf", "stem": "True or false: a patient who asks for a copy of their data by phone has made a valid request.", "options": ["True", "False"], "answer": 0, "feedback": "A verbal request is valid, so you tell the practice manager rather than turning them away.", "quote": "A verbal request is valid.", "tags": ["dsar"]}, {"id": "l0-06-q3", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "You emailed a job reminder to the wrong address. What do you do?", "options": ["Tell the practice manager the same day", "Say nothing, as it was only one email", "Email the right address and leave it there", "Ask the wrong recipient to delete it quietly"], "answer": 0, "feedback": "Report straight away. A fast report helps the patient and lets the data protection officer decide what is needed.", "quote": "Tell the practice manager straight away, on the same day.", "tags": ["breach"]}, {"id": "l0-06-q4", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "How long do we have to reply to a request for personal data?", "options": ["Within 24 hours", "Within one calendar month", "Within one calendar year", "There is no fixed deadline at all"], "answer": 1, "feedback": "The reply is due within one calendar month.", "quote": "The reply is due within one calendar month.", "tags": ["dsar"]}, {"id": "l0-06-q5", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "A caller says he is a patient's husband and asks what her prescription is. What do you say?", "options": ["Read it out, since he knows her name and address", "Ask him to confirm her date of birth, then read it out", "Say you can only talk to the patient, and offer to take a message", "Email it to him so that there is a record of it"], "answer": 2, "feedback": "A relationship is not an identifier or permission. You protect the record and take a message instead.", "quote": "Before you give information or hand over a job, check two identifiers.", "tags": ["identifiers"]}, {"id": "l0-06-q6", "lesson": "l0-06", "level": 0, "type": "tf", "stem": "True or false: if a patient asks for their data by phone, you should ask them to put it in writing.", "options": ["True", "False"], "answer": 1, "feedback": "Never turn them away. A verbal request is valid, and you tell the practice manager at once.", "quote": "Do not say \"put it in writing\" to someone asking for their data.", "tags": ["dsar"]}, {"id": "l0-06-q7", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "Who decides whether the regulator must be told of a breach within 72 hours?", "options": ["The first colleague who hears of it", "The dispenser who made the mistake", "The patient whose data was affected", "The data protection officer"], "answer": 3, "feedback": "The data protection officer decides, which is why you report the same day. Every hour counts.", "quote": "the data protection officer decides that", "tags": ["breach"]}, {"id": "l0-06-q8", "lesson": "l0-06", "level": 0, "type": "mcq", "stem": "Which action helps keep patient data safe?", "options": ["Photographing a job bag so you can check it at home", "Locking the screen when you leave the computer", "Messaging a prescription to your own personal phone", "Opening a record out of curiosity about a neighbour"], "answer": 1, "feedback": "Locking the screen stops anyone else seeing a record. Photos, personal phones and curiosity all break the rules.", "quote": "Lock the screen when you leave the computer.", "tags": ["safety"]}, {"id": "l0-07-q1", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "What is the add?", "options": ["The distance between the pupils", "The extra power added for reading", "The coating on the lens surface", "The size of the frame in millimetres"], "answer": 1, "feedback": "The add is the extra reading power on top of the distance prescription.", "quote": "Add: the extra power added for reading.", "tags": ["vocab"]}, {"id": "l0-07-q2", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "What does a focimeter do?", "options": ["Tests the patient's eyes for disease", "Checks the power and centre of a lens", "Measures how thin a lens material is", "Finds the height of the eye above the frame"], "answer": 1, "feedback": "A focimeter reads the power and centre of a lens, so we can check it matches the prescription.", "quote": "Focimeter (lensometer): the instrument that checks the power and centre of a lens.", "tags": ["vocab"]}, {"id": "l0-07-q3", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "What is a registrant?", "options": ["Anyone who works on the front desk at reception", "An optometrist or dispensing optician on the GOC register", "A trainee dispenser in their first week at work", "The lab technician who glazes the finished job"], "answer": 1, "feedback": "A registrant is on the General Optical Council register: an optometrist or a dispensing optician.", "quote": "Registrant: someone on the General Optical Council (GOC) register, either an optometrist or a dispensing optician.", "tags": ["vocab"]}, {"id": "l0-07-q4", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "What does reglaze mean?", "options": ["New lenses in an existing frame", "A new frame with the old lenses", "A thorough clean of the finished glasses", "A free eye test after collection"], "answer": 0, "feedback": "Reglaze is putting new lenses into the frame the patient already owns.", "quote": "Reglaze: new lenses in an existing frame.", "tags": ["vocab"]}, {"id": "l0-07-q5", "lesson": "l0-07", "level": 0, "type": "tf", "stem": "True or false: a higher index lets a lens be thinner for the same prescription.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. Index is how strongly the material bends light, and a higher index allows a thinner lens.", "quote": "A higher index lets the lens be thinner for the same prescription.", "tags": ["vocab"]}, {"id": "l0-07-q6", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "A patient asks what a varifocal is. Which is the best plain answer?", "options": ["A lens with two powers and a visible dividing line", "A lens that gives one power over the whole lens", "A lens that changes smoothly from far to near, with no line", "A lens that darkens when it is out in the sunlight"], "answer": 2, "feedback": "The others describe a bifocal, single vision and photochromic lens in turn. A varifocal changes smoothly with no visible line.", "quote": "Varifocal (progressive): a smooth change in power from far to near, with no visible line.", "tags": ["vocab"]}, {"id": "l0-07-q7", "lesson": "l0-07", "level": 0, "type": "tf", "stem": "True or false: height matters most for single vision lenses.", "options": ["True", "False"], "answer": 1, "feedback": "Height matters most for varifocals, where the eye must sit at the right level in the lens.", "quote": "Height: how high above the frame bottom the eye sits. It matters most for varifocals.", "tags": ["vocab"]}, {"id": "l0-07-q8", "lesson": "l0-07", "level": 0, "type": "mcq", "stem": "Which term means the gap between the back of the lens and the eye?", "options": ["Pupillary distance", "Cylinder axis", "Vertex distance", "Add power"], "answer": 2, "feedback": "Vertex distance is that gap. PD is the distance between the pupils.", "quote": "Vertex distance: the gap between the back of the lens and the eye.", "tags": ["vocab"]}, {"id": "l0-08-q1", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "How many dispenses do you shadow at Level 0?", "options": ["At least 5", "At least 10", "At least 20", "At least 50"], "answer": 2, "feedback": "You shadow at least 20 dispenses and do not serve alone.", "quote": "At Level 0 you shadow at least 20 dispenses.", "tags": ["shadow"]}, {"id": "l0-08-q2", "lesson": "l0-08", "level": 0, "type": "order", "stem": "Put these steps of the collection routine in order.", "options": ["Check the job against the order", "Fit", "Distance, near and in motion", "Check two identifiers"], "answer": 0, "feedback": "The routine starts with checking against the order and ends with two identifiers.", "quote": "Collections are done in the same order every time.", "tags": ["collection"]}, {"id": "l0-08-q3", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "How many observed single vision dispenses are needed for Level 2?", "options": ["Five observed dispenses", "Eight observed dispenses", "Ten observed dispenses", "Twenty observed dispenses"], "answer": 2, "feedback": "Level 2 needs at least 10 observed single vision dispenses, with a defined mix.", "quote": "For Level 2 it is 10 observed single vision dispenses", "tags": ["signoff"]}, {"id": "l0-08-q4", "lesson": "l0-08", "level": 0, "type": "tf", "stem": "True or false: at Level 3 you must be observed measuring 3 of the 8 varifocal and bifocal dispenses.", "options": ["True", "False"], "answer": 0, "feedback": "Yes. 3 of the 8 are measured by you and checked by the signer.", "quote": "For Level 3 it is 8 observed varifocal and bifocal dispenses, 3 of them measured by you and checked by the signer.", "tags": ["signoff"]}, {"id": "l0-08-q5", "lesson": "l0-08", "level": 0, "type": "tf", "stem": "True or false: reaching the minimum count means you are automatically signed off.", "options": ["True", "False"], "answer": 1, "feedback": "The count is a minimum. The signer also judges that you are ready and asks a spoken spot-check.", "quote": "In every case the count is a minimum, the signer decides when you are ready, and you answer a 5-question spoken spot-check.", "tags": ["signoff"]}, {"id": "l0-08-q6", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "What goes in your shadowing notebook?", "options": ["The patient's name and what they bought", "A copy of the prescription for revision", "A line on what you saw, with no patient names", "The patient's phone number for the follow-up"], "answer": 2, "feedback": "You count and note each dispense with no patient names or details.", "quote": "Count them in a notebook with no patient names.", "tags": ["shadow"]}, {"id": "l0-08-q7", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "You want to know why the dispenser did something. When do you ask?", "options": ["Straight away, while the patient is talking", "Afterwards, as one why question", "Never; copy what they do instead", "Only at your next weekly check-in"], "answer": 1, "feedback": "Stay quiet and out of the way during the dispense, then ask one why question afterwards.", "quote": "Afterwards, ask one why question.", "tags": ["shadow"]}, {"id": "l0-08-q8", "lesson": "l0-08", "level": 0, "type": "mcq", "stem": "Which is part of the Level 2 observed mix?", "options": ["A bifocal with a visible dividing line", "A varifocal measured by the learner", "A contact lens aftercare visit", "An NHS voucher dispense"], "answer": 3, "feedback": "The Level 2 mix includes a high minus, a high plus, an oblique-axis astigmat, an anisometrope, an NHS voucher, a Transitions or tint, and a second pair.", "quote": "an NHS voucher, a Transitions or tint, and a second pair", "tags": ["signoff"]}], "n": 20, "pass_": 0.8};</script><script src="assets/app.js"></script></body></html>
